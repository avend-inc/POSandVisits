<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>物件レビュー</title>
<style>
  :root{--ink:#1a1a1a;--ink2:#6b6b6b;--bg:#f5f5f3;--surface:#fff;--border:#e4e4e4;
    --accent:#b8860b;--ok:#1b8a3a;--ng:#c0392b;--hold:#8a6d00;--shadow:0 1px 3px rgba(0,0,0,.06);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:70px}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  .hbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);
    border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
  main{max-width:720px;margin:0 auto;padding:12px}
  .filters{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;
    margin:10px 0;box-shadow:var(--shadow)}
  .card.v-OK{border-left:5px solid var(--ok)} .card.v-NG{border-left:5px solid var(--ng)}
  .card.v-保留{border-left:5px solid var(--hold)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
  .badge.hit{background:var(--ok)} .badge.info{background:#888}
  .badge.road{background:#0f766e}   /* ロードサイド（路面・幹線沿い） */
  .badge.warn{background:#e8830c;font-size:10px;padding:2px 7px;margin-left:6px;vertical-align:middle}
  .city{font-size:12px;color:var(--ink2)}
  .name{font-size:16px;font-weight:700;margin:2px 0 6px}
  .specs{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:6px 0}
  .specs label{display:block;font-size:11px;color:var(--ink2)} .specs b{font-size:15px}
  .unk{color:#b0b0b0;font-weight:400;font-size:13px}     /* 不明（未取得） */
  .none{color:var(--ng);font-weight:600;font-size:14px}  /* なし（0） */
  .note{font-size:12px;color:var(--ink2);margin:4px 0 8px;line-height:1.6}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
  .links a{font-size:13px;text-decoration:none;color:#1558d6;border:1px solid #ccd;border-radius:8px;padding:6px 10px}
  .linkbtn{font-size:13px;color:var(--ink2);background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
  .mapbox{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .mapbox input{flex:1 1 100%;min-width:0;border:1px solid var(--border);border-radius:9px;padding:9px;font-size:13px}
  .mapbox button{border:1px solid var(--border);background:#fafafa;border-radius:9px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .mapbox button[data-mapsave]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .verdicts{display:flex;gap:8px;margin:8px 0}
  .vb{flex:1;border:1px solid var(--border);background:#fafafa;border-radius:10px;padding:11px 0;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}
  .vb.sel-OK{background:var(--ok);color:#fff;border-color:var(--ok)}
  .vb.sel-NG{background:var(--ng);color:#fff;border-color:var(--ng)}
  .vb.sel-保留{background:var(--hold);color:#fff;border-color:var(--hold)}
  .reasonshow{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.6;min-height:16px}
  .reasonshow b{color:var(--ink)}
  .saved{font-size:12px;color:var(--ok);height:16px;margin-top:2px}
  .msg{padding:30px 16px;color:var(--ink2);text-align:center;line-height:1.8}
  .loginbtn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer}
  /* 理由ポップアップ（ボトムシート） */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;
    justify-content:center;z-index:100}
  .overlay.on{display:flex}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:720px;
    max-height:86vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .mhead{font-size:15px;font-weight:700;margin-bottom:4px}
  .msub{font-size:12px;color:var(--ink2);margin-bottom:10px}
  .ropt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);
    border-radius:11px;margin:7px 0;font-size:14px;cursor:pointer;user-select:none}
  .ropt.sel{border-color:var(--accent);background:#fff8e8}
  .ropt input{width:18px;height:18px;accent-color:var(--accent)}
  .otherrow{display:flex;gap:8px;margin:10px 0}
  .otherrow input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px}
  .otherrow button{border:1px solid var(--border);background:#fafafa;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
  .setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
  .setgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
  .setgrid input{border:1px solid var(--border);border-radius:10px;padding:10px;font-size:15px;color:var(--ink)}
  @media(max-width:420px){.setgrid{grid-template-columns:1fr}}
  .mfoot{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
  .mfoot button{flex:1;border-radius:11px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--border)}
  #rsave{background:var(--accent);color:#fff;border-color:var(--accent)}
  #rcancel{background:#fafafa;color:var(--ink2)}
  /* 「ホーム」ボタン。どのページでも同じ見た目にするため、
     ページごとに違う .navlink には頼らず自前で持つ */
  .homebtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto;
    border:1px solid var(--border);background:var(--surface);color:var(--accent);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;
    text-decoration:none;cursor:pointer;}
  .homebtn:hover{border-color:var(--accent);}
  /* 下のタブバー。他のページと同じ形にそろえる。
     ここにCSSが無く、ナビだけ足してあって当たっていなかった */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 2px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;border-top:2px solid transparent;}
  .tabbar a.on{border-top-color:var(--accent);color:var(--accent);}
  .tabbar a:active{opacity:.55;}
  /* タブバーのぶん、本文の下に余白を作る（最後の行が隠れないように） */
  body{padding-bottom:76px;}
</style></head>
<body>
<header>
  <a class="hbtn" href="index.html?g=own">‹ 戻る</a>
  <h1>物件レビュー</h1>
  <a class="hbtn" href="shoken.html" title="商圏調査（教師データ照合）">商圏調査</a>
  <a class="hbtn" href="cities.html" title="自動収集の対象市区町村を登録">対象エリア</a>
  <button class="hbtn" id="addbtn" style="display:none" title="自分で見つけた物件を登録">＋追加</button>
  <button class="hbtn" id="setbtn" style="display:none" title="検索条件の設定">条件</button>
  <button class="hbtn" id="logoutbtn" style="display:none">ログアウト</button>

      <a class="navlink homebtn" href="../" title="アプリのトップへ">ホーム</a>
    </header>
<main>
  <div class="filters" id="filters" style="display:none">
    <button class="chip on" data-f="todo">条件一致</button>
    <button class="chip" data-f="road">🛣 ロードサイド</button>
    <button class="chip" data-f="info">要確認</button>
    <button class="chip" data-f="OK">OK</button>
    <button class="chip" data-f="NG">NG</button>
    <button class="chip" data-f="保留">保留</button>
    <button class="chip" data-f="all">全部</button>
  </div>
  <div id="list"><div class="msg">読み込み中…</div></div>
</main>

<div class="overlay" id="ov"><div class="modal">
  <div class="mhead" id="mhead">理由を選ぶ</div>
  <div class="msub" id="msub"></div>
  <div id="ropts"></div>
  <div class="otherrow"><input id="rother" placeholder="その他の理由を入力"><button id="raddbtn">追加</button></div>
  <div class="mfoot"><button id="rcancel">キャンセル</button><button id="rsave">保存</button></div>
</div></div>

<!-- 検索条件の設定（面積・家賃・階数・駐車場のしきい値）。ここを変えると表示も次回収集も変わる -->
<div class="overlay" id="setov"><div class="modal">
  <div class="mhead">検索条件の設定</div>
  <div class="msub">判明していてこの範囲外の物件は候補から外れます。不明の物件は残ります（確認で変わりうるため）。</div>
  <div class="setgrid">
    <label>面積 下限（坪）<input type="number" id="c_area_min" inputmode="decimal" step="1"></label>
    <label>面積 上限（坪）<input type="number" id="c_area_max" inputmode="decimal" step="1"></label>
    <label>家賃 下限（月額・円）<input type="number" id="c_rent_min" inputmode="numeric" step="1000"></label>
    <label>家賃 上限（月額・円）<input type="number" id="c_rent_max" inputmode="numeric" step="1000"></label>
    <label>所在階 上限<input type="number" id="c_floor_max" inputmode="numeric" step="1"></label>
    <label>駐車場 下限（台・0=不問）<input type="number" id="c_parking_min" inputmode="numeric" step="1"></label>
  </div>
  <div class="saved" id="setmsg" style="text-align:center"></div>
  <div class="mfoot"><button id="setcancel">キャンセル</button><button id="setsave">保存</button></div>
</div></div>

<!-- 自分で見つけた物件を手動登録する。id は manual- で始め、収集の同期で消えないようにする -->
<div class="overlay" id="addov"><div class="modal">
  <div class="mhead">物件を追加（自分で見つけた物件）</div>
  <div class="msub">分かる項目だけでOK。物件名は必須です。登録すると「OK」タブに入ります（後でNG/保留に変更も可）。</div>
  <div class="setgrid">
    <label style="grid-column:1/-1">物件名 <span style="color:var(--ng)">*</span><input type="text" id="a_name" placeholder="例）○○ビル1階 / 国道○号沿い店舗"></label>
    <label>市区町村<input type="text" id="a_city" placeholder="例）福島市"></label>
    <label>住所<input type="text" id="a_address" placeholder="例）福島県福島市…"></label>
    <label>面積（坪）<input type="number" id="a_area" inputmode="decimal" step="0.1"></label>
    <label>家賃（月額・円）<input type="number" id="a_rent" inputmode="numeric" step="1000"></label>
    <label>駐車場（台）<input type="number" id="a_parking" inputmode="numeric" step="1"></label>
    <label>所在階<input type="number" id="a_floor" inputmode="numeric" step="1"></label>
    <label>最寄り駅<input type="text" id="a_station" placeholder="例）福島駅 徒歩8分"></label>
    <label style="grid-column:1/-1">物件ページURL<input type="url" id="a_url" inputmode="url" placeholder="https://…（募集ページ等）"></label>
    <label style="grid-column:1/-1">Google Map URL<input type="url" id="a_map" inputmode="url" placeholder="https://maps.google.com/…（任意）"></label>
    <label style="grid-column:1/-1">メモ<input type="text" id="a_note" placeholder="気づいたこと（幹線沿い・角地 など）"></label>
  </div>
  <div class="saved" id="addmsg" style="text-align:center"></div>
  <div class="mfoot"><button id="addcancel">キャンセル</button><button id="addsave">登録する</button></div>
</div></div>

<script>
"use strict";
// POSandVisits ダッシュボードと同じ Supabase / 同じログイン(notime-auth)を共有する。
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null}, ROWS=[], FILTER="todo";
// 検索条件（面積・家賃・階数・駐車場のしきい値）。⚙設定で編集し bukken_criteria に保存する。
// 収集(discover)・同期(sync)も同じ値を読むので、ここを変えると次回収集にも反映される。
const CRIT_DEFAULT={area_min:25,area_max:50,rent_min:30000,rent_max:500000,floor_max:2,parking_min:0};
let CRIT={...CRIT_DEFAULT};

// 判明している属性が条件レンジ外なら true（＝条件に合致しないと確定）。不明の属性は判定しない。
function outOfRange(r){
  if(r.area_tsubo!=null && (r.area_tsubo<CRIT.area_min || r.area_tsubo>CRIT.area_max)) return true;
  if(r.rent_yen!=null   && (r.rent_yen<CRIT.rent_min   || r.rent_yen>CRIT.rent_max))   return true;
  if(r.floor!=null      &&  r.floor>CRIT.floor_max) return true;
  if(CRIT.parking_min   &&  r.parking!=null && r.parking<CRIT.parking_min) return true;
  return false;
}
async function loadCriteria(){
  try{
    const {data,error}=await SB.from("bukken_criteria").select("*").limit(1);
    if(!error && data && data[0]){
      for(const k of Object.keys(CRIT_DEFAULT)){ const v=data[0][k]; if(v!=null) CRIT[k]=Number(v); }
    }
  }catch(e){ /* テーブル未作成等 → 既定値のまま */ }
}

// 市→主要駅（cities.yaml の main_station）。駅距離が未取得でも駅名は出す。
const STATION={福島市:"福島駅",秋田市:"秋田駅",富士市:"富士駅",大分市:"大分駅",宮崎市:"宮崎駅",長崎市:"長崎駅"};
// 理由プリセット（成功/失敗パターンに対応）。ユーザー追加分は localStorage に貯める。
const PRESET={
  OK:["幹線沿い・視認性が良い","駐車場が十分","面積が成功帯(25坪+)","坪単価が安い","集客装置が近い","独立店舗・ロードサイド"],
  NG:["住宅地の中・幹線から外れる","通行量が少ない","駐車場が不足","面積が狭い","坪単価が高い","2階で視認性が弱い","商圏が弱い","家賃が過大","繁華街の徒歩型"]
};

const YEN=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadSupabase(){
  if(window.supabase)return;
  await new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));
    document.head.appendChild(s);});
}
function screen(html){document.getElementById("list").innerHTML=html;}

function syncAdminTab(){const ad=!!(ME&&ME.role==="admin");const t=document.getElementById("tab-admin");if(t)t.style.display=ad?"":"none";const k=document.getElementById("tab-keiei");if(k)k.style.display=ad?"":"none";}

async function boot(){
  try{
    const cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();
    await loadSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){
      screen('<div class="msg">物件レビューを見るにはログインが必要です。'
        +'<br><button class="loginbtn" id="lg">Googleでログイン</button></div>');
      document.getElementById("lg").onclick=()=>SB.auth.signInWithOAuth(
        {provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
      return;
    }
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    // 管理・経営タブは管理者だけに出す。他ページ（dashboard 等）と同じ判定にそろえる。
    // ここで読まないと、このページからだけ管理タブに辿り着けない状態になる
    try{
      const {data:u}=await SB.from("users").select("role,is_active,segments").ilike("email",ME.email).maybeSingle();
      ME.role=(u&&u.is_active&&(u.segments||[]).includes("sales"))
        ? (u.role==="admin"?"admin":(u.role==="manager"?"editor":"viewer")) : null;
    }catch(e){ ME.role=null; }
    syncAdminTab();
    document.getElementById("logoutbtn").style.display="";
    document.getElementById("logoutbtn").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
    document.getElementById("setbtn").style.display="";
    document.getElementById("setbtn").onclick=openSettings;
    document.getElementById("addbtn").style.display="";
    document.getElementById("addbtn").onclick=openAdd;
    await load();
  }catch(e){ screen('<div class="msg">読み込みに失敗しました：'+esc(e.message||e)+'</div>'); }
}

async function load(){
  await loadCriteria();
  const {data,error}=await SB.from("bukken").select("*");
  if(error){
    screen('<div class="msg">物件テーブルを読めませんでした。<br>'
      +'（bukken テーブル未作成／列不足の可能性。SQLをチャットから流してください）<br>'
      +'<small>'+esc(error.message)+'</small></div>');
    return;
  }
  // 並び順: ロードサイド優先 → 成功パターン → 未判定を先に
  const rank=r=>(isRoadside(r)?0:1)*100+(r.success_flag?0:1)*10+(r.verdict?1:0);
  ROWS=(data||[]).sort((a,b)=>rank(a)-rank(b)
    || String(a.city).localeCompare(String(b.city))
    || String(b.first_seen||"").localeCompare(String(a.first_seen||"")));
  document.getElementById("filters").style.display="";
  render();
}

// 条件にハマる＝面積も家賃も「判明」していて、条件レンジ内（階・駐車も判明分は範囲内）。
// 面積や家賃が不明の物件は「確定はできない」ので、条件一致には入れず『要確認』に回す。
function fits(r){
  return r.area_tsubo!=null && r.rent_yen!=null && !outOfRange(r);
}
// ロードサイド（路面・幹線沿い・独立店舗）らしさ。説明文/名称/住所のキーワードで判定。
// ビルインのテナントより優先したいので、バッジ表示・並び順・専用チップに使う。
const _RE_ROAD=/路面|幹線|国道|県道|バイパス|ロードサイド|通り沿い|沿い|独立店舗|ドライブスルー|角地/;
function isRoadside(r){
  return _RE_ROAD.test((r.note||"")+" "+(r.name||"")+" "+(r.address||""));
}
function pass(r){
  // 未判定で条件レンジ外（＝合致しないと確定）は隠す。判定済み(OK/NG/保留)は残す。
  if(!r.verdict && outOfRange(r)) return false;
  if(FILTER==="all")   return true;
  if(FILTER==="todo")  return !r.verdict && fits(r);   // 条件一致（面積・家賃が判明して範囲内）
  if(FILTER==="info")  return !r.verdict && !fits(r);  // 要確認（面積/家賃が不明などで確定できない）
  if(FILTER==="road")  return !r.verdict && fits(r) && isRoadside(r);  // ロードサイドかつ条件一致
  return r.verdict===FILTER;
}

// --- 各項目の表示：不明(null)＝グレー / なし(0)＝赤 / 値＝そのまま ---
function fArea(r){
  if(r.area_tsubo==null) return '<span class="unk">不明</span>';
  return r.area_tsubo.toFixed(1)+"坪"+(r.area_sqm!=null?"（"+r.area_sqm.toFixed(1)+"㎡）":"");
}
// 想定は25〜50坪。50坪超は「広い＝建物全体の可能性」で要確認、25坪未満は「狭い」で要確認。
function areaWarn(r){
  if(r.area_tsubo==null) return "";
  if(r.area_tsubo>50) return ' <span class="badge warn">⚠広い</span>';
  if(r.area_tsubo<25) return ' <span class="badge warn">⚠狭い</span>';
  return "";
}
// 用途（事務所/店舗 等）。取得できていれば表示。
function fUsage(r){ return r.usage?esc(r.usage):'<span class="unk">不明</span>'; }
function fRent(r){ return r.rent_yen==null?'<span class="unk">不明</span>':YEN(r.rent_yen); }
// 家賃の異常値検知：面積があれば坪単価、無ければ絶対額で「高すぎ（＝保証金/坪単価総額の拾い間違い疑い）」を判定
function rentWarn(r){
  if(r.rent_yen==null) return false;
  if(r.area_tsubo) return (r.rent_yen / r.area_tsubo) > 40000;   // 4万円/坪超は地方店舗として高すぎ
  return r.rent_yen > 800000;                                    // 面積不明時は月額80万円超を要確認
}
function fPark(r){
  if(r.parking==null) return '<span class="unk">不明</span>';
  if(r.parking===0)  return '<span class="none">なし(0台)</span>';
  return r.parking+"台";
}
function fFloor(r){ return r.floor==null?'<span class="unk">不明</span>':r.floor+"階"; }
function fStation(r){
  if(r.station_name){          // 詳細ページ由来（例「秋田駅 徒歩11分」）
    let s=esc(r.station_name);
    if(r.station_km!=null)s+=" "+r.station_km.toFixed(1)+"km";
    return s;
  }
  const nm=STATION[r.city]||"";
  return (nm?esc(nm)+" ":"")+'<span class="unk">不明</span>';
}
function gmapUrl(r){
  // ユーザーが貼り直したURLがあれば最優先（自動生成の検索リンクはズレることがあるため）
  if(r.map_url && /^https?:\/\//i.test(r.map_url)) return r.map_url;
  const q=(r.address&&r.address.trim())?r.address:((r.city||"")+(r.name||""));
  return "https://maps.google.com/maps?q="+encodeURIComponent(q);
}

function render(){
  const rows=ROWS.filter(pass);
  if(!rows.length){
    let hint="該当なし";
    if(FILTER==="todo") hint='条件一致（面積・家賃が判明して範囲内）の未判定はありません。<br>面積や家賃が不明の候補は「要確認」タブにあります。';
    else if(FILTER==="road") hint='ロードサイド（路面・幹線沿い）で条件一致の未判定はありません。<br>「条件一致」タブにビルインのテナントも含めて出ます。';
    else if(FILTER==="info") hint='要確認（情報が不足している未判定）はありません。';
    screen('<div class="msg">'+hint+'</div>');return;
  }
  document.getElementById("list").innerHTML=rows.map(r=>{
    const v=r.verdict||"";
    const badge=(isRoadside(r)?'<span class="badge road">🛣 ロードサイド</span> ':'')
      +(r.success_flag?'<span class="badge hit">成功パターン</span>':'<span class="badge info">要確認</span>');
    const isDetail=/detailPage|\/detail[-\/]|\/bukken[-\/]|\/property\/[^\/]*\d/i.test(r.detail_url||"");
    const link=r.detail_url?'<a href="'+esc(r.detail_url)+'" target="_blank" rel="noopener">'+(isDetail?'物件ページ':'掲載元サイト（一覧）')+' ›</a>':'';
    const mapCustom=!!(r.map_url && /^https?:\/\//i.test(r.map_url));
    // 「🗺 地図」ボタンを押すと、今入っているリンクが編集欄に出て、書き換え→保存できる
    const gmap='<button class="linkbtn" data-maptoggle>🗺 地図'+(mapCustom?'（指定）':'')+'</button>';
    return `<div class="card v-${esc(v)}" data-id="${esc(r.id)}">
      <div class="top">${badge}<span class="city">${esc(r.city)}</span></div>
      <div class="name">${esc(r.name||"（名称なし）")}</div>
      ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      <div class="specs">
        <div><label>坪数</label><b>${fArea(r)}${areaWarn(r)}</b></div>
        <div><label>家賃</label><b>${fRent(r)}${rentWarn(r)?' <span class="badge warn">⚠要確認</span>':''}</b></div>
        <div><label>用途</label><b>${fUsage(r)}</b></div>
        <div><label>駐車場</label><b>${fPark(r)}</b></div>
        <div><label>階数</label><b>${fFloor(r)}</b></div>
        <div><label>主要駅からの距離</label><b>${fStation(r)}</b></div>
      </div>
      <div class="links">${link}${gmap}<span class="city" style="align-self:center">出典：${esc(r.source||"")}</span></div>
      <div class="mapbox" data-mapbox style="display:none">
        <input type="url" inputmode="url" data-mapinput placeholder="Google MapのURL" value="${esc(r.map_url||gmapUrl(r))}">
        <button data-mapopen>開く</button>
        <button data-mapsave>保存</button>
        <button data-mapclear>既定に戻す</button>
      </div>
      <div class="verdicts">
        <button class="vb ${v==="OK"?"sel-OK":""}" data-v="OK">OK</button>
        <button class="vb ${v==="NG"?"sel-NG":""}" data-v="NG">NG</button>
        <button class="vb ${v==="保留"?"sel-保留":""}" data-v="保留">保留</button>
      </div>
      <div class="reasonshow" data-reason>${r.reason?'理由：<b>'+esc(r.reason)+'</b>':''}</div>
      <div class="saved" data-saved></div>
    </div>`;
  }).join("");
  bind();
}

function bind(){
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id;
    card.querySelectorAll(".vb").forEach(b=>b.onclick=()=>{
      const verdict=b.dataset.v;
      if(verdict==="保留"){ save(id,card,{verdict:"保留",reason:(ROWS.find(r=>r.id===id)||{}).reason||null}); }
      else openReason(id,card,verdict);      // OK/NG は理由ポップアップ
    });
    // 「🗺 地図」ボタン → 今のリンクを編集欄に表示。書き換えて保存でDBへ。開くで確認。
    const mb=card.querySelector("[data-mapbox]");
    const tg=card.querySelector("[data-maptoggle]");
    if(tg&&mb) tg.onclick=()=>{ mb.style.display=(mb.style.display==="none"?"flex":"none"); };
    if(mb){
      const inp=mb.querySelector("[data-mapinput]");
      mb.querySelector("[data-mapopen]").onclick=()=>{
        const u=inp.value.trim(); if(u)window.open(u,"_blank","noopener");
      };
      mb.querySelector("[data-mapsave]").onclick=()=>{
        const url=inp.value.trim();
        if(url && !/^https?:\/\//i.test(url)){ alert("http(s)から始まるURLを貼り付けてください"); return; }
        saveMap(id,card,url||null);
      };
      mb.querySelector("[data-mapclear]").onclick=()=>{ saveMap(id,card,null); };
    }
  });
}

async function saveMap(id,card,url){
  const saved=card.querySelector("[data-saved]");
  saved.textContent="地図リンク保存中…"; saved.style.color="var(--ink2)";
  const {error}=await SB.from("bukken").update(
    {map_url:url, reviewed_by:ME.email, reviewed_at:new Date().toISOString()}).eq("id",id);
  if(error){ saved.textContent="保存に失敗："+error.message; saved.style.color="var(--ng)"; return; }
  saved.style.color="var(--ok)"; saved.textContent=url?"✓ 地図リンクを保存しました":"✓ 既定の地図に戻しました";
  const row=ROWS.find(r=>r.id===id); if(row)row.map_url=url;
  const tg=card.querySelector("[data-maptoggle]");
  if(tg) tg.textContent="🗺 地図"+(url?"（指定）":"");
  const inp=card.querySelector("[data-mapinput]");
  if(inp&&row) inp.value=row.map_url||gmapUrl(row);   // 既定に戻した時は自動生成URLを再表示
  const mb=card.querySelector("[data-mapbox]"); if(mb)mb.style.display="none";
}

// ---- 理由ポップアップ ----
const OV=document.getElementById("ov");
function customKey(v){return "bukken_reasons_"+v;}
function loadCustom(v){ try{return JSON.parse(localStorage.getItem(customKey(v))||"[]");}catch(e){return [];} }
function addCustom(v,label){ const a=loadCustom(v); if(label&&!a.includes(label)){a.push(label);localStorage.setItem(customKey(v),JSON.stringify(a));} }

function openReason(id,card,verdict){
  const row=ROWS.find(r=>r.id===id)||{};
  const chosen=new Set(String(row.reason||"").split("、").map(s=>s.trim()).filter(Boolean));
  const opts=PRESET[verdict].concat(loadCustom(verdict).filter(x=>!PRESET[verdict].includes(x)));
  document.getElementById("mhead").textContent=(verdict==="OK"?"OK":"NG")+"の理由（複数選択可）";
  document.getElementById("msub").textContent=esc(row.name||"")+"　選んだ理由が判断基準として溜まります";
  const box=document.getElementById("ropts");
  box.innerHTML=opts.map(label=>{
    const on=chosen.has(label);
    return '<label class="ropt'+(on?' sel':'')+'"><input type="checkbox" '+(on?'checked':'')+' value="'+esc(label)+'"><span>'+esc(label)+'</span></label>';
  }).join("");
  box.querySelectorAll(".ropt").forEach(el=>{
    const cb=el.querySelector("input");
    cb.onchange=()=>el.classList.toggle("sel",cb.checked);
  });
  const other=document.getElementById("rother"); other.value="";
  document.getElementById("raddbtn").onclick=()=>{
    const val=other.value.trim(); if(!val)return;
    addCustom(verdict,val);
    const lab=document.createElement("label"); lab.className="ropt sel";
    lab.innerHTML='<input type="checkbox" checked value="'+esc(val)+'"><span>'+esc(val)+'</span>';
    lab.querySelector("input").onchange=e=>lab.classList.toggle("sel",e.target.checked);
    box.appendChild(lab); other.value="";
  };
  document.getElementById("rcancel").onclick=closeReason;
  document.getElementById("rsave").onclick=()=>{
    const picked=Array.from(box.querySelectorAll("input:checked")).map(i=>i.value);
    const extra=other.value.trim();
    if(extra){ addCustom(verdict,extra); picked.push(extra); }
    save(id,card,{verdict,reason:picked.join("、")});
    closeReason();
  };
  OV.classList.add("on");
}
function closeReason(){ OV.classList.remove("on"); }
OV.addEventListener("click",e=>{ if(e.target===OV)closeReason(); });

async function save(id,card,patch){
  const saved=card.querySelector("[data-saved]");
  saved.textContent="保存中…"; saved.style.color="var(--ink2)";
  const payload=Object.assign({},patch,{reviewed_by:ME.email,reviewed_at:new Date().toISOString()});
  const {error}=await SB.from("bukken").update(payload).eq("id",id);
  if(error){saved.textContent="保存に失敗："+error.message;saved.style.color="var(--ng)";return;}
  saved.style.color="var(--ok)";saved.textContent="✓ 保存済み";
  const row=ROWS.find(r=>r.id===id); if(row)Object.assign(row,patch);
  card.className="card v-"+(patch.verdict||"");
  card.querySelectorAll(".vb").forEach(b=>{
    b.className="vb"+(patch.verdict&&b.dataset.v===patch.verdict?(" sel-"+patch.verdict):"");
  });
  const rs=card.querySelector("[data-reason]");
  if(rs)rs.innerHTML=patch.reason?('理由：<b>'+esc(patch.reason)+'</b>'):'';
  // 絞り込み表示中は、判定するとその行が条件から外れることがあるので少し後に再描画
  if(FILTER!=="all"){ setTimeout(render,700); }
}

document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");FILTER=c.dataset.f;render();
});

// ---- 検索条件の設定 ----
const SETOV=document.getElementById("setov");
const CFIELDS=["area_min","area_max","rent_min","rent_max","floor_max","parking_min"];
function openSettings(){
  for(const k of CFIELDS){ document.getElementById("c_"+k).value = CRIT[k]; }
  document.getElementById("setmsg").textContent="";
  SETOV.classList.add("on");
}
function closeSettings(){ SETOV.classList.remove("on"); }
async function saveSettings(){
  const v={};
  for(const k of CFIELDS){ const n=Number(document.getElementById("c_"+k).value); v[k]=isFinite(n)?n:CRIT[k]; }
  if(v.area_min>v.area_max || v.rent_min>v.rent_max){
    const m=document.getElementById("setmsg"); m.style.color="var(--ng)"; m.textContent="下限が上限を超えています。ご確認ください。"; return;
  }
  const msg=document.getElementById("setmsg"); msg.style.color="var(--ink2)"; msg.textContent="保存中…";
  const payload=Object.assign({id:1},v,{updated_by:ME.email,updated_at:new Date().toISOString()});
  const {error}=await SB.from("bukken_criteria").upsert(payload,{onConflict:"id"});
  if(error){ msg.style.color="var(--ng)"; msg.textContent="保存に失敗："+error.message+"（bukken_criteria テーブル未作成の可能性）"; return; }
  CRIT={...CRIT,...v};
  msg.style.color="var(--ok)"; msg.textContent="✓ 保存しました。次回の物件収集にも反映されます。";
  render();                            // 新しい条件で即フィルタし直す
  setTimeout(closeSettings,900);
}
document.getElementById("setcancel").onclick=closeSettings;
document.getElementById("setsave").onclick=saveSettings;
SETOV.addEventListener("click",e=>{ if(e.target===SETOV)closeSettings(); });

// ===== 物件を手動で追加（自分で見つけた物件）=====
const ADDOV=document.getElementById("addov");
const A_IDS=["name","city","address","area","rent","parking","floor","station","url","map","note"];
function openAdd(){
  for(const k of A_IDS){ document.getElementById("a_"+k).value=""; }
  document.getElementById("addmsg").textContent="";
  ADDOV.classList.add("on");
}
function closeAdd(){ ADDOV.classList.remove("on"); }
const _num=id=>{ const s=document.getElementById(id).value.replace(/[, ]/g,"").trim(); return s===""?null:Number(s); };
const _str=id=>{ const s=document.getElementById(id).value.trim(); return s===""?null:s; };
async function saveAdd(){
  const msg=document.getElementById("addmsg");
  const name=_str("a_name");
  if(!name){ msg.style.color="var(--ng)"; msg.textContent="物件名を入力してください。"; return; }
  const area=_num("a_area");
  const rec={
    id:"manual-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    city:_str("a_city"), name:name, address:_str("a_address"),
    area_tsubo: area, area_sqm: (area!=null?Math.round(area*3.305785*100)/100:null),
    rent_yen:_num("a_rent"), parking:_num("a_parking"), floor:_num("a_floor"),
    station_name:_str("a_station"), usage:null, source:"手動登録",
    detail_url:_str("a_url")||"", map_url:_str("a_map"), success_flag:false,
    note:_str("a_note"),
    // 自分で見つけた物件は最初から「OK」に入れる（＝OKタブに表示）。
    // 未判定にすると、面積・家賃が範囲外/未入力の物件は絞り込みで隠れてしまい
    // 「どこにも出ない」ため。OKなら範囲外でも必ず見える。
    verdict:"OK", reason:"自分で見つけた物件（手動追加）",
    reviewed_by:ME.email, reviewed_at:new Date().toISOString(),
  };
  msg.style.color="var(--ink2)"; msg.textContent="登録中…";
  const {error}=await SB.from("bukken").insert(rec);
  if(error){ msg.style.color="var(--ng)"; msg.textContent="登録に失敗："+error.message; return; }
  msg.style.color="var(--ok)"; msg.textContent="✓ OKに登録しました。";
  FILTER="OK";                            // OKタブに切り替えて追加した物件を見せる
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.f===FILTER));
  await load();                           // DBから読み直して正しい並びで表示（新規行を含む）
  setTimeout(closeAdd,900);
}
document.getElementById("addcancel").onclick=closeAdd;
document.getElementById("addsave").onclick=saveAdd;
ADDOV.addEventListener("click",e=>{ if(e.target===ADDOV)closeAdd(); });

// 画面を「グイーン」と強く引っ張った時だけ更新（pull-to-refresh）
(function(){
  const TRIGGER=150;   // これ以上引っ張ったら更新（普通の下スクロールでは反応しない）
  const ARM=12;        // この程度引っ張って初めてインジケータを出す（軽い動きは無視）
  let startY=null, armed=false;
  const bar=document.createElement("div");
  bar.style.cssText="position:fixed;top:0;left:0;right:0;text-align:center;padding:10px;font-size:13px;color:#888;background:#f5f5f3;transform:translateY(-48px);transition:transform .15s;z-index:200";
  bar.textContent="↓ グイーンと引っ張って更新";
  document.body.appendChild(bar);
  addEventListener("touchstart",e=>{ startY=(scrollY<=0)?e.touches[0].clientY:null; armed=false; },{passive:true});
  addEventListener("touchmove",e=>{
    if(startY==null)return;
    const dy=e.touches[0].clientY-startY;
    if(dy<=ARM){ if(armed){bar.style.transform="translateY(-48px)";armed=false;} return; }
    armed=true;
    // 抵抗をつけて“グイーン”と伸びる感触に。引っ張り量に応じてバーを下げる。
    const pulled=Math.min((dy-ARM)*0.5, 60);
    bar.style.transform="translateY("+(pulled-48)+"px)";
    bar.textContent = dy>TRIGGER ? "手を離すと更新します" : "↓ もっとグイーンと引っ張って更新";
  },{passive:true});
  addEventListener("touchend",e=>{
    if(startY!=null && armed && e.changedTouches[0].clientY-startY>TRIGGER){
      bar.textContent="更新中…"; bar.style.transform="translateY(0)"; location.reload();
    } else { bar.style.transform="translateY(-48px)"; }
    startY=null; armed=false;
  },{passive:true});
})();

boot();
