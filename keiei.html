<script>
"use strict";
const NUM=n=>Math.round(n).toLocaleString("ja-JP");
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, DATA=null, ME={email:"",role:null}, TARGETS=null;
async function loadTargets(){ if(window.__TARGETS__){TARGETS=window.__TARGETS__;return;} try{TARGETS=await (await fetch("targets.json",{cache:"no-store"})).json();}catch(e){TARGETS=null;} }

function screen(h){document.getElementById("app").innerHTML=h;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function prevYm(ym){let[y,m]=ym.split("-").map(Number);m--;if(m===0){m=12;y--;}return y+"-"+String(m).padStart(2,"0");}
function monthSpan(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return[`${ym}-01`,`${ym}-${String(last).padStart(2,"0")}`];}
function addMonths(ym,d){let[y,m]=ym.split("-").map(Number);m+=d;while(m<=0){m+=12;y--;}while(m>12){m-=12;y++;}return y+"-"+String(m).padStart(2,"0");}
function ownOf(sid){const s=(DATA.stores||[]).find(x=>String(x.id)===String(sid));return (s&&s.own)?s.own:"直営";}
function kvOf(sid){const s=(DATA.stores||[]).find(x=>String(x.id)===String(sid));return s?(s.kv!==false):true;}
function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return DATA.stores.filter(s=>w.has(s.id)&&s.visible!==false);}
function sumRows(rows){const p={in:0,ex:0,tx:0,txv:0,it:0,v:0,hasV:false};
  for(const r of rows){p.in+=r.in||0;p.ex+=(r.ex!=null?r.ex:0);p.tx+=r.tx||0;p.it+=(r.it!=null?r.it:0);if(kvOf(r.s)){p.txv+=r.tx||0;if(r.v!=null){p.v+=r.v;p.hasV=true;}}}
  if(!p.hasV)p.v=0;return p;}
function prep(){const ds=DATA.daily.map(r=>r.d).sort();DATA._min=ds[0];DATA._max=ds[ds.length-1];
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();DATA._salesMax=sd.length?sd[sd.length-1]:DATA._max;}

// ---- 着地見込み（予実タブ pl.html と同じ計算） ----
//  当月の税抜売上 着地見込は、予実タブ（🎯着地見込み）の計算・編集値と一致させる。
//  経営レポート独自の日割り(proj)だと平日/土日の偏りを無視して当月頭で暴れるため、
//  予実タブと同じ「平日/土日祝の1日平均 × 残日数 ＋ 締日までの実績」で出す。
function _isWeekend(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6;}
// 日本の祝日（土日祝の判定用）。dashboard.html / pl.html と同一。年度が進んだら追記。
const JP_HOLIDAYS=new Set([
  "2025-08-11","2025-09-15","2025-09-23","2025-10-13","2025-11-03","2025-11-23","2025-11-24",
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
  "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
  "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
]);
function _isWkHol(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6||JP_HOLIDAYS.has(d);}  // 土日祝
function _addDays(d,n){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function _monthEnd(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return `${ym}-${String(last).padStart(2,"0")}`;}
// 予実タブが保存した着地見込みの上書き値（page="fc"）を、その月ぶん“1回のクエリ”で全店まとめて読む。
// （店舗ごとに問い合わせると直営店の数だけ往復が発生して遅い。1回に集約して高速化）
async function planLoadAllFc(ym){
  const m={};
  if(SB){try{const {data}=await SB.from("plan_data").select("scope,data").eq("page","fc").eq("ym",ym);(data||[]).forEach(r=>{m[String(r.scope)]=r.data||null;});return m;}catch(e){return m;}}
  try{for(const s of usableStores()){const x=localStorage.getItem(`notime-fc-${s.id}-${ym}`);if(x)m[String(s.id)]=JSON.parse(x);}}catch(e){}
  return m;
}
// pl.html computeAuto 相当（税込 in／税抜 ex のみ）。締日までの実績・平日/土日祝1日平均・残日数を出す。
// アプリ共通の着地見込み定義（①経過実績＋②平日直近10日平均×残平日＋③土日祝直近10日平均×残土日祝）。
// 平日/土日祝は _isWkHol（土日＋祝日）で判定。「直近10日」＝締日以前でその区分の実績がある日を新しい順に最大10日。
function fcAuto(storeId,ym){
  const ids=new Set([storeId]);
  const mS=ym+"-01", mE=_monthEnd(ym), today=todayStr(), winStart=_addDays(mS,-70);
  const byDate={};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue; if(r.d<winStart||r.d>mE)continue;
    const a=byDate[r.d]||(byDate[r.d]={in:0,ex:0,it:0}); a.in+=r.in||0; a.ex+=(r.ex!=null?r.ex:0); a.it+=(r.it!=null?r.it:0); }
  const monthDates=Object.keys(byDate).filter(d=>d>=mS&&d<=mE).sort();
  const closing=monthDates.filter(d=>d<=today).slice(-1)[0]||null;
  let tdIn=0,tdEx=0,tdIt=0;   // ① 経過実績
  if(closing) for(const d of monthDates){ if(d>closing)continue; const a=byDate[d]; tdIn+=a.in; tdEx+=a.ex; tdIt+=a.it; }
  // ②③ 直近10日平均（平日/土日祝それぞれ最大10日）
  const ref=closing||_addDays(today,-1);
  const hist=Object.keys(byDate).filter(d=>d<=ref).sort();
  const avg10=(we,k)=>{let s=0,n=0; for(let i=hist.length-1;i>=0&&n<10;i--){const d=hist[i]; if(_isWkHol(d)===we){s+=byDate[d][k];n++;}} return n?s/n:0;};
  const avgWk=avg10(false,"in"), avgWe=avg10(true,"in");
  const avgItWk=avg10(false,"it"), avgItWe=avg10(true,"it");
  let remWk=0,remWe=0; const start=closing?_addDays(closing,1):mS;
  for(let d=start; d<=mE; d=_addDays(d,1)){ if(_isWkHol(d))remWe++; else remWk++; }
  const exRatio = tdIn? tdEx/tdIn : 0.91;
  return {tdIn,tdEx,tdIt,avgWk,avgWe,avgItWk,avgItWe,remWk,remWe,exRatio,closing};
}
// 着地見込み（税抜・複数店の合算）＝dashboard の landingForIds と同一。ロイヤリティ基礎に使う。
function landingExForIds(ids,ym){
  const mS=ym+"-01", mE=_monthEnd(ym), today=todayStr();
  const byDate={};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue;
    byDate[r.d]=(byDate[r.d]||0)+(r.ex!=null?r.ex:(r.in||0)/1.1); }
  const allDates=Object.keys(byDate).sort();
  if(!allDates.length)return 0;
  const monthDates=allDates.filter(d=>d>=mS&&d<=mE);
  const cutoff=today<mE?today:mE;
  const closing=monthDates.filter(d=>d<=cutoff).slice(-1)[0]||null;
  let actual=0; if(closing)for(const d of monthDates){ if(d<=closing)actual+=byDate[d]; }
  const ref=closing||cutoff, hist=allDates.filter(d=>d<=ref);
  const avg10=we=>{let s=0,n=0; for(let i=hist.length-1;i>=0&&n<10;i--){const d=hist[i]; if(_isWkHol(d)===we){s+=byDate[d];n++;}} return n?s/n:0;};
  const wkAvg=avg10(false), weAvg=avg10(true);
  let remWk=0,remWe=0; const start=closing?_addDays(closing,1):mS;
  for(let d=start; d<=mE; d=_addDays(d,1)){ if(_isWkHol(d))remWe++; else remWk++; }
  return actual + remWk*wkAvg + remWe*weAvg;
}
// 予実タブと同じ着地見込み（保存済み上書き o があれば反映）。o は planLoadAllFc の該当店ぶん。
// 戻り: {ex:税抜売上着地, inLand:税込着地, it:商品販売数着地}
function fcLandingEx(storeId,ym,o){
  const A=fcAuto(storeId,ym);
  // v が未指定(null/undefined/空)なら既定値dへ。※Number(null)===0 の罠を避ける。
  const num=(v,d)=>{if(v==null||v==="")return d;const n=Number(v);return Number.isFinite(n)?n:d;};
  const remWk=num(o&&o.remWk,A.remWk), remWe=num(o&&o.remWe,A.remWe);
  const avgWk=num(o&&o.avg&&o.avg.in&&o.avg.in.wk, Math.round(A.avgWk));
  const avgWe=num(o&&o.avg&&o.avg.in&&o.avg.in.we, Math.round(A.avgWe));
  const avgItWk=num(o&&o.avg&&o.avg.it&&o.avg.it.wk, Math.round(A.avgItWk));
  const avgItWe=num(o&&o.avg&&o.avg.it&&o.avg.it.we, Math.round(A.avgItWe));
  const Lin = A.tdIn + remWk*avgWk + remWe*avgWe;
  const Lit = A.tdIt + remWk*avgItWk + remWe*avgItWe;
  return {ex:Math.round(Lin*A.exRatio), inLand:Math.round(Lin), it:Math.round(Lit), closing:A.closing};
}

// ---- 保存（mgmt_report：月ごとJSON。サーバー未整備時は端末にフォールバック）----
async function keieiLoad(ym){
  try{ if(SB){ const {data}=await SB.from("mgmt_report").select("payload").eq("ym",ym).maybeSingle(); if(data&&data.payload)return {src:"server",p:data.payload}; } }catch(e){}
  try{ const s=localStorage.getItem("mgmtReport:"+ym); if(s)return {src:"local",p:JSON.parse(s)}; }catch(e){}
  return {src:null,p:null};
}
async function keieiSave(ym,payload){
  let server=false;
  try{ if(SB){ const {error}=await SB.from("mgmt_report").upsert({ym,payload,updated_by:(ME&&ME.email)||null},{onConflict:"ym"}); if(!error)server=true; } }catch(e){}
  try{ localStorage.setItem("mgmtReport:"+ym,JSON.stringify(payload)); }catch(e){}
  return server;
}

// ---- 認証（管理者のみ）＋データ読込 ----
async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }
async function boot(){
  try{
    if(window.__DATA__){DATA=window.__DATA__;prep();ME.role="admin";await loadTargets();renderKeiei();return;}
    let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    if(!cfg||cfg.mode!=="auth"){ screen('<div class="gate"><div class="logo">🧮 経営レポート</div><div class="t">ログインが必要です</div><div class="m">この画面は管理者専用です。Googleログインの設定が完了すると利用できます。</div><div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>'); return; }
    await ensureSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return;}
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    let role=null; try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
    ME.role=role;
    if(ME.role!=="admin"){ showDenied(ME.role?("この画面は管理者専用です（あなたの権限："+({viewer:"閲覧",editor:"編集"}[ME.role]||ME.role)+"）"):"アクセス権がありません。管理者にユーザー追加を依頼してください。"); return; }
    const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
    if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
    DATA=JSON.parse(await data.text()); prep(); await loadTargets(); renderKeiei();
  }catch(e){ showError(e); }
}
function showLogin(){ screen('<div class="gate"><div class="logo">🧮 経営レポート</div><div class="t">ログイン</div><div class="m">管理者の Google アカウントでログインしてください。</div><button class="gbtn" id="gl"><span class="g"></span>Google でログイン</button></div>');
  document.getElementById("gl").onclick=async()=>{const redirectTo=location.origin+location.pathname; await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}});}; }
function showDenied(msg){ screen('<div class="gate"><div class="logo">🧮 経営レポート</div><div class="t">アクセスできません</div><div class="m">'+esc(msg)+'</div><button class="gbtn" id="lo"><span class="g"></span>別のアカウントでログイン</button><div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>');
  document.getElementById("lo").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();}; }

// ---- 本体：経営レポート ----
async function renderKeiei(){
  const yf=v=>"¥"+Math.round(+v||0).toLocaleString("ja-JP");
  const ml=m=>(+m.slice(5,7))+"月";
  const cur=(DATA._salesMax||DATA._max||todayStr()).slice(0,7);
  const prev=prevYm(cur), next=addMonths(cur,1);
  const lyCur=addMonths(cur,-12), lyNext=addMonths(next,-12);
  const [cf,ct]=monthSpan(cur),[pf,pt]=monthSpan(prev),[lcf,lct]=monthSpan(lyCur),[lnf,lnt]=monthSpan(lyNext);
  const daysIn=+ct.slice(8,10);
  const curEnd=((DATA._salesMax||"")>=cf&&(DATA._salesMax||"")<=ct)?DATA._salesMax:null;
  const elapsed=curEnd?(+curEnd.slice(8,10)):0;
  const sumIds=(ids,from,to)=>sumRows(DATA.daily.filter(r=>ids.has(r.s)&&r.d>=from&&r.d<=to));
  const proj=s=>elapsed>0?s/elapsed*daysIn:0;
  const grow=(a,b)=>(a>0&&b>0)?b/a:1;
  // 直営 各店 税抜売上
  const dstores=usableStores().filter(s=>ownOf(s.id)==="直営");
  // 予算（月次予実「予算」＝目標）を店舗×月で引く。翌月以降の着地見込みに使う。
  const T=(TARGETS&&TARGETS.targets)||{};
  const tgtField=(sid,ym,fld)=>{const nm=(dstores.find(s=>s.id===sid)||{}).name||"";for(const tok in T){if(nm.indexOf(tok)>=0&&T[tok][ym]&&T[tok][ym][fld]!=null)return T[tok][ym][fld];}return null;};
  const tgtEx=(sid,ym)=>{const v=tgtField(sid,ym,"ex");return v!=null?Math.round(v):null;};
  const tgtQty=(sid,ym)=>{const v=tgtField(sid,ym,"qty");return v!=null?Math.round(v):null;};
  // 当月着地は「予実タブ（🎯着地見込み）」と同じ計算＝編集値も反映される。
  // 予実タブ保存値は1回のクエリで全店まとめて取得（往復を店舗数ぶん→1回に短縮）。
  const fcAll=await planLoadAllFc(cur);
  const fcMap={}; dstores.forEach(s=>{ try{fcMap[s.id]=fcLandingEx(s.id,cur,fcAll[String(s.id)]);}catch(e){fcMap[s.id]=null;} });
  const storeEx={}, storeIt={};
  dstores.forEach(s=>{const idset=new Set([s.id]);
    const pAgg=sumIds(idset,pf,pt); const pEx=pAgg.ex||0, pIt=pAgg.it||0;
    const cLand=Math.round(landingExForIds(idset,cur)), g=grow(sumIds(idset,lcf,lct).ex||0,sumIds(idset,lnf,lnt).ex||0);   // 当月税抜着地＝ダッシュボードと同一（landingForIds）
    const cIt=(elapsed>0&&fcMap[s.id])?fcMap[s.id].it:pIt;
    // 翌月（来月）＝予算があれば予算を着地見込みに、無ければ前年同月比推定。
    const nb=tgtEx(s.id,next), nq=tgtQty(s.id,next);
    storeEx[s.id]={prev:Math.round(pEx),cur:Math.round(cLand),next:(nb!=null?nb:Math.round(cLand*g))};
    storeIt[s.id]={prev:Math.round(pIt),cur:Math.round(cIt),next:(nq!=null?nq:Math.round(cIt*g))};});
  // 直営 全体KPI
  const dids=new Set(dstores.map(s=>s.id));
  const aggPrev=sumIds(dids,pf,pt), aggSo=curEnd?sumIds(dids,cf,curEnd):sumIds(dids,cf,cf);
  const f=elapsed>0?daysIn/elapsed:0, gAll=grow(sumIds(dids,lcf,lct).ex||0,sumIds(dids,lnf,lnt).ex||0);
  const scale=(a,m)=>({ex:(a.ex||0)*m,in:(a.in||0)*m,tx:(a.tx||0)*m,it:(a.it||0)*m,v:(a.hasV?a.v:0)*m,txv:(a.txv||0)*m,hasV:a.hasV});
  const aggCur=scale(aggSo,f), aggNext=scale(aggCur,gAll);
  const kOf=a=>({ex:Math.round(a.ex||0),aov:(a.tx>0?Math.round(a.in/a.tx):0),upt:(a.tx>0?+(a.it/a.tx).toFixed(2):0),aup:(a.it>0?Math.round(a.ex/a.it):0),v:Math.round(a.v||0),pr:(a.v>0?+(a.txv/a.v*100).toFixed(1):0)});
  const KPIS=[{k:"ex",n:"税抜売上"},{k:"aov",n:"客単価(税込)"},{k:"upt",n:"平均購入点数",u:"点"},{k:"aup",n:"商品単価(税抜)"},{k:"v",n:"来店客数",u:"人"},{k:"pr",n:"購入率",u:"%"}];
  const kpi={prev:kOf(aggPrev),cur:kOf(aggCur),next:kOf(aggNext)};
  // 直営全体の翌月 税抜売上は、各店の翌月着地（予算優先）の合計と一致させる。
  kpi.next.ex=Math.round(dstores.reduce((t,s)=>t+(storeEx[s.id].next||0),0));
  // FC 税抜着地（ロイヤリティ基礎）＝ダッシュボードの着地見込みと同一定義（①②③、税抜、FC全店の合算）
  const fcIds=new Set(usableStores().filter(s=>ownOf(s.id)!=="直営").map(s=>s.id));
  const fcLandEx=Math.round(landingExForIds(fcIds,cur));
  const auto={storeEx,kpi,roy:{base:fcLandEx,rate:6.8},wh:{NOTIME:{qty:0,unit:0},SELFURUGI:{qty:0,unit:0},GARAGE:{qty:0,unit:0},NEW:{qty:0,unit:0}},con:{qty:0,price:0,rate:0}};
  const loaded=await keieiLoad(cur), saved=loaded.p||{};
  const M=JSON.parse(JSON.stringify(auto));
  // 当月(cur)は予実タブの着地見込みが正（そちらで編集）。経営レポート保存の上書きは前月/来月のみ。
  if(saved.storeEx)for(const id in M.storeEx){if(saved.storeEx[id])["prev","next"].forEach(c=>{if(saved.storeEx[id][c]!=null)M.storeEx[id][c]=saved.storeEx[id][c];});}
  if(saved.kpi)["prev","cur","next"].forEach(c=>{if(saved.kpi[c])Object.assign(M.kpi[c],saved.kpi[c]);});
  if(saved.roy)Object.assign(M.roy,saved.roy);
  if(saved.wh)for(const k in M.wh){if(saved.wh[k])Object.assign(M.wh[k],saved.wh[k]);}
  if(saved.con&&typeof saved.con==="object")Object.assign(M.con,saved.con);   // 旧・数値保存は破棄（新: {qty,price,rate}）
  const ni=(k,v)=>`<input class="ki" data-k="${k}" value="${v}" inputmode="decimal">`;
  const niY=(k,v)=>`<span class="yenin">¥${ni(k,v)}</span>`;   // 円マーク付き入力
  const WH=[["NOTIME","NOTIME"],["SELFURUGI","SELFURUGI"],["GARAGE","SELFURUGI GARAGE"],["NEW","新店"]];
  let h='';
  h+=`<header><h1>🧮 経営レポート</h1><span class="sub">対象 <b>${cur}</b>（前月 ${ml(prev)}／当月 ${ml(cur)}／来月 ${ml(next)}）${elapsed?`　当月は ${elapsed}/${daysIn}日で日割り換算`:'　当月データなし'}</span><a class="navlink" href="index.html" style="margin-left:auto">← ダッシュボード</a></header>`;
  h+=`<div class="note">前月＝実績確定／当月＝<b>ダッシュボードと同じ着地見込み（①②③）</b>／翌月以降＝<b>予算（月次予実「予算」）</b>を着地見込みに（予算が無い店のみ前年同月比で推定）。自動入力ですが編集できます（「保存する」で全員に共有）。</div>`;
  // ■ 予算達成の見込み（目標 vs 着地）※月次予実Excelから取込んだ目標を店舗に紐付け
  const trows=Object.keys(T).map(tok=>{ const cand=usableStores().filter(s=>(s.name||"").indexOf(tok)>=0); return {tok,st:cand.find(s=>ownOf(s.id)==="直営")||cand[0]}; }).filter(x=>x.st&&T[x.tok][cur]);
  if(trows.length){
    const rate=(a,b)=>b?Math.round(a/b*100)+"%":"—";
    h+=`<div class="panel"><h2>■ 予算達成の見込み（${ml(cur)}・目標 vs 着地）</h2><div class="tblwrap"><table><thead><tr><th>店舗</th><th>税抜売上 目標</th><th>着地見込</th><th>達成率</th><th>来店 目標</th><th>着地見込</th><th>達成率</th></tr></thead><tbody>`;
    trows.forEach(({tok,st})=>{ const idset=new Set([st.id]);
      // 税抜売上の着地見込＝ダッシュボードと同一の着地見込み定義（landingExForIds＝①②③）。直営は上の表の編集値と連動。
      const exLand=M.storeEx[st.id]?M.storeEx[st.id].cur:Math.round(landingExForIds(idset,cur));
      const so=curEnd?sumIds(idset,cf,curEnd):{v:0,hasV:false}; const vLand=so.hasV?Math.round(proj(so.v||0)):null;
      const tg=T[tok][cur]||{}; const exT=tg.ex?Math.round(tg.ex):null, vT=tg.visitors?Math.round(tg.visitors):null;
      h+=`<tr><td>${esc(st.name)}</td><td>${exT?yf(exT):"—"}</td><td id="tex-${st.id}">${yf(exLand)}</td><td><b id="trate-${st.id}">${exT?rate(exLand,exT):"—"}</b></td><td>${vT?NUM(vT)+"人":"—"}</td><td>${vLand!=null?NUM(vLand)+"人":"—"}</td><td><b>${(vT&&vLand!=null)?rate(vLand,vT):"—"}</b></td></tr>`;
    });
    h+=`</tbody></table></div><div class="note">目標＝月次予実「予算」（Excel取込）。税抜売上の着地見込＝<b>ダッシュボード（店舗ページ）の着地見込みと同じ計算（①②③）</b>。来店＝当月実績の日割り。達成率＝着地÷目標。</div></div>`;
  }
  // 直営 各店：税抜売上・商品販売数・平均商品単価（月ごと）
  h+=`<div class="panel"><h2>■ 直営：各店の着地見込（税抜売上・商品販売数・平均商品単価）</h2><div class="tblwrap"><table><thead><tr><th>店舗 / 指標</th><th>${ml(prev)}</th><th>${ml(cur)}</th><th>${ml(next)}</th></tr></thead><tbody>`;
  dstores.forEach(s=>{const e=M.storeEx[s.id], it=storeIt[s.id];
    const aup=c=>(it[c]>0?Math.round(e[c]/it[c]):0);
    h+=`<tr class="storehd"><td colspan="4">${esc(s.name)}</td></tr>`;
    h+=`<tr><td>税抜売上</td><td>${niY("sx|"+s.id+"|prev",e.prev)}</td><td>${niY("sx|"+s.id+"|cur",e.cur)}</td><td>${niY("sx|"+s.id+"|next",e.next)}</td></tr>`;
    h+=`<tr><td>商品販売数</td>`+["prev","cur","next"].map(c=>`<td id="it-${s.id}-${c}">${NUM(it[c])}点</td>`).join("")+`</tr>`;
    h+=`<tr><td>平均商品単価</td>`+["prev","cur","next"].map(c=>`<td id="aup-${s.id}-${c}">${yf(aup(c))}</td>`).join("")+`</tr>`;});
  h+=`<tr class="total"><td>直営 計（税抜売上）</td><td id="tot-prev"></td><td id="tot-cur"></td><td id="tot-next"></td></tr>`;
  h+=`</tbody></table></div><div class="note">当月（${ml(cur)}）＝<b>ダッシュボードと同じ着地見込み（①②③）</b>。翌月（${ml(next)}）＝<b>予算</b>（月次予実「予算」。税抜売上・商品販売数とも予算。無い店のみ前年同月比推定）。前月＝実績確定。平均商品単価＝税抜売上÷商品販売数（売上を直すと自動再計算）。</div>`;
  // 直営 KPI
  h+=`<div class="subhd">直営：主要KPI 着地見込（直営全体）</div><div class="tblwrap"><table><thead><tr><th>KPI</th><th>${ml(prev)}</th><th>${ml(cur)}</th><th>${ml(next)}</th></tr></thead><tbody>`;
  KPIS.forEach(m=>{h+=`<tr><td>${m.n}${m.u?`（${m.u}）`:''}</td>`+["prev","cur","next"].map(c=>`<td>${ni("kpi|"+c+"|"+m.k,M.kpi[c][m.k])}</td>`).join("")+`</tr>`;});
  h+=`</tbody></table></div></div>`;
  // FC
  h+=`<div class="panel"><h2>■ FC売上（本部としての売上着地見込）</h2>`;
  h+=`<div class="subhd">① ロイヤリティ</div><div class="krow">FC着地売上(税抜) ${ni("roy|base",M.roy.base)} × 率 ${ni("roy|rate",M.roy.rate)}% ＝ <b id="roy-res" style="font-size:15px"></b></div>`;
  h+=`<div class="note" style="margin:-2px 0 8px">FC着地売上＝ダッシュボードの着地見込みと同じ計算（①今月の経過実績＋②平日の直近10日平均×残平日＋③土日祝の直近10日平均×残土日祝）。<b>税抜</b>のFC全店合算です。</div>`;
  h+=`<div class="subhd">② 卸売上</div><div class="tblwrap"><table><thead><tr><th>区分</th><th>発送数</th><th>卸商品単価</th><th>小計</th></tr></thead><tbody>`;
  WH.forEach(([k,nm])=>{const w=M.wh[k];h+=`<tr><td>${nm}</td><td>${ni("wh|"+k+"|qty",w.qty)}</td><td>${ni("wh|"+k+"|unit",w.unit)}</td><td id="wsub-${k}"></td></tr>`;});
  h+=`<tr class="total"><td>卸売上 合計</td><td id="wqty-tot"></td><td id="wunit-avg"></td><td id="wtot"></td></tr></tbody></table></div><div class="note">卸売上合計の「発送数」＝各区分の発送数の合計、「卸商品単価」＝加重平均（合計金額÷合計発送数）。</div>`;
  h+=`<div class="subhd">③ 委託店</div><div class="tblwrap"><table><thead><tr><th>販売着数</th><th>売価</th><th>卸掛け率(%)</th><th>合計</th></tr></thead><tbody>`;
  h+=`<tr><td>${ni("con|qty",M.con.qty)}</td><td>${niY("con|price",M.con.price)}</td><td>${ni("con|rate",M.con.rate)}</td><td id="con-res"></td></tr>`;
  h+=`</tbody></table></div><div class="note">委託店の卸売上見込み＝販売着数 × 売価 × 卸掛け率(%)。</div>`;
  h+=`<div class="honbu"><span>本部売上見込 合計（① ロイヤリティ＋② 卸＋③ 委託）</span><span id="honbu" style="font-size:17px"></span></div></div>`;
  h+=`<div class="actions"><span id="ki-status" class="sub"></span><button id="ki-auto" class="themebtn">自動再計算</button><button id="ki-save" class="themebtn" style="background:var(--accent);color:#fff;border-color:var(--accent)">保存する</button></div>`;
  screen(h);
  const D=document, gel=k=>D.querySelector('[data-k="'+k+'"]'), num=k=>{const e=gel(k);return e?(parseFloat(String(e.value).replace(/[^0-9.\-]/g,''))||0):0;};
  const recalc=()=>{
    ["prev","cur","next"].forEach(c=>{let t=0;dstores.forEach(s=>t+=num("sx|"+s.id+"|"+c));const e=D.getElementById("tot-"+c);if(e)e.textContent=yf(t);});
    // 平均商品単価＝税抜売上÷商品販売数（売上の編集に追従）
    dstores.forEach(s=>["prev","cur","next"].forEach(c=>{const q=storeIt[s.id]?storeIt[s.id][c]:0;const ae=D.getElementById("aup-"+s.id+"-"+c);if(ae)ae.textContent=q>0?yf(Math.round(num("sx|"+s.id+"|"+c)/q)):"—";}));
    const roy=num("roy|base")*num("roy|rate")/100; D.getElementById("roy-res").textContent=yf(roy);
    let wtot=0,wqty=0;WH.forEach(([k])=>{const q=num("wh|"+k+"|qty"),u=num("wh|"+k+"|unit");const sub=q*u;wtot+=sub;wqty+=q;const e=D.getElementById("wsub-"+k);if(e)e.textContent=yf(sub);});
    D.getElementById("wtot").textContent=yf(wtot);
    {const qe=D.getElementById("wqty-tot");if(qe)qe.textContent=NUM(wqty);const ae=D.getElementById("wunit-avg");if(ae)ae.textContent=wqty>0?yf(Math.round(wtot/wqty)):"—";}
    const con=num("con|qty")*num("con|price")*num("con|rate")/100; const ce=D.getElementById("con-res");if(ce)ce.textContent=yf(con);
    D.getElementById("honbu").textContent=yf(roy+wtot+con);
    // 予算達成パネルの税抜売上着地＝直営の当月着地(編集値)と連動
    trows.forEach(({tok,st})=>{ if(ownOf(st.id)!=="直営")return; const land=num("sx|"+st.id+"|cur");
      const te=D.getElementById("tex-"+st.id); if(te)te.textContent=yf(land);
      const exT=(T[tok][cur]||{}).ex; const tr=D.getElementById("trate-"+st.id); if(tr)tr.textContent=exT?(Math.round(land/exT*100)+"%"):"—"; });
  };
  D.querySelectorAll(".ki").forEach(e=>e.addEventListener("input",recalc)); recalc();
  if(loaded.src)D.getElementById("ki-status").textContent=(loaded.src==="server"?"サーバーの保存値を表示中":"この端末の保存値を表示中");
  D.getElementById("ki-auto").onclick=()=>{
    for(const id in auto.storeEx)["prev","cur","next"].forEach(c=>{const e=gel("sx|"+id+"|"+c);if(e)e.value=auto.storeEx[id][c];});
    ["prev","cur","next"].forEach(c=>KPIS.forEach(m=>{const e=gel("kpi|"+c+"|"+m.k);if(e)e.value=auto.kpi[c][m.k];}));
    const rb=gel("roy|base");if(rb)rb.value=auto.roy.base; recalc();
  };
  D.getElementById("ki-save").onclick=async()=>{
    const payload={storeEx:{},kpi:{prev:{},cur:{},next:{}},roy:{base:num("roy|base"),rate:num("roy|rate")},wh:{},con:{qty:num("con|qty"),price:num("con|price"),rate:num("con|rate")}};
    dstores.forEach(s=>{payload.storeEx[s.id]={prev:num("sx|"+s.id+"|prev"),cur:num("sx|"+s.id+"|cur"),next:num("sx|"+s.id+"|next")};});
    ["prev","cur","next"].forEach(c=>KPIS.forEach(m=>{payload.kpi[c][m.k]=num("kpi|"+c+"|"+m.k);}));
    WH.forEach(([k])=>{payload.wh[k]={qty:num("wh|"+k+"|qty"),unit:num("wh|"+k+"|unit")};});
    const b=D.getElementById("ki-save");b.disabled=true;b.textContent="保存中…";
    const server=await keieiSave(cur,payload);
    b.disabled=false;b.textContent="保存する";
    D.getElementById("ki-status").textContent=server?"✅ サーバーに保存しました（全員に共有）":"⚠️ この端末に保存（サーバー保存は sql/018 実行後に有効）";
  };
}
boot();
</script>
