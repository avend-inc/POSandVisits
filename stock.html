<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04); --radius:14px;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 92px;}
  header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 4px;}
  select{appearance:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:10px;padding:8px 30px 8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  label.lbl{font-size:12px;color:var(--muted);font-weight:600;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;margin:14px 0;}
  .panel h2{font-size:14px;margin:0 0 2px;font-weight:700;}
  .panel .note{font-size:11.5px;color:var(--muted);margin:0 0 8px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow);}
  .card .k{font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:5px;}
  .card .val{font-size:21px;font-weight:750;line-height:1.1;}
  .card.gap .val.pos{color:var(--good);} .card.gap .val.neg{color:var(--bad);}
  .card .knote{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tblwrap{overflow-x:auto;}
  th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);}
  th{color:var(--ink2);font-weight:700;font-size:11px;background:var(--surface);}
  tfoot td{font-weight:750;border-top:2px solid var(--border);background:var(--surface2);}
  tr.sec td{background:var(--surface2);font-weight:750;color:var(--ink2);font-size:11.5px;}
  td.calc{font-weight:700;}
  input.num{width:96px;text-align:right;border:1px solid var(--border);border-radius:8px;
    padding:6px 8px;font-size:12.5px;font-family:inherit;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums;}
  input.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);}
  input.num.auto{background:var(--surface2);color:var(--ink2);}
  .savebar{position:sticky;bottom:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;
    margin:10px 0 0;padding:8px 0;}
  .btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:750;cursor:pointer;box-shadow:var(--shadow);}
  .btn[disabled]{opacity:.5;cursor:default;}
  .pill{font-size:12px;color:var(--muted);font-weight:600;}
  .navlink{border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .themebtn{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .foot{color:var(--muted);font-size:11px;margin-top:16px;line-height:1.7;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:640px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);} .tabbar a.on .ic{filter:none;}
  .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;} .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:20px;}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}

<script>
"use strict";
const YEN=n=>Math.round(n||0).toLocaleString("ja-JP");
const NUM=n=>Math.round(n||0).toLocaleString("ja-JP");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[,¥\s]/g,""));return isFinite(n)?n:0;};

const CONFIG_URL="https://rwfcsanmqvkxiuwdeddv.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null}, DATA=null;

// 実地棚卸のカテゴリ。着数（服）に数える標準カテゴリ ＋ 小物（着数に含めない）。
const BASE_GARMENTS=["デニム","チノ/スラックス等","Tシャツ","ポロシャツ","半袖シャツ","長袖シャツ",
  "スウェット/パーカー","セーター/フリース","ニット","アウター/ジャケット","ヘビーアウター"];
const KOMONO=["ネックレス","指輪","ラグ","その他小物"];         // 小物は分けて数える（着数には含めない）
const BLOCKS=["店内","BY","倉庫"];
// 着数からもカテゴリ着数からも除く（小物・付随物・非商品）
const NON_GARMENT=new Set(["小物","ネックレス","指輪","ラグ","リング","その他小物","レジ袋","クーポン","その他"]);

let GARMENTS=BASE_GARMENTS.slice();   // 実データのカテゴリを足して確定（initで拡張）
let OWN_STORES=[];                    // 直営店 [{id,name}]
let state={sid:null, ym:null, inv:null, prev:null, dirty:false};

/* ---------------- 起動・ログイン（dashboardと同じ方式） ---------------- */
function screen(html){document.getElementById("app").innerHTML=html;}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
async function ensureSupabase(){
  if(window.supabase)return;
  await new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;
    s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした（通信環境をご確認ください）"));document.head.appendChild(s);});
}
async function boot(){
  try{
    let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    if(!(cfg&&cfg.mode==="auth")){
      screen('<div class="err">棚卸はログインが必要です（認証モードのみ）。管理画面から設定してください。</div>');return;
    }
    await ensureSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,
      detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return;}
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    let role=null; try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
    ME.role=role; if(!ME.role){showDenied(ME.email);return;}
    screen('<div class="sub" style="padding:40px 0">データを読み込み中…</div>');
    const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
    if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
    DATA=JSON.parse(await data.text());
    initStock();
  }catch(e){showError(e);}
}
function showLogin(){
  screen(`<div class="gate"><div class="logo">売上KPI管理</div><div class="t">ログイン</div>
    <div class="m">許可されたメンバー専用です。<br>管理者に登録された Google アカウントでログインしてください。</div>
    <button class="gbtn" id="glogin"><span class="g"></span>Google でログイン</button></div>`);
  document.getElementById("glogin").onclick=doLogin;
}
function showDenied(email){
  screen(`<div class="gate"><div class="logo">売上KPI管理</div><div class="t">アクセス権がありません</div>
    <div class="m"><b>${esc(email)}</b> はまだ登録されていません。<br>管理者にユーザー追加を依頼してください。</div>
    <button class="gbtn" id="grelogin"><span class="g"></span>別のアカウントでログイン</button></div>`);
  document.getElementById("grelogin").onclick=doLogout;
}
async function doLogin(){const redirectTo=location.origin+location.pathname;
  const {error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}});
  if(error)showError(error);}
async function doLogout(){try{await SB.auth.signOut();}catch(e){}location.reload();}

/* ---------------- 棚卸ロジック ---------------- */
function ymOf(d){return String(d).slice(0,7);}
function prevYm(ym){let[y,m]=ym.split("-").map(Number);m--;if(m<1){m=12;y--;}return `${y}-${String(m).padStart(2,"0")}`;}
function ymLabel(ym){const[y,m]=ym.split("-");return `${y}年${+m}月`;}

function initStock(){
  // 直営店（表示対象）
  OWN_STORES=(DATA.stores||[]).filter(s=>s.own==="直営"&&s.visible!==false)
    .map(s=>({id:s.id,name:s.name})).sort((a,b)=>a.id-b.id);
  // 実データのカテゴリを標準リストに足して「POS登録の全カテゴリ」に近づける（小物等は除外）
  const extra=new Set();
  (DATA.cat||[]).forEach(r=>{const c=(r.c||"").trim();
    if(c&&!NON_GARMENT.has(c)&&BASE_GARMENTS.indexOf(c)<0)extra.add(c);});
  GARMENTS=BASE_GARMENTS.concat([...extra].sort());
  // 月の候補（データのある月、降順）
  const months=[...new Set((DATA.daily||[]).map(r=>ymOf(r.d)))].sort().reverse();
  state.sid=OWN_STORES.length?OWN_STORES[0].id:null;
  state.ym=months.length?months[0]:new Date().toISOString().slice(0,7);
  renderShell(months);
  loadMonth();
}

// KPIから当月の自動値（すべて売上データから算出）
//   it   = 販売点数（レジ袋・クーポンを除く。小物・詰め放題は含む）
//   bag  = レジ袋点数 / coup = クーポン点数
//   komono = 小物点数（小物系カテゴリの合計） / tsumeBags = 詰め放題の袋数（「詰め放題」カテゴリ点数）
//   sales = 販売数（＝ it + レジ袋 + クーポン。スプシの「販売数」に相当）
const KOMONO_CATS=["小物","ネックレス","指輪","ラグ","リング","その他小物"];
function isTsume(c){return c.indexOf("詰め放題")>=0||c.indexOf("詰放題")>=0||c.indexOf("つめ放題")>=0;}
function kpiOf(sid,ym){
  let it=0,bag=0,coup=0;
  (DATA.daily||[]).forEach(r=>{ if(r.s===sid&&ymOf(r.d)===ym){ it+=num(r.it); bag+=num(r.bagq); coup+=num(r.coup); }});
  let komono=0, tsumeBags=0;
  (DATA.cat||[]).forEach(r=>{ if(r.s===sid&&ymOf(r.d)===ym){
    const c=(r.c||"").trim();
    if(KOMONO_CATS.indexOf(c)>=0)komono+=num(r.q);
    if(isTsume(c))tsumeBags+=num(r.q);
  }});
  // 販売着数（服のみ）＝ 販売数 − レジ袋 − クーポン − 小物 − 詰め放題袋数 ＝ it − 小物 − 詰め放題袋
  const soldGarment=Math.max(it-komono-tsumeBags,0);
  return {it, bag, coup, komono, tsumeBags, sales:it+bag+coup, soldGarment};
}

// 実地棚卸の在庫（着数）＝ ブロック×服カテゴリの合計 ＋ 特例プラス − 特例マイナス
function physicalGarment(inv){
  let s=0; const p=(inv&&inv.physical)||{};
  BLOCKS.forEach(b=>{const bb=p[b]||{}; GARMENTS.forEach(c=>{ s+=num(bb[c]); });});
  s+=num(inv&&inv.special_plus)-num(inv&&inv.special_minus);
  return s;
}
function physicalKomono(inv){let s=0;const p=(inv&&inv.physical)||{};const kk=p["小物"]||{};KOMONO.forEach(c=>{s+=num(kk[c]);});return s;}

// 当月の全計算をまとめて返す
function compute(){
  const inv=state.inv||{}, prev=state.prev;
  const kpi=kpiOf(state.sid,state.ym);
  // 前月末在庫（着数・単価）：前月の実地在庫 と 前月の合算平均単価。無ければ初期値入力。
  let openQ, openP;
  if(prev){ openQ=physicalGarment(prev); openP=num(prev.avg_price); }
  else { openQ=num(inv.opening_qty); openP=num(inv.opening_price); }
  const openAmt=openQ*openP;
  const recvQ=num(inv.received_qty), recvP=num(inv.received_price), recvAmt=recvQ*recvP;
  const sumQ=openQ+recvQ, sumAmt=openAmt+recvAmt;
  const avgP=sumQ>0?sumAmt/sumQ:0;
  const outQ=kpi.soldGarment+num(inv.shipping_qty)+num(inv.loss_qty)+num(inv.campaign_qty)+num(inv.tsume_qty);
  const theoQ=sumQ-outQ;
  const theoAmt=theoQ*avgP;
  const physQ=physicalGarment(inv), physK=physicalKomono(inv);
  const gap=physQ-theoQ;
  const shelfAmt=physQ*avgP;
  return {kpi,openQ,openP,openAmt,recvQ,recvP,recvAmt,sumQ,sumAmt,avgP,outQ,theoQ,theoAmt,physQ,physK,gap,shelfAmt,hasPrev:!!prev};
}

async function loadMonth(){
  state.inv=null; state.prev=null; state.dirty=false;
  try{
    const {data:cur}=await SB.from("inventory").select("*").eq("store_id",state.sid).eq("ym",state.ym).maybeSingle();
    state.inv=cur||{store_id:state.sid,ym:state.ym,physical:{}};
    const {data:pv}=await SB.from("inventory").select("*").eq("store_id",state.sid).eq("ym",prevYm(state.ym)).maybeSingle();
    state.prev=pv||null;
  }catch(e){ state.inv=state.inv||{store_id:state.sid,ym:state.ym,physical:{}}; }
  if(!state.inv.physical)state.inv.physical={};
  renderBody();
}

/* ---------------- 描画 ---------------- */
function renderShell(months){
  const opts=OWN_STORES.map(s=>`<option value="${s.id}"${s.id===state.sid?" selected":""}>${esc(s.name)}</option>`).join("");
  const mopts=months.map(m=>`<option value="${m}"${m===state.ym?" selected":""}>${ymLabel(m)}</option>`).join("")
    || `<option value="${state.ym}">${ymLabel(state.ym)}</option>`;
  screen(`<header><h1>📦 棚卸</h1><span class="sub">理論在庫 vs 実地棚卸（月次）</span>
      <button class="themebtn" id="theme">◐ テーマ</button></header>
    <div class="controls">
      <label class="lbl">店舗</label><select id="selStore">${opts}</select>
      <label class="lbl">対象月</label><select id="selYm">${mopts}</select>
      <a class="navlink" href="index.html?g=own">← ダッシュボード</a>
    </div>
    <div id="stockBody"><div class="sub" style="padding:30px 0">読み込み中…</div></div>`);
  document.getElementById("selStore").onchange=e=>{state.sid=+e.target.value;loadMonth();};
  document.getElementById("selYm").onchange=e=>{state.ym=e.target.value;loadMonth();};
  const tb=document.getElementById("theme");
  tb.onclick=()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme")||"";
    const nx=cur==="dark"?"light":cur==="light"?"":"dark";if(nx)r.setAttribute("data-theme",nx);else r.removeAttribute("data-theme");};
}

function inRow(label,field,val,note){
  return `<tr><td>${esc(label)}${note?` <span class="sub">${esc(note)}</span>`:""}</td>
    <td><input class="num" type="number" step="any" data-f="${field}" value="${val?val:""}"></td></tr>`;
}
function calcRow(label,val,fmt,cls){
  return `<tr><td>${esc(label)}</td><td class="calc ${cls||""}">${fmt?fmt(val):NUM(val)}</td></tr>`;
}

function renderBody(){
  const inv=state.inv, c=compute();
  const yen=v=>"¥"+YEN(v), n=v=>NUM(v);
  // 上部サマリー
  const gapCls=c.gap>=0?"pos":"neg";
  const kpis=`<div class="kpis">
    <div class="card"><div class="k">理論在庫（着数）</div><div class="val">${n(c.theoQ)}</div><div class="knote">合算${n(c.sumQ)} − 減少${n(c.outQ)}</div></div>
    <div class="card"><div class="k">実地在庫（着数）</div><div class="val">${n(c.physQ)}</div><div class="knote">数えた合計＋特例</div></div>
    <div class="card gap"><div class="k">GAP（実地−理論）</div><div class="val ${gapCls}">${c.gap>=0?"+":""}${n(c.gap)}</div><div class="knote">差異（ロス等）</div></div>
    <div class="card"><div class="k">棚金額</div><div class="val">${yen(c.shelfAmt)}</div><div class="knote">実地${n(c.physQ)}×平均${yen(c.avgP)}</div></div>
  </div>`;

  // 明細テーブル（手入力＝input / 自動・計算＝表示）
  const rows=[];
  rows.push(`<tr class="sec"><td colspan="2">① 前月末在庫（繰越）</td></tr>`);
  if(c.hasPrev){
    rows.push(calcRow("前月末在庫（着数）",c.openQ,n));
    rows.push(calcRow("前月平均単価",c.openP,yen));
  }else{
    rows.push(inRow("前月末在庫（着数・初期値）","opening_qty",num(inv.opening_qty),"前月データが無い初回のみ"));
    rows.push(inRow("前月平均単価（初期値）","opening_price",num(inv.opening_price)));
  }
  rows.push(calcRow("前月棚金額",c.openAmt,yen));

  rows.push(`<tr class="sec"><td colspan="2">② 当月入荷（手入力）</td></tr>`);
  rows.push(inRow("入荷着数","received_qty",num(inv.received_qty)));
  rows.push(inRow("入荷平均単価","received_price",num(inv.received_price)));
  rows.push(calcRow("入荷棚金額",c.recvAmt,yen));

  rows.push(`<tr class="sec"><td colspan="2">③ 合算（前月＋入荷）</td></tr>`);
  rows.push(calcRow("合算着数",c.sumQ,n));
  rows.push(calcRow("合算平均単価",c.avgP,yen));
  rows.push(calcRow("合算棚金額",c.sumAmt,yen));

  rows.push(`<tr class="sec"><td colspan="2">④ 当月の減少 → 理論在庫</td></tr>`);
  rows.push(calcRow("販売数（自動）",c.kpi.sales,n));
  rows.push(calcRow("　− レジ袋（自動）",c.kpi.bag,n));
  rows.push(calcRow("　− クーポン（自動）",c.kpi.coup,n));
  rows.push(calcRow("　− 小物（自動）",c.kpi.komono,n));
  rows.push(calcRow("　− 詰め放題 袋数（自動）",c.kpi.tsumeBags,n));
  rows.push(calcRow("＝ 販売着数（服のみ）",c.kpi.soldGarment,n,"pos"));
  rows.push(inRow("発送数","shipping_qty",num(inv.shipping_qty)));
  rows.push(inRow("ロス","loss_qty",num(inv.loss_qty)));
  rows.push(inRow("キャンペーン(MEO用)","campaign_qty",num(inv.campaign_qty)));
  rows.push(inRow("詰め放題（着数・袋の中の枚数）","tsume_qty",num(inv.tsume_qty)));
  rows.push(calcRow("理論在庫（着数）",c.theoQ,n,"pos"));
  rows.push(calcRow("理論棚金額",c.theoAmt,yen));

  const table=`<div class="panel"><h2>棚卸計算</h2>
    <p class="note">グレー背景の欄は手入力です。前月末在庫・合算・理論・GAP・棚金額は自動計算されます。</p>
    <div class="tblwrap"><table><tbody id="calcTbody">${rows.join("")}</tbody></table></div></div>`;

  // 実地棚卸（カテゴリ別 × ブロック）
  const p=inv.physical||{};
  const gHead=`<tr><th>カテゴリ</th>${BLOCKS.map(b=>`<th>${b}</th>`).join("")}<th>計</th></tr>`;
  const gBody=GARMENTS.map(cat=>{
    let rowSum=0; const tds=BLOCKS.map(b=>{const v=num((p[b]||{})[cat]);rowSum+=v;
      return `<td><input class="num" type="number" step="any" data-blk="${esc(b)}" data-cat="${esc(cat)}" value="${v||""}"></td>`;}).join("");
    return `<tr><td>${esc(cat)}</td>${tds}<td class="calc" data-rowsum="${esc(cat)}">${n(rowSum)}</td></tr>`;
  }).join("");
  const blkSum=b=>{let s=0;GARMENTS.forEach(cat=>{s+=num((p[b]||{})[cat]);});return s;};
  const gFoot=`<tr class="sec"><td>ブロック計</td>${BLOCKS.map(b=>`<td class="calc" data-blksum="${esc(b)}">${n(blkSum(b))}</td>`).join("")}
      <td class="calc" data-garmenttotal>${n(GARMENTS.reduce((a,cat)=>a+BLOCKS.reduce((x,b)=>x+num((p[b]||{})[cat]),0),0))}</td></tr>`;
  const komonoRows=KOMONO.map(cat=>{const v=num((p["小物"]||{})[cat]);
    return `<tr><td>${esc(cat)}</td><td><input class="num" type="number" step="any" data-blk="小物" data-cat="${esc(cat)}" value="${v||""}"></td></tr>`;}).join("");
  const physical=`<div class="panel"><h2>⑤ 実地棚卸（カテゴリ別）</h2>
    <p class="note">店内・BY・倉庫それぞれで、POSカテゴリ別に数えた在庫数を入力します。合計が「実地在庫（着数）」になります。</p>
    <div class="tblwrap"><table><thead>${gHead}</thead><tbody>${gBody}</tbody><tfoot>${gFoot}</tfoot></table></div>
    <h2 style="margin-top:14px">小物（着数に含めない）</h2>
    <div class="tblwrap"><table><tbody>${komonoRows}
      <tr class="sec"><td>小物 計</td><td class="calc" data-komonototal>${n(c.physK)}</td></tr></tbody></table></div>
    <div class="tblwrap"><table><tbody>
      ${inRow("特例（プラス分）","special_plus",num(inv.special_plus))}
      ${inRow("特例（マイナス分）","special_minus",num(inv.special_minus))}
      <tr><td>実地在庫（着数）</td><td class="calc" data-physq>${n(c.physQ)}</td></tr>
    </tbody></table></div></div>`;

  document.getElementById("stockBody").innerHTML=kpis+table+physical+
    `<div class="savebar"><span class="pill" id="savemsg">${state.inv&&state.inv.updated_at?("最終保存 "+esc(String(state.inv.updated_at).slice(0,16).replace("T"," "))):"未保存"}</span>
       <button class="btn" id="saveBtn"${state.dirty?"":" disabled"}>保存する</button></div>
     <div class="foot">理論在庫＝前月末在庫＋入荷−（販売着数＋発送＋ロス＋キャンペーン＋詰め放題着数）。
       GAP＝実地−理論（マイナスは想定より在庫が少ない＝ロス等）。棚金額＝実地在庫×合算平均単価。</div>`;
  wireInputs();
}

function wireInputs(){
  const body=document.getElementById("stockBody");
  body.querySelectorAll('input.num[data-f]').forEach(el=>{
    el.oninput=()=>{ state.inv[el.dataset.f]=el.value===""?0:num(el.value); markDirty(); recompute(); };
  });
  body.querySelectorAll('input.num[data-blk]').forEach(el=>{
    el.oninput=()=>{
      const b=el.dataset.blk, cat=el.dataset.cat;
      if(!state.inv.physical[b])state.inv.physical[b]={};
      state.inv.physical[b][cat]=el.value===""?0:num(el.value);
      markDirty(); recompute();
    };
  });
  const sb=document.getElementById("saveBtn"); if(sb)sb.onclick=save;
}
function markDirty(){state.dirty=true;const b=document.getElementById("saveBtn");if(b)b.disabled=false;
  const m=document.getElementById("savemsg");if(m)m.textContent="未保存の変更があります";}

// 入力のたびに、計算セルだけ更新（再描画せず速い）
function recompute(){
  const c=compute();
  const set=(sel,txt)=>{const el=document.querySelector(sel);if(el)el.textContent=txt;};
  // サマリーカード
  const cards=document.querySelectorAll(".kpis .card .val");
  if(cards[0])cards[0].textContent=NUM(c.theoQ);
  if(cards[1])cards[1].textContent=NUM(c.physQ);
  if(cards[2]){cards[2].textContent=(c.gap>=0?"+":"")+NUM(c.gap);cards[2].className="val "+(c.gap>=0?"pos":"neg");}
  if(cards[3])cards[3].textContent="¥"+YEN(c.shelfAmt);
  // 実地グリッドの行計・ブロック計
  const p=state.inv.physical||{};
  document.querySelectorAll('[data-rowsum]').forEach(td=>{const cat=td.getAttribute("data-rowsum");
    let s=0;BLOCKS.forEach(b=>{s+=num((p[b]||{})[cat]);});td.textContent=NUM(s);});
  BLOCKS.forEach(b=>{const td=document.querySelector(`[data-blksum="${CSS.escape(b)}"]`);
    if(td){let s=0;GARMENTS.forEach(cat=>{s+=num((p[b]||{})[cat]);});td.textContent=NUM(s);}});
  set("[data-garmenttotal]",NUM(GARMENTS.reduce((a,cat)=>a+BLOCKS.reduce((x,b)=>x+num((p[b]||{})[cat]),0),0)));
  set("[data-komonototal]",NUM(c.physK));
  set("[data-physq]",NUM(c.physQ));
  // 計算行（②③④の自動値）— 影響の大きいものだけ手軽に全再描画
  refreshCalcCells(c);
}
function refreshCalcCells(c){
  // calcTbody 内の計算セルを作り直す（入力欄には触れない）
  // 簡便のため renderBody の計算部分だけ再構築せず、主要値をラベル一致で更新
  const map=[["前月棚金額","¥"+YEN(c.openAmt)],["入荷棚金額","¥"+YEN(c.recvAmt)],
    ["合算着数",NUM(c.sumQ)],["合算平均単価","¥"+YEN(c.avgP)],["合算棚金額","¥"+YEN(c.sumAmt)],
    ["＝ 販売着数（服のみ）",NUM(c.kpi.soldGarment)],["理論在庫（着数）",NUM(c.theoQ)],["理論棚金額","¥"+YEN(c.theoAmt)]];
  document.querySelectorAll("#calcTbody tr").forEach(tr=>{
    const k=tr.firstElementChild&&tr.firstElementChild.textContent.trim();
    const hit=map.find(m=>k&&k.indexOf(m[0])===0);
    if(hit){const td=tr.querySelector("td.calc");if(td)td.textContent=hit[1];}
  });
}

async function save(){
  const btn=document.getElementById("saveBtn"); if(btn){btn.disabled=true;btn.textContent="保存中…";}
  const c=compute();
  const inv=state.inv;
  const payload={store_id:state.sid, ym:state.ym,
    received_qty:num(inv.received_qty), received_price:num(inv.received_price),
    shipping_qty:num(inv.shipping_qty), loss_qty:num(inv.loss_qty), campaign_qty:num(inv.campaign_qty),
    tsume_bags:num(inv.tsume_bags), tsume_qty:num(inv.tsume_qty),
    special_plus:num(inv.special_plus), special_minus:num(inv.special_minus),
    opening_qty:(inv.opening_qty===undefined||inv.opening_qty===null||inv.opening_qty==="")?null:num(inv.opening_qty),
    opening_price:(inv.opening_price===undefined||inv.opening_price===null||inv.opening_price==="")?null:num(inv.opening_price),
    physical:inv.physical||{}, avg_price:c.avgP, updated_by:ME.email};
  try{
    const {error}=await SB.from("inventory").upsert(payload,{onConflict:"store_id,ym"});
    if(error)throw error;
    state.dirty=false;
    const m=document.getElementById("savemsg");if(m)m.textContent="保存しました";
    if(btn){btn.textContent="保存する";btn.disabled=true;}
  }catch(e){
    if(btn){btn.textContent="保存する";btn.disabled=false;}
    alert("保存できませんでした：\n"+(e&&e.message||e));
  }
}

boot();
</script>
</body>
</html>
