<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;
    --accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 96px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .closebadge{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink2);}
  .closebadge b{color:var(--ink);}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 14px;margin:14px 0;}
  .intro{color:var(--ink2);font-size:13px;line-height:1.8;}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.5;cursor:default;}
  .ghost{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .ghost:hover{border-color:var(--accent);color:var(--ink);}
  .newbtn{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;border:1px dashed var(--accent);background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin:12px 0;}
  .newbtn:active{opacity:.6;}
  .tlist{display:flex;flex-direction:column;gap:10px;}
  .tcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:13px 14px;cursor:pointer;font-family:inherit;}
  .tcard:hover{border-color:var(--accent);}
  .tcard .tt{font-size:14.5px;font-weight:750;color:var(--ink);line-height:1.5;}
  .tcard .mt{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;}
  .tcard .who{color:var(--ink2);font-weight:700;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 10px;line-height:1.9;}
  .thead{display:flex;align-items:center;gap:10px;margin:6px 0 4px;}
  .thead .tt{font-size:16px;font-weight:800;line-height:1.5;flex:1;}
  .msg{margin:14px 0;display:flex;flex-direction:column;}
  .msg.u{align-items:flex-end;} .msg.a{align-items:flex-start;}
  .bubble{max-width:92%;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.85;}
  .msg.u .bubble{background:var(--accent-weak);color:var(--ink);font-weight:600;border-top-right-radius:5px;}
  .msg.a .bubble{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-top-left-radius:5px;}
  .msg .by{font-size:11px;color:var(--muted);margin:4px 4px 0;font-weight:600;}
  .bubble h2,.bubble h3{font-size:14.5px;margin:12px 0 5px;font-weight:800;}
  .bubble h2:first-child,.bubble h3:first-child{margin-top:0;}
  .bubble ul{margin:5px 0;padding-left:20px;} .bubble li{margin:3px 0;}
  .bubble p{margin:7px 0;} .bubble strong{font-weight:800;} .bubble code{background:var(--surface2);border-radius:6px;padding:1px 5px;font-size:12.5px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;}
  .chip{border:1px solid var(--border);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.4;text-align:left;}
  .chip:hover{color:var(--ink);border-color:var(--accent);}
  .composer{position:sticky;bottom:74px;background:var(--bg);padding-top:8px;margin-top:8px;}
  textarea{width:100%;min-height:70px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;line-height:1.7;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);}
  .composer .row{display:flex;gap:10px;align-items:center;margin-top:8px;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--accent-weak);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warn{color:var(--bad);font-weight:600;font-size:13px;}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);} .tabbar a.on .ic{filter:none;} .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;letter-spacing:.02em;}
  .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn:hover{border-color:var(--accent);}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
  .err{padding:20px;color:var(--bad);font-weight:600;}
</style>

<script>
"use strict";
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, DATA=null, ME={email:"",role:null}, BUSY=false;
let THREADS=[], CUR=null, RT=null, NEEDSETUP=false;
const EXAMPLES=[
  "先月の企画/SALE（例：◯/◯〜◯/◯）で、通常の土日と企画土日の来店客数はどう変わった？売上への寄与とROIも示唆して（投資額が分かれば書きます）",
  "今月、前月比で最も伸びた店舗と、その要因（来店数・購入率・客単価のどれ）を教えて",
  "曜日別の売上と購入率を出して。強い曜日・弱い曜日と、弱い曜日への打ち手を提案して",
  "直近4週の週次売上トレンドと、今月の着地見込みへの示唆を出して",
];

function screen(h){document.getElementById("app").innerHTML=h;}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function nowIso(){return new Date().toISOString();}
function fmtMD(d){if(!d)return "—";const[,m,dd]=d.split("-");return `${+m}/${+dd}`;}
function nameOf(email){return String(email||"").split("@")[0]||"（不明）";}
function fmtDT(iso){if(!iso)return "";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function uuid(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&0x3|0x8);return v.toString(16);});}

async function boot(){ try{
  let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
  if(cfg&&cfg.mode==="auth"){ await authBoot(cfg.url,cfg.anon); return; }
  screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
    <div class="t">ログイン制のときだけ使えます</div>
    <div class="m">この機能はセキュリティのため、Googleログイン制のダッシュボードでのみ動きます。<br>管理者（Shoさん）にお問い合わせください。</div></div>`);
}catch(e){showError(e);} }

async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }
async function authBoot(url,anon){ screen('<div class="sub" style="padding:40px 0">読み込み中…</div>'); await ensureSupabase();
  SB=window.supabase.createClient(url,anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return;}
  ME.email=(session.user&&session.user.email||"").toLowerCase();
  let role=null; try{const {data:u}=await SB.from("users").select("role,is_active,segments").ilike("email",ME.email).maybeSingle(); if(u&&u.is_active&&(u.segments||[]).includes("sales")) role=u.role==="admin"?"admin":(u.role==="manager"?"editor":"viewer");}catch(e){}
  ME.role=role;
  if(!ME.role){showDenied(ME.email);return;}
  const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
  if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
  DATA=JSON.parse(await data.text()); prep(); syncAdminTab();
  await loadThreads(); renderList(); subscribeRealtime(); }
function syncAdminTab(){const ad=!!(ME&&ME.role==="admin");const t=document.getElementById("tab-admin");if(t)t.style.display=ad?"":"none";const k=document.getElementById("tab-keiei");if(k)k.style.display=ad?"":"none";}
function prep(){ if(!DATA||!DATA.daily)throw new Error("データが空です");
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();
  DATA._salesMax=sd.length?sd[sd.length-1]:null; }
function showLogin(){ screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
  <div class="t">ログイン</div><div class="m">許可されたメンバー専用です。<br>登録された Google アカウントでログインしてください。</div>
  <button class="gbtn" id="glogin"><span class="g"></span>Google でログイン</button></div>`);
  document.getElementById("glogin").onclick=doLogin; }
function showDenied(email){ screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
  <div class="t">アクセス権がありません</div><div class="m"><b>${esc(email)}</b> はまだ登録されていません。<br>管理者（Shoさん）にユーザー追加を依頼してください。</div>
  <button class="gbtn" id="grelogin"><span class="g"></span>別のアカウントでログイン</button></div>`);
  document.getElementById("grelogin").onclick=doLogout; }
async function doLogin(){ const redirectTo=location.origin+location.pathname;
  const {error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}}); if(error)showError(error); }
async function doLogout(){try{await SB.auth.signOut();}catch(e){}location.reload();}

function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return (DATA.stores||[]).filter(s=>w.has(s.id));}
function buildDigest(){
  const stores=usableStores(), byStore={};
  for(const r of DATA.daily){ (byStore[r.s]||(byStore[r.s]=[])).push([r.d,Math.round(r.in||0),Math.round(r.ex||0),r.tx||0,r.it||0,(r.v!=null?r.v:null)]); }
  const series={}; stores.forEach(s=>{ series[s.name]=(byStore[s.id]||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1); });
  return {today:todayStr(), closing:DATA._salesMax,
    stores:stores.map(s=>({name:s.name, own:s.own||"直営", kpi_visitors:(s.kv!==false)})),
    note:"own=直営/FC。kpi_visitors=false の店（例:下北沢）は来店vが夜間のみの参考値なので、来店数・購入率のKPI計算からは除外する（売上・客単価には含めてよい）。直営合計は own=直営 の店だけを合計する。",
    legend:"[日付, 税込売上in, 税抜売上ex, 取引tx(購入客数), 点数it(販売数), 来店v(来店客数)]", series};
}

// ===== スレッド保存（ai_conversations テーブル） =====
async function loadThreads(){
  NEEDSETUP=false;
  const {data,error}=await SB.from("ai_conversations").select("id,title,created_by,created_at,updated_at,messages").order("updated_at",{ascending:false}).limit(300);
  if(error){ if(/does not exist|relation|schema cache/i.test(error.message||"")){NEEDSETUP=true;THREADS=[];return;} THREADS=[]; return; }
  THREADS=(data||[]).map(t=>({...t,messages:Array.isArray(t.messages)?t.messages:[]}));
}
async function saveThread(){
  if(!CUR)return;
  const row={id:CUR.id,title:CUR.title||"(無題)",created_by:CUR.created_by||ME.email,messages:CUR.messages,updated_at:nowIso()};
  const {error}=await SB.from("ai_conversations").upsert(row,{onConflict:"id"});
  if(error)throw new Error("保存に失敗："+error.message);
}
function subscribeRealtime(){
  if(!SB||RT)return;
  RT=SB.channel("aiconv_rt").on("postgres_changes",{event:"*",schema:"public",table:"ai_conversations"},()=>{
    const ae=document.activeElement;
    if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))return; // 入力中は見送り
    if(BUSY)return;
    if(CUR)return;               // スレッドを開いている間は一覧を上書きしない
    loadThreads().then(renderList);
  }).subscribe();
}

// ===== 一覧ビュー =====
function topBar(){
  return `<header>
      <h1>🔍 分析AI</h1>
      <span class="closebadge" title="取り込み済みの最新データ日（締日）">📅 締日 <b>${fmtMD(DATA._salesMax)}</b></span>
      <button class="themebtn" id="themebtn" style="margin-left:8px">◐ 表示切替</button>
    </header>`;
}
function renderList(){
  CUR=null;
  if(NEEDSETUP){
    screen(topBar()+`<div class="panel"><div class="intro"><b>初期設定が必要です。</b><br>質問履歴を保存するテーブルがまだありません。管理者（Shoさん）がSupabaseで <code>sql/008_ai_conversations.sql</code> を実行すると使えるようになります。</div></div>`);
    document.getElementById("themebtn").onclick=toggleTheme; return;
  }
  const cards=THREADS.map(t=>{
    const turns=(t.messages||[]).filter(m=>m.role==="user").length;
    return `<button class="tcard" data-id="${esc(t.id)}">
      <div class="tt">${esc(t.title||"(無題)")}</div>
      <div class="mt"><span class="who">👤 ${esc(nameOf(t.created_by))}</span><span>🗓 ${esc(fmtDT(t.updated_at))}</span><span>💬 ${turns}件のやり取り</span></div>
    </button>`;}).join("");
  screen(topBar()+`
    <div class="panel" style="padding-bottom:8px">
      <div class="intro">売上・来店データについて<b>自由に質問</b>すると、AIが数字を計算して<b>結論・根拠・示唆（打ち手やROI）</b>を返します。質問は履歴として残り、<b>タップで続き（追加質問）</b>ができます。</div>
      <button class="newbtn" id="newbtn">＋ 新しい質問をする</button>
    </div>
    <div class="tlist">${cards||'<div class="empty">まだ質問がありません。<br>「＋ 新しい質問をする」から始めましょう。</div>'}</div>
    <p class="note">履歴は登録メンバー全員で共有されます（誰がいつ質問したかも表示）。データは締日までの取り込み分です。</p>`);
  document.getElementById("themebtn").onclick=toggleTheme;
  document.getElementById("newbtn").onclick=newThread;
  document.querySelectorAll(".tcard").forEach(c=>c.onclick=()=>openThread(c.dataset.id));
}
function openThread(id){ CUR=THREADS.find(t=>t.id===id)||null; if(!CUR){renderList();return;} renderThread(); }
function newThread(){ CUR={id:uuid(),title:"",created_by:ME.email,messages:[],_new:true}; renderThread(); }

// ===== スレッド（詳細）ビュー =====
function mdToHtml(md){
  const lines=String(md).replace(/\r/g,"").split("\n"); let html="",inList=false;
  const inline=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(let raw of lines){ const line=raw.replace(/\s+$/,"");
    const h=line.match(/^(#{2,4})\s+(.*)$/), li=line.match(/^\s*[-*]\s+(.*)$/);
    if(li){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+inline(li[1])+"</li>"; continue; }
    if(inList){html+="</ul>";inList=false;}
    if(h){ html+="<h3>"+inline(h[2])+"</h3>"; continue; }
    if(line.trim()===""){continue;}
    html+="<p>"+inline(line)+"</p>";
  }
  if(inList)html+="</ul>"; return html;
}
function msgHtml(m){
  const cls=m.role==="user"?"u":"a";
  const body=m.role==="user"?esc(m.content).replace(/\n/g,"<br>"):mdToHtml(m.content);
  const by=m.role==="user"?`👤 ${esc(nameOf(m.by))}・${esc(fmtDT(m.at))}`:`🤖 AI・${esc(fmtDT(m.at))}`;
  return `<div class="msg ${cls}"><div class="bubble">${body}</div><div class="by">${by}</div></div>`;
}
function renderThread(){
  const isNew=!CUR.messages.length;
  const msgs=CUR.messages.map(msgHtml).join("");
  const chips=isNew?`<div class="chips">${EXAMPLES.map((q,i)=>`<button class="chip" data-i="${i}">${esc(q)}</button>`).join("")}</div>`:"";
  const title=CUR.title?esc(CUR.title):"新しい質問";
  screen(topBar()+`
    <div class="thead"><button class="ghost" id="back">← 一覧</button><div class="tt">${title}</div></div>
    <div id="stream">${msgs}${isNew?'<div class="empty" style="padding:14px 6px">質問を入力してください。例をタップしても入ります👇</div>':""}</div>
    ${chips}
    <div class="composer">
      <textarea id="q" placeholder="${isNew?"例）先月の企画で来店・売上はどう動いた？投資額◯円としてROIも":"追加で質問する…（このやり取りの続きとして答えます）"}"></textarea>
      <div class="row"><button class="btn" id="send">${isNew?"質問する":"追加で質問する"}</button><span class="sub" id="hint">AIがデータを計算して答えます</span></div>
    </div>
    <p class="note">回答はAIによる推定を含みます。重要な意思決定の前に元数字（予実・推移タブ）もご確認ください。</p>`);
  document.getElementById("themebtn").onclick=toggleTheme;
  document.getElementById("back").onclick=async()=>{ if(CUR&&!CUR._new){await loadThreads();} renderList(); };
  document.getElementById("send").onclick=()=>send();
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const t=document.getElementById("q");t.value=EXAMPLES[+c.dataset.i];t.focus();});
  const st=document.getElementById("stream"); if(st&&!isNew)window.scrollTo(0,document.body.scrollHeight);
}
async function send(){
  if(BUSY||!CUR)return;
  const t=document.getElementById("q"); const q=(t.value||"").trim();
  if(!q){t.focus();return;}
  BUSY=true;
  const btn=document.getElementById("send"); if(btn){btn.disabled=true;btn.textContent="送信中…";}
  const history=CUR.messages.map(m=>({role:m.role,content:m.content}));
  CUR.messages.push({role:"user",content:q,by:ME.email,at:nowIso()});
  if(!CUR.title)CUR.title=q.slice(0,42);
  // 描画（ユーザー発言＋考え中）
  const stream=document.getElementById("stream");
  stream.insertAdjacentHTML("beforeend",msgHtml(CUR.messages[CUR.messages.length-1]));
  stream.insertAdjacentHTML("beforeend",`<div class="msg a" id="pending"><div class="bubble"><span class="spin"></span>AIがデータを分析しています…（数十秒かかることがあります）</div></div>`);
  t.value=""; window.scrollTo(0,document.body.scrollHeight);
  let answer=null, errMsg=null, newTitle=null;
  try{
    const {data,error}=await SB.functions.invoke("ask",{body:{question:q,digest:buildDigest(),history}});
    if(error){ errMsg=error.message||String(error); try{const ctx=error.context&&await error.context.json();if(ctx&&ctx.error)errMsg=ctx.error;}catch(e){} }
    else if(data&&data.error){ errMsg=data.error; }
    else { answer=(data&&data.answer)||""; newTitle=(data&&data.title)||null; }
  }catch(e){ errMsg=String(e&&e.message||e); }
  const pending=document.getElementById("pending"); if(pending)pending.remove();
  if(answer){
    if(newTitle)CUR.title=newTitle;   // AIが要約した一覧タイトル
    CUR.messages.push({role:"assistant",content:answer,by:"AI",at:nowIso()});
    try{ await saveThread(); if(CUR._new){CUR._new=false;THREADS.unshift(CUR);} }
    catch(e){ errMsg="（回答は表示できましたが保存に失敗）"+String(e&&e.message||e); }
  }else{
    // 失敗：ユーザー発言は残しつつ、エラーを表示（再質問できる）
    CUR.messages.pop();
  }
  BUSY=false;
  renderThread();
  if(errMsg){ const st=document.getElementById("stream");
    st.insertAdjacentHTML("beforeend",`<div class="msg a"><div class="bubble"><span class="warn">エラー：${esc(errMsg)}</span></div></div>`);
    const qq=document.getElementById("q"); if(qq){qq.value=q;} window.scrollTo(0,document.body.scrollHeight); }
}
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");}
boot();
</script>
