<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="売上KPI管理">
<meta name="robots" content="noindex, nofollow">
<title>分析AI｜売上KPI管理</title>
<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;
    --accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 92px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .closebadge{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink2);}
  .closebadge b{color:var(--ink);}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 14px;margin:14px 0;}
  .panel h2{font-size:14px;margin:0 0 8px;font-weight:700;}
  .intro{color:var(--ink2);font-size:13px;line-height:1.8;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;}
  .chip{border:1px solid var(--border);background:var(--surface2);color:var(--ink2);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.4;text-align:left;}
  .chip:hover{color:var(--ink);border-color:var(--accent);}
  textarea{width:100%;min-height:92px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;line-height:1.7;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.5;cursor:default;}
  .ghost{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:10px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .ans{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:14px 0;font-size:14px;line-height:1.9;color:var(--ink);}
  .ans h2,.ans h3{font-size:15px;margin:14px 0 6px;font-weight:800;}
  .ans h2:first-child,.ans h3:first-child{margin-top:0;}
  .ans ul{margin:6px 0;padding-left:20px;}
  .ans li{margin:3px 0;}
  .ans p{margin:8px 0;}
  .ans strong{font-weight:800;}
  .ans code{background:var(--surface2);border-radius:6px;padding:1px 5px;font-size:12.5px;}
  .qbubble{background:var(--accent-weak);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:13.5px;font-weight:600;margin:14px 0 0;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--accent-weak);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warn{color:var(--bad);font-weight:600;font-size:13px;}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);} .tabbar a.on .ic{filter:none;} .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;letter-spacing:.02em;}
  .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn:hover{border-color:var(--accent);}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
  .err{padding:20px;color:var(--bad);font-weight:600;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub" style="padding:40px 0">読み込み中…</div></div>
<nav class="tabbar"><div class="tabbar-in">
  <a href="index.html"><span class="ic">📊</span>サマリー</a>
  <a href="pl.html"><span class="ic">📋</span>予実</a>
  <a href="trends.html"><span class="ic">📈</span>推移</a>
  <a href="ask.html" class="on"><span class="ic">🔍</span>分析AI</a>
</div></nav>
<script>
"use strict";
const CONFIG_URL="https://rwfcsanmqvkxiuwdeddv.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, DATA=null, ME={email:"",role:null}, BUSY=false;
const EXAMPLES=[
  "先月のSALE（例：◯/◯〜◯/◯）で、通常の土日とSALE土日の来店客数はどう変わった？売上への寄与とROIも示唆して（SALEの投資額が分かれば書きます）",
  "今月、前月比で最も伸びた店舗と、その要因（来店数・購入率・客単価のどれ）を教えて",
  "曜日別の売上と購入率を出して。強い曜日・弱い曜日と、弱い曜日への打ち手を提案して",
  "直近4週の週次売上トレンドと、今月の着地見込みへの示唆を出して",
];

function screen(h){document.getElementById("app").innerHTML=h;}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmtMD(d){if(!d)return "—";const[,m,dd]=d.split("-");return `${+m}/${+dd}`;}

async function boot(){ try{
  let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
  if(cfg&&cfg.mode==="auth"){ await authBoot(cfg.url,cfg.anon); return; }
  // 公開モード（ログイン制でない）ではAI機能は使えない（APIキーを守るため）
  screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
    <div class="t">ログイン制のときだけ使えます</div>
    <div class="m">この機能はセキュリティのため、Googleログイン制のダッシュボードでのみ動きます。<br>管理者（Shoさん）にお問い合わせください。</div></div>`);
}catch(e){showError(e);} }

async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }
async function authBoot(url,anon){ screen('<div class="sub" style="padding:40px 0">読み込み中…</div>'); await ensureSupabase();
  SB=window.supabase.createClient(url,anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return;}
  ME.email=(session.user&&session.user.email||"").toLowerCase();
  let role=null; try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
  ME.role=role;
  if(!ME.role){showDenied(ME.email);return;}
  const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
  if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
  DATA=JSON.parse(await data.text()); prep(); render(); }
function prep(){ if(!DATA||!DATA.daily)throw new Error("データが空です");
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();
  DATA._salesMax=sd.length?sd[sd.length-1]:null; }
function showLogin(){ screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
  <div class="t">ログイン</div><div class="m">許可されたメンバー専用です。<br>登録された Google アカウントでログインしてください。</div>
  <button class="gbtn" id="glogin"><span class="g"></span>Google でログイン</button></div>`);
  document.getElementById("glogin").onclick=doLogin; }
function showDenied(email){ screen(`<div class="gate"><div class="logo">🔍 分析AI</div>
  <div class="t">アクセス権がありません</div><div class="m"><b>${esc(email)}</b> はまだ登録されていません。<br>管理者（Shoさん）にユーザー追加を依頼してください。</div>
  <button class="gbtn" id="grelogin"><span class="g"></span>別のアカウントでログイン</button></div>`);
  document.getElementById("grelogin").onclick=doLogout; }
async function doLogin(){ const redirectTo=location.origin+location.pathname;
  const {error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}}); if(error)showError(error); }
async function doLogout(){try{await SB.auth.signOut();}catch(e){}location.reload();}

function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return (DATA.stores||[]).filter(s=>w.has(s.id));}
// AIへ渡すデータ要約（日次を店舗名ごとに [日付,税込,税抜,取引,点数,来店] の配列で）
function buildDigest(){
  const stores=usableStores();
  const byStore={};
  for(const r of DATA.daily){ (byStore[r.s]||(byStore[r.s]=[])).push([r.d,Math.round(r.in||0),Math.round(r.ex||0),r.tx||0,r.it||0,(r.v!=null?r.v:null)]); }
  const series={};
  stores.forEach(s=>{ const rows=(byStore[s.id]||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1); series[s.name]=rows; });
  return {today:todayStr(), closing:DATA._salesMax, stores:stores.map(s=>s.name),
    legend:"[日付, 税込売上in, 税抜売上ex, 取引tx(購入客数), 点数it(販売数), 来店v(来店客数)]", series};
}

function render(){
  const chips=EXAMPLES.map((q,i)=>`<button class="chip" data-i="${i}">${esc(q)}</button>`).join("");
  screen(`
    <header>
      <h1>🔍 分析AI</h1>
      <span class="closebadge" title="取り込み済みの最新データ日（締日）">📅 締日 <b>${fmtMD(DATA._salesMax)}</b></span>
      <button class="themebtn" id="themebtn" style="margin-left:8px">◐ 表示切替</button>
    </header>
    <div class="panel">
      <div class="intro">売上・来店データについて<b>自由に質問</b>すると、AIが数字を計算して<b>結論・根拠・示唆（打ち手やROI）</b>を返します。SALEの日付・投資額・広告費など、データに無い情報は質問文に書き添えると精度が上がります。</div>
      <div class="chips">${chips}</div>
      <textarea id="q" placeholder="例）先月のSALEで来店・売上はどう動いた？投資額◯円としてROIも出して"></textarea>
      <div class="row">
        <button class="btn" id="ask">質問する</button>
        <button class="ghost" id="clear">クリア</button>
        <span class="sub" id="hint">Enterで改行／ボタンで送信</span>
      </div>
    </div>
    <div id="out"></div>
    <p class="note">回答はAIによる推定を含みます。重要な意思決定の前に元数字（予実・推移タブ）もご確認ください。データは取り込み済みの最新日（締日）までです。</p>`);
  document.getElementById("themebtn").onclick=toggleTheme;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.getElementById("q").value=EXAMPLES[+c.dataset.i];document.getElementById("q").focus();});
  document.getElementById("ask").onclick=ask;
  document.getElementById("clear").onclick=()=>{document.getElementById("q").value="";document.getElementById("out").innerHTML="";};
}

async function ask(){
  if(BUSY)return;
  const q=(document.getElementById("q").value||"").trim();
  if(!q){document.getElementById("q").focus();return;}
  BUSY=true;
  const btn=document.getElementById("ask"); btn.disabled=true; btn.textContent="考え中…";
  const out=document.getElementById("out");
  out.innerHTML=`<div class="qbubble">${esc(q)}</div><div class="ans"><span class="spin"></span>AIがデータを分析しています…（数十秒かかることがあります）</div>`;
  try{
    const {data,error}=await SB.functions.invoke("ask",{body:{question:q,digest:buildDigest()}});
    if(error){
      let msg=error.message||String(error);
      try{const ctx=error.context&&await error.context.json();if(ctx&&ctx.error)msg=ctx.error;}catch(e){}
      out.querySelector(".ans").innerHTML=`<span class="warn">エラー：${esc(msg)}</span>`;
    }else if(data&&data.error){
      out.querySelector(".ans").innerHTML=`<span class="warn">エラー：${esc(data.error)}</span>`;
    }else{
      out.querySelector(".ans").innerHTML=mdToHtml(data&&data.answer||"（回答が空でした）");
    }
  }catch(e){ out.querySelector(".ans").innerHTML=`<span class="warn">エラー：${esc(String(e&&e.message||e))}</span>`; }
  finally{ BUSY=false; btn.disabled=false; btn.textContent="質問する"; }
}

// ごく軽量な Markdown → HTML（見出し/箇条書き/太字/コード）。まずHTMLエスケープしてから変換。
function mdToHtml(md){
  const lines=String(md).replace(/\r/g,"").split("\n");
  let html="",inList=false;
  const inline=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(let raw of lines){
    const line=raw.replace(/\s+$/,"");
    const h=line.match(/^(#{2,4})\s+(.*)$/);
    const li=line.match(/^\s*[-*]\s+(.*)$/);
    if(li){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+inline(li[1])+"</li>"; continue; }
    if(inList){html+="</ul>";inList=false;}
    if(h){ html+="<h3>"+inline(h[2])+"</h3>"; continue; }
    if(line.trim()===""){ continue; }
    html+="<p>"+inline(line)+"</p>";
  }
  if(inList)html+="</ul>";
  return html;
}
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");}
boot();
</script>
</body>
</html>
