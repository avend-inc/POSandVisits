<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="robots" content="noindex, nofollow">
<title>経営レポート｜売上KPI管理</title>
<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 96px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:14px 0;}
  .panel h2{font-size:15px;margin:2px 0 8px;font-weight:800;}
  .subhd{font-size:13px;font-weight:700;margin:14px 0 4px;color:var(--ink);}
  .tblwrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--muted);font-weight:700;font-size:12px;}
  tr.total td{font-weight:800;background:var(--surface2);}
  tr.storehd td{font-weight:800;background:var(--surface2);color:var(--ink);padding-top:9px;}
  span.yenin{display:inline-flex;align-items:center;gap:2px;color:var(--muted);}
  span.yenin input.ki{width:98px;}
  input.ki{width:108px;padding:5px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--ink);text-align:right;font-size:13px;font-family:inherit;}
  input.ki:focus{outline:none;border-color:var(--accent);}
  .krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;}
  .honbu{margin-top:14px;padding:12px 14px;background:var(--accent-weak);border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-weight:800;}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;}
  .actions{position:sticky;bottom:64px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;margin-top:16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:720px;margin:0 auto;display:flex;}
  /* 絵文字をやめたので、アイコンと文字を縦に積む必要がなくなった。
     文字だけを1行で置き、押している所は上の罫と色で示す */
  .tabbar a{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 2px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;border-top:2px solid transparent;}
  .tabbar a.on{border-top-color:var(--accent);}
  .tabbar a.on{color:var(--accent);}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;} .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;} .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn .g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
  .navlink{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  /* 「ホーム」ボタン。どのページでも同じ見た目にするため、
     ページごとに違う .navlink には頼らず自前で持つ */
  .homebtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto;
    border:1px solid var(--border);background:var(--surface);color:var(--accent);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;
    text-decoration:none;cursor:pointer;}
  .homebtn:hover{border-color:var(--accent);}
  .edlink{font-size:11px;color:var(--accent);text-decoration:none;font-weight:700;margin-left:4px;white-space:nowrap;}
  .edlink:hover{text-decoration:underline;}
  .aureset{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer;font-family:inherit;}
  .aureset:hover{border-color:var(--accent);color:var(--accent);}
  .txtmodal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .txtmodal .box{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;max-width:560px;width:100%;}
  .txtmodal textarea{width:100%;height:230px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:10px;line-height:1.8;resize:vertical;}
  .txtmodal .row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub" style="padding:40px 0">読み込み中…</div></div>
<nav class="tabbar"><div class="tabbar-in">
  <a href="index.html?g=own" id="tab-own">直営</a>
  <a href="index.html?g=fc" id="tab-fc">FC</a>
  <a href="unei.html" id="tab-unei">運営</a>
  <a href="keiei.html" id="tab-keiei" class="on">経営</a>
  <a href="admin.html" id="tab-admin" style="display:none">管理</a>
</div></nav>
<script src="landing.js"></script>
<script>
"use strict";
const NUM=n=>Math.round(n).toLocaleString("ja-JP");
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, DATA=null, ME={email:"",role:null}, TARGETS=null;
// 管理タブは管理者だけに出す（他ページと同じ判定）
function syncAdminTab(){const t=document.getElementById("tab-admin");if(t)t.style.display=(ME&&ME.role==="admin")?"":"none";}
async function loadTargets(){ if(window.__TARGETS__){TARGETS=window.__TARGETS__;return;} try{TARGETS=await (await fetch("targets.json",{cache:"no-store"})).json();}catch(e){TARGETS=null;} }

function screen(h){document.getElementById("app").innerHTML=h;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function prevYm(ym){let[y,m]=ym.split("-").map(Number);m--;if(m===0){m=12;y--;}return y+"-"+String(m).padStart(2,"0");}
function monthSpan(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return[`${ym}-01`,`${ym}-${String(last).padStart(2,"0")}`];}
function addMonths(ym,d){let[y,m]=ym.split("-").map(Number);m+=d;while(m<=0){m+=12;y--;}while(m>12){m-=12;y++;}return y+"-"+String(m).padStart(2,"0");}
function ownOf(sid){const s=(DATA.stores||[]).find(x=>String(x.id)===String(sid));return (s&&s.own)?s.own:"直営";}
function kvOf(sid){const s=(DATA.stores||[]).find(x=>String(x.id)===String(sid));return s?(s.kv!==false):true;}
function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return DATA.stores.filter(s=>w.has(s.id)&&s.visible!==false);}
function sumRows(rows){const p={in:0,ex:0,tx:0,txv:0,it:0,v:0,hasV:false};
  for(const r of rows){p.in+=r.in||0;p.ex+=(r.ex!=null?r.ex:0);p.tx+=r.tx||0;p.it+=(r.it!=null?r.it:0);if(kvOf(r.s)){p.txv+=r.tx||0;if(r.v!=null){p.v+=r.v;p.hasV=true;}}}
  if(!p.hasV)p.v=0;return p;}
function prep(){const ds=DATA.daily.map(r=>r.d).sort();DATA._min=ds[0];DATA._max=ds[ds.length-1];
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();DATA._salesMax=sd.length?sd[sd.length-1]:DATA._max;}

// ---- 着地見込み（予実タブ pl.html と同じ計算） ----
//  当月の税抜売上 着地見込は、予実タブ（🎯着地見込み）の計算・編集値と一致させる。
//  経営レポート独自の日割り(proj)だと平日/土日の偏りを無視して当月頭で暴れるため、
//  予実タブと同じ「平日/土日祝の1日平均 × 残日数 ＋ 締日までの実績」で出す。
function _isWeekend(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6;}
// 日本の祝日（土日祝の判定用）。dashboard.html / pl.html と同一。年度が進んだら追記。
const JP_HOLIDAYS=new Set([
  "2025-08-11","2025-09-15","2025-09-23","2025-10-13","2025-11-03","2025-11-23","2025-11-24",
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
  "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
  "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
]);
function _isWkHol(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6||JP_HOLIDAYS.has(d);}  // 土日祝
function _addDays(d,n){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function _monthEnd(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return `${ym}-${String(last).padStart(2,"0")}`;}
// 予実タブが保存した着地見込みの上書き値（page="fc"）を、その月ぶん“1回のクエリ”で全店まとめて読む。
// （店舗ごとに問い合わせると直営店の数だけ往復が発生して遅い。1回に集約して高速化）
async function planLoadAllFc(ym){
  const m={};
  if(SB){try{const {data}=await SB.from("plan_data").select("scope,data").eq("page","fc").eq("ym",ym);(data||[]).forEach(r=>{m[String(r.scope)]=r.data||null;});return m;}catch(e){return m;}}
  try{for(const s of usableStores()){const x=localStorage.getItem(`notime-fc-${s.id}-${ym}`);if(x)m[String(s.id)]=JSON.parse(x);}}catch(e){}
  return m;
}
// 手入力（平日/土日祝 平均売上・税抜）を全ページ共通DB(plan_data page="fcavg")から読む。唯一のDB源。
let FC_OV={};
async function loadFcOv(){ FC_OV = SB ? await NL.loadOverrides(SB) : {}; }
function fcOvGet(id,ym){const o=FC_OV[String(id)+"|"+ym];return (o&&Number.isFinite(o.wkEx)&&Number.isFinite(o.weEx))?o:null;}

// 着地見込み（税抜・複数店の合算）＝ landing.js の唯一実装に委譲。ページ独自ロジックは持たない＝全ページ同じ数字。
function landingExForIds(ids,ym){ return NL.salesEx(DATA.daily, ids, ym, id=>fcOvGet(id,ym)) || 0; }

// 単店の着地（税抜ex・税込in・商品販売数it）＝ landing.js の唯一実装に委譲。
// 売上を手入力で変えると点数itも同じ倍率で連動＝商品単価(ex/it)は現状維持。
// 戻り: {ex:税抜売上着地, inLand:税込着地, it:商品販売数着地, closing}
function fcLandingEx(storeId,ym){
  const L=NL.landingFull(DATA.daily, storeId, ym, fcOvGet(storeId,ym), function(){return true;});
  if(!L) return {ex:0, inLand:0, it:0, closing:null};
  const C=NL.components(DATA.daily, new Set([storeId]), ym, function(){return true;});
  return {ex:Math.round(L.ex), inLand:Math.round(L.in), it:Math.round(L.it), closing:C.closing};
}

// ---- 保存（mgmt_report：月ごとJSON。サーバー未整備時は端末にフォールバック）----
async function keieiLoad(ym){
  try{ if(SB){ const {data}=await SB.from("mgmt_report").select("payload").eq("ym",ym).maybeSingle(); if(data&&data.payload)return {src:"server",p:data.payload}; } }catch(e){}
  try{ const s=localStorage.getItem("mgmtReport:"+ym); if(s)return {src:"local",p:JSON.parse(s)}; }catch(e){}
  return {src:null,p:null};
}
async function keieiSave(ym,payload){
  let server=false;
  try{ if(SB){ const {error}=await SB.from("mgmt_report").upsert({ym,payload,updated_by:(ME&&ME.email)||null},{onConflict:"ym"}); if(!error)server=true; } }catch(e){}
  try{ localStorage.setItem("mgmtReport:"+ym,JSON.stringify(payload)); }catch(e){}
  return server;
}

// 直営表の「商品単価（着地見込）」の手入力上書き。plan_data page="keiei_aup" scope=店id ym。
async function loadAupOv(ym){const m={}; if(!SB)return m;
  try{const {data}=await SB.from("plan_data").select("scope,data").eq("page","keiei_aup").eq("ym",ym);
    (data||[]).forEach(r=>{const v=r.data&&r.data.aup; if(Number.isFinite(+v))m[String(r.scope)]=+v;});}catch(e){}
  return m;}
async function saveAupOv(ym,id,val){ if(!SB)return; try{await SB.from("plan_data").upsert({page:"keiei_aup",scope:String(id),ym,data:{aup:val},updated_at:new Date().toISOString(),updated_by:(ME&&ME.email)||null},{onConflict:"page,scope,ym"});}catch(e){} }
async function delAupOv(ym,id){ if(!SB)return; try{await SB.from("plan_data").delete().eq("page","keiei_aup").eq("scope",String(id)).eq("ym",ym);}catch(e){} }
// 新店舗（データ無し）の「税抜売上・着地見込」の手入力上書き。plan_data page="keiei_land"。
async function loadLandOv(ym){const m={}; if(!SB)return m;
  try{const {data}=await SB.from("plan_data").select("scope,data").eq("page","keiei_land").eq("ym",ym);
    (data||[]).forEach(r=>{const v=r.data&&r.data.ex; if(Number.isFinite(+v))m[String(r.scope)]=+v;});}catch(e){}
  return m;}
async function saveLandOv(ym,id,val){ if(!SB)return; try{await SB.from("plan_data").upsert({page:"keiei_land",scope:String(id),ym,data:{ex:val},updated_at:new Date().toISOString(),updated_by:(ME&&ME.email)||null},{onConflict:"page,scope,ym"});}catch(e){} }

// ---- 認証（管理者のみ）＋データ読込 ----
async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }
async function boot(){
  try{
    if(window.__DATA__){DATA=window.__DATA__;prep();ME.role="admin";syncAdminTab();await loadTargets();renderKeiei();return;}
    let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    if(!cfg||cfg.mode!=="auth"){ screen('<div class="gate"><div class="logo">経営レポート</div><div class="t">ログインが必要です</div><div class="m">この画面は管理者専用です。Googleログインの設定が完了すると利用できます。</div><div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>'); return; }
    await ensureSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:(function(){try{var r=new URL(CONFIG_URL).hostname.split(".")[0];var k="sb-"+r+"-auth-token";function h(x){try{var v=localStorage.getItem(x);return !!(v&&v.length>2&&v!=="null"&&v!=="undefined");}catch(e){return false;}}return h("notime-auth")?"notime-auth":(h(k)?k:"notime-auth");}catch(e){return "notime-auth";}})()}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return;}
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    let role=null; try{const {data:u}=await SB.from("users").select("role,is_active,segments").ilike("email",ME.email).maybeSingle(); if(u&&u.is_active&&(u.segments||[]).includes("sales")) role=u.role==="admin"?"admin":(u.role==="manager"?"editor":"viewer");}catch(e){}
    ME.role=role;
    syncAdminTab();
    if(ME.role!=="admin"){ showDenied(ME.role?("この画面は管理者専用です（あなたの権限："+({viewer:"閲覧",editor:"編集"}[ME.role]||ME.role)+"）"):"アクセス権がありません。管理者にユーザー追加を依頼してください。"); return; }
    const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
    if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
    DATA=JSON.parse(await data.text());
    DATA.daily=await loadDaily();
    prep(); await loadTargets(); renderKeiei();
  }catch(e){ showError(e); }
}

// 日別×店舗は data.json から外し、テーブル(dash_daily)から読む（2026-08-11〜）。
//   このページはその切り替えに取り残されていて、DATA.daily が空のまま
//   「データが空です」で止まっていた。dashboard.html と同じ読み方にそろえる。
//   期間で切らずに全期間を取る：画面ごとに要る期間がばらばらで、切ると必ず
//   どこかが足りなくなるため。RLS(can_view_store)が効くので、返るのは
//   自分が見られる店の行だけ。
async function loadDaily(){
  const PAGE=1000, CONC=8;
  const cols="date,store_id,sales_in,sales_ex,tx,items,visitors,bag_in,bag_ex,bag_qty,"+
             "komono_ex,nocat_ex,coupon_qty,coupon_amount,"+
             "sales_ex_unmanned,sales_ex_manned,visitors_staffed";
  const out=[]; let page=0, done=false;
  while(!done){
    const jobs=[];
    for(let i=0;i<CONC;i++,page++){
      const off=page*PAGE;
      jobs.push(SB.from("dash_daily").select(cols).order("date").range(off,off+PAGE-1));
    }
    const res=await Promise.all(jobs);
    for(const {data,error} of res){
      if(error)throw new Error("日別データを取得できませんでした（"+error.message+"）");
      out.push(...(data||[]));
      if(!data||data.length<PAGE)done=true;   // 最後まで来た
    }
  }
  // data.json に入っていたのと同じ形にそろえる（画面側は一切変えない）。
  // 該当しない店・日には付けない列（exU/exM/vm）は、null のときは付けない。
  return out.map(r=>{
    const o={d:r.date, s:r.store_id, in:r.sales_in, ex:r.sales_ex, tx:r.tx, it:r.items,
             v:r.visitors, bag:r.bag_in, bagEx:r.bag_ex, bagq:r.bag_qty,
             komEx:r.komono_ex, nocatEx:r.nocat_ex,
             coup:r.coupon_qty, coupAmt:r.coupon_amount};
    if(r.sales_ex_unmanned!=null)o.exU=r.sales_ex_unmanned;
    if(r.sales_ex_manned!=null)o.exM=r.sales_ex_manned;
    if(r.visitors_staffed!=null)o.vm=r.visitors_staffed;
    return o;
  });
}

// ---- 本体：経営レポート ----
async function renderKeiei(){
  const yf=v=>"¥"+Math.round(+v||0).toLocaleString("ja-JP");
  const ml=m=>(+m.slice(5,7))+"月";
  const cur=(DATA._salesMax||DATA._max||todayStr()).slice(0,7);
  const prev=prevYm(cur), next=addMonths(cur,1);
  const lyCur=addMonths(cur,-12), lyNext=addMonths(next,-12);
  const [cf,ct]=monthSpan(cur),[pf,pt]=monthSpan(prev),[lcf,lct]=monthSpan(lyCur),[lnf,lnt]=monthSpan(lyNext);
  const daysIn=+ct.slice(8,10);
  const curEnd=((DATA._salesMax||"")>=cf&&(DATA._salesMax||"")<=ct)?DATA._salesMax:null;
  const elapsed=curEnd?(+curEnd.slice(8,10)):0;
  const sumIds=(ids,from,to)=>sumRows(DATA.daily.filter(r=>ids.has(r.s)&&r.d>=from&&r.d<=to));
  const proj=s=>elapsed>0?s/elapsed*daysIn:0;
  const grow=(a,b)=>(a>0&&b>0)?b/a:1;
  // 直営 各店 税抜売上
  const dstores=usableStores().filter(s=>ownOf(s.id)==="直営");
  // 予算（月次予実「予算」＝目標）を店舗×月で引く。翌月以降の着地見込みに使う。
  const T=(TARGETS&&TARGETS.targets)||{};
  const tgtField=(sid,ym,fld)=>{const nm=(dstores.find(s=>s.id===sid)||{}).name||"";for(const tok in T){if(nm.indexOf(tok)>=0&&T[tok][ym]&&T[tok][ym][fld]!=null)return T[tok][ym][fld];}return null;};
  const tgtEx=(sid,ym)=>{const v=tgtField(sid,ym,"ex");return v!=null?Math.round(v):null;};
  const tgtQty=(sid,ym)=>{const v=tgtField(sid,ym,"qty");return v!=null?Math.round(v):null;};
  // 税抜売上目標（予算）は「事業計画 bizplan_monthly」を正として全ページで統一する。
  //  優先順は店舗ページ(loadBudget)と同一： ①事業計画RPC → ②予実タブ保存(plan_data page=pl の b_ex) → ③targets.json。
  const nmOf=(id)=>{const s=(usableStores().find(x=>x.id===id));return (s&&s.name)||(dstores.find(x=>x.id===id)||{}).name||"";};
  const BIZ={};   // ym -> [{pos_store_name, amount(税抜)}]
  async function loadBiz(ym){ if(BIZ[ym]||!SB)return; try{const {data,error}=await SB.rpc("bizplan_store_sales",{p_ym:ym});BIZ[ym]=error?[]:(data||[]);}catch(e){BIZ[ym]=[];} }
  await loadBiz(cur); await loadBiz(next);
  // 福井より後の新店舗（オープン月に達したら表示）。data.json未反映でもIDで載せる。
  // 税抜売上の目標＝新店舗モデル＋オープン景気（new_store_sales_target RPC）。今後の新店もここに追加。
  const NEWSTORES=[{id:50,name:"NOTIME長野店",open:"2026-09"}].filter(x=>x.open<=cur);
  const newTgtEx={};
  for(const ns of NEWSTORES){ try{const {data}=await SB.rpc("new_store_sales_target",{p_open_ym:ns.open,p_ym:cur}); newTgtEx[ns.id]=Number.isFinite(+data)?Math.round(+data):null; }catch(e){ newTgtEx[ns.id]=null; } }
  const aupOv=await loadAupOv(cur);   // 商品単価の手入力上書き（着地見込）
  const landOv=await loadLandOv(cur); // 新店舗の税抜売上・着地見込の手入力上書き
  const plBud={};   // "ym|scope" -> 予実タブ保存の税抜予算 b_ex
  if(SB){ try{ const {data}=await SB.from("plan_data").select("scope,ym,data").eq("page","pl").in("ym",[cur,next]);
    (data||[]).forEach(r=>{const v=r.data&&r.data.b_ex; if(Number.isFinite(v))plBud[r.ym+"|"+r.scope]=Math.round(v);}); }catch(e){} }
  const bizEx=(id,ym)=>{const nm=nmOf(id);for(const r of (BIZ[ym]||[])){const key=((r&&r.pos_store_name)||"").trim(),v=Number(r&&r.amount);if(key&&nm.indexOf(key)>=0&&Number.isFinite(v))return Math.round(v);}return null;};
  const budgetEx=(id,ym)=>{let v=bizEx(id,ym); if(v!=null)return v; const p=plBud[ym+"|"+id]; if(p!=null)return p; return tgtEx(id,ym);};
  // 当月着地は「予実タブ（🎯着地見込み）」と同じ計算＝編集値も反映される。

  const fcMap={}; dstores.forEach(s=>{ try{fcMap[s.id]=fcLandingEx(s.id,cur);}catch(e){fcMap[s.id]=null;} });
  const storeEx={}, storeIt={};
  dstores.forEach(s=>{const idset=new Set([s.id]);
    const pAgg=sumIds(idset,pf,pt); const pEx=pAgg.ex||0, pIt=pAgg.it||0;
    const cLand=Math.round(landingExForIds(idset,cur)), g=grow(sumIds(idset,lcf,lct).ex||0,sumIds(idset,lnf,lnt).ex||0);   // 当月税抜着地＝ダッシュボードと同一（landingForIds）
    const cIt=(elapsed>0&&fcMap[s.id])?fcMap[s.id].it:pIt;
    // 翌月（来月）＝予算があれば予算を着地見込みに、無ければ前年同月比推定。

  // 直営 全体KPI
  const dids=new Set(dstores.map(s=>s.id));

  const f=elapsed>0?daysIn/elapsed:0, gAll=grow(sumIds(dids,lcf,lct).ex||0,sumIds(dids,lnf,lnt).ex||0);
  const scale=(a,m)=>({ex:(a.ex||0)*m,in:(a.in||0)*m,tx:(a.tx||0)*m,it:(a.it||0)*m,v:(a.hasV?a.v:0)*m,txv:(a.txv||0)*m,hasV:a.hasV});
  const aggCur=scale(aggSo,f), aggNext=scale(aggCur,gAll);
  const kOf=a=>({ex:Math.round(a.ex||0),aov:(a.tx>0?Math.round(a.in/a.tx):0),upt:(a.tx>0?+(a.it/a.tx).toFixed(2):0),aup:(a.it>0?Math.round(a.ex/a.it):0),v:Math.round(a.v||0),pr:(a.v>0?+(a.txv/a.v*100).toFixed(1):0)});
  const KPIS=[{k:"ex",n:"税抜売上"},{k:"aov",n:"客単価(税込)"},{k:"upt",n:"平均購入点数",u:"点"},{k:"aup",n:"商品単価(税抜)"},{k:"v",n:"来店客数",u:"人"},{k:"pr",n:"購入率",u:"%"}];
  const kpi={prev:kOf(aggPrev),cur:kOf(aggCur),next:kOf(aggNext)};
  // 直営全体の当月/翌月 税抜売上は、各店の着地の合計＝アプリ共通の着地見込み（landing.js）に一致させる。

  // FC 税抜着地（ロイヤリティ基礎）＝ダッシュボードの着地見込みと同一定義（①②③、税抜、FC全店の合算）

  const fcLandEx=Math.round(landingExForIds(fcIds,cur));
  const auto={storeEx,kpi,roy:{base:fcLandEx,rate:6.8},wh:{NOTIME:{qty:0,unit:0},SELFURUGI:{qty:0,unit:0},GARAGE:{qty:0,unit:0},NEW:{qty:0,unit:0}},con:{qty:0,price:0,rate:0}};
  const loaded=await keieiLoad(cur), saved=loaded.p||{};
  const M=JSON.parse(JSON.stringify(auto));
  // 当月(cur)は予実タブの着地見込みが正（そちらで編集）。経営レポート保存の上書きは前月/来月のみ。
  if(saved.storeEx)for(const id in M.storeEx){if(saved.storeEx[id])["prev","next"].forEach(c=>{if(saved.storeEx[id][c]!=null)M.storeEx[id][c]=saved.storeEx[id][c];});}
  if(saved.kpi)["prev","cur","next"].forEach(c=>{if(saved.kpi[c])Object.assign(M.kpi[c],saved.kpi[c]);});

  if(saved.con&&typeof saved.con==="object")Object.assign(M.con,saved.con);   // 旧・数値保存は破棄（新: {qty,price,rate}）
  const ni=(k,v)=>`<input class="ki" data-k="${k}" value="${v}" inputmode="decimal">`;
  const niY=(k,v)=>`<span class="yenin">¥${ni(k,v)}</span>`;   // 円マーク付き入力
  const WH=[["NOTIME","NOTIME"],["SELFURUGI","SELFURUGI"],["GARAGE","SELFURUGI GARAGE"],["NEW","新店"]];
  let h='';
  h+=`<header><h1>経営レポート</h1><span class="sub">対象 <b>${cur}</b>（前月 ${ml(prev)}／当月 ${ml(cur)}／来月 ${ml(next)}）${elapsed?`　当月は ${elapsed}/${daysIn}日で日割り換算`:'　当月データなし'}</span><a class="navlink" href="index.html" style="margin-left:auto">← ダッシュボード</a>
      <a class="navlink homebtn" href="../" title="アプリのトップへ">ホーム</a>
    </header>`;
  h+=`<div class="note">前月＝実績確定／当月＝<b>ダッシュボードと同じ着地見込み（①②③）</b>／翌月以降＝<b>予算（事業計画 bizplan）</b>を着地見込みに（予算が無い店のみ前年同月比で推定）。自動入力ですが編集できます（「保存する」で全員に共有）。</div>`;
  // ■ 直営：店舗×指標（目標・着地見込・実績）＝ご指定の並び（下北沢/山形/いわき/福井/長野/合計）
  //   ・税抜売上の着地見込は「編集」リンクから店舗ページ(見込設定)で変更（直営タブと同じ動線）。
  //   ・商品単価の着地見込は自動入力＋手で上書き可（↺で自動に戻す）。
  //   ・商品販売数の着地見込＝税抜売上着地 ÷ 商品単価（単価を変えるとその場で再計算）。
  const DIRECT_SEQ=["下北沢","山形","いわき","福井"];
  const seqStores=DIRECT_SEQ.map(tok=>dstores.find(s=>(s.name||"").indexOf(tok)>=0)).filter(Boolean);
  const panelRows=[...seqStores.map(s=>({id:s.id,name:s.name,neu:false})), ...NEWSTORES.map(ns=>({id:ns.id,name:ns.name,neu:true}))].map(r=>{
    const idset=new Set([r.id]);
    const so=curEnd?sumIds(idset,cf,curEnd):{ex:0,it:0}; r.actEx=Math.round(so.ex||0); r.actIt=Math.round(so.it||0);
    let L={ex:0,it:0}; try{L=fcLandingEx(r.id,cur)||L;}catch(e){} r.landEx=Math.round(L.ex||0); r.landIt=Math.round(L.it||0);
    r.tgt=r.neu?newTgtEx[r.id]:budgetEx(r.id,cur);
    r.actUnit=r.actIt>0?Math.round(r.actEx/r.actIt):null;
    // 新店舗（データ無し）は着地売上を手入力で持つ（初期値＝上書き値→無ければ目標）。既存店は landing.js。

  {
    const dash='<span class="sub">—</span>';
    let tTgt=0,anyTgt=false,tActEx=0,tActIt=0, body="";
    panelRows.forEach(r=>{
      if(r.tgt!=null){tTgt+=r.tgt;anyTgt=true;} tActEx+=r.actEx; tActIt+=r.actIt;
      // 税抜売上・着地見込：既存店は表示＋店舗ページ編集リンク／新店舗は手入力
      const salesCell = r.neu

    h+=`<div class="panel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">■ 直営：目標・着地見込・実績（${ml(cur)}）</h2>

  const recalc=()=>{

    let wtot=0,wqty=0;WH.forEach(([k])=>{const q=num("wh|"+k+"|qty"),u=num("wh|"+k+"|unit");const sub=q*u;wtot+=sub;wqty+=q;const e=D.getElementById("wsub-"+k);if(e)e.textContent=yf(sub);});
    D.getElementById("wtot").textContent=yf(wtot);
    {const qe=D.getElementById("wqty-tot");if(qe)qe.textContent=NUM(wqty);const ae=D.getElementById("wunit-avg");if(ae)ae.textContent=wqty>0?yf(Math.round(wtot/wqty)):"—";}
    const con=num("con|qty")*num("con|price")*num("con|rate")/100; const ce=D.getElementById("con-res");if(ce)ce.textContent=yf(con);
    D.getElementById("honbu").textContent=yf(roy+wtot+con);
  };
  D.querySelectorAll(".ki").forEach(e=>e.addEventListener("input",recalc)); recalc();
  // ---- 直営表：着地見込（売上・単価）の手入力→販売数・合計を再計算。↺で単価を自動に戻す ----
  const auNum=id=>{const e=D.querySelector('[data-au="'+id+'"]');const v=e?parseFloat(String(e.value).replace(/[^0-9.]/g,'')):NaN;return (Number.isFinite(v)&&v>0)?v:null;};
  const ldNum=id=>{const e=D.querySelector('[data-ld="'+id+'"]');if(!e)return null;const v=parseFloat(String(e.value).replace(/[^0-9.]/g,''));return (Number.isFinite(v)&&v>0)?v:null;};
  const salesOf=r=>{ if(r.neu){const v=ldNum(r.id); return v!=null?v:(r.tgt!=null?r.tgt:0);} return r.landEx; };
  function recalcAup(){ let tExAll=0,tExCnt=0,tQty=0;
    panelRows.forEach(r=>{ const base=salesOf(r), u=auNum(r.id)||r.autoUnit||0, ok=base>0&&u>0, qty=ok?Math.round(base/u):0;
      const qe=D.getElementById('qt-'+r.id); if(qe)qe.textContent=ok?NUM(qty)+'点':'—';
      if(base>0)tExAll+=base; if(ok){tExCnt+=base;tQty+=qty;} });
    const lt=D.getElementById('ld-tot'); if(lt)lt.textContent=yf(tExAll);
    const qt=D.getElementById('qt-tot'); if(qt)qt.textContent=NUM(tQty)+'点';
    const at=D.getElementById('au-tot'); if(at)at.textContent=tQty>0?yf(Math.round(tExCnt/tQty)):'—'; }
  D.querySelectorAll('.au').forEach(e=>{ e.addEventListener('input',recalcAup);
    e.addEventListener('change',()=>{const id=e.dataset.au,v=auNum(id); if(v!=null){saveAupOv(cur,id,v);}else{delAupOv(cur,id);}}); });
  D.querySelectorAll('.ld').forEach(e=>{ e.addEventListener('input',recalcAup);
    e.addEventListener('change',()=>{const id=e.dataset.ld,v=ldNum(id); if(v!=null)saveLandOv(cur,id,v);}); });
  D.querySelectorAll('.aureset').forEach(b=>{ b.addEventListener('click',async()=>{const id=b.dataset.aur,r=panelRows.find(x=>String(x.id)===String(id));
    await delAupOv(cur,id); const e=D.querySelector('[data-au="'+id+'"]'); if(e)e.value=(r&&r.autoUnit)||''; recalcAup(); }); });
  recalcAup();
  // ---- テキスト化（Slack貼り付け用）----
  function showTextModal(text){
    const old=D.getElementById('txtmodal'); if(old)old.remove();
    const m=D.createElement('div'); m.className='txtmodal'; m.id='txtmodal';
    m.innerHTML=`<div class="box"><div style="font-weight:800;margin-bottom:8px">テキスト（Slackに貼り付け）</div>`
      +`<textarea id="txtout" readonly></textarea>`
      +`<div class="row"><span class="sub" id="txtmsg" style="margin-right:auto"></span>`
      +`<button type="button" class="themebtn" id="txtcopy" style="background:var(--accent);color:#fff;border-color:var(--accent)">コピー</button>`
      +`<button type="button" class="themebtn" id="txtclose">閉じる</button></div></div>`;
    D.body.appendChild(m);
    const ta=D.getElementById('txtout'); ta.value=text; ta.focus(); try{ta.select();}catch(e){}
    D.getElementById('txtcopy').onclick=()=>{let ok=false;try{ta.select();ok=D.execCommand('copy');}catch(e){}try{navigator.clipboard.writeText(text);ok=true;}catch(e){}D.getElementById('txtmsg').textContent=ok?'コピーしました':'テキストを選択してコピーしてください';};
    D.getElementById('txtclose').onclick=()=>m.remove();
    m.addEventListener('click',ev=>{if(ev.target===m)m.remove();});
  }
  const cpBtn=D.getElementById('ki-copy');
  if(cpBtn)cpBtn.onclick=()=>{
    const short=nm=>String(nm).replace(/^NOTIME/,'').replace(/店$/,'');
    const maxLen=Math.max(1,...panelRows.map(r=>short(r.name).length));
    const padName=nm=>{const s=short(nm);return s+'　'.repeat(Math.max(0,maxLen-s.length));};
    let tQty=0,tEx=0, lines=['【直営】'];
    panelRows.forEach(r=>{ const base=salesOf(r), u=auNum(r.id)||r.autoUnit||0, ok=base>0&&u>0, qty=ok?Math.round(base/u):0;
      if(ok){tQty+=qty;tEx+=base;}
      lines.push(ok?`${padName(r.name)}　${NUM(qty)}点 ／ ${(base/10000).toFixed(1)}万円 ／ 単価${NUM(u)}円`
                   :(base>0?`${padName(r.name)}　${(base/10000).toFixed(1)}万円 ／ 単価未設定`:`${padName(r.name)}　（データなし）`)); });
    lines.push(`　直営合計　${NUM(tQty)}点 ／ ${(tEx/10000).toFixed(1)}万円`);
    const text=lines.join('\n');
    try{navigator.clipboard.writeText(text);}catch(e){}
    showTextModal(text);
  };
  if(loaded.src)D.getElementById("ki-status").textContent=(loaded.src==="server"?"サーバーの保存値を表示中":"この端末の保存値を表示中");
  D.getElementById("ki-auto").onclick=()=>{
    const rb=gel("roy|base");if(rb)rb.value=auto.roy.base; recalc();
  };
  D.getElementById("ki-save").onclick=async()=>{
    const payload={roy:{base:num("roy|base"),rate:num("roy|rate")},wh:{},con:{qty:num("con|qty"),price:num("con|price"),rate:num("con|rate")}};
    WH.forEach(([k])=>{payload.wh[k]={qty:num("wh|"+k+"|qty"),unit:num("wh|"+k+"|unit")};});
    const b=D.getElementById("ki-save");b.disabled=true;b.textContent="保存中…";
    const server=await keieiSave(cur,payload);
    b.disabled=false;b.textContent="保存する";
    D.getElementById("ki-status").textContent=server?"✅ サーバーに保存しました（全員に共有）":"⚠️ この端末に保存（サーバー保存は sql/018 実行後に有効）";
  };
}
boot();
</script>
</body>
</html>
