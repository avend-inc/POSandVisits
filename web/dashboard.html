<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="売上KPI管理">
<meta name="robots" content="noindex, nofollow">
<title>売上KPI管理</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04); --radius:14px;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 88px;}
  header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .rangebar{font-size:13px;color:var(--ink2);margin:8px 0 2px;font-weight:600;}
  .rangebar b{color:var(--ink);} .rangebar .store{color:var(--accent);}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 4px;}
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--ink2);font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  select,input[type="date"]{appearance:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  select{padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  input[type="date"]{padding:7px 10px;}
  label.lbl{font-size:12px;color:var(--muted);}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  .chip:hover{color:var(--ink);border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 4px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);}
  .card .k{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:6px;}
  .card .val{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.1;}
  .card .knote{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.3;}
  .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;gap:3px;align-items:center;}
  .delta.up{color:var(--good);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;margin:14px 0;}
  .panel h2{font-size:14px;margin:0 0 2px;font-weight:700;}
  .panel .note{font-size:11.5px;color:var(--muted);margin:0 0 8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:760px){.row2{grid-template-columns:1fr;}}
  .chart{position:relative;width:100%;}
  svg{display:block;width:100%;height:auto;overflow:visible;}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.4;
    padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .08s;z-index:5;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tblwrap{overflow-x:auto;}
  th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);}
  th{color:var(--ink2);font-weight:700;font-size:11.5px;position:sticky;top:0;background:var(--surface);}
  tbody tr:hover td{background:var(--surface2);}
  tfoot td{font-weight:750;border-top:2px solid var(--border);background:var(--surface2);}
  tr.catrow.clk{cursor:pointer;}
  .caret{display:inline-block;width:1.1em;color:var(--muted);font-size:11px;}
  .catdetail>td{padding:0 !important;background:var(--surface2);}
  .subtbl{width:100%;border-collapse:collapse;margin:0;}
  .subtbl th,.subtbl td{padding:6px 10px;font-size:12px;border-bottom:1px solid var(--border);text-align:right;background:var(--surface2);}
  .subtbl th:first-child,.subtbl td:first-child{text-align:left;padding-left:26px;color:var(--ink2);}
  .subtbl th{color:var(--muted);font-weight:600;}
  .subtbl tr:last-child td{border-bottom:0;}
  .foot{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .themebtn{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .navlink{border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .navlink:hover{border-color:var(--accent);}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);}
  .tabbar a.on .ic{filter:none;}
  .gbadge{display:inline-block;font-size:12px;font-weight:800;vertical-align:middle;
    padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;letter-spacing:.03em;}
  .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;letter-spacing:.02em;}
  .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;
    cursor:pointer;box-shadow:var(--shadow);margin-top:20px;}
  .gbtn:hover{border-color:var(--accent);}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;
    background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
  /* ---- 直営/FC・店舗詳細ページ 共通コンポーネント（両ページで使うため head に集約）---- */
  .slicer{display:flex;flex-direction:column;gap:1px;margin-top:8px}
  .schip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:16px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .schip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .kmat{width:100%;border-collapse:collapse;font-size:12.5px}
  .kmat th,.kmat td{border-bottom:1px solid var(--border);padding:5px 7px;text-align:right;white-space:nowrap}
  .kmat th:first-child,.kmat td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
  .kmat thead th{color:var(--ink2);font-size:11.5px;font-weight:700}
  .kmat .colhdr small{display:block;color:var(--ink2);font-weight:500;font-size:10px}
  .kmat tr.subhdr th{font-size:10px;color:var(--ink2);font-weight:600;padding:2px 7px}
  .kmat td.peer{color:var(--ink2)}
  .kmat tr.land td{color:var(--accent);font-weight:800}
  .kmat tr.prow td{font-weight:800;background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .stbtn{background:none;border:none;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
  .pchip.on,.gchip.on,.hchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--surface);font-weight:700;cursor:pointer;margin-top:4px}
  .dd summary::-webkit-details-marker{display:none}
  .dd .ddarrow{color:var(--ink2);transition:transform .15s}
  .dd[open] .ddarrow{transform:rotate(180deg)}
  .ddbody{border:1px solid var(--border);border-radius:10px;margin-top:6px;padding:8px;max-height:46vh;overflow:auto;background:var(--surface)}
  .scheck{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:8px;font-size:13px;cursor:pointer}
  .scheck input{width:18px;height:18px;flex:none}
  .heat{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
  .heat th,.heat td{border:1px solid var(--border);padding:5px 4px;text-align:center;white-space:nowrap;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
  .heat col.c-rank{width:64px} .heat col.c-tot{width:58px} .heat col.c-cat{width:62px}
  .heat th{color:var(--ink2);font-weight:700;font-size:10.5px}
  .heat td:first-child,.heat th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
  .heat th.cbtn,.heat td.gtot.cbtn{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;cursor:pointer}
  .heat td.cbtn{cursor:pointer}
  .heat td.cbtn:not(.gtot) .pct{border-bottom:1px dotted var(--ink2)}
  .heat td.zc{color:var(--ink2);opacity:.42}
  .heat .g5{background:color-mix(in srgb,#22c55e 32%,transparent);font-weight:800}
  .heat tr.prow td,.heat td.gtot{font-weight:800;background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .delta-up{color:#16a34a} .delta-dn{color:#dc2626}
  .gchip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .mdlbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
  .mdl{background:var(--surface);width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:16px;padding:16px}
  .mdl h3{margin:0 0 8px;font-size:15px}
  .mdl .x{position:absolute;top:10px;right:14px;font-size:22px;color:var(--ink2);cursor:pointer;background:none;border:none}
  /* 加盟店ログイン後の「自分の店舗」一覧 */
  .frhome{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .frcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow);cursor:pointer;font:inherit;color:var(--ink);text-align:left}
  .frcard:hover{border-color:var(--accent)}
  .frcard .nm{font-size:16px;font-weight:750}
  .frcard .go{font-size:22px;color:var(--accent);font-weight:800;line-height:1}
  /* 日別推移：直近7日ぶんの高さに収め、下スクロールで過去。見出し＋平均2行は上に固定 */
  .daywrap{max-height:295px;overflow:auto}
  .daykpi tr.avgrow th{font-size:11px;font-weight:700;text-align:right;color:var(--ink);
    background:color-mix(in srgb,var(--accent) 7%,var(--surface));border-bottom:1px solid var(--border)}
  .daykpi tr.avgrow th:first-child{text-align:left}
  .daykpi tr.avgrow.we th{color:var(--accent)}
  .daywrap thead th{position:sticky;top:0;background:var(--surface);z-index:2}
  .daywrap thead th:first-child{z-index:3}
  .kmat tr.we td{color:var(--accent)}
  /* 店舗詳細ページ：上部サマリーカード（横幅で数字を縮めてはみ出さない）・見出しアクセント */
  .dtop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 4px}
  /* 直営店は「売上予算」を足して4枚。スマホ幅では3枚を横に並べると潰れるので2×2にする */
  .dtop.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media(max-width:620px){ .dtop.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .dtop .card.bud{border-top-color:#2e9e5b}
  .dtop .card .rate{margin-top:4px;font-size:10px;font-weight:800;white-space:nowrap}
  .dtop .card{padding:11px 12px;border-radius:12px;border-top:3px solid var(--accent)}
  .dtop .card .k{font-size:11px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtop .card .val{font-size:clamp(14px,4.4vw,22px);white-space:nowrap;letter-spacing:-.02em}
  .dtop .card .val small{font-size:11px;font-weight:700;color:var(--ink2);margin-left:1px}
  .dtop .card .knote{font-size:9.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtop .card.land{background:linear-gradient(135deg,#1f2a44,#2b3c60);border-top-color:#b8860b;border-color:#2b3c60}
  .dtop .card.land .k{color:#cadcfc}
  .dtop .card.land .val{color:#fff}
  .dtop .card.land .val small{color:#cadcfc}
  .dtop .card.land .knote{color:#8fa3c8}
  /* 無人／有人の内訳（1店で2レジを使い分ける店＝下北沢のみ表示）。スマホ幅でも1行ずつ収める */
  .dtop .card .ksplit{display:none;margin-top:5px;padding-top:4px;border-top:1px dotted var(--border);font-size:9.5px;line-height:1.65;color:var(--ink2)}
  .dtop .card .ksplit div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dtop .card .ksplit b{font-weight:800;color:var(--ink)}
  .dtop .card.land .ksplit{border-top-color:#3a4d75;color:#8fa3c8}
  .dtop .card.land .ksplit b{color:#fff}
  /* 有人来店の入力もれ：ボタンの件数バッジと、日別推移の来店セルにつける印 */
  .bdg{margin-left:5px;padding:1px 6px;border-radius:9px;background:#b8860b;color:#fff;font-size:9.5px;font-weight:800;white-space:nowrap}
  .kmat td .mk{margin-left:3px;font-size:9px;font-weight:800;color:#b8860b}
  .svtbl tr.miss td{background:rgba(184,134,11,.10)}
  /* 広告タブ：選んだ項目ぶんの折れ線を並べる */
  .adcharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .adchart{border:1px solid var(--border);border-radius:12px;padding:8px 10px 6px;background:var(--surface)}
  .adchart .t{font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:2px}
  .adchart .r{display:flex;justify-content:space-between;gap:6px;font-size:9.5px;color:var(--muted);margin-top:2px}
  /* 1枚グラフの凡例（色・項目名・期間合計・レンジ） */
  .adlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:6px}
  .adlegend span{display:inline-flex;align-items:baseline;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap}
  .adlegend i{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
  .adlegend b{font-size:12px;color:var(--ink);font-weight:800}
  .adlegend small{font-size:9.5px;color:var(--muted)}
  .adlegend em{font-style:normal;font-size:9px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 3px}
  /* グラフに触れたときの吹き出し */
  .adwrap{position:relative;overflow-x:auto}
  .adtip{position:absolute;top:6px;z-index:5;pointer-events:none;background:rgba(17,20,24,.94);color:#fff;
    border-radius:9px;padding:7px 10px;font-size:11px;line-height:1.55;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
  .adtip .d{font-weight:800;font-size:11px;margin-bottom:3px;color:#cbd5e1}
  .adtip .l{display:flex;align-items:center;gap:5px}
  .adtip .l i{width:8px;height:8px;border-radius:2px;flex:none}
  .adtip .l b{margin-left:auto;padding-left:10px;font-weight:800}
  /* 元データがまだ無い指標のチップ */
  /* 項目チップ：色は丸ドットで示す（左端の帯だと折り返しで崩れるため） */
  .chip.adcol{display:inline-flex;align-items:center;gap:5px}
  .chip.adcol .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip.adcol.on .dot{background:#fff !important;opacity:.9}
  .chip.adcol.nodata{opacity:.5}
  /* 元データが未取込の項目：カードを薄くし、理由を出す */
  .dtop .card.nodata{opacity:.62;border-top-color:var(--border)}
  .dtop .card.nodata .knote{color:#b8860b}
  .adwarn{margin:0 0 8px;padding:8px 10px;border:1px dashed #b8860b;border-radius:10px;
    background:rgba(184,134,11,.08);font-size:11.5px;line-height:1.7}
  .adwarn code{background:rgba(0,0,0,.06);border-radius:4px;padding:1px 4px;font-size:11px}
  /* 選択中の区分（店舗別など）をはっきり見せる */
  .chip.adgrp.on{background:var(--accent);border-color:var(--accent);color:#fff}
  @media(max-width:560px){
    .adlegend{gap:4px 10px}
    .adlegend span{font-size:10.5px}
    .adlegend small{display:none}          /* 幅が足りないのでレンジは隠す（値は吹き出しで見る） */
    .kmat .eye{font-size:11px}
    .adtip{font-size:10.5px;padding:6px 8px}
  }
  /* 内訳：親（店舗など）と、その下にぶら下がる週 */
  .kmat tr.adparent td{font-weight:800;border-top:1px solid var(--border)}
  .kmat tr.adweek td{color:var(--ink2);font-size:12px}
  .kmat tr.adweek td:first-child{padding-left:20px;position:relative;color:var(--muted)}
  .kmat tr.adweek td:first-child::before{content:"└";position:absolute;left:8px;color:var(--border)}
  /* 直営／FC のセクション行 */
  .kmat tr.adsec td{background:var(--surface2);font-weight:800;font-size:11.5px;color:var(--ink2);border-top:2px solid var(--border)}
  /* 店舗を非表示にするボタン */

<script>
"use strict";
const YEN=n=>Math.round(n).toLocaleString("ja-JP");
const NUM=n=>Math.round(n).toLocaleString("ja-JP");
const F1 =n=>(Math.round(n*10)/10).toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1});
const F2 =n=>(Math.round(n*100)/100).toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2});

// 売上はすべて「税抜」で語る（税込売上は画面に出さない）。税抜の実額が無い店（デジテールの
// 日次合計のみ）は税込÷1.1で近似して常に税抜で表示する。
const METRICS=[
  {key:"ex", name:"税抜売上",   fmt:v=>YEN(v)+"円", calc:p=>p.hasEx?p.ex:(p.in!=null?p.in/1.1:null)},
  {key:"v",  name:"来店客数",   fmt:v=>NUM(v)+"人", calc:p=>p.hasV?p.v:null, note:"デジテール導入店のみ"},
  {key:"tx", name:"取引数",     fmt:v=>NUM(v)+"件", calc:p=>p.tx},
  {key:"qty",name:"販売数",     fmt:v=>NUM(v)+"点", calc:p=>p.hasIt?p.it:null},
  {key:"pr", name:"購入率",     fmt:v=>F1(v)+"%",   calc:p=>(p.hasV&&p.v>0)?(p.txv!=null?p.txv:p.tx)/p.v*100:null, note:"デジテール導入店のみ（来店÷取引）"},
  {key:"aov",name:"客単価",     fmt:v=>YEN(v)+"円", calc:p=>p.tx>0?(p.hasEx?p.ex:(p.in||0)/1.1)/p.tx:null},
  {key:"upt",name:"平均購入数", fmt:v=>F2(v)+"点",  calc:p=>(p.hasIt&&p.txIt>0)?p.it/p.txIt:null},
  {key:"aup",name:"商品単価",   fmt:v=>YEN(v)+"円", calc:p=>(p.hasEx&&p.it>0)?p.ex/p.it:null},
];
const M=k=>METRICS.find(m=>m.key===k);
const KPI_ORDER=["ex","v","tx","qty","pr","aov","upt","aup"];
// 比較ラベル：対象期間の長さに合わせて 前日比／前週比／前月比 を出し分ける。
// 比較先は「直前の同じ長さの期間」（実際の日付はマウスオーバーで表示）。
function deltaLabel(n){ if(n<=1)return"前日比"; if(n<=7)return"前週比"; if(n<=31)return"前月比"; return "前"+n+"日比"; }
// 表示グループ（直営／FC）。URLの ?g=own / ?g=fc で切り替える。
//   直営ページ … 直営店だけ。FCページ … FC店だけ。既定（無指定）は直営。
// ?store=<id> があれば「店舗専用ページ」を表示（一覧の店名タップで遷移＝ブラウザ戻るで一覧へ）
// ログイン後にURLを復元して読み直せるよう、let にして関数から入れ直せるようにしてある。
let GROUP="own", GROUP_LABEL="直営店", DETAIL_ID=null, VIEW="";
function readRoute(){
  const q=new URLSearchParams(location.search);
  GROUP=(q.get("g")||"").toLowerCase();
  if(GROUP!=="own"&&GROUP!=="fc")GROUP="own";
  GROUP_LABEL=(GROUP==="fc")?"FC店":"直営店";
  const v=q.get("store");
  DETAIL_ID=(v&&/^\d+$/.test(v))?+v:null;
  VIEW=(q.get("view")||"").toLowerCase();
}
readRoute();
// 共有URL（?g=own&store=4 など）は Googleログインの往復で消えてしまい、
// 受け取った人は店舗ページではなく一覧に着地する。ログインへ飛ぶ直前に控えておき、
// 戻ってきたら書き戻す。※ 復元はセッション確立の後に行う（?code= を先に消さないため）。
const RETURN_KEY="notime-return-search";
function rememberSharedUrl(){
  try{ if(location.search)sessionStorage.setItem(RETURN_KEY,location.search); }catch(e){}
}
function restoreSharedUrl(){
  let saved=null;
  try{ saved=sessionStorage.getItem(RETURN_KEY); sessionStorage.removeItem(RETURN_KEY); }catch(e){}
  if(!saved)return;
  const q=new URLSearchParams(location.search);
  if(q.get("store")||q.get("g"))return;            // すでに付いている＝復元は不要
  try{ history.replaceState(null,"",location.pathname+saved); }catch(e){ return; }
  readRoute();
  state.detail=DETAIL_ID;
  if(DETAIL_ID){ state.sel=new Set([DETAIL_ID]); state.grain="day"; }
}

// sel=選択店舗ID(Set)。kind=③期間プリセット。grain=⑤推移の粒度。trendAnchor=⑤の＜＞位置。
const state={store:"__sel__",sel:null,grain:DETAIL_ID?"day":"month",metric:"ex",from:null,to:null,kind:"thismonth",trendEnd:null,detail:DETAIL_ID,
  heatMetric:"q",trendSel:["ex"],hKind:"thismonth",hFrom:null,hTo:null};
  // heatMetric=店舗ページ比率表の切替（q=販売数/a=税抜売上）。trendSel=推移グラフの表示系列（最大3）
  // hKind/hFrom/hTo=店舗ページ比率表の集計期間（KPIまとめの期間とは独立）
let DATA=null;
// リロード／直アクセスか？（＝タブ移動でないか）。リロード時は選択・期間をデフォルトへ戻す。
function navIsReload(){
  try{ const e=performance.getEntriesByType&&performance.getEntriesByType("navigation")[0];
    if(e&&e.type)return e.type==="reload";
    if(performance.navigation)return performance.navigation.type===1; }catch(_){}
  return false;
}

// ---- 配信設定 ----
//  画面は Supabase 公開バケットの config.json を見て、公開/認証モードを自動判別する。
//  （config.json は export_dashboard.py が書き出す。anon は公開してよい鍵）
//  ・公開モード : config.json の dataUrl（公開data.json）を読む
//  ・認証モード : Googleログイン → 許可リスト(app_users)に居れば非公開data.jsonを読む
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null};   // Supabase クライアント／ログイン中ユーザー
const SUPA={url:"",anon:""};            // Supabase の接続情報（Edge Function を直接叩くときに使う）

// 「プリントTシャツ」「バンド/ミュージックTシャツ」「アニメ/ムービーTシャツ」は直営店だけの細分。
// ★これらを「Tシャツ」に統合するのは “レポートの中だけ”。ダッシュボード画面は原本のまま。
//   → 統合・除外は rptCatAgg / rptBandAgg / rptCatShareMonth（レポート集計）だけで適用する。
// Tシャツ細分の判定（表記ゆれに強いキーワード判定）。プリント／バンド・ミュージック／アニメ・ムービー。
function tshirtTheme(c){ c=(c||""); if(c.indexOf("シャツ")<0)return null;
  if(c.indexOf("プリント")>=0)return "プリントT";
  if(c.indexOf("バンド")>=0||c.indexOf("ミュージック")>=0)return "バンド/ミュージックT";
  if(c.indexOf("アニメ")>=0||c.indexOf("ムービー")>=0||c.indexOf("映画")>=0)return "アニメ/ムービーT";
  return null; }
// レポートのカテゴリ/価格帯ランキングから除外（セール＝バンドル割引の擬似カテゴリ）。画面には影響しない。
function isDropCat(c){ c=(c||""); return c.indexOf("セール")>=0||c==="SALE"; }
function normCat(c){ return tshirtTheme(c)?"Tシャツ":c; }
// ⑤⑥ヒートマップ用の表示正規化：Tシャツ系は4分類の正式名に寄せる（アニメを先に判定して
// 「アニメ/ミュージックTシャツ」等の表記ミスも『アニメ/ムービーTシャツ』へ正す）。T以外のシャツ(半袖/長袖/ポロ)や他カテゴリはそのまま。
function tCanon(c){ c=(c||"");
  if(c.indexOf("シャツ")<0) return c;
  if(c.indexOf("プリント")>=0) return "プリントTシャツ";
  if(c.indexOf("アニメ")>=0||c.indexOf("ムービー")>=0||c.indexOf("映画")>=0) return "アニメ/ムービーTシャツ";
  if(c.indexOf("バンド")>=0||c.indexOf("ミュージック")>=0) return "バンド/ミュージックTシャツ";
  if(c.indexOf("Tシャツ")>=0||c.indexOf("Ｔシャツ")>=0) return "Tシャツ";
  return c; }
// ---- 来店数の合算（無人＋有人）--------------------------------------------
// 下北沢のように「無人営業＝SIPOS／有人営業＝Airレジ」の2レジで回している店は、
// 入店計測（デジテール）が無人時間ぶんしか取れない。有人時間ぶんは店舗ページの
// 「有人来店を入力」から日別に手入力し（visits.source='staffed' / sql/021）、
// r.v0＝無人・r.vm＝有人・r.v＝合算 として持つ。以降の画面はすべて r.v を見るので、
// 日別推移・購入率・推移グラフ・KPIまとめが自動的に合算値になる。
// ※ 何度呼んでも同じ結果になるよう、元の無人ぶんは r.v0 に退避しておく。
function mergeStaffedVisits(){
  for(const r of DATA.daily){
    if(r.v0===undefined)r.v0=(r.v==null?null:r.v);
    r.v=(r.v0==null&&r.vm==null)?null:((r.v0||0)+(r.vm||0));
  }
}
// 来店データのある店舗・最新日を作り直す（手入力の保存後にも呼ぶ）。
function recomputeVisitIndex(){
  const vd=DATA.daily.filter(r=>r.v!=null).map(r=>r.d).sort();
  DATA._visitMax=vd.length?vd[vd.length-1]:DATA._max;
  // 来店（入店計測）が入っている店舗の集合。来店客数・購入率はこの店だけで計算する。
  DATA._visitStores=new Set(DATA.daily.filter(r=>r.v!=null).map(r=>r.s));
}
function prep(){
  if(!DATA||!DATA.daily)throw new Error("データが空です");
  const ds=DATA.daily.map(r=>r.d).sort();
  DATA._min=ds[0]; DATA._max=ds[ds.length-1];
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();
  DATA._salesMax=sd.length?sd[sd.length-1]:DATA._max;
  mergeStaffedVisits();      // 有人時間の来店（手入力）を来店数へ合算してから各種の集計を作る
  recomputeVisitIndex();     // 来店データのある店・最新日
  // 無人／有人の売上内訳を持っている店（＝1店で2レジを使い分ける店。下北沢）。
  DATA._posMix=new Set(DATA.daily.filter(r=>r.exU!=null||r.exM!=null).map(r=>r.s));
  // ※ DATA.cat / DATA.catp は原本のまま（画面のカテゴリ表示はTシャツ細分を分けて出す）。
  //   Tシャツ統合・セール除外はレポート集計側（rptCatAgg等）だけで行う。
  // リロード／直アクセスなら選択・期間をデフォルトに戻す（タブ移動のときだけ引き継ぐ）
  if(navIsReload()){ try{sessionStorage.removeItem("kpiSel");sessionStorage.removeItem("kpiPeriodSS");}catch(e){} }
  const [tf,tt]=presetRange("thismonth"); state.from=tf; state.to=tt; state.kind="thismonth";  // 既定＝今月
  state.hFrom=tf; state.hTo=tt; state.hKind="thismonth";  // 店舗ページ比率表の期間（独立）も既定＝今月
  const sp=loadPeriodSS(); if(sp){state.from=sp.from;state.to=sp.to;state.kind=sp.kind;}       // タブ移動での引き継ぎ
  state.sel=loadSel();                                   // 既定＝全選択／タブ移動で引き継ぎ
  if(state.detail)state.sel=new Set([state.detail]);     // 店舗専用ページはその店だけ
  state.trendEnd=trendLatestAnchor(state.grain);         // 推移の初期アンカー（粒度に合わせた最新位置）
}

function screen(html){document.getElementById("app").innerHTML=html;}
function showError(e){screen('<div class="err">データを読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}

async function boot(){
  try{
    // ① 非公開スナップショット（Artifact等）：埋め込み済みデータをそのまま表示
    if(window.__DATA__){DATA=window.__DATA__;prep();render();return;}
    // ② 公開設定を読む
    let cfg=null;
    try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    // ③ 認証モード：Googleログインの後に非公開データを読む
    if(cfg&&cfg.mode==="auth"){await authBoot(cfg.url,cfg.anon);return;}
    // ④ 公開モード：data.json を読む
    const url=(cfg&&cfg.dataUrl)||"data.json";
    DATA=await (await fetch(url,{cache:"no-store"})).json();
    prep();render();
  }catch(e){showError(e);}
}

// ---- 認証モード ----
async function ensureSupabase(){
  if(window.supabase)return;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした（通信環境をご確認ください）"));
    document.head.appendChild(s);
  });
}
async function authBoot(url,anon){
  screen('<div class="sub" style="padding:40px 0">読み込み中…</div>');
  await ensureSupabase();
  SUPA.url=String(url||"").replace(/\/+$/,""); SUPA.anon=anon;   // AI呼び出しの直接fetch用に控える
  SB=window.supabase.createClient(url,anon,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,
      flowType:"pkce",storageKey:"notime-auth"},
  });
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return;}
  restoreSharedUrl();          // ログイン前に開いていた共有URL（店舗ページ等）へ戻す
  ME.email=(session.user&&session.user.email||"").toLowerCase();
  // 許可リスト判定：app_users に登録があればログイン可（ロールを取得）
  let role=null;
  try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
  ME.role=role;
  if(!ME.role){showDenied(ME.email);return;}
  // 加盟店（FC）判定：app_user_stores に割り当てがあれば「加盟店モード」＝自店バンドルだけ読む。
  // 割り当てが無い＝AVENDメンバー（従来どおり全店 data.json）。
  // RLS(sql/019)により data.json は AVENDメンバーしか読めない（加盟店は自店バンドルのみ）。
  // ★ここは必ず「自分のメール」で絞る。
  //   app_user_stores のRLSは『本人の行 または 管理者は全行』なので、絞らずに読むと
  //   管理者だけ“全員ぶんの割り当て”が返ってしまい、他人の店舗で加盟店モードに入る。
  //   加えて admin/editor は割り当てがあっても常にAVENDメンバー扱いにする
  //   （sql/019 の is_hq() と同じ判定にそろえる）。
  let frStores=[];
  if(ME.role!=="admin"&&ME.role!=="editor"){
    try{ const {data:us}=await SB.from("app_user_stores").select("store_id").eq("email",ME.email);
         frStores=[...new Set((us||[]).map(r=>+r.store_id))]; }catch(e){}
  }
  if(frStores.length){ await franchiseeBoot(frStores); return; }
  screen('<div class="sub" style="padding:40px 0">データを読み込み中…</div>');
  const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
  if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
  DATA=JSON.parse(await data.text());
  prep();render();
}
// 加盟店モード：割り当て店舗の store-<id>.json（自店の明細＋事前計算した比較値）だけ読む。
async function franchiseeBoot(ids){
  screen('<div class="sub" style="padding:40px 0">データを読み込み中…</div>');
  const bench={}, stores=[], daily=[], cat=[], catp=[], bundles=[]; let bundleNames={},catSeason={},gradeBands=[],gen="";
  for(const sid of ids){
    try{
      const {data,error}=await SB.storage.from("dashboard-data").download("store-"+sid+".json");
      if(error) continue;
      const b=JSON.parse(await data.text());
      bench[sid]=b.bench||{};
      (b.stores||[]).forEach(s=>stores.push(s));
      daily.push(...(b.daily||[])); cat.push(...(b.cat||[])); catp.push(...(b.catp||[]));
      bundles.push(...(b.bundles||[])); Object.assign(bundleNames,b.bundleNames||{});
      if(b.catSeason)catSeason=b.catSeason; if(b.gradeBands)gradeBands=b.gradeBands; if(b.generated_at)gen=b.generated_at;
    }catch(e){}
  }
  if(!stores.length){ showError(new Error("割り当てられた店舗のデータが見つかりませんでした。管理者にお問い合わせください。")); return; }
  window.FRANCHISEE=true; window.FR_STORES=stores.map(s=>s.id); window.FR_BENCH=bench;
  DATA={generated_at:gen,stores,daily,cat,catp,bundles,bundleNames,catSeason,gradeBands};
  prep();
  // 割当が1店 or URLで店指定 → その店へ直行。複数店 → まず「自分の店舗」一覧を出す。
  const pick=(DETAIL_ID&&window.FR_STORES.includes(DETAIL_ID))?DETAIL_ID
            :(window.FR_STORES.length===1?window.FR_STORES[0]:null);
  if(pick!=null)openFranchiseeStore(pick); else renderFranchiseeHome();
}
// 加盟店：許可された店舗の一覧（ログイン直後に表示）。名前をタップでその店へ。
function renderFranchiseeHome(){
  const tb=document.querySelector(".tabbar"); if(tb)tb.style.display="none";
  const app=document.getElementById("app"); app.classList.remove("detail");
  const ids=window.FR_STORES||[];
  app.innerHTML=`
    <header>
      <h1>売上KPI管理 <span class="gbadge">加盟店</span></h1>
      <button class="themebtn" id="themebtn" style="margin-left:auto">◐</button>
      ${SB?'<button class="themebtn" id="logoutbtn" style="margin-left:6px">ログアウト</button>':''}
    </header>
    <div class="sub" style="margin:8px 0 12px">ご覧になる店舗を選んでください。</div>
    <div class="frhome">${ids.map(id=>`<button class="frcard" data-sid="${id}"><span class="nm">${esc((storeMeta(id)||{}).name||("店舗"+id))}</span><span class="go">›</span></button>`).join("")||'<span class="sub">表示できる店舗がありません。管理者にお問い合わせください。</span>'}</div>`;
  const el=document.getElementById("themebtn"); if(el)el.onclick=toggleTheme;
  if(SB){const lo=document.getElementById("logoutbtn"); if(lo)lo.onclick=doLogout;}

function mondayOf(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10);}
function pKey(d,g){return g==="day"?d:g==="month"?d.slice(0,7):mondayOf(d);}
function pLabel(k,g){
  if(g==="month"){const[y,m]=k.split("-");return `${y}年${+m}月`;}
  if(g==="day"){const[,m,dd]=k.split("-");return `${+m}/${+dd}`;}
  return `${+k.slice(5,7)}/${+k.slice(8,10)}週`;   // 週は「6/29週」（月曜始まり）
}
// グラフの横軸など、幅が限られる場所で使う短いラベル（月=「8月」／週=「6/29週」／日=「8/8」）
function pShort(k,g){
  if(g==="month")return `${+k.slice(5,7)}月`;
  if(g==="day")return `${+k.slice(5,7)}/${+k.slice(8,10)}`;
  return `${+k.slice(5,7)}/${+k.slice(8,10)}週`;
}
// 見出しに出す期間の範囲ラベル（月だけ年を2桁で添える）
function pRange(k,g){
  if(g==="month")return `${k.slice(2,4)}年${+k.slice(5,7)}月`;
  return pShort(k,g);
}
function addDays(d,n){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000)+1;}
function clampLo(d){return d<DATA._min?DATA._min:d;} function clampHi(d){return d>DATA._max?DATA._max:d;}

function sumRows(rows){
  // in/ex/tx/it=売上系（全店）。
  // txv=購入率の分子（購入客数＝取引数）、v=分母（来店客数）。どちらも
  // 「デジテール（入店計測）が入っていて、かつKPIに来店を使う店」だけを対象にする
  //（＝来店の分母が無い店の取引を分子に混ぜない。POSだけの店は購入率に含めない）。
  // 例外：いま開いている店舗ページの店だけは、KPI対象外(kpi_visitors=false)でも来店を使う。
  //   下北沢は無人＋有人の合算をこの画面の中では正しい来店数として扱いたい一方、
  //   全店・直営合計の購入率は従来どおり除外したままにするため（state.detail のときだけ許可）。
  const p={in:0,ex:0,tx:0,txv:0,it:0,txIt:0,v:0,bagIn:0,bagEx:0,hasV:false,hasEx:false,hasIt:false};
  const isVS=DATA._visitStores||new Set();
  for(const r of rows){p.in+=r.in||0;p.tx+=r.tx||0;
    if(r.ex!=null){p.ex+=r.ex;p.hasEx=true;}   // 税抜は実額がある行だけ合計（近似店はnull）
    if(r.it!=null){p.it+=r.it;p.hasIt=true;p.txIt+=r.tx||0;}  // 点数と、その分母となる取引数（明細のある店だけ）
    // レジ袋の税込/税抜（客単価・商品単価から差し引く用。bagEx未提供の旧データは税込÷1.1で近似＝レジ袋は10%課税なので厳密）
    p.bagIn+=r.bag||0; p.bagEx+=(r.bagEx!=null?r.bagEx:(r.bag?Math.round(r.bag/1.1):0));
    if((kvOf(r.s)||r.s===state.detail)&&isVS.has(r.s)){p.txv+=r.tx||0; if(r.v!=null){p.v+=r.v;p.hasV=true;}}}
  if(!p.hasV)p.v=0; return p;
}
// 店舗スコープ判定：'all'=全店 / 'own'=直営 / 'fc'=FC / 'sf'=SELFURUGI / 'nt'=NOTIME / それ以外=店舗id
// 非表示(visible=false)の店はどの集計にも出さない。
function storeMatch(sid,scope){
  if(!visibleOf(sid))return false;
  if(scope==="all")return true;
  if(scope==="__sel__")return state.sel?state.sel.has(sid):true;   // ①店舗選択スライサー
  if(scope==="own")return ownOf(sid)==="直営";
  if(scope==="fc") return ownOf(sid)==="FC";
  if(scope==="sf") return brandOf(sid)==="SELFURUGI";
  if(scope==="nt") return brandOf(sid)==="NOTIME";
  return sid===scope;
}

// レポートのブランド別ランキング用（GARAGE を SELFURUGI から分離）：NOTIME／SELFURUGI／SELFURUGI GARAGE／その他

// ---- グレード（ランク帯）判定：カテゴリ→季節、税抜単価→帯（下限しきい値で下の帯に寄せる）----
function gradeOf(category, price){
  const season=(DATA.catSeason||{})[category];
  if(season!=="SS"&&season!=="AW")return null;               // その他・未設定は対象外
  const bands=(DATA.gradeBands||[]).filter(b=>b.season===season).slice().sort((a,b)=>b.lo-a.lo);
  for(const b of bands){ if(price>=b.lo)return b.grade; }
  return null;                                               // 最小の下限未満
}
function gradeAgg(from,to,store){
  const g={}; let ta=0,tq=0;
  for(const r of (DATA.catp||[])){
    if(!storeMatch(r.s,store))continue; if(r.d<from||r.d>to)continue;
    const gr=gradeOf(r.c,r.p); if(!gr)continue;
    const x=g[gr]||(g[gr]={a:0,q:0}); x.a+=r.a||0; x.q+=r.q||0; ta+=r.a||0; tq+=r.q||0;
  }
  return {g,ta,tq};
}
function hasGrades(){ return !!(DATA.gradeBands&&DATA.gradeBands.length&&DATA.catSeason&&DATA.catp&&DATA.catp.length); }
function drawGrade(from,to,store){

  if(!hasGrades()){ panel.style.display="none"; return; }
  const {g,ta,tq}=gradeAgg(from,to,store); const keys=Object.keys(g);
  if(!keys.length){ panel.style.display="none"; return; }
  panel.style.display="";
  const bySales=keys.slice().sort((x,y)=>g[y].a-g[x].a).slice(0,3);
  const byQty=keys.slice().sort((x,y)=>g[y].q-g[x].q).slice(0,3);
  const rows=(arr,val,tot,fmt)=>arr.map((k,i)=>
    `<tr><td>${i+1}</td><td>ランク ${esc(k)}</td><td>${fmt(g[k][val])}</td><td>${tot>0?F1(g[k][val]/tot*100)+"%":"—"}</td></tr>`).join("")
    ||`<tr><td colspan="4" class="sub">対象データなし</td></tr>`;
  document.getElementById("grade-sales").innerHTML=`<thead><tr><th>#</th><th>ランク</th><th>売上</th><th>比率</th></tr></thead><tbody>${rows(bySales,"a",ta,v=>YEN(v)+"円")}</tbody>`;

  document.getElementById("grade-note").textContent=`比率＝ランク対象（SS/AW）の合計に対する割合（その他カテゴリは除く）`;

function rowsIn(from,to,storeId){

// 表示期間を grain で刻んだ推移用
function periods(from,to,g,storeId){
  const map=new Map();
  for(const r of rowsIn(from,to,storeId)){const k=pKey(r.d,g);if(!map.has(k))map.set(k,[]);map.get(k).push(r);}
  return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([k,rows])=>{const p=sumRows(rows);p.key=k;p.label=pLabel(k,g);return p;});
}
function catIn(from,to,storeId){
  const map=new Map();
  for(const r of DATA.cat){if(!storeMatch(r.s,storeId))continue;if(r.d<from||r.d>to)continue;if(isDropCat(r.c))continue; // セール（バンドル割引）は売上・販売数ランキングに入れない
    let c=map.get(r.c);if(!c){c={c:r.c,a:0,q:0};map.set(r.c,c);}c.a+=r.a||0;c.q+=r.q||0;}
  return [...map.values()];
}
// カテゴリを1つ選び、対象期間・店舗でしぼって価格帯（単価）別に集計。売上降順。
function catPriceIn(from,to,storeId,category){
  if(!DATA.catp)return null;
  const map=new Map();
  for(const r of DATA.catp){if(r.c!==category)continue;if(!storeMatch(r.s,storeId))continue;if(r.d<from||r.d>to)continue;
    let e=map.get(r.p);if(!e){e={p:r.p,a:0,q:0};map.set(r.p,e);}e.a+=r.a||0;e.q+=r.q||0;}
  return [...map.values()].sort((a,b)=>b.a-a.a);
}
function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return DATA.stores.filter(s=>w.has(s.id)&&s.visible!==false);}
function storeMeta(sid){return (DATA.stores||[]).find(x=>String(x.id)===String(sid))||null;}

function hasFCStores(){return usableStores().some(s=>ownOf(s.id)!=="直営");}
function periodSpan(key,g){
  if(g==="day")return[key,key];
  if(g==="week")return[key,addDays(key,6)];
  const[y,m]=key.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();
  return[`${key}-01`,`${key}-${String(last).padStart(2,"0")}`];
}
function monthSpan(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return[`${ym}-01`,`${ym}-${String(last).padStart(2,"0")}`];}
function clampRange(f,t){if(f<DATA._min)f=DATA._min;if(t>DATA._max)t=DATA._max;if(f>t)f=t;return[f,t];}
// 実際の今日（端末＝日本時間）を基準にボタンの期間を決める。
// 前日＝昨日、今週＝今日を含む週(月〜日) …。常にデータのある範囲へ収める。
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function presetRange(kind){
  const today=todayStr(), y1=addDays(today,-1);
  if(kind==="all")return[DATA._min,DATA._max];
  if(kind==="d14")return clampRange(addDays(today,-13),today);
  if(kind==="d30")return clampRange(addDays(today,-29),today);
  if(kind==="d90")return clampRange(addDays(today,-89),today);
  if(kind==="prevday")return clampRange(y1,y1);
  if(kind==="thisweek"){const mon=mondayOf(today);return clampRange(mon,addDays(mon,6));}
  if(kind==="lastweek"){const mon=addDays(mondayOf(today),-7);return clampRange(mon,addDays(mon,6));}
  if(kind==="thismonth")return clampRange(...monthSpan(today.slice(0,7)));
  if(kind==="lastmonth"){const[y,m]=today.split("-").map(Number);let py=y,pm=m-1;if(pm===0){pm=12;py--;}
    return clampRange(...monthSpan(`${py}-${String(pm).padStart(2,"0")}`));}
  return[DATA._min,DATA._max];
}

  {k:"im",  name:"表示回数",       fmt:v=>NUM(Math.round(v))+"回", sum:r=>r.im},
  {k:"rc",  name:"リーチ",         fmt:v=>NUM(Math.round(v))+"人", sum:r=>r.rc, note:"日をまたぐと重複を含みます"},
  {k:"ck",  name:"クリック",       fmt:v=>NUM(Math.round(v))+"回", sum:r=>r.ck},
  {k:"fl",  name:"フォロー数",     fmt:v=>NUM(Math.round(v))+"人", sum:r=>r.fl, need:"fl", src:"follows"},
  {k:"pv",  name:"プロフアクセス数",fmt:v=>NUM(Math.round(v))+"回", sum:r=>r.pv, need:"pv", src:"profile_visits"},
  {k:"ctr", name:"CTR",           fmt:v=>v==null?"—":F1(v)+"%",  calc:p=>p.im>0?p.ck/p.im*100:null},

  {k:"cpf", name:"CPF",           fmt:v=>v==null?"—":YEN(Math.round(v))+"円", calc:p=>p.fl>0?p.sp/p.fl:null, need:"fl", src:"follows", note:"フォロー獲得単価＝広告費÷フォロー数"},
  {k:"cpv", name:"プロフ単価",   fmt:v=>v==null?"—":YEN(Math.round(v))+"円", calc:p=>p.pv>0?p.sp/p.pv:null, need:"pv", src:"profile_visits"},
  {k:"cpm", name:"CPM",           fmt:v=>v==null?"—":YEN(Math.round(v))+"円", calc:p=>p.im>0?p.sp/p.im*1000:null},

];
// その指標の元データが1行でも入っているか（入っていない指標は出さない）
function adHas(need){
  if(!need)return true;
  const ks=Array.isArray(need)?need:[need];
  return ks.every(k=>(DATA.meta||[]).some(r=>r[k]!=null));
}
// 指標は常に全部並べる（元データがまだ無いものは値が「—」になるだけ）。
// 隠してしまうと「選べない」のか「作っていない」のか区別が付かないため。
function adMetrics(){ return AD_METRICS; }
// 指標の色。グラフの線と「表示する項目」のチップで同じ色を使う。
const AD_COLOR={sp:"#2f6fd0",im:"#8e5bd0",rc:"#0aa2c0",ck:"#1a8a5a",fl:"#d6336c",pv:"#e8590c",
  ctr:"#b8860b",cpc:"#c0392b",cpf:"#7048e8",frt:"#0ca678",cpv:"#e67700",cpm:"#495057",frq:"#845ef7"};
const AD_DEFAULT=["sp","im","ck","ctr","cpc","cpm"];
let AD_COLS=(function(){
  try{const s=JSON.parse(localStorage.getItem("notime-adcols")||"null");
    if(Array.isArray(s)&&s.length)return s.filter(k=>AD_METRICS.some(m=>m.k===k));}catch(e){}
  return AD_DEFAULT.slice();
})();

// 非表示にした店舗（店名の集合）。集計・グラフ・表のすべてから外す。

// 広告タブの既定期間＝直近4週（最新日を含む週の月曜から数えて4週ぶん）。
// 店舗別一覧が月曜〜日曜の週で並ぶので、週がちょうど4本立つ範囲にそろえる。
let AD_PERIOD_INIT=false;
function adDefaultPeriod(){
  const last=(DATA.meta||[]).reduce((a,r)=>r.d>a?r.d:a,"")||DATA._salesMax||DATA._max;
  return [clampLo(addDays(mondayOf(last),-21)), clampHi(last)];
}
function adApply4w(){
  const [f,t]=adDefaultPeriod();
  state.from=f; state.to=t; state.kind="custom"; savePeriod();
}
let AD_STORE=(function(){try{return localStorage.getItem("notime-adstore")||"";}catch(e){return "";}})();
// 期間内に広告費が動いた店舗（＋未紐付け）をプルダウンの選択肢にする
function adStoreList(){
  const set=new Set();
  for(const r of (DATA.meta||[]))set.add(r.st||UNMAPPED);
  return [...set].sort((a,b)=>a===UNMAPPED?1:b===UNMAPPED?-1:a.localeCompare(b,"ja"));
}
const AD_GROUPS=[["c","キャンペーン別"],["st","店舗別"],["a","アカウント別"]];
const UNMAPPED="（未紐付け）";

// カード・グラフ用：対象期間 ＋ 選んだ店舗 ＋ 非表示を除く
function adRows(){
  return adRowsAll().filter(r=>!AD_STORE||(r.st||UNMAPPED)===AD_STORE);
}
// 店舗別一覧用：店舗の絞り込みは効かせない（一覧は常に全店を出す）。
// 非表示にした店だけは、明示的な操作なので一覧からも外す。
function adRowsAll(){
  return (DATA.meta||[]).filter(r=>r.d>=state.from&&r.d<=state.to&&!AD_HIDE.has(r.st||UNMAPPED));
}
function adSum(rows){
  const p={sp:0,im:0,rc:0,ck:0,fl:0,pv:0};
  for(const r of rows){p.sp+=r.sp||0;p.im+=r.im||0;p.rc+=r.rc||0;p.ck+=r.ck||0;p.fl+=r.fl||0;p.pv+=r.pv||0;}
  return p;
}
function adVal(k,p){
  const m=AD_METRICS.find(x=>x.k===k);
  return m.calc?m.calc(p):p[k];
}

// 選んだ項目を1枚に重ねた折れ線。
//   ・1番目に選んだ項目は左の縦軸、2番目は右の縦軸に目盛りを出す。
//   ・3番目以降は軸を持たない（軸が増えると読めなくなるため。値はカーソルで見る）。
//   ・線は項目ごとに「その期間の最小〜最大」で正規化する。左右の軸はその最小〜最大を
//     そのまま目盛りにしているので、1番目・2番目の線は軸の数字と一致する。
//   ・グラフに触れると、その日の全項目をまとめて黒い吹き出しで出す。
function adChart(days,byDay){
  // スマホは座標系ごと小さくする。760幅のまま縮めると目盛りの文字が潰れて読めないため。
  const NARROW=(window.innerWidth||760)<560;
  const W=NARROW?380:760, H=NARROW?190:230, L=NARROW?40:54, R=NARROW?40:54, T=NARROW?8:12, B=NARROW?22:26;
  const FS=NARROW?8:9;
  const x=i=>days.length<2?(L+(W-R))/2:L+i*(W-L-R)/(days.length-1);
  const series=AD_COLS.map(k=>{
    const m=AD_METRICS.find(z=>z.k===k), vals=days.map(d=>adVal(k,byDay.get(d)));
    const fin=vals.filter(v=>v!=null&&isFinite(v));
    if(!fin.length)return null;
    const max=Math.max(...fin), min=Math.min(...fin), span=(max-min)||Math.abs(max)||1;
    const y=v=>H-B-((v-min)/span)*(H-B-T);
    let d="",pen=false;
    vals.forEach((v,i)=>{ if(v==null||!isFinite(v)){pen=false;return;}
      d+=(pen?" L":" M")+x(i).toFixed(1)+" "+y(v).toFixed(1); pen=true; });
    return {k:k,m:m,vals:vals,min:min,max:max,y:y,d:d.trim(),c:AD_COLOR[k]||"var(--accent)"};
  }).filter(Boolean);
  if(!series.length)return `<p class="note">表示する項目を選んでください。値が「—」の項目は、元データがDBに入ると出ます。</p>`;
  const dot=days.length>45?1.7:2.6;
  const step=Math.max(1,Math.ceil(days.length/(NARROW?5:8)));
  // 左右の軸（3等分の目盛り）。short=軸に置くので短く丸める。
  const axis=(s2,side)=>{
    if(!s2)return "";
    const at=side==="L"?L-6:W-R+6, an=side==="L"?"end":"start";
    return [0,.5,1].map(f=>{
      const v=s2.min+(s2.max-s2.min)*f, yy=s2.y(v);
      return `<text x="${at}" y="${(yy+3).toFixed(1)}" font-size="${FS}" fill="${s2.c}" text-anchor="${an}">${esc(adShort(s2.m,v))}</text>`;
    }).join("");
  };
  const tot=adSum(adRows());
  return `<div class="adlegend">`+series.map((s2,i)=>
      `<span><i style="background:${s2.c}"></i>${s2.m.name}${i<2?`<em>${i?"右軸":"左軸"}</em>`:""}<b>${s2.m.fmt(adVal(s2.k,tot))}</b>`+
      `<small>${s2.m.fmt(s2.min)}〜${s2.m.fmt(s2.max)}</small></span>`).join("")+`</div>
    <div class="adwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block"
        data-l="${L}" data-r="${R}" data-w="${W}" data-n="${days.length}">
      ${axis(series[0],"L")}${axis(series[1],"R")}
      ${days.map((d,i)=>i%step?"":`<text x="${x(i).toFixed(1)}" y="${H-7}" font-size="${FS}" fill="var(--muted)" text-anchor="middle">${+d.slice(5,7)}/${+d.slice(8,10)}</text>`).join("")}
      <line class="adcursor" x1="0" y1="${T}" x2="0" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      ${series.map(s2=>`<path d="${s2.d}" fill="none" stroke="${s2.c}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
      ${series.map(s2=>days.map((dd,i)=>{const v=s2.vals[i];
        return (v==null||!isFinite(v))?"":`<circle cx="${x(i).toFixed(1)}" cy="${s2.y(v).toFixed(1)}" r="${dot}" fill="${s2.c}"/>`;}).join("")).join("")}
    </svg><div class="adtip" style="display:none"></div></div>
    <p class="note" style="margin:4px 0 0">左の軸＝1番目に選んだ項目、右の軸＝2番目。3番目以降は軸を出していません（軸が増えると読めなくなるため）。グラフに触れるとその日の全項目が出ます。</p>`;
}
// 軸の目盛り用に短くする（円は千/万、%は小数1桁）
function adShort(m,v){
  if(v==null||!isFinite(v))return "—";
  const u=m.fmt(0).replace(/[\d,.\-]/g,"");
  if(u.indexOf("%")>=0)return F1(v)+"%";
  const a=Math.abs(v);
  if(a>=10000)return Math.round(v/1000)+"千"+(u||"");
  if(a>=1000)return NUM(Math.round(v))+(u||"");
  return (a<10?F1(v):String(Math.round(v)))+(u||"");
}
// グラフに触れたとき、その日の全項目を黒い吹き出しでまとめて出す
function adWireTip(days,byDay){
  const wrap=document.querySelector("#adtrend .adwrap"); if(!wrap)return;
  const svg=wrap.querySelector("svg"), tip=wrap.querySelector(".adtip");
  if(!svg||!tip||!days.length)return;
  const L=+svg.dataset.l, R=+svg.dataset.r, W=+svg.dataset.w, cur=svg.querySelector(".adcursor");
  const at=e=>{
    const box=svg.getBoundingClientRect();
    const px=((e.touches?e.touches[0].clientX:e.clientX)-box.left)/box.width*W;   // viewBox座標へ
    const t=days.length<2?0:(px-L)/(W-L-R);
    return Math.max(0,Math.min(days.length-1,Math.round(t*(days.length-1))));
  };
  const show=e=>{
    const i=at(e), d=days[i], p=byDay.get(d);
    if(cur){const gx=days.length<2?(L+(W-R))/2:L+i*(W-L-R)/(days.length-1);
      cur.setAttribute("x1",gx);cur.setAttribute("x2",gx);cur.setAttribute("opacity","1");}
    tip.innerHTML=`<div class="d">${d.slice(0,4)}/${+d.slice(5,7)}/${+d.slice(8,10)}（${WK[new Date(d+"T00:00:00Z").getUTCDay()]}）</div>`+
      AD_COLS.map(k=>{const m=AD_METRICS.find(z=>z.k===k);
        return `<div class="l"><i style="background:${AD_COLOR[k]||"#fff"}"></i>${m.name}<b>${m.fmt(adVal(k,p))}</b></div>`;}).join("");
    tip.style.display="block";
    const box=wrap.getBoundingClientRect();
    const px=(e.touches?e.touches[0].clientX:e.clientX)-box.left;
    tip.style.left=Math.max(4,Math.min(box.width-tip.offsetWidth-4,px+12))+"px";
  };
  const hide=()=>{tip.style.display="none"; if(cur)cur.setAttribute("opacity","0");};
  svg.addEventListener("mousemove",show);
  svg.addEventListener("mouseleave",hide);
  svg.addEventListener("touchstart",show,{passive:true});
  svg.addEventListener("touchmove",show,{passive:true});
  svg.addEventListener("touchend",hide);
}
function drawAds(){
  const rows=adRows(), tot=adSum(rows);
  // ---- カード（選んだ項目だけ）----
  const cards=document.getElementById("adcards");
  if(cards)cards.innerHTML=AD_COLS.map(k=>{
    const m=AD_METRICS.find(x=>x.k===k), ready=adHas(m.need), v=adVal(k,tot);
    // 元データが未取込の項目は「—」だけだと理由が分からないので、必要な列名を書く
    return `<div class="card${ready?"":" nodata"}"><div class="k">${m.name}</div>`+
           `<div class="val">${ready?m.fmt(v):"—"}</div>`+
           `<div class="knote">${ready?(m.note||""):`${m.src} が未取込`}</div></div>`;
  }).join("");
  // 選んだ項目のうち、元データがまだDBに無いものをまとめて知らせる
  const warn=document.getElementById("adwarn");
  if(warn){
    const miss=AD_COLS.map(k=>AD_METRICS.find(x=>x.k===k)).filter(m=>!adHas(m.need));
    warn.innerHTML=miss.length?
      `<b>${miss.map(m=>m.name).join("・")}</b> はまだ数字が出せません。`+
      `Meta広告の取り込みに <code>${[...new Set(miss.map(m=>m.src))].join("</code>・<code>")}</code> が入ると、`+
      `この画面の計算（CPF＝広告費÷フォロー数、フォロー率＝フォロー数÷プロフアクセス数）が自動で動きます。`:"";
    warn.style.display=miss.length?"":"none";
  }
  // ---- 日別の推移：選んだ項目を1枚のグラフに重ねる ----
  //   単位も桁も違う（円・回・%）ので、そのまま重ねると1本以外が潰れる。
  //   各項目を「その項目の最小〜最大」で正規化して形を比べられるようにし、
  //   実際の値は凡例と、点にカーソルを載せたときに出す。
  const el=document.getElementById("adtrend");
  if(el){
    const byDay=new Map();
    for(const r of rows){ const a=byDay.get(r.d)||{sp:0,im:0,rc:0,ck:0,fl:0,pv:0};
      a.sp+=r.sp||0;a.im+=r.im||0;a.rc+=r.rc||0;a.ck+=r.ck||0;a.fl+=r.fl||0;a.pv+=r.pv||0; byDay.set(r.d,a); }
    const days=[...byDay.keys()].sort();
    el.innerHTML=days.length?adChart(days,byDay):`<p class="note">この期間の広告データがありません。</p>`;
    if(days.length)adWireTip(days,byDay);
  }
  // ---- 内訳：選んだ区分ごとに、週（月〜日）を下にぶら下げる ----
  //   店舗別のときは 直営／FC でセクションに分け、店舗ごとに非表示にできる。
  //   週は月曜始まり・日曜終わり。対象期間の端に掛かる週は、実際に集計した範囲だけを出す
  //   （例: 8/1〜8/9 を選ぶと最初の週は「8/1〜8/2」）。無い日ぶんまで入っているように見せない。
  const byStore=(AD_GROUP==="st");
  const g=new Map();
  for(const r of adRowsAll()){        // ← 一覧は店舗の絞り込みに連動しない
    const key=byStore?(r.st||UNMAPPED):(AD_GROUP==="a"?r.a:r.c);
    let e=g.get(key); if(!e){e={own:r.ow||null,tot:{sp:0,im:0,rc:0,ck:0,fl:0,pv:0},wk:new Map()};g.set(key,e);}
    if(!e.own&&r.ow)e.own=r.ow;
    const add=o=>{o.sp+=r.sp||0;o.im+=r.im||0;o.rc+=r.rc||0;o.ck+=r.ck||0;o.fl+=r.fl||0;o.pv+=r.pv||0;};
    add(e.tot);
    const mon=mondayOf(r.d);
    let w=e.wk.get(mon); if(!w){w={sp:0,im:0,rc:0,ck:0,fl:0,pv:0};e.wk.set(mon,w);}
    add(w);
  }
  const md=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
  const wkLabel=mon=>{
    const sun=addDays(mon,6);
    const a=mon<state.from?state.from:mon, b=sun>state.to?state.to:sun;   // 期間の端で切る
    return a===b?md(a):`${md(a)}〜${md(b)}`;
  };
  const cells=p2=>AD_COLS.map(k=>{const m=AD_METRICS.find(x=>x.k===k);return `<td>${m.fmt(adVal(k,p2))}</td>`;}).join("");
  const rowsOf=(nm,e)=>
    `<tr class="adparent"><td style="text-align:left">`+
      (byStore?`<button class="eye" data-hide="${esc(nm)}" title="この店舗を非表示にする">👁</button>`:"")+
      (nm===UNMAPPED?`<b style="color:#b8860b">${nm}</b>`:esc(nm))+`</td>${cells(e.tot)}</tr>`+
    [...e.wk.keys()].sort().map(mon=>
      `<tr class="adweek"><td style="text-align:left">${wkLabel(mon)}</td>${cells(e.wk.get(mon))}</tr>`).join("");
  const sortEnt=arr=>arr.sort((x,y)=>y[1].tot.sp-x[1].tot.sp);
  const all=[...g.entries()];
  let body="";
  if(!all.length){
    body=`<tr><td colspan="${AD_COLS.length+1}" class="sub">データがありません</td></tr>`;
  }else if(byStore){
    // 直営 → FC → 区分なし の順。区分は pos_store_links 経由で店舗マスタから引いている。
    const secs=[["直営","直営店"],["FC","FC店"],[null,"区分なし"]];
    body=secs.map(([own,label])=>{
      const part=sortEnt(all.filter(([,e])=>(e.own||null)===own));
      if(!part.length)return "";
      const sum=part.reduce((a,[,e])=>{["sp","im","rc","ck","fl","pv"].forEach(k=>a[k]+=e.tot[k]);return a;},
                            {sp:0,im:0,rc:0,ck:0,fl:0,pv:0});
      return `<tr class="adsec"><td style="text-align:left">${label}<span class="sub" style="font-weight:500">（${part.length}店）</span></td>${cells(sum)}</tr>`+
             part.map(([nm,e])=>rowsOf(nm,e)).join("");
    }).join("");
  }else{
    body=sortEnt(all).map(([nm,e])=>rowsOf(nm,e)).join("");
  }
  const t=document.getElementById("adtbl");
  if(t)t.innerHTML=`<thead><tr><th>${AD_GROUPS.find(x=>x[0]===AD_GROUP)[1].replace("別","")}</th>`+
    AD_COLS.map(k=>`<th>${AD_METRICS.find(x=>x.k===k).name}</th>`).join("")+`</tr></thead><tbody>${body}</tbody>`;
  // 非表示にしている店舗の案内（何を隠しているかが分かるように名前も出す）
  const hb=document.getElementById("adhidden");
  if(hb){
    const hid=[...AD_HIDE];
    hb.innerHTML=hid.length?
      `<b>${hid.length}店舗を非表示中：</b>`+
      hid.map(n=>`<button class="chip hidechip" data-show="${esc(n)}" title="表示に戻す">${esc(n)} ✕</button>`).join("")+
      `<button class="chip" id="adshowall" style="font-weight:800">すべて表示に戻す</button>`
      :"";
    hb.style.display=hid.length?"":"none";
  }
  if(t)t.querySelectorAll(".eye").forEach(b2=>b2.onclick=()=>{
    AD_HIDE.add(b2.dataset.hide); adSaveHide(); drawAds(); });
  if(hb){
    hb.querySelectorAll(".hidechip").forEach(b2=>b2.onclick=()=>{
      AD_HIDE.delete(b2.dataset.show); adSaveHide(); drawAds(); });
    const sa=document.getElementById("adshowall");
    if(sa)sa.onclick=()=>{ AD_HIDE.clear(); adSaveHide(); drawAds(); };
  }
  const nomap=adSum(adRowsAll().filter(r=>!r.st));
  const note=document.getElementById("adnote");
  if(note)note.innerHTML=
    `CTR＝クリック÷表示回数、CPC＝広告費÷クリック、CPM＝広告費÷表示回数×1000、FQ＝表示回数÷リーチ`+
    (adHas("fl")?`、CPF＝広告費÷フォロー数`:"")+(adHas(["fl","pv"])?`、フォロー率＝フォロー数÷プロフアクセス数`:"")+
    (adHas("pv")?`、プロフアクセス単価＝広告費÷プロフアクセス数`:"")+`。`+
    `期間をまたぐときも実額どうしで割り直しています（比率の平均はしていません）。`+
    (nomap.sp>0?`<br><b style="color:#b8860b">店舗に紐付いていない広告費が ${YEN(nomap.sp)}円あります。</b>店舗別の数字はそのぶん少なく出ます。`:"");
}
function wireCommon(){
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el[ev]=fn;};
  on("from","onchange",e=>{state.from=clampLo(e.target.value||DATA._min);if(state.from>state.to)state.to=state.from;state.kind="custom";syncDateInputs();savePeriod();draw();});
  on("to","onchange",e=>{state.to=clampHi(e.target.value||DATA._max);if(state.to<state.from)state.from=state.to;state.kind="custom";syncDateInputs();savePeriod();draw();});
  document.querySelectorAll(".pchip").forEach(b=>b.onclick=()=>{
    const pk=b.dataset.preset; let f,t;
    const fb=window.FRANCHISEE&&window.FR_BENCH&&(window.FR_BENCH[state.detail]||{})[pk];   // 加盟店は焼込みレンジ
    if(fb){f=fb.from;t=fb.to;}else{[f,t]=presetRange(pk);}
    state.from=f;state.to=t;state.kind=pk;syncDateInputs();savePeriod();draw();});
  document.querySelectorAll(".gchip[data-grain]").forEach(b=>b.onclick=()=>{state.grain=b.dataset.grain;state.trendEnd=trendLatestAnchor(state.grain);drawTrend2();});
  on("tr-prev","onclick",()=>{trendShift(-1);drawTrend2();});
  on("tr-next","onclick",()=>{trendShift(1);drawTrend2();});
  // 店舗ページ：比率表の切替（販売数／税抜売上）と推移グラフの系列トグル（最大3・最後の1つは消せない）
  document.querySelectorAll(".hmet").forEach(b=>b.onclick=()=>{state.heatMetric=b.dataset.hmet;drawHeatX();});
  document.querySelectorAll(".tmet").forEach(b=>b.onclick=()=>{
    const k=b.dataset.tmet, i=state.trendSel.indexOf(k);
    if(i>=0){ if(state.trendSel.length>1)state.trendSel.splice(i,1); }
    else{ state.trendSel.push(k); if(state.trendSel.length>3)state.trendSel.shift(); }
    drawTrendDetail();
  });
  // 比率表専用の期間チップ（KPIまとめの期間とは連動しない）
  document.querySelectorAll(".hchip").forEach(b=>b.onclick=()=>{
    const[f,t]=presetRange(b.dataset.hpreset);
    state.hKind=b.dataset.hpreset; state.hFrom=f; state.hTo=t;
    drawHeatX();
  });
  on("themebtn","onclick",toggleTheme);
  on("reportbtn","onclick",openReportDialog);
  on("storereportbtn","onclick",openStoreReportDialog);
  if(SB)on("logoutbtn","onclick",doLogout);
}

// ========================= レポート（Partners Lounge 向け 分析） =========================
// すべてダッシュボードの実データ（DATA）から計算する。数字の捏造はしない。
// 価格帯（税抜単価）の区分。古着・アパレルを想定した固定バンド。
const RPT_BANDS=[
  {lo:0,     hi:1000,     label:"〜¥999"},
  {lo:1000,  hi:2000,     label:"¥1,000〜1,999"},
  {lo:2000,  hi:3000,     label:"¥2,000〜2,999"},
  {lo:3000,  hi:5000,     label:"¥3,000〜4,999"},
  {lo:5000,  hi:8000,     label:"¥5,000〜7,999"},
  {lo:8000,  hi:12000,    label:"¥8,000〜11,999"},
  {lo:12000, hi:Infinity, label:"¥12,000〜"},
];
function rptBandIdx(p){ for(let i=0;i<RPT_BANDS.length;i++){ if(p>=RPT_BANDS[i].lo&&p<RPT_BANDS[i].hi)return i; } return RPT_BANDS.length-1; }
// 対象月の自動選択：売上のある最新月。最新日が5日以下（月初だけ）なら前月を対象にする。
function rptPickYm(){
  const smax=DATA._salesMax||DATA._max; const ym=smax.slice(0,7);
  const dom=+smax.slice(8,10);
  return dom<=5 ? prevYm(ym) : ym;
}
// 店舗idの集合を述語にしてカテゴリ集計（DATA.cat）※レポート専用：Tシャツ細分を統合・セール除外
function rptCatAgg(from,to,pred){
  const m=new Map();
  for(const r of (DATA.cat||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const cn=normCat(r.c); let c=m.get(cn); if(!c){c={c:cn,a:0,q:0};m.set(cn,c);} c.a+=r.a||0; c.q+=r.q||0; }
  return [...m.values()];
}
// 店舗idの集合を述語にして価格帯（税抜単価）別に集計（DATA.catp）※レポート専用：セール除外
function rptBandAgg(from,to,pred){
  const bands=RPT_BANDS.map(b=>({label:b.label,a:0,q:0})); let ta=0,tq=0;
  for(const r of (DATA.catp||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const i=rptBandIdx(r.p||0); bands[i].a+=r.a||0; bands[i].q+=r.q||0; ta+=r.a||0; tq+=r.q||0; }
  return {bands,ta,tq};
}
// 店舗idの集合を述語にして「ランク（グレード S/A/B/C/D）」別に集計（gradeOf を使用）※レポート専用
function rptGradeAgg(from,to,pred){
  const g={}; let ta=0,tq=0;
  for(const r of (DATA.catp||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const gr=gradeOf(r.c,r.p); if(!gr)continue;
    const x=g[gr]||(g[gr]={grade:gr,a:0,q:0}); x.a+=r.a||0; x.q+=r.q||0; ta+=r.a||0; tq+=r.q||0; }
  return {g,ta,tq};
}
// 設定済みのランクを高い順（S,A,B,C,D…）に並べて返す
function rptRankOrder(){
  const ord=["S","A","B","C","D","E","F"];
  const all=[...new Set((DATA.gradeBands||[]).map(b=>b.grade))];
  return all.sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
}
function rptHasGrades(){ return !!(DATA.gradeBands&&DATA.gradeBands.length&&DATA.catSeason&&DATA.catp&&DATA.catp.length); }
// 合計値（sumRows の結果）→ 主要KPI
function rptKpi(p){
  // 客単価・商品単価は「レジ袋」を除いた商品ぶんで算出（レジ袋は数点の付随手数料でKPIを歪めるため）。
  // 売上（in/ex）そのものはレジ袋込み＝POS純売上のまま（ロイヤリティ整合）。販売点数(it)は元々レジ袋を含まない。
  const inNet=p.in-(p.bagIn||0);
  const exNet=p.hasEx?(p.ex-(p.bagEx||0)):null;
  return {
    in:p.in, ex:p.hasEx?p.ex:null, tx:p.tx, it:p.it,
    inNet, exNet, v:p.hasV?p.v:null, hasV:p.hasV, txv:p.txv,
    // 客単価は税抜で語る（税抜売上÷取引数、レジ袋除く）。税抜の実額が無い店は税込÷1.1で近似。
    aov:p.tx>0?((exNet!=null?exNet:inNet/1.1)/p.tx):null,
    upt:(p.hasIt&&p.txIt>0)?p.it/p.txIt:null, // 平均購入点数（分母は明細のある取引数）
    aup:(p.hasEx&&p.it>0)?exNet/p.it:null, // 平均商品単価（税抜・レジ袋除く）
    pr :(p.hasV&&p.v>0)?(p.txv/p.v*100):null, // 購入率（デジテール店のみ）
  };
}
// 税抜売上（実額があればそれ、無ければ税込÷1.1で近似）。売上は全て税抜で語るため。
function rptEx(p){return (p&&p.hasEx)?p.ex:(((p&&p.in)||0)/1.1);}
// 2要素の中点（Shapley）分解： 積 A×B の増減を A要因/B要因に厳密配分（合計＝Δ(A×B)）
function rptDecomp(aC,bC,aP,bP){
  return { a:(aC-aP)*(bC+bP)/2, b:(bC-bP)*(aC+aP)/2, total:aC*bC-aP*bP };
}
// 各店の初回売上月（YYYY-MM）＝OPEN月。売上が初めて立った月で判定（データ駆動）。
let _rptFirstYm=null;
function rptFirstYm(sid){
  if(!_rptFirstYm){ _rptFirstYm=new Map();
    for(const r of DATA.daily){ if(!((r.in||0)>0||(r.tx||0)>0))continue;
      const ym=(r.d||"").slice(0,7), cur=_rptFirstYm.get(r.s);
      if(!cur||ym<cur)_rptFirstYm.set(r.s,ym); } }
  return _rptFirstYm.get(sid)||null;
}
// 平均・全体KPIの対象店（その月がOPEN月の店は初月ゆえ除外、下北沢は恒久除外）
// データ先頭月は「本当のOPEN月」と区別できないためOPEN扱いにしない（誤除外を防ぐ）。
function rptEligIds(ym){
  const [f,t]=monthSpan(ym), ids=new Set();
  const startYm=(DATA._min||"").slice(0,7);
  for(const s of usableStores()){
    if((s.name||"").indexOf("下北沢")>=0)continue;
    if(rptFirstYm(s.id)===ym && ym>startYm)continue;   // その月がOPEN月（かつデータ先頭月でない）→除外
    if(DATA.daily.some(r=>r.s===s.id&&r.d>=f&&r.d<=t&&((r.in||0)>0)))ids.add(s.id);
  }
  return ids;
}
// 対象店の月次 店舗売上（平均・中央値・店舗数）
function rptAvgMed(ym){
  const [f,t]=monthSpan(ym), ids=rptEligIds(ym);
  const vals=[...ids].map(id=>{let x=0;for(const r of DATA.daily){if(r.s===id&&r.d>=f&&r.d<=t)x+=r.in||0;}return x;}).filter(v=>v>0).sort((a,b)=>a-b);
  const n=vals.length, avg=n?vals.reduce((a,b)=>a+b,0)/n:0;
  const med=n?(n%2?vals[(n-1)/2]:(vals[n/2-1]+vals[n/2])/2):0;
  return {avg,med,n};
}

// グループ（分類）ごとの当月/前月集計を返す。ids は所属店舗idの集合。
function rptGroupRows(cf,ct,pf,pt){
  return classesInData().map(cls=>{
    const members=usableStores().filter(s=>classOf(s.id)===cls);
    const ids=new Set(members.map(s=>s.id));
    const c=sumRowsForIds(cf,ct,ids), p=sumRowsForIds(pf,pt,ids);
    const n=members.filter(s=>{const x=sumRows(rowsIn(cf,ct,s.id));return x.in>0;}).length;
    return {cls,ids,members,n,c,p};
  });
}
// 売上規模で S/A/B/C の4階層に分ける（同数に近い分位＋レンジ表示）
function rptTiers(rows){
  const defs=[{label:"S（大型）",color:"B8860B"},{label:"A（中大）",color:"2E5AAC"},{label:"B（中小）",color:"5B8C5A"},{label:"C（小型）",color:"6B7280"}];
  const n=rows.length; const out=defs.map(d=>({...d,rows:[],sum:{in:0,ex:0,tx:0,txv:0,it:0,v:0,hasV:false}}));
  if(!n)return out.map(t=>({...t,range:"—"}));
  const per=Math.ceil(n/4);
  rows.forEach((r,i)=>{ const t=out[Math.min(3,Math.floor(i/per))];
    t.rows.push(r); ["in","ex","tx","txv","it","v"].forEach(k=>t.sum[k]+=r.c[k]||0); if(r.c.hasV)t.sum.hasV=true; });
  return out.map(t=>{ if(!t.rows.length)return {...t,range:"—"};
    const hi=t.rows[0].c.in, lo=t.rows[t.rows.length-1].c.in;
    return {...t,range:(Math.round(lo/10000).toLocaleString("ja-JP"))+"〜"+(Math.round(hi/10000).toLocaleString("ja-JP"))+"万円"}; });
}
// 上位店の示唆（強みKPIから成功要因を推定）
function rptStoreInsight(r,kAll,cf,ct){
  const k=rptKpi(r.c); const parts=[];
  const rel=(v,b)=>v==null||b==null||b===0?null:(v/b-1)*100;
  const rAov=rel(k.aov,kAll.aov), rUpt=rel(k.upt,kAll.upt), rAup=rel(k.aup,kAll.aup), rPr=k.pr!=null&&kAll.pr!=null?(k.pr-kAll.pr):null;
  const cand=[];
  if(rAup!=null&&rAup>=6)cand.push(["商品単価が全店比 "+(rAup>=0?"+":"")+rAup.toFixed(0)+"%","高単価・良質な品揃え（グレードの高い商材）が客単価を押し上げ"]);
  if(rUpt!=null&&rUpt>=6)cand.push(["購入点数が全店比 "+(rUpt>=0?"+":"")+rUpt.toFixed(0)+"%","セット・複数買いの提案力（関連販売）が効いている"]);
  if(rPr!=null&&rPr>=1.5)cand.push(["購入率が全店比 +"+rPr.toFixed(1)+"pt","入店客の購買転換が高い（接客・動線・品揃えの鮮度）"]);
  if(rAov!=null&&rAov>=6&&!cand.length)cand.push(["客単価が全店比 "+(rAov>=0?"+":"")+rAov.toFixed(0)+"%","1点単価と買上点数のバランスが良い"]);
  // 強みが平均並みでも、規模が大きい店は集客ドライバーとして評価
  if(!cand.length&&rUpt!=null&&rUpt>=3)cand.push(["購入点数が全店比 +"+rUpt.toFixed(0)+"%","複数買いの提案が寄与"]);
  // カテゴリの強み
  let catTxt="";
  const cats=rptCatAgg(cf,ct,sid=>String(sid)===String(r.id)).sort((a,b)=>b.a-a.a);
  if(cats.length){const tot=cats.reduce((x,c)=>x+c.a,0)||1;catTxt="主力は「"+cats[0].c+"」（"+(cats[0].a/tot*100).toFixed(0)+"%）。";}

  return r.name+"（"+man_(r.c.in)+"）：" + lead + catTxt;

function man_(v){return Math.round(v/10000).toLocaleString("ja-JP")+"万円";}
// 月の加算（YYYY-MM, deltaヶ月）
function rptAddMonths(ym,delta){let[y,m]=ym.split("-").map(Number);m+=delta;while(m<=0){m+=12;y--;}while(m>12){m-=12;y++;}return y+"-"+String(m).padStart(2,"0");}
// ブランド別グループ（直営は分けずブランド＝SELFURUGI／NOTIME／その他 に合算）
function rptBrandGroups(cf,ct,pf,pt){
  const seen=new Set(); usableStores().forEach(s=>seen.add(brandOf(s.id)));
  const order=["SELFURUGI","NOTIME","その他"];
  const list=[...order.filter(b=>seen.has(b)),...[...seen].filter(b=>!order.includes(b))];
  return list.map(b=>{const members=usableStores().filter(s=>brandOf(s.id)===b);const ids=new Set(members.map(s=>s.id));
    const c=sumRowsForIds(cf,ct,ids),p=sumRowsForIds(pf,pt,ids);
    const n=members.filter(s=>sumRows(rowsIn(cf,ct,s.id)).in>0).length;
    return {brand:b,cls:b,ids,members,n,c,p};});
}
// 注目3店の自動選定（FCのみ）：①FC売上最高 ②FC前月比最高 ③FC売上2位
function rptKeyStores(srows){
  const picked=new Set(), out=[]; const withC=srows.filter(r=>r.c.in>0&&r.own!=="直営");  // FCのみ
  const add=(r,icon,badge,reason,key)=>{ if(!r||picked.has(r.id))return; picked.add(r.id); out.push({r,icon,badge,reason,key}); };
  const bySales=[...withC].sort((a,b)=>b.c.in-a.c.in);
  const fc=bySales[0];
  if(fc)add(fc,"🏆","FC 売上トップ","FC売上 最高（"+man_(fc.c.in)+"）","fc");
  const base=Math.max(300000,0.25*(withC.reduce((x,r)=>x+r.c.in,0)/(withC.length||1)));
  const mom=withC.filter(r=>r.p.in>=base).map(r=>({r,g:r.c.in/r.p.in})).sort((a,b)=>b.g-a.g).map(x=>x.r).find(r=>!picked.has(r.id));
  if(mom)add(mom,"📈","FC 前月比トップ","FCで売上の前月比が最高（"+((mom.c.in/mom.p.in-1)*100>=0?"+":"")+((mom.c.in/mom.p.in-1)*100).toFixed(0)+"%）","mom");
  const fc2=bySales.find(r=>!picked.has(r.id));
  if(fc2)add(fc2,"🥈","FC 売上2番手","FC売上の上位（"+man_(fc2.c.in)+"）","fc");
  return out;
}
// 指定月の全店カテゴリ構成（明細のある店の合計）→ {m:Map(cat→売上), tot}
function rptCatShareMonth(ym){

// アクション提言（データから方向性を自動生成）
function rptActions(ctx){
  const {top,kC,dTx,dAov,grp,tiers}=ctx;
  const out=[];
  // 1. 上位店の勝ちパターン横展開
  const t0=top&&top[0];
  out.push({t:"① 上位店の勝ちパターンを横展開",b:[
    t0?("トップ "+t0.name+" の強み（単価/点数/購入率）を分解し、勝ち筋を標準化"):"上位店のKPIを分解し標準化",
    "中位・下位店に『客単価』か『取引数』のどちらを伸ばすか個店目標を設定",
    "好調カテゴリ・価格帯の品揃えを他店にも展開"]});
  // 2. 客単価 or 取引数のテコ入れ（弱い方）
  const focus=Math.abs(dTx.a)>=Math.abs(dTx.b)?"客単価":"取引数（集客・購入率）";
  out.push({t:"② "+focus+"のテコ入れ",b:[
    (dAov.a<0?"買上点数が低下 → セット販売・関連提案を強化":"買上点数の伸びを維持 → 提案の型を横展開"),
    (dAov.b<0?"商品単価が低下 → 上位グレード/価格帯の品揃えを拡充":"単価帯の上昇を維持 → 高単価帯の在庫を厚く"),
    "購入率（デジテール店）を指標に、入店→購買の転換を接客で改善"]});
  // 3. 中位・下位層の底上げ
  const lowT=[...(tiers||[])].reverse().find(t=>t.rows&&t.rows.length);
  out.push({t:"③ 中位・下位層の底上げ",b:[
    (lowT?("下位階層 "+lowT.rows.length+"店に重点支援。上位店の単価・点数の作り方を移植"):"下位層に重点支援"),
    "売上構成の大半を占める主力価格帯の品揃え欠品を防ぐ",
    "月次で1店1KPIの改善目標を設定し、Partners Loungeで進捗共有"]});
  // 4. カテゴリ×価格帯の最適化
  const bestGrp=(grp||[]).slice().sort((a,b)=>b.c.in-a.c.in)[0];
  out.push({t:"④ カテゴリ×価格帯の最適化",b:[
    "売れ筋カテゴリへ在庫・陳列を集中、死に筋は絞る",
    "主力価格帯を厚くしつつ、一段上の価格帯を計画的に育成し客単価を向上",
    (bestGrp?("最大グループ「"+bestGrp.cls+"」の成功構成を他グループの参考に"):"グループ間で成功構成を共有")]});
  return out;
}

//   ・来店客数・購入率はデジテール（入店計測）導入店のみ。

// 同ブランドの比較対象店（当月OPEN店・下北沢を除く。直営店→直営全店／FC店→同ブランド）
function eligBrandIdsFor(sid,ym){
  const e=rptEligIds(ym), own=ownOf(sid), br=brandOf(sid);
  return [...e].filter(id=> own==="直営" ? ownOf(id)==="直営" : brandOf(id)===br );
}
// 店舗ごとの月次KPIを単純平均（値の取れる店だけで平均）。来店・購入率は自然にデジテール店のみ。
function brandKpiAvg(ids,f,t){
  const per=ids.map(id=>{const a=sumRows(rowsIn(f,t,id));return {id,a,k:rptKpi(a)};});
  const mean=pick=>{const vs=per.map(pick).filter(v=>v!=null&&isFinite(v));return vs.length?vs.reduce((x,y)=>x+y,0)/vs.length:null;};
  return { inv:mean(x=>x.a.in), ex:mean(x=>rptEx(x.a)), tx:mean(x=>x.a.tx),
    v:mean(x=>x.a.hasV?x.a.v:null), pr:mean(x=>x.k.pr), aov:mean(x=>x.k.aov),
    upt:mean(x=>x.k.upt), aup:mean(x=>x.k.aup), per, n:ids.length };
}
// 平日／土日祝の「1日あたり」KPI（cls: 'wd'=平日 / 'we'=土日祝 / null=全日）
function rptDayKpi(id,f,t,cls){
  let rws=rowsIn(f,t,id); if(cls)rws=rws.filter(r=>dayClass(r.d)===cls);
  const a=sumRows(rws), k=rptKpi(a);
  const op=distDates(rws,r=>(r.in||0)>0||(r.tx||0)>0), vd=distDates(rws,r=>r.v!=null);
  return { exDay:op?rptEx(a)/op:null, vDay:(a.hasV&&vd)?a.v/vd:null, pr:k.pr, aov:k.aov, op };
}
function rptDayAvg(ids,f,t,cls){
  const arr=ids.map(id=>rptDayKpi(id,f,t,cls));
  const mean=pick=>{const vs=arr.map(pick).filter(v=>v!=null&&isFinite(v));return vs.length?vs.reduce((x,y)=>x+y,0)/vs.length:null;};
  return { exDay:mean(x=>x.exDay), vDay:mean(x=>x.vDay), pr:mean(x=>x.pr), aov:mean(x=>x.aov) };
}

        (topSalesNm?"売上トップ店（"+topSalesNm+"）の曜日別の型を移植":"曜日別の売上構成を毎月モニタリング") ]}); }
    const AX=[0.6,6.9], AY=[1.6,4.35];

      sl.addText(a.b.map(t=>({text:t,options:{bullet:{code:"2022"},color:ICE,fontSize:11.5,paraSpaceAfter:5}})),{x:x+0.3,y:y+0.9,w:5.4,h:1.5}); });
    sl.addText(peerNote+(isCur?" 当月は途中段階の実績。":""),{x:0.6,y:7.02,w:12.13,h:0.3,fontSize:9.5,color:MUT});

    const safe=nm.replace(/[\\/:*?"<>|\s]+/g,"_");

  }catch(e){ alert("店舗レポート出力に失敗しました：\n"+((e&&e.message)||e)); }

//  直営/FCタブ 新レイアウト（スマホ最優先）
//   ①店舗選択スライサー ②KPIまとめ(締日/今週/今月) ③期間 ④店舗別KPI

const KPI2_COLS=["ex","v","pr","aov","qty","upt","aup"];   // ②④で縦に並べる指標
function kpiLabel(k){ const n=M(k).name; return n==="販売数"?"商品販売数":n; }
function mdLabel(f,t){ const g=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`; return f===t?g(f):`${g(f)}〜${g(t)}`; }
function mdShort(s){ return s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:"—"; }
function genShort(g){ if(!g)return"—"; const s=g.replace("T"," "); return `${+s.slice(5,7)}/${+s.slice(8,10)} ${s.slice(11,16)}`; }

function draw(){ if(VIEW==="ads"){ drawPeriod(); drawAds(); return; } drawSlicer(); drawPeriod(); refresh(); }
// 選択・期間の変更でスライサー本体以外を描き直す（チェックのたびにリストを作り直さない）
function refresh(){ if(state.detail){drawDetailExtras(); drawDayKpi();} drawKpi2(); drawStoreKpi(); drawTrend2();
  if(state.detail){ drawHeatX(); }                       // 店舗ページ＝1表（販売数/税抜売上を切替）
  else{ const D=heatData();                              // ⑥⑦で同じ集計・同じ列順を使う
    const cats=heatCatsOf(D);                            // 売上降順・共通
    drawHeat("heatQ","q",D,cats); drawHeat("heatA","a",D,cats); }
  updateSelCount(); }
// 比率表の列（カテゴリ）：税抜売上の降順・上位10（販売数表示でも列順は共通）
function heatCatsOf(D){ return Object.keys(D.catTot).sort((a,b)=>D.catTot[b].a-D.catTot[a].a).slice(0,10); }
// 店舗ページの比率表：選択中の指標（販売数/税抜売上）で自店とブランド全体の2表を描き、切替チップを点灯。

// ① 店舗選択（ドロップダウン内のチェックボックス）

function updateSelCount(){
