// 着地見込み（当月）＝当月実績(税抜) ÷ 締日までの経過日数 × 当月の暦日数
function landingMonth(){
  const sd=DATA._salesMax||DATA._max, ym=sd.slice(0,7);
  const ex=M("ex").calc(sumRows(rowsIn(ym+"-01",sd,"__sel__")));
  if(ex==null)return null;
  const dom=+sd.slice(8,10); if(!dom)return null;
  const [y,m]=ym.split("-").map(Number), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  return ex/dom*dim;
}

// 日本の祝日（土日祝の判定用）。直近2週の平日/土日祝を分けるのに使う。年度が進んだら追記。
const JP_HOLIDAYS=new Set([
  "2025-08-11","2025-09-15","2025-09-23","2025-10-13","2025-11-03","2025-11-23","2025-11-24",
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
  "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
  "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
]);
function isWeekendOrHoliday(d){const wd=new Date(d+"T00:00:00Z").getUTCDay();return wd===0||wd===6||JP_HOLIDAYS.has(d);}
function dayClass(d){return isWeekendOrHoliday(d)?"we":"wd";}      // 土日祝 / 平日
function distDates(rows,pred){const s=new Set();for(const r of rows)if(pred(r))s.add(r.d);return s.size;}
const VOL_METRICS=new Set(["ex","v","qty"]);   // 数量系＝平均列では「1日あたり」に割る

// ② KPIまとめ（前日／今週／今月／平日平均／土日祝平均 × 指標）
function drawKpi2(){
  const el=document.getElementById("kpi2"); if(!el)return;
  const sd=DATA._salesMax||DATA._max, ym=sd.slice(0,7), mon=mondayOf(sd), w2=addDays(sd,-13);
  const cols=[
    {label:"前日",   sub:mdLabel(sd,sd),        from:sd,       to:sd},
    {label:"今週",   sub:mdLabel(mon,sd),       from:mon,      to:sd},
    {label:"今月",   sub:mdLabel(ym+"-01",sd),  from:ym+"-01", to:sd},
    {label:"平日平均",  sub:"直近2週(1日あたり)", from:w2, to:sd, day:"wd"},
    {label:"土日祝平均",sub:"直近2週(1日あたり)", from:w2, to:sd, day:"we"},
  ];
  // 列×指標のセル値。平均列は数量系を「その区分の日数」で割って1日あたりにする（比率系はそのまま）。
  const cellVal=(c,k)=>{
    let rws=rowsIn(c.from,c.to,"__sel__");
    if(c.day) rws=rws.filter(r=>dayClass(r.d)===c.day);
    let v=M(k).calc(sumRows(rws));
    if(c.day && v!=null && VOL_METRICS.has(k)){
      const div=(k==="v") ? distDates(rws,r=>r.v!=null)
                          : distDates(rws,r=>(r.in||0)>0||(r.tx||0)>0);
      v = div>0 ? v/div : null;
    }
    return v;
  };
  const lv=landingMonth();
  // 店舗ページは「自店（選択期間）／同ブランド上位3店平均／差分／平日平均／土日祝平均」の専用レイアウト
  if(state.detail){ drawKpi2Detail(el,{sd,ym,w2,cellVal,lv}); return; }
  let h=`<thead><tr><th></th>${cols.map(c=>`<th class="colhdr">${c.label}<small>${c.sub}</small></th>`).join("")}</tr></thead><tbody>`;
  // 着地見込みは当月のみ算出。他列は概念上「対象外」（0ではない）。
  h+=`<tr class="land"><td>着地見込み <span class="sub" style="font-weight:500;font-size:9.5px">当月のみ</span></td>`+
     cols.map((c,i)=>`<td>${i===2?YEN(lv||0)+"円":"対象外"}</td>`).join("")+`</tr>`;
  for(const k of KPI2_COLS){const m=M(k);
    h+=`<tr><td>${kpiLabel(k)}</td>`+cols.map(c=>{const v=cellVal(c,k);return `<td>${m.fmt(v==null?0:v)}</td>`;}).join("")+`</tr>`;}
  el.innerHTML=h+`</tbody>`;
}
// ブランドの短い表記（KPIまとめの列名が長くならないように）：直営／SFG／SF／NT
function brandShort(id){ if(ownOf(id)==="直営")return "直営";
  const b=rptBrand3(id); return b==="SELFURUGI GARAGE"?"SFG":b==="SELFURUGI"?"SF":b==="NOTIME"?"NT":"FC"; }
// 店舗ページのKPIまとめ：スライサー（選択期間）を自店・他店比較の両方に適用した1つの表
function drawKpi2Detail(el,ctx){
  const {sd,ym,w2,cellVal,lv}=ctx, id=state.detail;
  const selCol={from:state.from,to:state.to};
  const wdCol={from:w2,to:sd,day:"wd"}, weCol={from:w2,to:sd,day:"we"};
  const own=ownOf(id), b3=rptBrand3(id), short=brandShort(id);
  const notShimo=x=>((x.name||"").indexOf("下北沢")<0);
  // 比較対象：FC店→同ブランドのFC店のみ（直営店は除く）／直営店→直営店どうし。いずれも下北沢除外
  // 加盟店モードは他店データを持たないため、事前計算した上位3店平均(bench)を使う（数式は同じ＝一致）。
  const baked=window.FRANCHISEE&&window.FR_BENCH&&(window.FR_BENCH[id]||{})[state.kind];
  const members=baked?[]:usableStores().filter(x=>notShimo(x)&&(own==="直営"?ownOf(x.id)==="直営":(rptBrand3(x.id)===b3&&ownOf(x.id)!=="直営"))).map(x=>x.id);
  const top3=baked?[]:topStoresBy(members,state.from,state.to,3);
  const avOf=k=>baked?baked.top3[k]:peerAvg(k,state.from,state.to,top3);
  const rl=document.getElementById("kpi-range"); if(rl)rl.textContent="期間 "+mdLabel(state.from,state.to);
  let h=`<thead><tr><th></th>
    <th class="colhdr">自店<small>${mdLabel(state.from,state.to)}</small></th>
    <th class="colhdr">${esc(short)}上位3店<small>平均・同期間</small></th>
    <th class="colhdr">差分<small>自店−上位3</small></th>
    <th class="colhdr">平日平均<small>直近2週·日平均</small></th>
    <th class="colhdr">土日祝平均<small>直近2週·日平均</small></th></tr></thead><tbody>`;
  // 着地見込み：今月を選んでいるときだけ自店列に出す
  const showLand=isMonthPeriod()&&state.from.slice(0,7)===ym;
  h+=`<tr class="land"><td>着地見込み <span class="sub" style="font-weight:500;font-size:9.5px">当月のみ</span></td>`+
     `<td>${showLand?YEN(lv||0)+"円":"対象外"}</td><td>—</td><td>—</td><td>対象外</td><td>対象外</td></tr>`;
  for(const k of KPI2_COLS){const m=M(k);
    const cur=cellVal(selCol,k), av=avOf(k);
    const diff=(cur!=null&&av!=null)?cur-av:null;
    const wd=cellVal(wdCol,k), we=cellVal(weCol,k);
    h+=`<tr><td>${kpiLabel(k)}</td>
      <td>${m.fmt(cur==null?0:cur)}</td>
      <td class="peer">${m.fmt(av==null?0:av)}</td>
      <td style="${diffColor(cur,av)}">${diff==null?"—":(diff>=0?"+":"−")+m.fmt(Math.abs(diff))}</td>
      <td>${m.fmt(wd==null?0:wd)}</td>
      <td>${m.fmt(we==null?0:we)}</td></tr>`;}
  el.innerHTML=h+`</tbody>`;
}
// ---- AIのまとめ（ページ最下部のカード）----
// 直近2週間の「同ブランド比較KPI・販売比率・週次推移」を Edge Function "ask"（Claude）に渡し、
// 店舗運営に大事なポイントだけを3〜4行で自動生成する。週1回（毎週月曜に更新）だけAPIを呼び、
// 結果は localStorage にキャッシュして表示のたびの呼び出しはしない。
async function aiWeeklyInsight(){
  const out=document.getElementById("ai-out"); if(!out)return;
  const id=state.detail; if(id==null)return;
  if(!SB){ out.textContent="AIのまとめはログイン版でのみ表示されます。"; return; }
  const wk=mondayOf(todayStr()), key="aiWeekly:"+id+":"+wk;
  try{ const c=localStorage.getItem(key); if(c){ out.innerHTML=c; return; } }catch(_){}
  try{
    const sd=DATA._salesMax||DATA._max, f=addDays(sd,-13), t=sd;
    const s=storeMeta(id), nm=(s&&s.name)||("店舗"+id);
    const own=ownOf(id), b3=rptBrand3(id);
    const notShimo=x=>((x.name||"").indexOf("下北沢")<0);
    const members=usableStores().filter(x=>notShimo(x)&&(own==="直営"?ownOf(x.id)==="直営":(rptBrand3(x.id)===b3&&ownOf(x.id)!=="直営"))).map(x=>x.id);
    const top3=topStoresBy(members,f,t,3);
    const p=sumRows(rowsIn(f,t,id));
    const cmp=KPI2_COLS.map(k=>({kpi:kpiLabel(k),self:M(k).calc(p),top3avg:peerAvg(k,f,t,top3)}));
    // 販売比率（ランク×カテゴリ・販売数シェア%）：自店とブランド全体
    // 構成比は上位12マスだけ渡す（送信量を抑えて応答を速くするため）
    const shareOf=D=>{const a=[];
      for(const g in D.cells)for(const c in D.cells[g]){const q=D.cells[g][c].q||0; if(q>0&&D.gQ)a.push([`ランク${g}×${c}`,Math.round(q/D.gQ*1000)/10]);}
      const o={}; a.sort((x,y)=>y[1]-x[1]).slice(0,12).forEach(([k,v])=>o[k]=v); return o;};
    const selfD=heatData(undefined,f,t);
    const brandIds=new Set(usableStores().filter(x=>brandOf(x.id)===brandOf(id)).map(x=>x.id));
    const brandD=heatData(brandIds,f,t);
    // 週次推移（直近6週の税抜売上・来店）
    const weekly=[]; const mon0=mondayOf(sd);
    for(let i=5;i>=0;i--){ const wf=addDays(mon0,-7*i), wt=addDays(wf,6);
      const a=sumRows(rowsIn(wf,wt,id));
      weekly.push({week:mdLabel(wf,wt), ex:M("ex").calc(a), v:a.hasV?a.v:null}); }
    const digest={
      today:todayStr(), closing:sd,
      stores:top3.map(x=>(storeMeta(x)||{}).name||x),
      note:`店舗「${nm}」の直近2週間（${f}〜${t}）の分析。cmp=自店KPIと同ブランド上位3店（${own==="直営"?"直営":b3}${own==="直営"?"":"・直営除く"}・下北沢除く）平均の比較。selfShare/brandShare=販売数の構成比%（ランク帯×カテゴリ）。weekly=直近6週の週次推移。`,
      legend:"cmp:[{kpi,self,top3avg}] / selfShare,brandShare:{ランク×カテゴリ:シェア%} / weekly:[{week,ex=税抜売上,v=来店}]",
      series:{cmp,selfShare:shareOf(selfD),brandShare:shareOf(brandD),weekly},
    };
    const q="このデータから、この店舗の運営にとって特に大事なポイントだけを日本語で3〜4行にまとめてください。同ブランド上位店との差・売れ筋構成の違い・直近の週次トレンドのうち、行動につながる重要なものだけ。見出し・箇条書き・Markdown記法は使わず、プレーンな文章のみ。数字は重要なものだけ添えてください。";
    const answer=await callAsk(q,digest);
    const html=esc(answer).replace(/\n+/g,"<br>");
    try{ localStorage.setItem(key,html); }catch(_){}
    out.innerHTML=html;
  }catch(e){
    // AIに繋がらないときは、同じデータから自動集計でまとめを出す（中身が空にならないように）。
    // AI版ではないことが分かるよう明記し、原因も併記する。
    const why=await askDiagnose((e&&e.message)||String(e));
    const auto=autoInsight();
    out.innerHTML=(auto?esc(auto).replace(/\n+/g,"<br>"):`<span class="sub">まとめを作成できませんでした。</span>`)+
      `<div class="sub" style="margin-top:8px;font-size:11px">※ 自動集計版（AI未接続：${esc(why)}）`+
      `<button class="chip" id="ai-retry" style="margin-left:6px;padding:3px 8px">再試行</button></div>`;
    const rb=document.getElementById("ai-retry");
    if(rb)rb.onclick=()=>{ out.textContent="⏳ 分析中…"; try{localStorage.removeItem(key);}catch(_){} aiWeeklyInsight(); };
  }
}
// AI接続の失敗原因を切り分ける。
// プリフライト（事前確認）の起きない「単純リクエスト」で関数を叩いてみる：
//   ・応答が読める → 関数は設置済み。通常の呼び出しが弾かれるのは CORS/JWT 設定側の問題
//   ・応答が読めない → 関数がこのプロジェクトに無い（または入口で遮断されている）
async function askDiagnose(baseMsg){
  if(!SUPA.url)return baseMsg;
  try{
    const r=await fetch(SUPA.url+"/functions/v1/ask",{method:"POST",headers:{"content-type":"text/plain"},body:"{}"});
    const txt=(await r.text()).slice(0,120);
    if(r.status===401||/ログイン|認証/.test(txt))return "関数は動いていますが、ブラウザの事前確認(CORS)で弾かれています（サーバ側の設定変更が必要）";
    return baseMsg+`（関数の応答 HTTP ${r.status}）`;
  }catch(_){
    return "Edge Function『ask』に接続できません（このSupabaseプロジェクトへの設置が必要です）";
  }
}
// AIが使えないときの自動まとめ（同じデータをルールで要約する。数字は実データから計算）
function autoInsight(){
  const id=state.detail; if(id==null)return "";
  const sd=DATA._salesMax||DATA._max, f=addDays(sd,-13), t=sd;
  const own=ownOf(id), b3=rptBrand3(id);
  const notShimo=x=>((x.name||"").indexOf("下北沢")<0);
  const members=usableStores().filter(x=>notShimo(x)&&(own==="直営"?ownOf(x.id)==="直営":(rptBrand3(x.id)===b3&&ownOf(x.id)!=="直営"))).map(x=>x.id);
  const top3=topStoresBy(members,f,t,3);
  const p=sumRows(rowsIn(f,t,id));
  const out=[];
  // ① 上位3店平均との差が大きいKPI（弱み・強みを1つずつ）
  const gaps=KPI2_COLS.map(k=>{const cur=M(k).calc(p),av=peerAvg(k,f,t,top3);
    return (cur==null||av==null||!av)?null:{k,cur,av,rel:(cur-av)/Math.abs(av)*100};}).filter(Boolean);
  const weak=gaps.slice().sort((a,b)=>a.rel-b.rel)[0], strong=gaps.slice().sort((a,b)=>b.rel-a.rel)[0];
  const cmpName=(own==="直営"?"直営":b3)+"上位3店";
  if(weak&&weak.rel<-3)out.push(`${cmpName}の平均と比べて${kpiLabel(weak.k)}が${Math.abs(Math.round(weak.rel))}%低く（自店${M(weak.k).fmt(weak.cur)}／平均${M(weak.k).fmt(weak.av)}）、ここが直近2週間で最も差がついている項目です。`);
  if(strong&&strong.rel>3)out.push(`一方で${kpiLabel(strong.k)}は平均を${Math.round(strong.rel)}%上回っており（自店${M(strong.k).fmt(strong.cur)}）、この強みは維持したい点です。`);
  // ② 週次トレンド（直近3週の売上の向き）
  const mon0=mondayOf(sd), wk=[];
  for(let i=2;i>=0;i--){const wf=addDays(mon0,-7*i);wk.push(M("ex").calc(sumRows(rowsIn(wf,addDays(wf,6),id)))||0);}
  if(wk[0]>0){ const ch=(wk[2]-wk[0])/wk[0]*100;
    out.push(Math.abs(ch)<5?`売上は直近3週間ほぼ横ばいで推移しています。`
      :`売上は直近3週間で${ch>0?"増加":"減少"}傾向にあります（${ch>0?"+":""}${Math.round(ch)}%）。`); }
  // ③ ブランド全体と比べて構成比の差が大きいマス
  const selfD=heatData(undefined,f,t);
  const bIds=new Set(usableStores().filter(x=>rptBrand3(x.id)===b3).map(x=>x.id));
  const brD=heatData(bIds,f,t);
  if(selfD.gQ&&brD.gQ){
    let best=null;
    for(const g in brD.cells)for(const c in brD.cells[g]){
      const bs=(brD.cells[g][c].q||0)/brD.gQ*100;
      const ss=((selfD.cells[g]&&selfD.cells[g][c]&&selfD.cells[g][c].q)||0)/selfD.gQ*100;
      if(bs>=5&&(!best||bs-ss>best.d))best={g,c,d:bs-ss,bs,ss};
    }
    if(best&&best.d>=3)out.push(`販売構成では「ランク${best.g}×${best.c}」がブランド全体${F1(best.bs)}%に対し自店${F1(best.ss)}%と低く、品揃えの見直し余地があります。`);
  }
  return out.slice(0,4).join("");
}
// Edge Function "ask"（分析AI）を呼ぶ。まず直接 fetch し、だめなら supabase-js 経由で再試行する。
// 直接 fetch にすることで、失敗時に HTTP ステータスと本文が読めて原因が分かる。
async function callAsk(question,digest){
  const body=JSON.stringify({question,digest,history:[]});
  let firstErr=null;
  if(SUPA.url){
    try{
      const {data:{session}}=await SB.auth.getSession();
      const tok=(session&&session.access_token)||SUPA.anon;
      const ac=new AbortController(); const timer=setTimeout(()=>ac.abort(),120000);
      let r;
      try{
        r=await fetch(SUPA.url+"/functions/v1/ask",{method:"POST",signal:ac.signal,
          headers:{"content-type":"application/json","authorization":"Bearer "+tok,"apikey":SUPA.anon},body});
      } finally { clearTimeout(timer); }
      const txt=await r.text();
      let j=null; try{ j=JSON.parse(txt); }catch(_){}
      if(!r.ok)throw new Error(`HTTP ${r.status}${(j&&j.error)?"："+j.error:(txt?"："+txt.slice(0,120):"")}`);
      if(j&&j.error)throw new Error(j.error);
      if(j&&j.answer)return j.answer;
      throw new Error("AIから空の応答");
    }catch(e){ firstErr=e; }
  }
  // 予備：supabase-js の invoke（直接fetchが通らない環境向け）
  try{
    const {data,error}=await SB.functions.invoke("ask",{body:{question,digest,history:[]}});
    if(error)throw error;
    if(data&&data.error)throw new Error(data.error);
    if(data&&data.answer)return data.answer;
    throw new Error("AIから空の応答");
  }catch(e2){
    throw new Error(((firstErr&&firstErr.message)||"")||((e2&&e2.message)||String(e2)));
  }
}

// 比較対象（同ブランド平均）の店舗ID：直営店→直営全店 / FC店→同ブランド（直営含む）。いずれも来店計測(デジテール)導入店のみ。
function peerIds(detailId){
  const vs=DATA._visitStores||new Set(), own=ownOf(detailId), br=brandOf(detailId);
  return usableStores().filter(s=>{
    if(!vs.has(s.id))return false;
    return own==="直営" ? ownOf(s.id)==="直営" : brandOf(s.id)===br;
  }).map(s=>s.id);
}
// 各店KPIの単純平均（値が取れる店だけで平均）
function peerAvg(k,from,to,ids){
  const vs=ids.map(id=>M(k).calc(sumRows(rowsIn(from,to,id)))).filter(v=>v!=null);
  return vs.length? vs.reduce((s,v)=>s+v,0)/vs.length : null;
}
// 平均比の差分色：上回り=緑・下回り=赤。差(絶対%)が大きいほど濃い（±50%で最濃）。
function diffColor(cur,avg){
  if(cur==null||avg==null||!avg)return "";
  const pct=(cur-avg)/Math.abs(avg), up=pct>=0, r=Math.min(1,Math.abs(pct)/0.5);
  return `color:hsl(${up?142:0} ${up?55:70}% ${Math.round(52-r*24)}%);font-weight:800`;
}

// ============================================================
//  売上予算（当月）— 経営の事業計画から自動で拾う
//  原本は targets.json（月次予実の「予算」。経営タブ・予実タブが読んでいるのと同じもの）。
//  予実タブ(pl.html)でその月の税抜売上予算を手直しして保存していれば、そちらを優先する。
//  カードを出すのは直営店だけ（FCには出さない）。
// ============================================================
let TARGETS=null;               // targets.json（未読込は null、読めなければ {}）
let BUDGET={ym:null,ex:null};   // いま表示している店・月の税抜売上予算
function budgetShown(id){ return id!=null && !window.FRANCHISEE && ownOf(id)==="直営"; }
async function loadTargets(){
  if(TARGETS!==null)return;
  try{ TARGETS=await (await fetch("targets.json",{cache:"no-store"})).json(); }
  catch(e){ TARGETS={}; }
}
// 事業計画から、その店・その月の税抜売上予算を引く。
// 店名に含まれるトークンで照合する（「NOTIME山形店」→「山形」）。予実タブと同じ引き方。
function planEx(id,ym){
  const T=(TARGETS&&TARGETS.targets)||{}, nm=(storeMeta(id)||{}).name||"";
  for(const tok in T){
    const t=T[tok]&&T[tok][ym];
    if(nm.indexOf(tok)>=0&&t&&Number.isFinite(t.ex))return t.ex;
  }
  return null;
}
// 経営の事業計画（bizplan_monthly の「売上」）から、その店・その月の税抜売上計画を引く。
// 計画側は POS実績（data.json の daily.ex＝税抜純売上）を取り込む前提なので税抜どうし。
// 照合は計画台帳の pos_store_name（例「下北沢店」）が店名に含まれるかで見る。
async function bizplanEx(id,ym){
  if(!SB)return null;
  try{
    const {data,error}=await SB.rpc("bizplan_store_sales",{p_ym:ym});
    if(error)return null;
    const nm=(storeMeta(id)||{}).name||"";
    for(const r of (data||[])){
      const key=((r&&r.pos_store_name)||"").trim(), v=Number(r&&r.amount);
      if(key&&nm.indexOf(key)>=0&&Number.isFinite(v))return v;
    }
  }catch(e){}
  return null;
}
async function loadBudget(id,ym){
  BUDGET={ym:ym,ex:null};
  if(!budgetShown(id))return;
  let ex=await bizplanEx(id,ym);        // ① 経営の事業計画（正）
  if(ex==null&&SB){                     // ② 予実タブで保存した税抜売上予算
    try{
      const {data}=await SB.from("plan_data").select("data")
        .eq("page","pl").eq("scope",String(id)).eq("ym",ym).maybeSingle();
      const v=data&&data.data&&data.data.b_ex;
      if(Number.isFinite(v))ex=v;
    }catch(e){}
  }
  if(ex==null){ await loadTargets(); ex=planEx(id,ym); }   // ③ 月次予実の予算
  BUDGET={ym:ym,ex:ex};
}
// 予算カードの中身（金額＋達成見込み＝着地÷予算）を描く。
function drawBudgetCard(ym,landing){
  const el=document.getElementById("dtop-bud"); if(!el)return;

// この店は「無人営業＋有人営業」の2レジ運用か（＝内訳と有人来店入力を出す店か）。
function posMixed(id){ return id!=null && (DATA._posMix||new Set()).has(id); }
// 有人来店の入力もれ：売上がある日なのに有人来店が未入力なら true（入力を促す印に使う）。
function staffedMissingDay(r){ return posMixed(r.s) && (r.tx||0)>0 && r.vm==null; }
// 直近14日の入力もれ日数。0なら印もバッジも出さない。
function staffedMissingCount(id){
  if(!posMixed(id))return 0;
  const last=DATA._salesMax||DATA._max, from=addDays(last,-13);
  let n=0;
  for(const r of DATA.daily){
    if(r.s!==id||r.d<from||r.d>last)continue;
    if(staffedMissingDay(r))n++;
  }
  return n;
}
// 「👥 有人来店を入力」ボタンに未入力件数のバッジを出す（0件なら消す）。
function drawStaffedBadge(){
  const el=document.getElementById("stf-badge"); if(!el)return;
  const n=staffedMissingCount(state.detail);
  el.className=n?"bdg":"";
  el.textContent=n?`未入力${n}日`:"";
}
// 税抜売上の内訳合計（u=無人営業時間／m=有人営業時間）。対象外の店は null。
function sumSplit(from,to,id){
  if(!posMixed(id))return null;
  let u=0,m=0,has=false;
  for(const r of DATA.daily){
    if(r.s!==id||r.d<from||r.d>to)continue;
    if(r.exU==null&&r.exM==null)continue;
    u+=r.exU||0; m+=r.exM||0; has=true;
  }
  return has?{u:u,m:m}:null;
}
// カード下段に「無人 ○○円／有人 ○○円」を出す。sp が null のときは行ごと隠す。
function fillSplit(elId,sp,scale){
  const el=document.getElementById(elId); if(!el)return;
  if(!sp){el.style.display="none"; el.innerHTML=""; return;}
  const k=(scale==null?1:scale);
  el.style.display="block";
  el.innerHTML=`<div>無人 <b>${YEN(Math.round(sp.u*k))}</b>円</div><div>有人 <b>${YEN(Math.round(sp.m*k))}</b>円</div>`;
}

// ============================================================
//  有人時間の来店数（手入力）
//  無人時間の来店は自動取得できるが、有人時間ぶんは計測できない。ここで日別に
//  入力してもらい、無人＋有人の合算をこの店の来店数として画面全体に反映する。
//  保存先は visits(source='staffed')。書き込みは RPC 経由（sql/021）。
// ============================================================
let STAFFED={};          // {"YYYY-MM-DD": 人数} 表示中の店のぶん
let STAFFED_SID=null;    // STAFFED がどの店のものか
// 保存済みの有人来店を読み直して、DATA.daily に反映する（data.json より新しい入力も拾う）。
async function loadStaffedVisits(sid){
  if(!SB||!posMixed(sid))return false;
  const to=todayStr(), from=DATA._min||to;
  const {data,error}=await SB.rpc("staffed_visits_list",{p_store_id:sid,p_from:from,p_to:to});
  if(error){ console.warn("有人来店の読み込みに失敗:",error.message); return false; }
  STAFFED={}; STAFFED_SID=sid;
  (data||[]).forEach(r=>{ if(r.visitors!=null)STAFFED[r.d]=+r.visitors; });
  applyStaffed(sid);
  return true;
}
// STAFFED（保存済みの有人来店）を DATA.daily に載せ直して、来店数を合算し直す。
function applyStaffed(sid){
  if(STAFFED_SID!==sid)return;
  const have=new Set();
  for(const r of DATA.daily){
    if(r.s!==sid)continue;
    have.add(r.d);
    const m=STAFFED[r.d];
    r.vm=(m==null?null:m);
  }
  // 売上行が無い日に有人来店だけ入力された場合は、その日の行を足す（来店だけの日）。
  for(const d in STAFFED){
    if(have.has(d))continue;
    DATA.daily.push({d:d,s:sid,in:0,ex:0,tx:0,it:0,v:null,v0:null,vm:STAFFED[d]});
  }
  mergeStaffedVisits();
  recomputeVisitIndex();
}

// 1日ぶんを保存して、画面全体（カード・日別推移・推移・KPI）を作り直す。
async function saveStaffedDay(inp){
  const d=inp.dataset.d, raw=(inp.value||"").trim();

// 日別推移（縦=日付・最新が上／横=KPI）。直近7日ぶんの高さに収め、下スクロールで過去を表示。
// 列は客単価まで（販売数・平均購入数・商品単価は出さない）＝スマホ幅で横スクロールなしで収める。
const WK=["日","月","火","水","木","金","土"];
const DAY_COLS=["ex","v","pr","aov"];
function drawDayKpi(){
  const el=document.getElementById("daykpi"); if(!el)return;
  const id=state.detail; if(id==null)return;
  const sd=DATA._salesMax||DATA._max, byDate=new Map();
  for(const r of DATA.daily){ if(r.s!==id)continue; if(r.d>sd)continue; let a=byDate.get(r.d); if(!a){a=[];byDate.set(r.d,a);} a.push(r); }
  const dates=[...byDate.keys()].sort().reverse();
  // 最上部に固定する「直近2週間の平日平均／休祝日平均」（1日あたり。数量系は日数で割る）
  const w2=addDays(sd,-13);
  const avgVal=(day,k)=>{
    const rws=rowsIn(w2,sd,id).filter(r=>dayClass(r.d)===day);
    let v=M(k).calc(sumRows(rws));
    if(v!=null&&VOL_METRICS.has(k)){
      const div=(k==="v")?distDates(rws,r=>r.v!=null):distDates(rws,r=>(r.in||0)>0||(r.tx||0)>0);
      v=div>0?v/div:null;
    }
    return v;
  };
  const avgRow=(label,day,cls)=>`<tr class="avgrow${cls||""}"><th>${label}<small style="display:block;font-weight:500;color:var(--ink2);font-size:9px">直近2週·日平均</small></th>`+
    DAY_COLS.map(k=>{const v=avgVal(day,k);return `<th>${M(k).fmt(v==null?0:v)}</th>`;}).join("")+`</tr>`;
  let h=`<thead><tr><th>日付</th>${DAY_COLS.map(k=>`<th>${M(k).name}</th>`).join("")}</tr>`+
        avgRow("平日平均","wd")+avgRow("休祝日平均","we"," we")+`</thead><tbody>`;
  if(!dates.length){ el.innerHTML=h+`<tr><td colspan="${DAY_COLS.length+1}" class="sub">データがありません</td></tr></tbody>`; return; }
  for(const d of dates){ const p=sumRows(byDate.get(d)); const we=isWeekendOrHoliday(d);

// ---- 日別推移のお天気アイコン（Open-Meteo・無料/キー不要。直近約3ヶ月ぶん）----
// 店舗名から地名を拾って緯度経度を決める。既知の店は対応表、無ければ地名検索で解決。
const PLACE_COORDS=[
  ["伊予松前",33.787,132.711],["下北沢",35.661,139.667],["山形",38.255,140.340],
  ["いわき",37.050,140.888],["福井",36.064,136.220],["倉敷",34.585,133.772],
  ["大須",35.159,136.899],["天王台",35.870,140.048],["鎌ヶ谷",35.777,140.001],
  ["早稲田",35.709,139.719],["町田",35.546,139.446],["静岡",34.976,138.383],
  ["宇都宮",36.555,139.883],["徳島",34.052,134.548],["隠岐",36.209,133.321],
  ["今治",34.066,133.005],["赤羽",35.778,139.721],
];
// アイコン判定：天気コード（WMO code）をそのまま使うと、日本では「実際は降っていないのに
// 小雨(51〜)扱い」の空振りが非常に多い。そこで実測値ベースで判定する：
//   雨・雪 … 実際の降水量（1mm以上＝気象庁の「降水日」の基準）
//   晴/曇 … 日照時間 ÷ 昼の長さ（日照率）。60%以上=晴れ／25%以上=晴れ時々曇り／それ未満=曇り
// 天気コードは雪・雷・霧の種類判定にだけ使う。
function wxIcon(o){ if(!o)return"";
  const c=o.c, p=o.p, sr=(o.sun!=null&&o.day>0)?o.sun/o.day:null;
  const snowy=(c!=null&&(((c>=71&&c<=77))||c===85||c===86));
  if(p!=null&&p>=1){                       // 降水あり
    if(snowy)return"❄️";
    if(c!=null&&c>=95)return"⛈️";
    return p>=10?"🌧️":"🌦️";
  }
  if(p==null&&c!=null){                    // 降水量が取れないときだけコードで判定
    if(snowy)return"❄️"; if(c>=95)return"⛈️"; if(c>=51)return"🌧️";
  }
  if(c===45||c===48)return"🌫️";
  if(sr!=null)return sr>=0.6?"☀️":sr>=0.25?"🌤️":"☁️";
  if(c===0)return"☀️"; if(c===1||c===2)return"🌤️";
  return"☁️";
}
async function wxCoords(name){
  for(const[k,la,lo] of PLACE_COORDS){ if((name||"").indexOf(k)>=0)return[la,lo]; }
  const q=(name||"").replace(/SELFURUGI|NOTIME|GARAGE/gi," ").replace(/店$/,"").trim();
  if(!q)return null;
  try{ const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=ja&name="+encodeURIComponent(q));
    const j=await r.json(); const g=j&&j.results&&j.results[0];
    if(g&&g.country_code==="JP")return[g.latitude,g.longitude]; }catch(_){}
  return null;
}
const WX={};   // 店舗id → {日付: {c:コード, p:降水量mm, sun:日照秒, day:昼の長さ秒, hi:最高, lo:最低}}
async function loadWeather(id){
  if(WX[id])return WX[id];
  const s=storeMeta(id); if(!s)return null;
  const c=await wxCoords(s.name||""); if(!c)return null;
  const qs="latitude="+c[0]+"&longitude="+c[1]+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,sunshine_duration,daylight_duration"+
    "&past_days=92&forecast_days=1&timezone=Asia%2FTokyo";
  // 日本では気象庁(JMA)モデルが最も実況に近いので優先。取れないときだけ標準モデルへ切替
  let j=null;
  try{ j=await(await fetch("https://api.open-meteo.com/v1/forecast?"+qs+"&models=jma_seamless")).json(); }catch(_){}
  if(!j||!j.daily||!j.daily.time){ try{ j=await(await fetch("https://api.open-meteo.com/v1/forecast?"+qs)).json(); }catch(_){ return null; } }
  if(!j||!j.daily||!j.daily.time)return null;
  const m={}, D=j.daily;
  D.time.forEach((d,i)=>m[d]={c:(D.weather_code||[])[i], p:(D.precipitation_sum||[])[i],
    sun:(D.sunshine_duration||[])[i], day:(D.daylight_duration||[])[i],
    hi:(D.temperature_2m_max||[])[i], lo:(D.temperature_2m_min||[])[i]});
  WX[id]=m; return m;
}
async function applyWeather(id){
  const m=await loadWeather(id); if(!m)return;
  document.querySelectorAll("#daykpi .wx").forEach(el=>{
    const o=m[el.dataset.d]; if(!o){el.textContent="";return;}
    const t=(o.hi!=null&&o.lo!=null)?`<span class="wxt">${Math.round(o.hi)}/${Math.round(o.lo)}°</span>`:"";
    el.innerHTML=wxIcon(o)+t;
  });
}
// 選択期間・下北沢除外での税抜売上トップN店（比較ベンチマーク用）
function topStoresBy(ids,from,to,n){

    .filter(x=>x.ex>0).sort((a,b)=>b.ex-a.ex).slice(0,n).map(x=>x.id);
}

// ⑤ 売上推移（縦=選択店舗／横=期間。月/週/日、◀▶で移動。既定=月×直近6）
function trendLatestAnchor(g){const sd=DATA._salesMax||DATA._max;return g==="month"?sd.slice(0,7):g==="week"?mondayOf(sd):sd;}
function trendShift(dir){const g=state.grain;
  if(g==="month"){let[y,m]=state.trendEnd.split("-").map(Number);m+=dir;while(m<=0){m+=12;y--;}while(m>12){m-=12;y++;}state.trendEnd=`${y}-${String(m).padStart(2,"0")}`;}
  else if(g==="week")state.trendEnd=addDays(state.trendEnd,7*dir);
  else state.trendEnd=addDays(state.trendEnd,dir);
  const latest=trendLatestAnchor(g); if(state.trendEnd>latest)state.trendEnd=latest;
}
function trendKeys(){const g=state.grain,n=10,end=state.trendEnd||trendLatestAnchor(g),keys=[];
  if(g==="month"){let[y,m]=end.split("-").map(Number);for(let i=n-1;i>=0;i--){let yy=y,mm=m-i;while(mm<=0){mm+=12;yy--;}keys.push(`${yy}-${String(mm).padStart(2,"0")}`);}}
  else if(g==="week"){for(let i=n-1;i>=0;i--)keys.push(addDays(end,-7*i));}
  else{for(let i=n-1;i>=0;i--)keys.push(addDays(end,-i));}
  return keys;
}
function drawTrend2(){

  const exOf=r=>(r.ex!=null?r.ex:(r.in||0)/1.1);
  const first=periodSpan(keys[0],g)[0], last=periodSpan(keys[keys.length-1],g)[1], map={};
  for(const r of DATA.daily){ if(!state.sel.has(r.s))continue; if(r.d<first||r.d>last)continue;

    return YEN(cur||0)+d; };

  for(const r of rows)h+=`<tr><td>${esc(r.name)}</td>${dk.map(k=>{const i=idx[k];return `<td>${cellHtml(r.vals[i], i>0?r.vals[i-1]:null)}</td>`;}).join("")}</tr>`;

// 仕入数（在庫管理アプリ）：pos_store_links で請求先を引き、shipments の納品点数を日付ごとに合計。
// 公開モード（未ログイン）や連携未設定の店は "none"＝表示なし。
let SHIP={};   // 店舗id → {日付: 点数} ／ "none"

async function loadPurchases(id){
  if(SHIP[id]!==undefined)return SHIP[id];
  if(!SB){SHIP[id]="none";return "none";}
  try{
    // ① 対応表（設定ページのPOS連携）で請求先を引く。kind=none/closed は連携しない指定
    let dest=null;
    const {data:l}=await SB.from("pos_store_links").select("destination_id,kind").eq("pos_store_id",id).maybeSingle();
    if(l&&l.destination_id&&l.kind!=="none"&&l.kind!=="closed")dest=l.destination_id;
    // ② 対応表に無い店は、店名の地名で在庫アプリの請求先を検索（1件に絞れたときだけ採用）
    if(!dest&&!(l&&(l.kind==="none"||l.kind==="closed"))){
      const s=storeMeta(id), q=((s&&s.name)||"").replace(/SELFURUGI|NOTIME|GARAGE/gi,"").replace(/店$/,"").trim();
      if(q){const {data:ds}=await SB.from("destinations").select("id,name").ilike("name","%"+q+"%").limit(5);
        if(ds&&ds.length===1)dest=ds[0].id;}
    }
    if(!dest){SHIP[id]="none";return "none";}
    const m={}; let from=0;
    for(;;){
      const {data:rows,error}=await SB.from("shipments")
        .select("shipment_date,delivery_date,total_quantity").eq("destination_id",dest)
        .order("id").range(from,from+999);
      if(error||!rows){ if(from===0){SHIP[id]="none";return "none";} break; }
      for(const r of rows){const d=r.delivery_date||r.shipment_date; if(!d)continue; m[d]=(m[d]||0)+(r.total_quantity||0);}
      if(rows.length<1000)break; from+=1000;
    }
    SHIP[id]=m; return m;
  }catch(_){ SHIP[id]="none"; return "none"; }
}

    return {key:m.key,label:m.label,color:m.color,fmt:m.fmt,axf:m.axf,vals};
  });
  drawMultiChart(box,keys.map(k=>pShort(k,g)),series,keys.map(k=>k===fkey));
  const rl=document.getElementById("trend-range"), lastKey=keys[keys.length-1];
  if(rl)rl.textContent=`${pRange(keys[0],g)}〜${pRange(lastKey,g)}${lastKey===fkey?"(見込)":""}`;
  document.querySelectorAll(".gchip[data-grain]").forEach(b=>b.classList.toggle("on",b.dataset.grain===g));
  syncTmetChips();
  const note=document.getElementById("trend-note");
  if(note)note.textContent=needBuy?(SHIP[id]==="none"?"仕入数：この店舗は在庫管理アプリと連携されていません（設定ページのPOS連携で紐付けできます）。":(!ship?"仕入数を取得中…":"")):"";
}
// 多系列の折れ線。系列ごとに縦のスケールを合わせる（左の目盛りは1つめの系列）
function drawMultiChart(box,labels,series,isFc){
  box.innerHTML="";
  const n=labels.length;
  const act=series.filter(s=>s.vals.some(v=>v!=null));
  if(!n||!act.length){box.innerHTML='<div class="sub" style="padding:8px 0">データなし</div>';return;}
  const single=act.length===1;
  const FS=9;   // 横軸ラベルの文字サイズ
  // 全ラベルを1行に並べて入るか判定。入らないときは上下2段の互い違いにして「全部表示」する。
  const estW=s=>[...String(s)].reduce((w,ch)=>w+(/[0-9/.]/.test(ch)?FS*0.55:FS*1.02),0);
  const labW=Math.max(...labels.map(estW));
  const W=Math.max(box.clientWidth||680,320),PADL=48,PADR=single?14:48;
  const stagger=n>1 && (labW+5)*n > (W-PADL-PADR);
  const PADB=stagger?36:26, H=stagger?210:200, PADT=14;
  const xs=i=>PADL+(W-PADL-PADR)*(n<=1?0.5:i/(n-1));
  const sc=series.map(s=>{
    const nums=s.vals.filter(v=>v!=null);
    if(!nums.length)return null;
    let lo=Math.min(0,...nums),hi=Math.max(...nums);
    if(hi===lo)hi=lo+1; hi+=(hi-lo)*0.06;
    return {lo,hi,ys:v=>PADT+(H-PADT-PADB)*(1-(v-lo)/(hi-lo))};
  });
  const a0=sc.findIndex(x=>x), ax=sc[a0], axm=series[a0];
  const gy=[];for(let i=0;i<=3;i++){const val=ax.lo+(ax.hi-ax.lo)*i/3;gy.push({y:ax.ys(val),val});}
  // 右の縦軸＝2つめに選んだ系列の目盛り（3系列めはツールチップで確認）
  let a1=-1; for(let i=0;i<sc.length;i++){ if(i!==a0&&sc[i]){a1=i;break;} }
  const gy2=(a1>=0)?[0,1,2,3].map(i=>{const val=sc[a1].lo+(sc[a1].hi-sc[a1].lo)*i/3;return {y:sc[a1].ys(val),val};}):[];
  const lines=series.map((s,si)=>{
    const S=sc[si]; if(!S)return"";
    const pts=s.vals.map((v,i)=>v==null?null:[xs(i),S.ys(v)]);
    const path=pts.map((p,i)=>p?`${i&&pts[i-1]?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`:"").join(" ");
    let area="";
    if(single){const fi=pts.findIndex(p=>p);let li=-1;for(let i=pts.length-1;i>=0;i--)if(pts[i]){li=i;break;}
      if(fi>=0){const base=S.ys(Math.max(0,S.lo));
        area=`<path d="M${pts[fi][0].toFixed(1)} ${base.toFixed(1)} `+pts.map(p=>p?`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`:"").join(" ")+` L${pts[li][0].toFixed(1)} ${base.toFixed(1)} Z" fill="${s.color}" opacity="0.09"/>`;}}
    const dots=pts.map((p,i)=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${(isFc[i]&&s.key==="ex")?"var(--surface)":s.color}" stroke="${s.color}" stroke-width="2"${(isFc[i]&&s.key==="ex")?' stroke-dasharray="2 1.6"':""}/>`:"").join("");
    return area+`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`+dots;
  });
  // 端のラベルがSVGからはみ出さないよう、中央寄せの基準位置を内側に寄せる
  const lx=i=>Math.min(Math.max(xs(i),estW(labels[i])/2+1),W-estW(labels[i])/2-1);
  const lyOf=i=>H-PADB+(stagger?(i%2?26:13):16);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="推移グラフ">
    ${gy.map(gg=>`<line x1="${PADL}" y1="${gg.y.toFixed(1)}" x2="${W-PADR}" y2="${gg.y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${PADL-7}" y="${(gg.y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="${single?"var(--muted)":axm.color}">${(axm.axf||shortNum)(gg.val)}</text>`).join("")}
    ${gy2.map(gg=>`<text x="${(W-PADR+7).toFixed(1)}" y="${(gg.y+3).toFixed(1)}" text-anchor="start" font-size="9.5" fill="${series[a1].color}">${(series[a1].axf||shortNum)(gg.val)}</text>`).join("")}
    ${lines.join("")}
    ${labels.map((lb,i)=>`<text x="${lx(i).toFixed(1)}" y="${lyOf(i)}" text-anchor="middle" font-size="${FS}" fill="var(--muted)">${lb}</text>`).join("")}
    <rect id="tc-hit" x="${PADL}" y="${PADT}" width="${(W-PADL-PADR).toFixed(1)}" height="${(H-PADT-PADB).toFixed(1)}" fill="transparent"/>
    <line id="tc-cross" x1="0" y1="${PADT}" x2="0" y2="${H-PADB}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
  </svg><div class="tip"></div>`;
  const tip=box.querySelector(".tip"),cross=box.querySelector("#tc-cross"),hit=box.querySelector("#tc-hit"),svgEl=box.querySelector("svg");
  const hide=()=>{tip.style.opacity=0;cross.setAttribute("opacity","0");};
  function move(ev){const r=svgEl.getBoundingClientRect();const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    let i=Math.round((px-PADL)/((W-PADL-PADR)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
    const rows=series.map((s,si)=>({s,v:s.vals[i],S:sc[si]})).filter(x=>x.v!=null);
    if(!rows.length){hide();return;}
    const cx=xs(i);cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",".45");
    tip.style.opacity=1;tip.style.left=(cx/W*r.width)+"px";tip.style.top=(rows[0].S.ys(rows[0].v)/H*r.height)+"px";
    tip.innerHTML=`<b>${labels[i]}</b><br>`+rows.map(x=>`<span style="color:${x.s.color}">■</span>${x.s.label}: ${x.s.fmt(x.v)}`).join("<br>");}
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",hide);
  // タッチは横方向のなぞりだけ反応。縦スクロールでは何もしない（カクつき防止）。
  let sx=0,sy=0,lock=null;
  hit.addEventListener("touchstart",ev=>{sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;lock=null;},{passive:true});
  hit.addEventListener("touchmove",ev=>{if(lock==="v")return;
    const dx=ev.touches[0].clientX-sx,dy=ev.touches[0].clientY-sy;
    if(lock===null&&(Math.abs(dx)>6||Math.abs(dy)>6))lock=Math.abs(dy)>Math.abs(dx)?"v":"h";
    if(lock==="v"){hide();return;}move(ev);},{passive:true});
  hit.addEventListener("touchend",hide);
}

// ⑥⑦ 価格帯(ランク)×カテゴリ ヒートマップ
const GRADE_ORDER=["S","A","B","C","D","E","F"];
// 比率表の集計期間：店舗ページは専用（hFrom/hTo・KPIまとめとは独立）、一覧ページは共通スライサー
function heatRange(){ return state.detail?[state.hFrom,state.hTo]:[state.from,state.to]; }
// idSet を渡すとその店舗集合で集計（ブランド全体の比率表用）。省略時は①の選択店舗。
// f0/t0 を渡すと期間を上書き（AIのまとめ用）。省略時は heatRange()。
function heatData(idSet,f0,t0){
  const hr=heatRange(), hf=f0||hr[0], ht=t0||hr[1];
  const cells={},catTot={},gradeTot={}; let gQ=0,gA=0;
  for(const r of (DATA.catp||[])){ if(idSet?!idSet.has(r.s):!storeMatch(r.s,"__sel__"))continue; if(r.d<hf||r.d>ht)continue; if(isDropCat(r.c))continue;
    const gr=gradeOf(r.c,r.p); if(!gr)continue; const cat=tCanon(r.c);   // ⑤⑥はTシャツを4分類(Tシャツ/プリントT/バンドT/アニメT)に分けて表示・表記ゆれも正規化
    (cells[gr]||(cells[gr]={})); (cells[gr][cat]||(cells[gr][cat]={q:0,a:0}));
    cells[gr][cat].q+=r.q||0; cells[gr][cat].a+=r.a||0;
    (catTot[cat]||(catTot[cat]={q:0,a:0})); catTot[cat].q+=r.q||0; catTot[cat].a+=r.a||0;
    (gradeTot[gr]||(gradeTot[gr]={q:0,a:0})); gradeTot[gr].q+=r.q||0; gradeTot[gr].a+=r.a||0;
    gQ+=r.q||0; gA+=r.a||0;
  }
  return {cells,catTot,gradeTot,gQ,gA};
}
function drawHeat(elId,metric,D,cats,opts){   // metric: 'q'=販売数 / 'a'=税抜売上。D/catsは自店・全店で共通
  opts=opts||{};                              // opts.pctOnly=比率のみ（実額を出さない）/ opts.noDrill=タップの内訳なし
  const el=document.getElementById(elId); if(!el)return;
  const rng=document.getElementById(elId+"-rng"); if(rng)rng.textContent="期間 "+mdLabel(...heatRange());
  if(!hasGrades()){ el.innerHTML='<tbody><tr><td class="sub" style="padding:8px">ランク帯データがありません。</td></tr></tbody>'; return; }
  const grand=metric==="q"?D.gQ:D.gA;
  if(!grand){ el.innerHTML='<tbody><tr><td class="sub" style="padding:8px">対象期間・店舗に、ランク対象（SS/AW）の販売がありません。</td></tr></tbody>'; return; }
  const val=o=>o?(metric==="q"?o.q:o.a):0;
  const cnt=o=>metric==="q"?NUM(val(o))+"着":YEN(val(o))+"円";
  // 定義済みのランク帯(S〜D)は実績0でも常に行表示する（空セルは0%）。販売のあった帯だけに間引かない。
  const defined=new Set((DATA.gradeBands||[]).map(b=>b.grade));
  const grades=GRADE_ORDER.filter(g=>defined.has(g));
  // 空欄は作らず 0%（0着/0円）を薄く表示。比率のみモードでは実額の行を出さない。
  const cell=o=>{const v=val(o);const pct=`<span class="pct">${F1(v/grand*100)}%</span>`;
    return opts.pctOnly?pct:pct+`<br><span class="sub" style="font-size:9.5px">${cnt(o)}</span>`;};
  const zc=o=>val(o)?"":" zc";   // 0のセルは薄く
  const flat=[]; for(const g of grades)for(const c of cats){const o=D.cells[g]&&D.cells[g][c]; if(val(o)>0)flat.push({g,c,v:val(o)});}
  const top5=new Set(flat.sort((a,b)=>b.v-a.v).slice(0,5).map(x=>x.g+"|"+x.c));
  const ce=c=>encodeURIComponent(c);
  const cb=opts.noDrill?"":" cbtn";           // 内訳なしのときはタップ見た目（青字・下線）も付けない
  const ttl=(t)=>opts.pctOnly?"":` title="${t}"`;
  let h=`<colgroup><col class="c-rank"><col class="c-tot">${cats.map(_=>'<col class="c-cat">').join("")}</colgroup>`;
  h+=`<thead><tr><th>ランク＼カテゴリ</th><th>合計</th>${cats.map(c=>`<th class="${cb.trim()}" data-cat="${ce(c)}">${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
  h+=`<tr class="prow"><td>合計</td><td>100%${opts.pctOnly?"":`<br><span class="sub" style="font-size:9.5px">${metric==="q"?NUM(grand)+"着":YEN(grand)+"円"}</span>`}</td>`+
     cats.map(c=>`<td class="${cb.trim()}" data-cat="${ce(c)}"${ttl(esc(c)+": "+cnt(D.catTot[c]))}>${cell(D.catTot[c])}</td>`).join("")+`</tr>`;
  for(const g of grades){
    h+=`<tr><td class="gtot${cb}" data-grade="${g}">ランク${g}</td><td class="gtot">${cell(D.gradeTot[g])}</td>`+
      cats.map(c=>{const o=D.cells[g]&&D.cells[g][c]; const green=top5.has(g+"|"+c)?" g5":"";
        return `<td class="${cb.trim()}${green}${zc(o)}" data-grade="${g}" data-cat="${ce(c)}"${ttl("ランク"+g+"×"+esc(c)+": "+cnt(o))}>${cell(o)}</td>`;}).join("")+`</tr>`;
  }
  el.innerHTML=h+`</tbody>`;
  if(opts.noDrill)return;
  el.querySelectorAll("th.cbtn[data-cat]").forEach(t=>t.onclick=()=>drillCategory(decodeURIComponent(t.dataset.cat),metric));
  el.querySelectorAll("td.cbtn").forEach(td=>td.onclick=()=>{
    const g=td.dataset.grade, c=td.dataset.cat?decodeURIComponent(td.dataset.cat):null;
    if(g&&c)drillCell(g,c,metric); else if(g)drillGrade(g,metric); else if(c)drillCategory(c,metric);});
}

function drillCategory(cat,metric){

function drillGrade(g,metric){

function drillCell(g,cat,metric){

// 着地見込み（自動・税込）：対象月の残日数×平日/土日祝の平均で月末を予測（店舗比較用）。
//  過去の月は残日数0＝実績と一致。当月は予測になる。月次予実の見込みと同じ算出方法。
function fIsWeekend(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6;}
function fMonthEnd(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return `${ym}-${String(last).padStart(2,"0")}`;}
function computeAutoLandingIn(store,ym){
  return computeAutoLandingForIds(new Set(usableStores().filter(s=>storeMatch(s.id,store)).map(s=>s.id)),ym);
}
function computeAutoLandingForIds(ids,ym){
  const mS=ym+"-01",mE=fMonthEnd(ym),today=todayStr(),winStart=addDays(mS,-56);
  const byDate={};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue; if(r.d<winStart||r.d>mE)continue;
    (byDate[r.d]=byDate[r.d]||{in:0}).in+=(r.ex!=null?r.ex:(r.in||0)/1.1); }  // 税抜（無い店は税込÷1.1近似）
  const monthDates=Object.keys(byDate).filter(d=>d>=mS&&d<=mE).sort();
  const closing=monthDates.filter(d=>d<=today).slice(-1)[0]||null;
  let tdIn=0,wkIn=0,wkN=0,weIn=0,weN=0;
  if(closing) for(const d of monthDates){ if(d>closing)continue; const v=byDate[d].in;
    tdIn+=v; if(fIsWeekend(d)){weIn+=v;weN++;}else{wkIn+=v;wkN++;} }
  let twkIn=0,twkN=0,tweIn=0,tweN=0; const trFrom=addDays(closing||today,-56),trTo=closing||addDays(today,-1);
  for(const d of Object.keys(byDate)){ if(d<trFrom||d>trTo)continue; const v=byDate[d].in;
    if(fIsWeekend(d)){tweIn+=v;tweN++;}else{twkIn+=v;twkN++;} }
  const wkAvg=wkN?wkIn/wkN:(twkN?twkIn/twkN:0), weAvg=weN?weIn/weN:(tweN?tweIn/tweN:0);
  let remWk=0,remWe=0; const start=closing?addDays(closing,1):mS;
  for(let d=start; d<=mE; d=addDays(d,1)){ if(fIsWeekend(d))remWe++; else remWk++; }
  return tdIn + remWk*wkAvg + remWe*weAvg;
}
function drawCompare(rows,showLand){
  const cols=KPI_CARDS.map(M);
  const landHead=showLand?`<th>着地見込み<br><span class="sub" style="font-weight:500">税抜</span></th>`:"";
  const head=`<thead><tr><th>店舗</th>${landHead}${cols.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead>`;
  const body=rows.map(p=>{
    const st=p._agg?' style="font-weight:750"':(p._sel?' style="font-weight:700;background:var(--surface2)"':'');
    const land=showLand?`<td>${p._land!=null?YEN(p._land)+"円":"—"}</td>`:"";
    return `<tr${st}><td>${esc(p._name)}</td>${land}${cols.map(c=>{const v=c.calc(p);return `<td>${v==null?"—":c.fmt(v)}</td>`;}).join("")}</tr>`;
  }).join("");
  document.getElementById("cmp").innerHTML=head+"<tbody>"+body+"</tbody>";
}
function drawCatTable(cats){
  const hasP=!!(DATA.catp&&DATA.catp.length);
  const head=`<thead><tr><th>カテゴリ</th><th>売上</th><th>販売数</th><th>点あたり</th></tr></thead>`;
  const body=cats.map(c=>{
    const main=`<tr class="catrow${hasP?" clk":""}" data-cat="${esc(c.c)}">`+
      `<td>${hasP?'<span class="caret">▸</span>':''}${esc(c.c)}</td>`+
      `<td>${YEN(c.a)}円</td><td>${NUM(c.q)}点</td><td>${c.q>0?YEN(c.a/c.q)+"円":"—"}</td></tr>`;
    const detail=`<tr class="catdetail" style="display:none"><td colspan="4"></td></tr>`;
    return main+detail;
  }).join("");
  const ta=cats.reduce((s,c)=>s+c.a,0),tq=cats.reduce((s,c)=>s+c.q,0);
  const t=document.getElementById("cat-t");
  t.innerHTML=head+"<tbody>"+body+"</tbody>"+
    `<tfoot><tr><td>合計</td><td>${YEN(ta)}円</td><td>${NUM(tq)}点</td><td>${tq>0?YEN(ta/tq)+"円":"—"}</td></tr></tfoot>`;
  if(!hasP)return;
  t.querySelectorAll("tr.catrow.clk").forEach(tr=>tr.onclick=()=>{
    const det=tr.nextElementSibling, caret=tr.querySelector(".caret");
    if(!det)return;
    if(det.style.display!=="none"){det.style.display="none";if(caret)caret.textContent="▸";return;}
    const rows=catPriceIn(state.from,state.to,state.store,tr.dataset.cat)||[];
    const cell=det.firstElementChild;
    if(!rows.length){cell.innerHTML=`<div class="sub" style="padding:8px 26px">価格帯データはありません（次回の集計更新後に表示されます）。</div>`;}
    else{const tot=rows.reduce((s,r)=>s+r.a,0);
      cell.innerHTML=`<table class="subtbl"><thead><tr><th>価格帯</th><th>売上</th><th>販売数</th><th>構成比</th></tr></thead><tbody>`+
        rows.map(r=>`<tr><td>${YEN(r.p)}円</td><td>${YEN(r.a)}円</td><td>${NUM(r.q)}点</td><td>${tot>0?F1(r.a/tot*100)+"%":"—"}</td></tr>`).join("")+
        `</tbody></table>`;}
    det.style.display="";if(caret)caret.textContent="▾";
  });
}
function drawTable(ps){
  const cols=KPI_ORDER.map(M);
  const head=`<thead><tr><th>期間</th>${cols.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead>`;
  const body=ps.slice().reverse().map(p=>`<tr data-k="${p.key}" style="cursor:pointer"><td>${p.label}</td>${cols.map(c=>{const v=c.calc(p);return `<td>${v==null?"—":c.fmt(v)}</td>`;}).join("")}</tr>`).join("");
  const t=document.getElementById("tbl");t.innerHTML=head+"<tbody>"+body+"</tbody>";
  t.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{
    const[f,to]=periodSpan(tr.dataset.k,state.grain);
    state.from=clampLo(f);state.to=clampHi(to);render();
    window.scrollTo({top:0,behavior:"smooth"});});
}

function drawTrend(ps){
  const box=document.getElementById("trend");box.innerHTML="";
  const m=M(state.metric),vals=ps.map(p=>({label:p.label,v:m.calc(p)}));
  if(!vals.length){box.innerHTML='<div class="sub" style="padding:8px 0">データなし</div>';return;}
  const W=Math.max(box.clientWidth||680,320),H=250,PADL=58,PADR=14,PADT=14,PADB=40;
  const xs=i=>PADL+(W-PADL-PADR)*(vals.length<=1?0.5:i/(vals.length-1));
  const nums=vals.map(d=>d.v).filter(v=>v!=null);const maxV=Math.max(1,...nums),minV=Math.min(0,...nums);
  const ys=v=>PADT+(H-PADT-PADB)*(1-(v-minV)/((maxV-minV)||1));
  const gy=[];for(let i=0;i<=4;i++){const val=minV+(maxV-minV)*i/4;gy.push({y:ys(val),val});}
  const pts=vals.map((d,i)=>d.v==null?null:[xs(i),ys(d.v)]);
  const path=pts.map((p,i)=>p?`${i&&pts[i-1]?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`:"").join(" ");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.name}の推移">
    ${gy.map(g=>`<line x1="${PADL}" y1="${g.y.toFixed(1)}" x2="${W-PADR}" y2="${g.y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${PADL-8}" y="${g.y+3}" text-anchor="end" font-size="10" fill="var(--muted)">${shortNum(g.val)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`:"").join("")}
    ${vals.map((d,i)=>(vals.length<=14||i%Math.ceil(vals.length/12)===0||i===vals.length-1)?`<text x="${xs(i).toFixed(1)}" y="${H-PADB+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.label}</text>`:"").join("")}
    <rect id="hit" x="${PADL}" y="${PADT}" width="${W-PADL-PADR}" height="${H-PADT-PADB}" fill="transparent"/>
    <line id="cross" x1="0" y1="${PADT}" x2="0" y2="${H-PADB}" stroke="var(--accent)" stroke-width="1" opacity="0"/>
  </svg><div class="tip" id="ttip"></div>`;
  const tip=box.querySelector("#ttip"),cross=box.querySelector("#cross"),hit=box.querySelector("#hit"),svgEl=box.querySelector("svg");
  function move(ev){const r=svgEl.getBoundingClientRect();const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    let i=Math.round((px-PADL)/((W-PADL-PADR)/Math.max(1,vals.length-1)));i=Math.max(0,Math.min(vals.length-1,i));
    const d=vals[i];if(d.v==null){tip.style.opacity=0;cross.setAttribute("opacity","0");return;}
    const cx=xs(i);cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",".5");
    tip.style.opacity=1;tip.style.left=(cx/W*r.width)+"px";tip.style.top=(ys(d.v)/H*r.height)+"px";
    tip.innerHTML=`<b>${d.label}</b><br>${m.name}: ${m.fmt(d.v)}`;}
  const hide=()=>{tip.style.opacity=0;cross.setAttribute("opacity","0");};
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",hide);
  // タッチは横方向のなぞりだけ反応。縦スクロールでは何もしない（カクつき防止）。
  let sx=0,sy=0,lock=null;
  hit.addEventListener("touchstart",ev=>{sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;lock=null;},{passive:true});
  hit.addEventListener("touchmove",ev=>{
    if(lock==="v")return;
    const dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
    if(lock===null&&(Math.abs(dx)>6||Math.abs(dy)>6))lock=Math.abs(dy)>Math.abs(dx)?"v":"h";
    if(lock==="v"){hide();return;}
    move(ev);
  },{passive:true});
  hit.addEventListener("touchend",hide);
}
function shortNum(v){if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1)+"億";if(Math.abs(v)>=1e4)return(v/1e4).toFixed(v>=1e5?0:1)+"万";return Math.round(v).toLocaleString("ja-JP");}
function drawBars(id,rows,getV,fmt){
  const box=document.getElementById(id);box.innerHTML="";rows=rows.slice(0,10);
  if(!rows.length){box.innerHTML='<div class="sub" style="padding:8px 0">データなし</div>';return;}
  const max=Math.max(1,...rows.map(getV)),rowH=30,W=Math.max(box.clientWidth||420,300),PADR=12,LBL=96,H=rows.length*rowH+8,bx=LBL+8,bw=W-bx-PADR;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rows.map((r,i)=>{const y=i*rowH+4,w=Math.max(2,bw*getV(r)/max);
    return `<g><text x="${LBL}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--ink2)">${esc(r.c).slice(0,7)}</text>
      <rect x="${bx}" y="${y+5}" width="${bw}" height="${rowH-14}" rx="4" fill="var(--surface2)"/>
      <rect x="${bx}" y="${y+5}" width="${w.toFixed(1)}" height="${rowH-14}" rx="4" fill="var(--accent)"/>
      <text x="${bx+w+6}" y="${y+rowH/2}" dominant-baseline="middle" font-size="10.5" fill="var(--muted)">${fmt(r)}</text></g>`;}).join("")}</svg>`;
}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function toggleTheme(){const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");draw();}
// 横幅が変わったときだけ描き直す（スマホのアドレスバー伸縮＝高さ変化では描き直さない）
let _lastW=window.innerWidth,_rt=null;
window.addEventListener("resize",()=>{
  if(!DATA)return;
  if(window.innerWidth===_lastW)return;   // 高さだけの変化は無視（カクつき防止）
  _lastW=window.innerWidth;
  clearTimeout(_rt);_rt=setTimeout(draw,150);
});
boot();
</script>
