<title>売上KPI管理</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04); --radius:14px;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1116; --surface:#161b22; --surface2:#1c232c; --border:#2a323c;
    --ink:#e7ebef; --ink2:#a3adb8; --muted:#727d89;
    --accent:#5b9bff; --accent-weak:#1e2f4a; --good:#3fce8c; --bad:#ff6b5e; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --border:#e2e6ea;
    --ink:#1a1d21; --ink2:#5b636c; --muted:#8a929b;
    --accent:#2f6fd0; --accent-weak:#dbe6f7; --good:#1a8a5a; --bad:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 88px;}
  header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .rangebar{font-size:13px;color:var(--ink2);margin:8px 0 2px;font-weight:600;}
  .rangebar b{color:var(--ink);} .rangebar .store{color:var(--accent);}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 4px;}
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--ink2);font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  select,input[type="date"]{appearance:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  select{padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  input[type="date"]{padding:7px 10px;}
  label.lbl{font-size:12px;color:var(--muted);}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  .chip:hover{color:var(--ink);border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 4px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);}
  .card .k{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:6px;}
  .card .val{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.1;}
  .card .knote{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:5px;line-height:1.3;}
  .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;gap:3px;align-items:center;}
  .delta.up{color:var(--good);} .delta.down{color:var(--bad);} .delta.flat{color:var(--muted);}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;margin:14px 0;}
  .panel h2{font-size:14px;margin:0 0 2px;font-weight:700;}
  .panel .note{font-size:11.5px;color:var(--muted);margin:0 0 8px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:760px){.row2{grid-template-columns:1fr;}}
  .chart{position:relative;width:100%;}
  svg{display:block;width:100%;height:auto;overflow:visible;}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:11.5px;line-height:1.4;
    padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .08s;z-index:5;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tblwrap{overflow-x:auto;}
  th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);}
  th{color:var(--ink2);font-weight:700;font-size:11.5px;position:sticky;top:0;background:var(--surface);}
  tbody tr:hover td{background:var(--surface2);}
  tfoot td{font-weight:750;border-top:2px solid var(--border);background:var(--surface2);}
  tr.catrow.clk{cursor:pointer;}
  .caret{display:inline-block;width:1.1em;color:var(--muted);font-size:11px;}
  .catdetail>td{padding:0 !important;background:var(--surface2);}
  .subtbl{width:100%;border-collapse:collapse;margin:0;}
  .subtbl th,.subtbl td{padding:6px 10px;font-size:12px;border-bottom:1px solid var(--border);text-align:right;background:var(--surface2);}
  .subtbl th:first-child,.subtbl td:first-child{text-align:left;padding-left:26px;color:var(--ink2);}
  .subtbl th{color:var(--muted);font-weight:600;}
  .subtbl tr:last-child td{border-bottom:0;}
  .foot{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .themebtn{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .navlink{border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .navlink:hover{border-color:var(--accent);}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);}
  .tabbar a.on .ic{filter:none;}
  .gbadge{display:inline-block;font-size:12px;font-weight:800;vertical-align:middle;
    padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;letter-spacing:.03em;}
  .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;letter-spacing:.02em;}
  .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;
    cursor:pointer;box-shadow:var(--shadow);margin-top:20px;}
  .gbtn:hover{border-color:var(--accent);}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;
    background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
</style>

<script>
"use strict";
const YEN=n=>Math.round(n).toLocaleString("ja-JP");
const NUM=n=>Math.round(n).toLocaleString("ja-JP");
const F1 =n=>(Math.round(n*10)/10).toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1});
const F2 =n=>(Math.round(n*100)/100).toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2});

// 売上はすべて「税抜」で語る（税込売上は画面に出さない）。税抜の実額が無い店（デジテールの
// 日次合計のみ）は税込÷1.1で近似して常に税抜で表示する。
const METRICS=[
  {key:"ex", name:"税抜売上",   fmt:v=>YEN(v)+"円", calc:p=>p.hasEx?p.ex:(p.in!=null?p.in/1.1:null)},
  {key:"v",  name:"来店客数",   fmt:v=>NUM(v)+"人", calc:p=>p.hasV?p.v:null, note:"デジテール導入店のみ"},
  {key:"tx", name:"取引数",     fmt:v=>NUM(v)+"件", calc:p=>p.tx},
  {key:"qty",name:"販売数",     fmt:v=>NUM(v)+"点", calc:p=>p.hasIt?p.it:null},
  {key:"pr", name:"購入率",     fmt:v=>F1(v)+"%",   calc:p=>(p.hasV&&p.v>0)?(p.txv!=null?p.txv:p.tx)/p.v*100:null, note:"デジテール導入店のみ（来店÷取引）"},
  {key:"aov",name:"客単価",     fmt:v=>YEN(v)+"円", calc:p=>p.tx>0?(p.hasEx?p.ex:(p.in||0)/1.1)/p.tx:null},
  {key:"upt",name:"平均購入数", fmt:v=>F2(v)+"点",  calc:p=>(p.hasIt&&p.txIt>0)?p.it/p.txIt:null},
  {key:"aup",name:"商品単価",   fmt:v=>YEN(v)+"円", calc:p=>(p.hasEx&&p.it>0)?p.ex/p.it:null},
];
const M=k=>METRICS.find(m=>m.key===k);
const KPI_ORDER=["ex","v","tx","qty","pr","aov","upt","aup"];
// 比較ラベル：対象期間の長さに合わせて 前日比／前週比／前月比 を出し分ける。
// 比較先は「直前の同じ長さの期間」（実際の日付はマウスオーバーで表示）。
function deltaLabel(n){ if(n<=1)return"前日比"; if(n<=7)return"前週比"; if(n<=31)return"前月比"; return "前"+n+"日比"; }
// 表示グループ（直営／FC）。URLの ?g=own / ?g=fc で切り替える。
//   直営ページ … 直営店だけ。FCページ … FC店だけ。既定（無指定）は直営。
let GROUP=(new URLSearchParams(location.search).get("g")||"").toLowerCase();
if(GROUP!=="own"&&GROUP!=="fc")GROUP="own";
const GROUP_LABEL=(GROUP==="fc")?"FC店":"直営店";

const state={store:GROUP,grain:"week",metric:"ex",from:null,to:null};
let DATA=null;

// ---- 配信設定 ----
//  画面は Supabase 公開バケットの config.json を見て、公開/認証モードを自動判別する。
//  （config.json は export_dashboard.py が書き出す。anon は公開してよい鍵）
//  ・公開モード : config.json の dataUrl（公開data.json）を読む
//  ・認証モード : Googleログイン → 許可リスト(app_users)に居れば非公開data.jsonを読む
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null};   // Supabase クライアント／ログイン中ユーザー

// 「プリントTシャツ」「バンド/ミュージックTシャツ」「アニメ/ムービーTシャツ」は直営店だけの細分。
// ★これらを「Tシャツ」に統合するのは “レポートの中だけ”。ダッシュボード画面は原本のまま。
//   → 統合・除外は rptCatAgg / rptBandAgg / rptCatShareMonth（レポート集計）だけで適用する。
// Tシャツ細分の判定（表記ゆれに強いキーワード判定）。プリント／バンド・ミュージック／アニメ・ムービー。
function tshirtTheme(c){ c=(c||""); if(c.indexOf("シャツ")<0)return null;
  if(c.indexOf("プリント")>=0)return "プリントT";
  if(c.indexOf("バンド")>=0||c.indexOf("ミュージック")>=0)return "バンド/ミュージックT";
  if(c.indexOf("アニメ")>=0||c.indexOf("ムービー")>=0||c.indexOf("映画")>=0)return "アニメ/ムービーT";
  return null; }
// レポートのカテゴリ/価格帯ランキングから除外（セール＝バンドル割引の擬似カテゴリ）。画面には影響しない。
function isDropCat(c){ c=(c||""); return c.indexOf("セール")>=0||c==="SALE"; }
function normCat(c){ return tshirtTheme(c)?"Tシャツ":c; }
function prep(){
  if(!DATA||!DATA.daily)throw new Error("データが空です");
  const ds=DATA.daily.map(r=>r.d).sort();
  DATA._min=ds[0]; DATA._max=ds[ds.length-1];
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();
  const vd=DATA.daily.filter(r=>r.v!=null).map(r=>r.d).sort();
  DATA._salesMax=sd.length?sd[sd.length-1]:DATA._max;
  DATA._visitMax=vd.length?vd[vd.length-1]:DATA._max;
  // デジテール（入店計測）が入っている店舗の集合。来店客数・購入率はこの店だけで計算する。
  DATA._visitStores=new Set(DATA.daily.filter(r=>r.v!=null).map(r=>r.s));
  // ※ DATA.cat / DATA.catp は原本のまま（画面のカテゴリ表示はTシャツ細分を分けて出す）。
  //   Tシャツ統合・セール除外はレポート集計側（rptCatAgg等）だけで行う。
  const [tf,tt]=presetRange("thismonth"); state.from=tf; state.to=tt;  // 既定＝今月
  const sv=loadSavedPeriod(); if(sv){state.from=sv[0]; state.to=sv[1];}  // 他タブで選んだ期間があれば引き継ぐ
}

function screen(html){document.getElementById("app").innerHTML=html;}
function showError(e){screen('<div class="err">データを読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}

async function boot(){
  try{
    // ① 非公開スナップショット（Artifact等）：埋め込み済みデータをそのまま表示
    if(window.__DATA__){DATA=window.__DATA__;prep();render();return;}
    // ② 公開設定を読む
    let cfg=null;
    try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    // ③ 認証モード：Googleログインの後に非公開データを読む
    if(cfg&&cfg.mode==="auth"){await authBoot(cfg.url,cfg.anon);return;}
    // ④ 公開モード：data.json を読む
    const url=(cfg&&cfg.dataUrl)||"data.json";
    DATA=await (await fetch(url,{cache:"no-store"})).json();
    prep();render();
  }catch(e){showError(e);}
}

// ---- 認証モード ----
async function ensureSupabase(){
  if(window.supabase)return;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした（通信環境をご確認ください）"));
    document.head.appendChild(s);
  });
}
async function authBoot(url,anon){
  screen('<div class="sub" style="padding:40px 0">読み込み中…</div>');
  await ensureSupabase();
  SB=window.supabase.createClient(url,anon,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,
      flowType:"pkce",storageKey:"notime-auth"},
  });
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return;}
  ME.email=(session.user&&session.user.email||"").toLowerCase();
  // 許可リスト判定：app_users に登録があればログイン可（ロールを取得）
  let role=null;
  try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
  ME.role=role;
  if(!ME.role){showDenied(ME.email);return;}
  screen('<div class="sub" style="padding:40px 0">データを読み込み中…</div>');
  const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
  if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
  DATA=JSON.parse(await data.text());
  prep();render();
}
function showLogin(){
  screen(`<div class="gate">
    <div class="logo">売上KPI管理</div>
    <div class="t">ログイン</div>
    <div class="m">許可されたメンバー専用です。<br>
      管理者に登録された Google アカウントでログインしてください。<br>
      一度ログインすれば、その端末では約1か月は再ログイン不要です。</div>
    <button class="gbtn" id="glogin"><span class="g"></span>Google でログイン</button>
  </div>`);
  document.getElementById("glogin").onclick=doLogin;
}
function showDenied(email){
  screen(`<div class="gate">
    <div class="logo">売上KPI管理</div>
    <div class="t">アクセス権がありません</div>
    <div class="m"><b>${esc(email)}</b> はまだ登録されていません。<br>
      管理者（Shoさん）にユーザー追加を依頼してください。<br>
      別のアカウントでログインし直すこともできます。</div>
    <button class="gbtn" id="grelogin"><span class="g"></span>別のアカウントでログイン</button>
  </div>`);
  document.getElementById("grelogin").onclick=doLogout;
}
async function doLogin(){
  const redirectTo=location.origin+location.pathname;   // ?code等を残さないURLへ戻す
  const {error}=await SB.auth.signInWithOAuth({provider:"google",
    options:{redirectTo,queryParams:{prompt:"select_account"}}});
  if(error)showError(error);
}
async function doLogout(){try{await SB.auth.signOut();}catch(e){}location.reload();}

function mondayOf(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10);}
function pKey(d,g){return g==="day"?d:g==="month"?d.slice(0,7):mondayOf(d);}
function pLabel(k,g){
  if(g==="month"){const[y,m]=k.split("-");return `${y}年${+m}月`;}
  if(g==="day"){const[,m,dd]=k.split("-");return `${+m}/${+dd}`;}
  const mon=new Date(k+"T00:00:00Z"),sun=new Date(mon);sun.setUTCDate(sun.getUTCDate()+6);
  const f=x=>`${x.getUTCMonth()+1}/${x.getUTCDate()}`;return `${f(mon)}〜${f(sun)}`;
}
function addDays(d,n){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000)+1;}
function clampLo(d){return d<DATA._min?DATA._min:d;} function clampHi(d){return d>DATA._max?DATA._max:d;}

function sumRows(rows){
  // in/ex/tx/it=売上系（全店）。
  // txv=購入率の分子（購入客数＝取引数）、v=分母（来店客数）。どちらも
  // 「デジテール（入店計測）が入っていて、かつKPIに来店を使う店」だけを対象にする
  //（＝来店の分母が無い店の取引を分子に混ぜない。POSだけの店は購入率に含めない）。
  const p={in:0,ex:0,tx:0,txv:0,it:0,txIt:0,v:0,bagIn:0,bagEx:0,hasV:false,hasEx:false,hasIt:false};
  const isVS=DATA._visitStores||new Set();
  for(const r of rows){p.in+=r.in||0;p.tx+=r.tx||0;
    if(r.ex!=null){p.ex+=r.ex;p.hasEx=true;}   // 税抜は実額がある行だけ合計（近似店はnull）
    if(r.it!=null){p.it+=r.it;p.hasIt=true;p.txIt+=r.tx||0;}  // 点数と、その分母となる取引数（明細のある店だけ）
    // レジ袋の税込/税抜（客単価・商品単価から差し引く用。bagEx未提供の旧データは税込÷1.1で近似＝レジ袋は10%課税なので厳密）
    p.bagIn+=r.bag||0; p.bagEx+=(r.bagEx!=null?r.bagEx:(r.bag?Math.round(r.bag/1.1):0));
    if(kvOf(r.s)&&isVS.has(r.s)){p.txv+=r.tx||0; if(r.v!=null){p.v+=r.v;p.hasV=true;}}}
  if(!p.hasV)p.v=0; return p;
}
// 店舗スコープ判定：'all'=全店 / 'own'=直営 / 'fc'=FC / 'sf'=SELFURUGI / 'nt'=NOTIME / それ以外=店舗id
// 非表示(visible=false)の店はどの集計にも出さない。
function storeMatch(sid,scope){
  if(!visibleOf(sid))return false;
  if(scope==="all")return true;
  if(scope==="own")return ownOf(sid)==="直営";
  if(scope==="fc") return ownOf(sid)==="FC";
  if(scope==="sf") return brandOf(sid)==="SELFURUGI";
  if(scope==="nt") return brandOf(sid)==="NOTIME";
  return sid===scope;
}
const AGG_SCOPES={all:1,own:1,fc:1,sf:1,nt:1};
const SCOPE_LABEL={all:"全店",own:"直営店",fc:"合計（FC）",sf:"SELFURUGI（FC）",nt:"NOTIME（FC）"};
// 店名の頭文字でブランドを判定（SELFURUGI…／NOTIME…／その他）
function brandOf(sid){const s=storeMeta(sid);const n=(s&&s.name)||"";
  if(n.indexOf("SELFURUGI")===0)return "SELFURUGI"; if(n.indexOf("NOTIME")===0)return "NOTIME"; return "その他";}
// レポートのブランド別ランキング用（GARAGE を SELFURUGI から分離）：NOTIME／SELFURUGI／SELFURUGI GARAGE／その他
function rptBrand3(sid){const s=storeMeta(sid);const n=(s&&s.name)||"";
  if(n.indexOf("GARAGE")>=0)return "SELFURUGI GARAGE";
  if(n.indexOf("SELFURUGI")>=0)return "SELFURUGI";
  if(n.indexOf("NOTIME")>=0)return "NOTIME";
  return "その他";}
function visibleOf(sid){const s=storeMeta(sid);return s?(s.visible!==false):true;}

function aggScopeList(){

  //   直営ページ … 直営店
  //   FCページ   … 合計（FC）／ SELFURUGI（FC）／ NOTIME（FC）（該当店があるものだけ）
  const us=usableStores();
  if(GROUP==="fc"){
    const out=[{id:"fc",name:SCOPE_LABEL.fc}];
    if(us.some(s=>brandOf(s.id)==="SELFURUGI"&&ownOf(s.id)==="FC"))out.push({id:"sf",name:SCOPE_LABEL.sf});
    if(us.some(s=>brandOf(s.id)==="NOTIME"&&ownOf(s.id)==="FC"))out.push({id:"nt",name:SCOPE_LABEL.nt});
    return out;
  }
  return [{id:"own",name:SCOPE_LABEL.own}];
}

// 対象期間が「その月の1日始まり＆同じ月内」なら着地見込みを出す（今月・前月など）。
// 今月は末日がデータ最新日にクランプされる（例 7/31→7/29）ので、末日一致は要求しない。
function isMonthPeriod(){ const ym=state.from.slice(0,7); return state.from===ym+"-01" && state.to.slice(0,7)===ym; }
// KPIカード＆店舗比較で使う指標（取引数・販売数はカードに出さない）
const KPI_CARDS=["ex","v","pr","aov","upt","aup"];
// ---- グレード（ランク帯）判定：カテゴリ→季節、税抜単価→帯（下限しきい値で下の帯に寄せる）----
function gradeOf(category, price){
  const season=(DATA.catSeason||{})[category];
  if(season!=="SS"&&season!=="AW")return null;               // その他・未設定は対象外
  const bands=(DATA.gradeBands||[]).filter(b=>b.season===season).slice().sort((a,b)=>b.lo-a.lo);
  for(const b of bands){ if(price>=b.lo)return b.grade; }
  return null;                                               // 最小の下限未満
}
function gradeAgg(from,to,store){
  const g={}; let ta=0,tq=0;
  for(const r of (DATA.catp||[])){
    if(!storeMatch(r.s,store))continue; if(r.d<from||r.d>to)continue;
    const gr=gradeOf(r.c,r.p); if(!gr)continue;
    const x=g[gr]||(g[gr]={a:0,q:0}); x.a+=r.a||0; x.q+=r.q||0; ta+=r.a||0; tq+=r.q||0;
  }
  return {g,ta,tq};
}
function hasGrades(){ return !!(DATA.gradeBands&&DATA.gradeBands.length&&DATA.catSeason&&DATA.catp&&DATA.catp.length); }
function drawGrade(from,to,store){
  const panel=document.getElementById("grade-panel"); if(!panel)return;
  if(!hasGrades()){ panel.style.display="none"; return; }
  const {g,ta,tq}=gradeAgg(from,to,store); const keys=Object.keys(g);
  if(!keys.length){ panel.style.display="none"; return; }
  panel.style.display="";
  const bySales=keys.slice().sort((x,y)=>g[y].a-g[x].a).slice(0,3);
  const byQty=keys.slice().sort((x,y)=>g[y].q-g[x].q).slice(0,3);
  const rows=(arr,val,tot,fmt)=>arr.map((k,i)=>
    `<tr><td>${i+1}</td><td>ランク ${esc(k)}</td><td>${fmt(g[k][val])}</td><td>${tot>0?F1(g[k][val]/tot*100)+"%":"—"}</td></tr>`).join("")
    ||`<tr><td colspan="4" class="sub">対象データなし</td></tr>`;
  document.getElementById("grade-sales").innerHTML=`<thead><tr><th>#</th><th>ランク</th><th>売上</th><th>比率</th></tr></thead><tbody>${rows(bySales,"a",ta,v=>YEN(v)+"円")}</tbody>`;
  document.getElementById("grade-qty").innerHTML=`<thead><tr><th>#</th><th>ランク</th><th>販売数</th><th>比率</th></tr></thead><tbody>${rows(byQty,"q",tq,v=>NUM(v)+"点")}</tbody>`;
  document.getElementById("grade-note").textContent=`比率＝ランク対象（SS/AW）の合計に対する割合（その他カテゴリは除く）`;
}

function rowsIn(from,to,storeId){

function periods(from,to,g,storeId){
  const map=new Map();
  for(const r of rowsIn(from,to,storeId)){const k=pKey(r.d,g);if(!map.has(k))map.set(k,[]);map.get(k).push(r);}
  return [...map.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([k,rows])=>{const p=sumRows(rows);p.key=k;p.label=pLabel(k,g);return p;});
}
function catIn(from,to,storeId){
  const map=new Map();
  for(const r of DATA.cat){if(!storeMatch(r.s,storeId))continue;if(r.d<from||r.d>to)continue;if(isDropCat(r.c))continue; // セール（バンドル割引）は売上・販売数ランキングに入れない
    let c=map.get(r.c);if(!c){c={c:r.c,a:0,q:0};map.set(r.c,c);}c.a+=r.a||0;c.q+=r.q||0;}
  return [...map.values()];
}
// カテゴリを1つ選び、対象期間・店舗でしぼって価格帯（単価）別に集計。売上降順。
function catPriceIn(from,to,storeId,category){
  if(!DATA.catp)return null;
  const map=new Map();
  for(const r of DATA.catp){if(r.c!==category)continue;if(!storeMatch(r.s,storeId))continue;if(r.d<from||r.d>to)continue;
    let e=map.get(r.p);if(!e){e={p:r.p,a:0,q:0};map.set(r.p,e);}e.a+=r.a||0;e.q+=r.q||0;}
  return [...map.values()].sort((a,b)=>b.a-a.a);
}
function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return DATA.stores.filter(s=>w.has(s.id)&&s.visible!==false);}
function storeMeta(sid){return (DATA.stores||[]).find(x=>String(x.id)===String(sid))||null;}
function ownOf(sid){const s=storeMeta(sid);return (s&&s.own)?s.own:"直営";}          // 直営 / FC
function kvOf(sid){const s=storeMeta(sid);return s?(s.kv!==false):true;}             // 来店数をKPIに使うか
function hasFCStores(){return usableStores().some(s=>ownOf(s.id)!=="直営");}
function periodSpan(key,g){
  if(g==="day")return[key,key];
  if(g==="week")return[key,addDays(key,6)];
  const[y,m]=key.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();
  return[`${key}-01`,`${key}-${String(last).padStart(2,"0")}`];
}
function monthSpan(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return[`${ym}-01`,`${ym}-${String(last).padStart(2,"0")}`];}
function clampRange(f,t){if(f<DATA._min)f=DATA._min;if(t>DATA._max)t=DATA._max;if(f>t)f=t;return[f,t];}
// 実際の今日（端末＝日本時間）を基準にボタンの期間を決める。
// 前日＝昨日、今週＝今日を含む週(月〜日) …。常にデータのある範囲へ収める。
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function presetRange(kind){
  const today=todayStr(), y1=addDays(today,-1);
  if(kind==="all")return[DATA._min,DATA._max];
  if(kind==="d30")return clampRange(addDays(today,-29),today);
  if(kind==="d90")return clampRange(addDays(today,-89),today);
  if(kind==="prevday")return clampRange(y1,y1);
  if(kind==="thisweek"){const mon=mondayOf(today);return clampRange(mon,addDays(mon,6));}
  if(kind==="lastweek"){const mon=addDays(mondayOf(today),-7);return clampRange(mon,addDays(mon,6));}
  if(kind==="thismonth")return clampRange(...monthSpan(today.slice(0,7)));
  if(kind==="lastmonth"){const[y,m]=today.split("-").map(Number);let py=y,pm=m-1;if(pm===0){pm=12;py--;}
    return clampRange(...monthSpan(`${py}-${String(pm).padStart(2,"0")}`));}
  return[DATA._min,DATA._max];
}
// 期間（state.from/to）を日付入力欄の表示にも反映する。

function loadSavedPeriod(){

      let t=s.to>DATA._max?DATA._max:(s.to<DATA._min?DATA._min:s.to);
      if(f>t)f=t; return [f,t];
    }}catch(e){}
  return null;
}

// 対象月の自動選択：売上のある最新月。最新日が5日以下（月初だけ）なら前月を対象にする。
function rptPickYm(){

// 店舗idの集合を述語にしてカテゴリ集計（DATA.cat）※レポート専用：Tシャツ細分を統合・セール除外
function rptCatAgg(from,to,pred){
  const m=new Map();
  for(const r of (DATA.cat||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const cn=normCat(r.c); let c=m.get(cn); if(!c){c={c:cn,a:0,q:0};m.set(cn,c);} c.a+=r.a||0; c.q+=r.q||0; }
  return [...m.values()];
}
// 店舗idの集合を述語にして価格帯（税抜単価）別に集計（DATA.catp）※レポート専用：セール除外
function rptBandAgg(from,to,pred){
  const bands=RPT_BANDS.map(b=>({label:b.label,a:0,q:0})); let ta=0,tq=0;
  for(const r of (DATA.catp||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const i=rptBandIdx(r.p||0); bands[i].a+=r.a||0; bands[i].q+=r.q||0; ta+=r.a||0; tq+=r.q||0; }
  return {bands,ta,tq};
}
// 店舗idの集合を述語にして「ランク（グレード S/A/B/C/D）」別に集計（gradeOf を使用）※レポート専用
function rptGradeAgg(from,to,pred){
  const g={}; let ta=0,tq=0;
  for(const r of (DATA.catp||[])){ if(!pred(r.s))continue; if(r.d<from||r.d>to)continue; if(isDropCat(r.c))continue;
    const gr=gradeOf(r.c,r.p); if(!gr)continue;
    const x=g[gr]||(g[gr]={grade:gr,a:0,q:0}); x.a+=r.a||0; x.q+=r.q||0; ta+=r.a||0; tq+=r.q||0; }

// 設定済みのランクを高い順（S,A,B,C,D…）に並べて返す
function rptRankOrder(){
  const ord=["S","A","B","C","D","E","F"];
  const all=[...new Set((DATA.gradeBands||[]).map(b=>b.grade))];
  return all.sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});

function rptHasGrades(){ return !!(DATA.gradeBands&&DATA.gradeBands.length&&DATA.catSeason&&DATA.catp&&DATA.catp.length); }
// 合計値（sumRows の結果）→ 主要KPI
function rptKpi(p){
  // 客単価・商品単価は「レジ袋」を除いた商品ぶんで算出（レジ袋は数点の付随手数料でKPIを歪めるため）。
  // 売上（in/ex）そのものはレジ袋込み＝POS純売上のまま（ロイヤリティ整合）。販売点数(it)は元々レジ袋を含まない。
  const inNet=p.in-(p.bagIn||0);
  const exNet=p.hasEx?(p.ex-(p.bagEx||0)):null;
  return {
    in:p.in, ex:p.hasEx?p.ex:null, tx:p.tx, it:p.it,
    inNet, exNet, v:p.hasV?p.v:null, hasV:p.hasV, txv:p.txv,
    // 客単価は税抜で語る（税抜売上÷取引数、レジ袋除く）。税抜の実額が無い店は税込÷1.1で近似。
    aov:p.tx>0?((exNet!=null?exNet:inNet/1.1)/p.tx):null,
    upt:(p.hasIt&&p.txIt>0)?p.it/p.txIt:null, // 平均購入点数（分母は明細のある取引数）
    aup:(p.hasEx&&p.it>0)?exNet/p.it:null, // 平均商品単価（税抜・レジ袋除く）
    pr :(p.hasV&&p.v>0)?(p.txv/p.v*100):null, // 購入率（デジテール店のみ）
  };
}
// 税抜売上（実額があればそれ、無ければ税込÷1.1で近似）。売上は全て税抜で語るため。
function rptEx(p){return (p&&p.hasEx)?p.ex:(((p&&p.in)||0)/1.1);}
// 2要素の中点（Shapley）分解： 積 A×B の増減を A要因/B要因に厳密配分（合計＝Δ(A×B)）
function rptDecomp(aC,bC,aP,bP){
  return { a:(aC-aP)*(bC+bP)/2, b:(bC-bP)*(aC+aP)/2, total:aC*bC-aP*bP };
}
// 各店の初回売上月（YYYY-MM）＝OPEN月。売上が初めて立った月で判定（データ駆動）。
let _rptFirstYm=null;
function rptFirstYm(sid){
  if(!_rptFirstYm){ _rptFirstYm=new Map();
    for(const r of DATA.daily){ if(!((r.in||0)>0||(r.tx||0)>0))continue;
      const ym=(r.d||"").slice(0,7), cur=_rptFirstYm.get(r.s);
      if(!cur||ym<cur)_rptFirstYm.set(r.s,ym); } }
  return _rptFirstYm.get(sid)||null;
}
// 平均・全体KPIの対象店（その月がOPEN月の店は初月ゆえ除外、下北沢は恒久除外）
// データ先頭月は「本当のOPEN月」と区別できないためOPEN扱いにしない（誤除外を防ぐ）。
function rptEligIds(ym){
  const [f,t]=monthSpan(ym), ids=new Set();
  const startYm=(DATA._min||"").slice(0,7);
  for(const s of usableStores()){
    if((s.name||"").indexOf("下北沢")>=0)continue;
    if(rptFirstYm(s.id)===ym && ym>startYm)continue;   // その月がOPEN月（かつデータ先頭月でない）→除外
    if(DATA.daily.some(r=>r.s===s.id&&r.d>=f&&r.d<=t&&((r.in||0)>0)))ids.add(s.id);
  }
  return ids;
}
// 対象店の月次 店舗売上（平均・中央値・店舗数）
function rptAvgMed(ym){
  const [f,t]=monthSpan(ym), ids=rptEligIds(ym);
  const vals=[...ids].map(id=>{let x=0;for(const r of DATA.daily){if(r.s===id&&r.d>=f&&r.d<=t)x+=r.in||0;}return x;}).filter(v=>v>0).sort((a,b)=>a-b);
  const n=vals.length, avg=n?vals.reduce((a,b)=>a+b,0)/n:0;
  const med=n?(n%2?vals[(n-1)/2]:(vals[n/2-1]+vals[n/2])/2):0;
  return {avg,med,n};
}

// グループ（分類）ごとの当月/前月集計を返す。ids は所属店舗idの集合。
function rptGroupRows(cf,ct,pf,pt){
  return classesInData().map(cls=>{
    const members=usableStores().filter(s=>classOf(s.id)===cls);
    const ids=new Set(members.map(s=>s.id));
    const c=sumRowsForIds(cf,ct,ids), p=sumRowsForIds(pf,pt,ids);
    const n=members.filter(s=>{const x=sumRows(rowsIn(cf,ct,s.id));return x.in>0;}).length;
    return {cls,ids,members,n,c,p};
  });
}
// 売上規模で S/A/B/C の4階層に分ける（同数に近い分位＋レンジ表示）
function rptTiers(rows){
  const defs=[{label:"S（大型）",color:"B8860B"},{label:"A（中大）",color:"2E5AAC"},{label:"B（中小）",color:"5B8C5A"},{label:"C（小型）",color:"6B7280"}];
  const n=rows.length; const out=defs.map(d=>({...d,rows:[],sum:{in:0,ex:0,tx:0,txv:0,it:0,v:0,hasV:false}}));
  if(!n)return out.map(t=>({...t,range:"—"}));
  const per=Math.ceil(n/4);
  rows.forEach((r,i)=>{ const t=out[Math.min(3,Math.floor(i/per))];

  return out;
}

// 着地見込み（自動・税込）：対象月の残日数×平日/土日祝の平均で月末を予測（店舗比較用）。
//  過去の月は残日数0＝実績と一致。当月は予測になる。月次予実の見込みと同じ算出方法。
function fIsWeekend(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6;}
function fMonthEnd(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return `${ym}-${String(last).padStart(2,"0")}`;}
function computeAutoLandingIn(store,ym){
  return computeAutoLandingForIds(new Set(usableStores().filter(s=>storeMatch(s.id,store)).map(s=>s.id)),ym);
}
function computeAutoLandingForIds(ids,ym){
  const mS=ym+"-01",mE=fMonthEnd(ym),today=todayStr(),winStart=addDays(mS,-56);
  const byDate={};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue; if(r.d<winStart||r.d>mE)continue;
    (byDate[r.d]=byDate[r.d]||{in:0}).in+=(r.ex!=null?r.ex:(r.in||0)/1.1); }  // 税抜（無い店は税込÷1.1近似）
  const monthDates=Object.keys(byDate).filter(d=>d>=mS&&d<=mE).sort();
  const closing=monthDates.filter(d=>d<=today).slice(-1)[0]||null;
  let tdIn=0,wkIn=0,wkN=0,weIn=0,weN=0;
  if(closing) for(const d of monthDates){ if(d>closing)continue; const v=byDate[d].in;
    tdIn+=v; if(fIsWeekend(d)){weIn+=v;weN++;}else{wkIn+=v;wkN++;} }
  let twkIn=0,twkN=0,tweIn=0,tweN=0; const trFrom=addDays(closing||today,-56),trTo=closing||addDays(today,-1);
  for(const d of Object.keys(byDate)){ if(d<trFrom||d>trTo)continue; const v=byDate[d].in;
    if(fIsWeekend(d)){tweIn+=v;tweN++;}else{twkIn+=v;twkN++;} }
  const wkAvg=wkN?wkIn/wkN:(twkN?twkIn/twkN:0), weAvg=weN?weIn/weN:(tweN?tweIn/tweN:0);
  let remWk=0,remWe=0; const start=closing?addDays(closing,1):mS;
  for(let d=start; d<=mE; d=addDays(d,1)){ if(fIsWeekend(d))remWe++; else remWk++; }
  return tdIn + remWk*wkAvg + remWe*weAvg;
}
function drawCompare(rows,showLand){
  const cols=KPI_CARDS.map(M);
  const landHead=showLand?`<th>着地見込み<br><span class="sub" style="font-weight:500">税抜</span></th>`:"";
  const head=`<thead><tr><th>店舗</th>${landHead}${cols.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead>`;
  const body=rows.map(p=>{
    const st=p._agg?' style="font-weight:750"':(p._sel?' style="font-weight:700;background:var(--surface2)"':'');
    const land=showLand?`<td>${p._land!=null?YEN(p._land)+"円":"—"}</td>`:"";
    return `<tr${st}><td>${esc(p._name)}</td>${land}${cols.map(c=>{const v=c.calc(p);return `<td>${v==null?"—":c.fmt(v)}</td>`;}).join("")}</tr>`;
  }).join("");
  document.getElementById("cmp").innerHTML=head+"<tbody>"+body+"</tbody>";
}
function drawCatTable(cats){
  const hasP=!!(DATA.catp&&DATA.catp.length);
  const head=`<thead><tr><th>カテゴリ</th><th>売上</th><th>販売数</th><th>点あたり</th></tr></thead>`;
  const body=cats.map(c=>{
    const main=`<tr class="catrow${hasP?" clk":""}" data-cat="${esc(c.c)}">`+
      `<td>${hasP?'<span class="caret">▸</span>':''}${esc(c.c)}</td>`+
      `<td>${YEN(c.a)}円</td><td>${NUM(c.q)}点</td><td>${c.q>0?YEN(c.a/c.q)+"円":"—"}</td></tr>`;
    const detail=`<tr class="catdetail" style="display:none"><td colspan="4"></td></tr>`;
    return main+detail;
  }).join("");
  const ta=cats.reduce((s,c)=>s+c.a,0),tq=cats.reduce((s,c)=>s+c.q,0);
  const t=document.getElementById("cat-t");
  t.innerHTML=head+"<tbody>"+body+"</tbody>"+
    `<tfoot><tr><td>合計</td><td>${YEN(ta)}円</td><td>${NUM(tq)}点</td><td>${tq>0?YEN(ta/tq)+"円":"—"}</td></tr></tfoot>`;
  if(!hasP)return;
  t.querySelectorAll("tr.catrow.clk").forEach(tr=>tr.onclick=()=>{
    const det=tr.nextElementSibling, caret=tr.querySelector(".caret");
    if(!det)return;
    if(det.style.display!=="none"){det.style.display="none";if(caret)caret.textContent="▸";return;}
    const rows=catPriceIn(state.from,state.to,state.store,tr.dataset.cat)||[];
    const cell=det.firstElementChild;
    if(!rows.length){cell.innerHTML=`<div class="sub" style="padding:8px 26px">価格帯データはありません（次回の集計更新後に表示されます）。</div>`;}
    else{const tot=rows.reduce((s,r)=>s+r.a,0);
      cell.innerHTML=`<table class="subtbl"><thead><tr><th>価格帯</th><th>売上</th><th>販売数</th><th>構成比</th></tr></thead><tbody>`+
        rows.map(r=>`<tr><td>${YEN(r.p)}円</td><td>${YEN(r.a)}円</td><td>${NUM(r.q)}点</td><td>${tot>0?F1(r.a/tot*100)+"%":"—"}</td></tr>`).join("")+
        `</tbody></table>`;}
    det.style.display="";if(caret)caret.textContent="▾";
  });
}
function drawTable(ps){
  const cols=KPI_ORDER.map(M);
  const head=`<thead><tr><th>期間</th>${cols.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead>`;
  const body=ps.slice().reverse().map(p=>`<tr data-k="${p.key}" style="cursor:pointer"><td>${p.label}</td>${cols.map(c=>{const v=c.calc(p);return `<td>${v==null?"—":c.fmt(v)}</td>`;}).join("")}</tr>`).join("");
  const t=document.getElementById("tbl");t.innerHTML=head+"<tbody>"+body+"</tbody>";
  t.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{
    const[f,to]=periodSpan(tr.dataset.k,state.grain);
    state.from=clampLo(f);state.to=clampHi(to);render();
    window.scrollTo({top:0,behavior:"smooth"});});
}

function drawTrend(ps){
  const box=document.getElementById("trend");box.innerHTML="";
  const m=M(state.metric),vals=ps.map(p=>({label:p.label,v:m.calc(p)}));
  if(!vals.length){box.innerHTML='<div class="sub" style="padding:8px 0">データなし</div>';return;}
  const W=Math.max(box.clientWidth||680,320),H=250,PADL=58,PADR=14,PADT=14,PADB=40;
  const xs=i=>PADL+(W-PADL-PADR)*(vals.length<=1?0.5:i/(vals.length-1));
  const nums=vals.map(d=>d.v).filter(v=>v!=null);const maxV=Math.max(1,...nums),minV=Math.min(0,...nums);
  const ys=v=>PADT+(H-PADT-PADB)*(1-(v-minV)/((maxV-minV)||1));
  const gy=[];for(let i=0;i<=4;i++){const val=minV+(maxV-minV)*i/4;gy.push({y:ys(val),val});}
  const pts=vals.map((d,i)=>d.v==null?null:[xs(i),ys(d.v)]);
  const path=pts.map((p,i)=>p?`${i&&pts[i-1]?"L":"M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`:"").join(" ");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.name}の推移">
    ${gy.map(g=>`<line x1="${PADL}" y1="${g.y.toFixed(1)}" x2="${W-PADR}" y2="${g.y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${PADL-8}" y="${g.y+3}" text-anchor="end" font-size="10" fill="var(--muted)">${shortNum(g.val)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`:"").join("")}
    ${vals.map((d,i)=>(vals.length<=14||i%Math.ceil(vals.length/12)===0||i===vals.length-1)?`<text x="${xs(i).toFixed(1)}" y="${H-PADB+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.label}</text>`:"").join("")}
    <rect id="hit" x="${PADL}" y="${PADT}" width="${W-PADL-PADR}" height="${H-PADT-PADB}" fill="transparent"/>
    <line id="cross" x1="0" y1="${PADT}" x2="0" y2="${H-PADB}" stroke="var(--accent)" stroke-width="1" opacity="0"/>
  </svg><div class="tip" id="ttip"></div>`;
  const tip=box.querySelector("#ttip"),cross=box.querySelector("#cross"),hit=box.querySelector("#hit"),svgEl=box.querySelector("svg");
  function move(ev){const r=svgEl.getBoundingClientRect();const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    let i=Math.round((px-PADL)/((W-PADL-PADR)/Math.max(1,vals.length-1)));i=Math.max(0,Math.min(vals.length-1,i));
    const d=vals[i];if(d.v==null){tip.style.opacity=0;cross.setAttribute("opacity","0");return;}
    const cx=xs(i);cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",".5");
    tip.style.opacity=1;tip.style.left=(cx/W*r.width)+"px";tip.style.top=(ys(d.v)/H*r.height)+"px";
    tip.innerHTML=`<b>${d.label}</b><br>${m.name}: ${m.fmt(d.v)}`;}
  const hide=()=>{tip.style.opacity=0;cross.setAttribute("opacity","0");};
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",hide);
  // タッチは横方向のなぞりだけ反応。縦スクロールでは何もしない（カクつき防止）。
  let sx=0,sy=0,lock=null;
  hit.addEventListener("touchstart",ev=>{sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;lock=null;},{passive:true});
  hit.addEventListener("touchmove",ev=>{
    if(lock==="v")return;
    const dx=ev.touches[0].clientX-sx, dy=ev.touches[0].clientY-sy;
    if(lock===null&&(Math.abs(dx)>6||Math.abs(dy)>6))lock=Math.abs(dy)>Math.abs(dx)?"v":"h";
    if(lock==="v"){hide();return;}
    move(ev);
  },{passive:true});
  hit.addEventListener("touchend",hide);
}
function shortNum(v){if(Math.abs(v)>=1e8)return(v/1e8).toFixed(1)+"億";if(Math.abs(v)>=1e4)return(v/1e4).toFixed(v>=1e5?0:1)+"万";return Math.round(v).toLocaleString("ja-JP");}
function drawBars(id,rows,getV,fmt){
  const box=document.getElementById(id);box.innerHTML="";rows=rows.slice(0,10);
  if(!rows.length){box.innerHTML='<div class="sub" style="padding:8px 0">データなし</div>';return;}
  const max=Math.max(1,...rows.map(getV)),rowH=30,W=Math.max(box.clientWidth||420,300),PADR=12,LBL=96,H=rows.length*rowH+8,bx=LBL+8,bw=W-bx-PADR;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${rows.map((r,i)=>{const y=i*rowH+4,w=Math.max(2,bw*getV(r)/max);
    return `<g><text x="${LBL}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--ink2)">${esc(r.c).slice(0,7)}</text>
      <rect x="${bx}" y="${y+5}" width="${bw}" height="${rowH-14}" rx="4" fill="var(--surface2)"/>
      <rect x="${bx}" y="${y+5}" width="${w.toFixed(1)}" height="${rowH-14}" rx="4" fill="var(--accent)"/>
      <text x="${bx+w+6}" y="${y+rowH/2}" dominant-baseline="middle" font-size="10.5" fill="var(--muted)">${fmt(r)}</text></g>`;}).join("")}</svg>`;
}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function toggleTheme(){const root=document.documentElement;
  const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.setAttribute("data-theme",cur==="dark"?"light":"dark");draw();}
// 横幅が変わったときだけ描き直す（スマホのアドレスバー伸縮＝高さ変化では描き直さない）
let _lastW=window.innerWidth,_rt=null;
window.addEventListener("resize",()=>{
  if(!DATA)return;
  if(window.innerWidth===_lastW)return;   // 高さだけの変化は無視（カクつき防止）
  _lastW=window.innerWidth;
  clearTimeout(_rt);_rt=setTimeout(draw,150);
});
boot();
</script>
