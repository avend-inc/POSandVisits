<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>既存店データ</title>
<style>
  :root{--ink:#1a1a1a;--ink2:#6b6b6b;--bg:#f5f5f3;--surface:#fff;--border:#e4e4e4;
    --accent:#b8860b;--ok:#1b8a3a;--ng:#c0392b;--hold:#8a6d00;--shadow:0 1px 3px rgba(0,0,0,.06);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:60px}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  .hbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);
    border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
  main{max-width:1100px;margin:0 auto;padding:14px}
  .lead{font-size:12.5px;color:var(--ink2);line-height:1.7;margin:2px 0 10px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
    border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
  th,td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:right}
  th{position:sticky;top:0;background:#faf9f6;font-size:11px;color:var(--ink2);cursor:pointer;user-select:none}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
  th:first-child{z-index:2;background:#faf9f6}
  tr.bench td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  tr.bench td{background:#fffdf5}
  tr.comp td:first-child{color:#7a5cc0}
  .tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}
  .t-成功{background:var(--ok)} .t-普通{background:#8a8a8a} .t-失敗{background:var(--ng)} .t-未{background:#c9c2a8}
  .sub{font-size:10.5px;color:#9a9a9a}
  .rangebar{font-size:11.5px;color:var(--ink2);background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;margin-top:10px;line-height:1.7}
  .rangebar b{color:var(--ink)}
  .msg{padding:24px 16px;color:var(--ink2);text-align:center;line-height:1.8}
  .loginbtn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer}
</style></head>
<body>
<header>
  <a class="hbtn" href="shoken.html">‹ 商圏調査</a>
  <h1>既存店データ</h1>
  <a class="hbtn" href="bukken.html">物件</a>
  <button class="hbtn" id="logoutbtn" style="display:none">ログアウト</button>
  <a class="hbtn" href="../" title="アプリのトップへ">ホーム</a>
</header>
<main id="main"><div class="msg">読み込み中…</div></main>

<script>
"use strict";
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null;

// ===== 教師データ =====
// 中身は bukken_teacher_stores（RLSで社内のみ）から読む。
// 以前はこのファイルに直接書いていたが、それだとページのソースを見るだけで
// ログイン無しに家賃・競合の数字まで読めてしまう（画面のログインでは守れない）。
let STORES=[];

const NUM=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("ja-JP");
// 主ベンチマーク＝弊社・地方・路面・成功（＝商圏調査の判定基準6店）
const isBench=s=>s.ours&&s.model==="地方"&&s.road&&s.success==="成功";

let FILTER="all", SORT={key:"grp",dir:1};
function passFilter(s){
  if(FILTER==="ours") return s.ours;
  if(FILTER==="comp") return !s.ours;
  if(FILTER==="bench") return isBench(s);
  if(FILTER==="成功"||FILTER==="失敗") return s.success===FILTER;
  return true;
}
const SUCC={"成功":0,"普通":1,"失敗":2,null:3};
function sortVal(s,k){
  if(k==="grp") return (s.ours?0:1)*100 + (SUCC[s.success]??3);
  if(k==="name") return s.name;
  return s[k]==null?-Infinity:s[k];
}
function render(){
  const rows=STORES.filter(passFilter).slice().sort((a,b)=>{
    let x=sortVal(a,SORT.key), y=sortVal(b,SORT.key);
    if(typeof x==="string") return x.localeCompare(y,"ja")*SORT.dir;
    return (x<y?-1:x>y?1:0)*SORT.dir;
  });
  const COLS=[["name","店名",0],["success","成否",0],["model","モデル",0],["road","路面",0],
    ["area","面積㎡",1],["rent","家賃",1],["park","駐車",1],
    ["p3","3km",1],["p10","10km",1],["p20","20km",1],["p30","30km",1],["p40","40km",1],
    ["indep","独立度",1],["traf","通行量",1]];
  const head="<tr>"+COLS.map(([k,l])=>`<th data-k="${k}">${l}${SORT.key===k?(SORT.dir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  const body=rows.map(s=>{
    const cls=(isBench(s)?"bench ":"")+(s.ours?"":"comp");
    const tag=s.success?`<span class="tag t-${s.success}">${s.success}</span>`:`<span class="tag t-未">未</span>`;
    return `<tr class="${cls}">
      <td>${s.name}${tag}<div class="sub">${s.pref||""}${s.city||""}${!s.ours?" ・競合":""}</div></td>
      <td>${s.success||"—"}</td><td>${s.model||"—"}</td><td>${s.road?"路面":"徒歩"}</td>
      <td>${NUM(s.area)}</td><td>${NUM(s.rent)}</td><td>${NUM(s.park)}</td>
      <td>${NUM(s.p3)}</td><td>${NUM(s.p10)}</td><td>${NUM(s.p20)}</td><td>${NUM(s.p30)}</td><td>${NUM(s.p40)}</td>
      <td>${s.indep==null?"—":s.indep.toFixed(3)}</td><td>${NUM(s.traf)}</td></tr>`;
  }).join("");
  // 主ベンチのレンジ
  const bench=STORES.filter(isBench);
  const p10s=bench.map(b=>b.p10), trs=bench.map(b=>b.traf).filter(v=>v!=null), ins=bench.map(b=>b.indep);
  const mm=a=>`${NUM(Math.min(...a))}〜${NUM(Math.max(...a))}`;
  document.getElementById("main").innerHTML=`
    <p class="lead">教師データ（弊社 SELFURUGI／NOTIME と競合）の商圏実数です。<b>金色の帯</b>＝商圏調査の判定基準になっている
      主ベンチマーク（地方・路面・成功の6店）。列見出しをタップで並べ替え。人口は各距離帯の20-34歳の絶対数。</p>
    <div class="chips">
      ${[["all","全部"],["ours","弊社"],["comp","競合"],["bench","主ベンチ6店"],["成功","成功"],["失敗","失敗"]]
        .map(([k,l])=>`<button class="chip ${FILTER===k?"on":""}" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div class="rangebar">主ベンチ6店のレンジ　<b>10km20-34</b> ${mm(p10s)}　／　<b>独立度</b> ${Math.min(...ins).toFixed(3)}〜${Math.max(...ins).toFixed(3)}　／　<b>通行量</b> ${mm(trs)}</div>
    <div class="wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p class="sub" style="margin-top:8px">※ 成否は教師データの success_label（成功／普通／失敗／未設定）。競合他社の店舗は判定基準には使っていません。</p>`;
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{FILTER=c.dataset.f;render();});
  document.querySelectorAll("th[data-k]").forEach(t=>t.onclick=()=>{
    const k=t.dataset.k; if(SORT.key===k)SORT.dir*=-1; else{SORT.key=k;SORT.dir=(k==="name"||k==="grp")?1:-1;} render();});
}

async function loadSupabase(){ if(window.supabase)return;
  await new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));
    document.head.appendChild(s);});}
async function boot(){
  try{
    const cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();
    await loadSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){
      document.getElementById("main").innerHTML='<div class="msg">既存店データを見るにはログインが必要です。<br><button class="loginbtn" id="lg">Googleでログイン</button></div>';
      document.getElementById("lg").onclick=()=>SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
      return;
    }
    document.getElementById("logoutbtn").style.display="";
    document.getElementById("logoutbtn").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
    const {data,error}=await SB.from("bukken_teacher_stores").select("*").order("name");
    if(error)throw new Error("教師データを読み込めませんでした（権限がない可能性があります）");
    STORES=data||[];
    if(!STORES.length){document.getElementById("main").innerHTML='<div class="msg">表示できるデータがありません。</div>';return;}
    render();
  }catch(e){ document.getElementById("main").innerHTML='<div class="msg">読み込みに失敗しました：'+String(e.message||e)+'</div>'; }
}
boot();
</script>
</body></html>
