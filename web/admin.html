<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="売上KPI管理">
<meta name="robots" content="noindex, nofollow">
<title>NOTIME 管理</title>
<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .navlink{border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 14px;margin:14px 0;}
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:800;}
  .panel .note{font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.6;}
  .tblwrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:8px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle;}
  th{color:var(--ink2);font-weight:700;font-size:11.5px;}
  input,select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);}
  input.wide{min-width:200px;}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn.ghost{background:var(--surface);color:var(--accent);}
  .btn.danger{background:var(--surface);color:var(--bad);border-color:var(--border);padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .roletag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .r-admin{background:#7c3aed22;color:#7c3aed;} .r-editor{background:var(--accent-weak);color:var(--accent);} .r-viewer{background:var(--surface2);color:var(--ink2);}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  /* 店舗を選ぶドロップダウン（スライサー） */
  .dd{position:relative;}
  .dd summary{list-style:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;}
  .dd summary::-webkit-details-marker{display:none}
  .dd[open] summary{border-color:var(--accent);}
  .dd .ddwrap{margin-top:6px;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);}
  .dd .ddgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 12px;max-height:280px;overflow:auto;}
  .dd .ddgrid label{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;cursor:pointer;}
  .stchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:3px 9px;font-size:12px;margin:2px 3px 2px 0;}
  .stchip button{border:none;background:none;color:var(--bad);cursor:pointer;font-weight:800;font-size:14px;line-height:1;padding:0;}
  select.addsel{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--surface);color:var(--ink);cursor:pointer;}
  .msg{font-size:12.5px;font-weight:600;margin:8px 0 0;}
  .msg.ok{color:var(--good);} .msg.err{color:var(--bad);}
  .secbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;}
  .secbar .btn{padding:9px 18px;}
  .pill{font-size:12px;font-weight:700;color:var(--muted);}
  .pill.on{color:var(--accent);}
  tr.dirty td{background:var(--accent-weak);}
  tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
  .gate{max-width:460px;margin:12vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:800;} .gate .t{font-size:16px;font-weight:700;margin:16px 0 6px;} .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn .g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .notice{background:var(--accent-weak);border:1px solid transparent;border-radius:12px;padding:16px 18px;color:var(--ink);font-size:14px;line-height:1.8;}
  body{padding-bottom:72px;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  /* 絵文字をやめたので、アイコンと文字を縦に積む必要がなくなった。
     文字だけを1行で置き、押している所は上の罫と色で示す */
  .tabbar a{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 2px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;border-top:2px solid transparent;}
  .tabbar a.on{border-top-color:var(--accent);}
  .tabbar a.on{color:var(--accent);} .tabbar a:active{opacity:.55;}
  /* 「ホーム」ボタン。どのページでも同じ見た目にするため、
     ページごとに違う .navlink には頼らず自前で持つ */
  .homebtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto;
    border:1px solid var(--border);background:var(--surface);color:var(--accent);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;
    text-decoration:none;cursor:pointer;}
  .homebtn:hover{border-color:var(--accent);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub" style="padding:40px 0">読み込み中…</div></div>
<nav class="tabbar"><div class="tabbar-in">
  <a href="index.html?g=own" id="tab-own">直営</a>
  <a href="index.html?g=fc" id="tab-fc">FC</a>
  <a href="pl.html">予実</a>
  <a href="unei.html" id="tab-unei">運営</a>
  <a href="keiei.html" id="tab-keiei">経営</a>
  <a href="admin.html" id="tab-admin" class="on">管理</a>
</div></nav>
<script>
"use strict";
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null};
const ROLES=[["viewer","閲覧"],["editor","編集"],["admin","管理"]];
const POS_TYPES=[["cashier","cashier(レジ)"],["airregi","Airレジ"],["ezregi","EZレジ"]];
let STORESCACHE=[];
// 各項目の「未保存の変更」を覚えておく（行ID＝店舗id / レジid / ユーザーのメール）。
// 編集すると行がここに入り、項目ごとの「変更を更新」ボタンでまとめて保存する。
const dirtyUsers=new Set(), dirtyStores=new Set(), dirtyPos=new Set();
const SEC={
  users :{set:dirtyUsers, tbl:"#utbl", btn:"u_update", pill:"u_dirty"},
  stores:{set:dirtyStores,tbl:"#stbl", btn:"s_update", pill:"s_dirty"},
  pos   :{set:dirtyPos,   tbl:"#ptbl", btn:"p_update", pill:"p_dirty"},
};
const roleJp=r=>({viewer:"閲覧",editor:"編集",admin:"管理"}[r]||r);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function screen(h){document.getElementById("app").innerHTML=h;}

async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }

async function boot(){
  let cfg=null;
  try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
  if(!cfg||cfg.mode!=="auth"){
    screen(`<header><h1>NOTIME 管理</h1>
      <a class="navlink homebtn" href="../" title="アプリのトップへ">ホーム</a>
    </header>
      <div class="panel"><div class="notice">この管理画面は、<b>Googleログインの設定が完了すると</b>使えるようになります。<br>
      セットアップ（Google連携・Supabase設定・SUPABASE_ANON_KEYの登録）が済むと、ここでユーザーと店舗を管理できます。</div></div>`);
    return;
  }
  try{
    await ensureSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return;}
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    // 名簿は在庫アプリと共通の users テーブル1枚。ロールの語彙が違うので読み替える。
    const {data,error}=await SB.from("users").select("role,is_active,segments").ilike("email",ME.email).maybeSingle();
    if(error)throw error;
    ME.role=(data&&data.is_active&&(data.segments||[]).includes("sales"))
      ? (data.role==="admin"?"admin":(data.role==="manager"?"editor":"viewer")) : null;
    if(ME.role!=="admin"){ showDenied(ME.role?`この画面は管理者専用です（あなたの権限：${roleJp(ME.role)}）`:"アクセス権がありません。管理者にユーザー追加を依頼してください。"); return; }
    render();
  }catch(e){ screen('<div class="err">エラー：'+esc(e.message||e)+'</div>'); }
}
function showLogin(){ screen(`<div class="gate"><div class="logo">NOTIME 管理</div>
  <div class="t">ログイン</div><div class="m">管理者の Google アカウントでログインしてください。</div>
  <button class="gbtn" id="gl"><span class="g"></span>Google でログイン</button></div>`);
  document.getElementById("gl").onclick=async()=>{const redirectTo=location.origin+location.pathname;
    await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}});};
}
function showDenied(msg){ screen(`<div class="gate"><div class="logo">NOTIME 管理</div>
  <div class="t">アクセスできません</div><div class="m">${esc(msg)}</div>
  <button class="gbtn" id="lo"><span class="g"></span>別のアカウントでログイン</button>
  <div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>`);
  document.getElementById("lo").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
}

async function render(){
  screen(`
    <header>
      <h1>NOTIME 管理</h1>
      <span class="sub">${esc(ME.email)}（管理）</span>
      <a class="navlink" href="index.html" style="margin-left:auto">← ダッシュボード</a>
      <button class="themebtn" id="themebtn">◐ 表示</button>
      <button class="themebtn" id="logout">ログアウト</button>
    
      <a class="navlink homebtn" href="../" title="アプリのトップへ">ホーム</a>
    </header>
    <div class="panel">
      <h2>ユーザー管理</h2>
      <p class="note">ロール：<b>閲覧</b>＝見るだけ／<b>編集</b>＝＋予算・コスト等の入力／<b>管理</b>＝＋ユーザー・店舗の管理。
        追加したメール（Googleアカウント。@avend.co.jp 以外の個人Gmail等もOK）でログインすると使えます。<br>
        ロールを変えたら、下の「<b>変更を更新</b>」ボタンでまとめて保存します。</p>
      <div class="tblwrap"><table id="utbl"><tbody><tr><td class="sub">読み込み中…</td></tr></tbody></table></div>
      <div class="secbar"><button class="btn" id="u_update" disabled>変更を更新</button><span class="pill" id="u_dirty">変更はありません</span></div>
      <div class="addrow">
        <input id="u_email" class="wide" type="email" placeholder="メール（Googleアカウント）">
        <input id="u_name" placeholder="名前（任意）">
        <select id="u_role">${ROLES.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select>
        <button class="btn" id="u_add">ユーザー追加</button>
      </div>
      <p class="msg" id="u_msg"></p>
    </div>
    <div class="panel">
      <h2>加盟店の店舗割り当て</h2>
      <p class="note"><b>「ユーザー管理」に登録した人だけがログインできます</b>（未登録の人はログインできず、何も見えません）。登録済みの人のうち、
        <b>店舗の割り当てが有る人＝加盟店（社外）＝その店だけ</b>／<b>割り当てが無い人＝AVENDメンバー（全店）</b>。<b>admin/編集は割り当てても全店のまま</b>です。
        メールを入れて<b>見せる店舗をチェック（複数可）</b>し「割り当てを追加」を押すと、そのメールを viewer（閲覧）として登録し、選んだ店に一括で割り当てます。</p>
      <div class="tblwrap"><table id="atbl"><tbody><tr><td class="sub">読み込み中…</td></tr></tbody></table></div>
      <div class="addrow" style="align-items:flex-start">
        <input id="a_email" class="wide" type="email" placeholder="メール（Googleアカウント）">
        <details class="dd" id="a_dd">
          <summary>店舗を選択 <span class="sub" id="a_cnt">（未選択）</span> ▼</summary>
          <div class="ddwrap">
            <div style="display:flex;gap:8px;margin-bottom:6px">
              <button class="btn ghost" id="a_all" type="button" style="padding:4px 10px;font-size:12px">全選択</button>
              <button class="btn ghost" id="a_none" type="button" style="padding:4px 10px;font-size:12px">全解除</button>
            </div>
            <div class="ddgrid" id="a_stores"><span class="sub">読み込み中…</span></div>
          </div>
        </details>
        <button class="btn" id="a_add">割り当てを追加</button>
      </div>
      <p class="msg" id="a_msg"></p>
    </div>
    <div class="panel">
      <h2>店舗管理</h2>
      <p class="note">直営/FC の区分・デジテール入店slug・オープン日などを設定できます。売上取り込みは<b>CSVの店舗名で自動的に店舗を追加</b>します（新しいFC店はここに自動で現れます）。<br>
        「<b>表示</b>」＝ダッシュボード（サマリー・予実・推移・販促）に<b>出す/隠す</b>（チェックを外すと一覧・店舗選択・合計から外れます。データ取り込みは続きます）。<br>
        「入店取得」＝夜間などデジテール来店を<b>集める</b>か／「KPIに来店」＝来店数・購入率の<b>KPIに使う</b>か（例：下北沢は取得ON・KPI OFF）。<br>
        編集したら下の「<b>変更を更新</b>」ボタンを押すと、この項目の変更がまとめて保存されます（変更した行は色が付きます）。
        更新後、ダッシュボードは次回の集計更新（毎日の取り込み時、または管理者の再集計）で反映されます。</p>
      <div class="tblwrap"><table id="stbl"><tbody><tr><td class="sub">読み込み中…</td></tr></tbody></table></div>
      <div class="secbar"><button class="btn" id="s_update" disabled>変更を更新</button><span class="pill" id="s_dirty">変更はありません</span></div>
      <div class="addrow">
        <input id="s_name" placeholder="店舗名（例：下北沢）">
        <input id="s_code" placeholder="コード（英字・例：shimokita）">
        <select id="s_own"><option value="直営">直営</option><option value="FC">FC</option></select>
        <input id="s_slug" placeholder="入店slug（任意）">
        <input id="s_open" type="date" title="オープン日">
        <label class="sub" style="display:inline-flex;align-items:center;gap:5px"><input type="checkbox" id="s_kv" checked> KPIに来店</label>
        <button class="btn" id="s_add">店舗追加</button>
      </div>
      <p class="msg" id="s_msg"></p>
    </div>
    <div class="panel">
      <h2>レジ接続（自動取得の設定）</h2>
      <p class="note">店舗ごとに<b>レジ種類・URL・ID・パスワード</b>を登録すると、日次の自動取得がここを読み込んでログインします（GitHubのSecret登録は不要）。
        <b>パスワードは保存後は表示されません</b>（安全のため書き込み専用）。変更するときだけ入力してください。1店舗に複数レジ（例：下北沢＝Airレジ＋EZレジ）も可。<br>
        Si(EZレジ)のように<b>1アカウントで複数店</b>の場合は、店舗を「<b>（アカウント全体・複数店）</b>」にして登録（店舗はデータの店舗名で自動作成されます）。<br>
        既存の行を編集したら、下の「<b>変更を更新</b>」ボタンでまとめて保存します（PW欄は空のままならPWは変わりません）。</p>
      <div class="tblwrap"><table id="ptbl"><tbody><tr><td class="sub">読み込み中…</td></tr></tbody></table></div>
      <div class="secbar"><button class="btn" id="p_update" disabled>変更を更新</button><span class="pill" id="p_dirty">変更はありません</span></div>
      <div class="addrow">
        <select id="p_store"></select>
        <select id="p_type">${POS_TYPES.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}</select>
        <input id="p_name" placeholder="表示名（任意・例：EZ下北沢）" style="width:150px">
        <input id="p_url" class="wide" placeholder="URL（レジ管理画面）">
        <input id="p_id" placeholder="ID" style="width:120px">
        <input id="p_pw" type="password" placeholder="パスワード" style="width:120px">
        <button class="btn" id="p_add">レジ接続を追加</button>
      </div>
      <p class="msg" id="p_msg"></p>
    </div>
    <div class="panel">
      <h2>バンドル名（SALE）</h2>
      <p class="note">レジのバンドル（セット割＝SALE）の<b>コード→名称</b>の一覧です。<br>

function updateAcnt(){const n=document.querySelectorAll("#a_stores .achk:checked").length;const el=document.getElementById("a_cnt");if(el)el.textContent=n?`（${n}店選択）`:"（未選択）";}
function nameOfStore(id){const s=STORESCACHE.find(x=>String(x.id)===String(id));return s?s.name:("店舗"+id);}
async function loadAssignments(){
  const tb=document.querySelector("#atbl"); if(!tb)return;
  // ① 新規割り当て用：ドロップダウン内のチェックボックス（店舗一覧）
  const box=document.getElementById("a_stores");
  if(box){ box.innerHTML=STORESCACHE.map(s=>`<label><input type="checkbox" class="achk" value="${s.id}"><span>${esc(s.name)}</span></label>`).join("")||'<span class="sub">店舗がありません</span>';
    box.querySelectorAll(".achk").forEach(c=>c.onchange=updateAcnt); updateAcnt(); }
  // ② 割り当て済み一覧：メールごとにまとめ、店舗チップ（×で解除）＋「＋店舗を追加」プルダウン
  const {data,error}=await SB.from("app_user_stores").select("email,store_id").order("email");
  if(error){tb.innerHTML=`<tbody><tr><td class="err">読み込み失敗：${esc(error.message)}</td></tr></tbody>`;return;}
  const byEmail=new Map();
  (data||[]).forEach(a=>{ if(!byEmail.has(a.email))byEmail.set(a.email,[]); byEmail.get(a.email).push(a.store_id); });
  const head=`<thead><tr><th>メール</th><th>見せている店舗</th><th>店舗を追加</th></tr></thead>`;
  const rows=[...byEmail.entries()].map(([email,sids])=>{
    const chips=sids.map(id=>`<span class="stchip">${esc(nameOfStore(id))}<button title="解除" data-rm-email="${esc(email)}" data-rm-sid="${id}">×</button></span>`).join("")||'<span class="sub">なし</span>';
    const remaining=STORESCACHE.filter(s=>!sids.includes(s.id));
    const boxes=remaining.map(s=>`<label><input type="checkbox" class="rowchk" data-add-email="${esc(email)}" value="${s.id}"><span>${esc(s.name)}</span></label>`).join("")
      ||'<span class="sub">追加できる店舗はありません</span>';
    const adder=remaining.length?`<details class="dd rowdd" data-email="${esc(email)}"><summary>＋店舗を追加 ▼</summary><div class="ddwrap"><div class="ddgrid">${boxes}</div><div style="margin-top:6px"><button class="btn rowadd" data-add-email="${esc(email)}" type="button" style="padding:5px 12px;font-size:12px">選んだ店を追加</button></div></div></details>`:'<span class="sub">全店割当済み</span>';
    return `<tr><td>${esc(email)}</td><td>${chips}</td><td>${adder}</td></tr>`;
  }).join("")||`<tr><td colspan="3" class="sub">割り当てはまだありません（登録済みユーザーは全員 AVENDメンバー＝全店閲覧）</td></tr>`;
  tb.innerHTML=head+"<tbody>"+rows+"</tbody>";
  tb.querySelectorAll("[data-rm-email]").forEach(b=>b.onclick=async()=>{
    const email=b.dataset.rmEmail, sid=b.dataset.rmSid;
    if(!confirm(`${email} から「${nameOfStore(sid)}」を解除しますか？`))return;
    const {error}=await SB.from("app_user_stores").delete().eq("email",email).eq("store_id",sid);
    msg("a_msg", error?("解除失敗："+error.message):`${email} から「${nameOfStore(sid)}」を解除しました`, !error);
    if(!error)loadAssignments();
  });
  tb.querySelectorAll(".rowadd").forEach(btn=>btn.onclick=async()=>{
    const email=btn.dataset.addEmail;
    const ids=[...tb.querySelectorAll(`.rowchk[data-add-email="${(window.CSS&&CSS.escape)?CSS.escape(email):email}"]:checked`)].map(c=>+c.value);
    if(!ids.length){msg("a_msg","追加する店舗をチェックしてください",false);return;}
    const {error}=await SB.from("app_user_stores").upsert(ids.map(store_id=>({email,store_id})),{onConflict:"email,store_id",ignoreDuplicates:true});
    msg("a_msg", error?("追加失敗："+error.message):`${email} に ${ids.length}店 を追加しました`, !error);
    if(!error)loadAssignments();
  });
}
async function addAssignment(){
  const email=(document.getElementById("a_email").value||"").trim().toLowerCase();
  const ids=[...document.querySelectorAll("#a_stores .achk:checked")].map(c=>+c.value);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg("a_msg","正しいメールアドレスを入れてください",false);return;}
  if(!ids.length){msg("a_msg","見せる店舗を1つ以上チェックしてください",false);return;}
  // 新規メールは staff(=viewer) で登録（既存ユーザーのロールは変えない）。
  // 名簿は users に一本化したので、ここに入れないとログインできない。
  // display_name は必須なので、無ければメールの@より前を使う。
  const {error:e1}=await SB.from("users").upsert(
    {email, display_name:email.split("@")[0], role:"staff", is_active:true, segments:["sales"]},
    {onConflict:"email",ignoreDuplicates:true});
  if(e1){msg("a_msg","ユーザー登録失敗："+e1.message,false);return;}
  const {error:e2}=await SB.from("app_user_stores").upsert(ids.map(store_id=>({email,store_id})),{onConflict:"email,store_id",ignoreDuplicates:true});
  msg("a_msg", e2?("割り当て失敗："+e2.message):`${email} に ${ids.length}店 を割り当てました`, !e2);
  if(!e2){document.getElementById("a_email").value="";document.querySelectorAll("#a_stores .achk").forEach(c=>c.checked=false);updateAcnt();loadAssignments();loadUsers();}
}

// 「変更を更新」ボタンの表示（件数・有効/無効）と未保存件数のラベルを更新する。
function refreshDirty(section){
  const c=SEC[section]; if(!c)return; const n=c.set.size;
  const btn=document.getElementById(c.btn), pill=document.getElementById(c.pill);
  if(btn){btn.disabled=n===0; btn.textContent=n>0?`変更を更新（${n}件）`:"変更を更新";}
  if(pill){pill.textContent=n>0?`未保存の変更 ${n}件`:"変更はありません"; pill.className="pill"+(n>0?" on":"");}
}
// テーブル内の入力欄を監視して、編集された行を「未保存」として記録する。
// 各行の <tr> に data-row（その行のID）が付いている前提。
function bindDirty(section){
  const c=SEC[section]; const tb=document.querySelector(c.tbl); if(!tb)return;
  tb.querySelectorAll("input,select").forEach(el=>{
    const ev=(el.type==="checkbox"||el.tagName==="SELECT")?"change":"input";
    el.addEventListener(ev,e=>{
      const tr=e.target.closest("tr"); if(!tr)return;
      const id=tr.dataset.row; if(id==null||id==="")return;
      c.set.add(id); tr.classList.add("dirty"); refreshDirty(section);
    });
  });
  refreshDirty(section);
}

// 編集した店舗だけ、まとめて保存する。
async function updateStores(){
  const tb=document.querySelector("#stbl"); const ids=[...dirtyStores];
  if(!ids.length){msg("s_msg","変更はありません",true);return;}
  const btn=document.getElementById("s_update"); btn.disabled=true; btn.textContent="更新中…";
  const results=await Promise.all(ids.map(async id=>{
    const q=c=>tb.querySelector(`.${c}[data-id="${id}"]`);
    const payload={ownership:q("sown").value, digitel_slug:q("sslug").value.trim()||null,
      has_entry_data:q("sentry").checked, kpi_visitors:q("skv").checked,
      visible:q("svis").checked, open_date:q("sopen").value||null};
    const {data,error}=await SB.from("stores").update(payload).eq("id",id).select();
    if(error)return {ok:false, err:error.message};
    if(!data||!data.length)return {ok:false, perm:true};   // RLSで弾かれると 0件・エラー無しで返る
    return {ok:true};
  }));
  const fail=results.filter(r=>!r.ok), ok=results.length-fail.length;
  if(fail.some(r=>r.perm)){
    msg("s_msg","一部保存できませんでした（権限）。あなたのアカウントに更新権限が無い可能性があります。管理者に sql/012_fix_store_ownership.sql の実行を依頼してください。",false);
  }else if(fail.length){
    msg("s_msg",`更新：成功${ok}件・失敗${fail.length}件（${esc(fail[0].err||"")}）`,false);
  }else{
    msg("s_msg",`${ok}件の店舗を更新しました`,true);
  }
  await loadStores();
}

    p_url:(document.getElementById("p_url").value||"").trim()||null,
    p_login_id:(document.getElementById("p_id").value||"").trim()||null,
    p_pw:pw, p_active:true});
  msg("p_msg", error?("追加失敗："+error.message):"レジ接続を追加しました", !error);
  if(!error){["p_name","p_url","p_id","p_pw"].forEach(id=>document.getElementById(id).value="");loadPos();}
}
boot();
</script>
</body>
</html>
