<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fd0">
<meta name="robots" content="noindex, nofollow">
<title>店舗運営｜売上KPI管理</title>
<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--warn:#b8860b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--warn:#e0b64a;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--warn:#e0b64a;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--warn:#b8860b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 96px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;}
  .navlink{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px;background:none;border:none;padding:0;font-family:inherit;cursor:pointer;}
  .homebtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    border:1px solid var(--border);background:var(--surface);color:var(--accent);
    border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;}
  .homebtn:hover{border-color:var(--accent);}
  /* ページ内の細かいタブ。スマホ幅でも折り返さず1行（はみ出す分は横スクロール） */
  .subtabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    margin:14px 0 0;padding-bottom:4px;scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
    border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .subtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:14px 0;}
  .panel h2{font-size:15px;margin:2px 0 8px;font-weight:800;}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;}
  .lead{font-size:13px;color:var(--ink2);line-height:1.8;margin:0 0 10px;}
  /* 店舗選択のカード。スマホは1列、広い画面は2〜3列 */
  .storelist{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
  @media(min-width:620px){.storelist{grid-template-columns:1fr 1fr;}}
  .storecard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    padding:14px 14px;cursor:pointer;font-family:inherit;color:var(--ink);}
  .storecard:hover{border-color:var(--accent);}
  .storecard .nm{font-size:16px;font-weight:800;}
  .storecard .meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .storecard .go{margin-left:auto;color:var(--accent);font-size:20px;font-weight:800;}
  .bigbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:14px 22px;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:var(--shadow);}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;}
  .ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink2);border-radius:10px;padding:11px 15px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;}
  .ghost:hover{border-color:var(--accent);color:var(--accent);}
  select.pick{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;
    padding:8px 10px;font-size:13px;font-family:inherit;max-width:100%;}
  /* 棚卸しの項目一覧。表にすると横スクロールになるので、1行1項目の縦並びにする */
  .item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .lbl{flex:1;min-width:0;}
  .item .lbl .nm{font-size:13.5px;font-weight:700;line-height:1.5;}
  .item .lbl .src{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .item .val{text-align:right;font-size:16px;font-weight:800;white-space:nowrap;}
  .item .val.none{color:var(--muted);font-size:14px;font-weight:600;}
  .item .val .u{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:2px;}
  .grouphd{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 2px;letter-spacing:.04em;}
  .grouphd:first-child{margin-top:4px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;color:#fff;}
  .t-final{background:var(--good)} .t-open{background:var(--warn)} .t-none{background:#9aa3ad}
  .src-live{color:var(--good);font-weight:700;}
  .src-todo{color:var(--warn);font-weight:700;}
  .soon{border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;line-height:1.9;}
  .soon b{color:var(--ink);}
  .soon ul{margin:8px 0 0;padding-left:1.2em;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .warnbox{background:var(--accent-weak);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.8;color:var(--ink2);margin-top:10px;}
  .old{color:var(--bad);font-weight:700;}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:720px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;align-items:center;justify-content:center;padding:13px 2px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;border-top:2px solid transparent;}
  .tabbar a.on{border-top-color:var(--accent);color:var(--accent);}
  .tabbar a:active{opacity:.55;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;} .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;} .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn .g{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub" style="padding:40px 0">読み込み中…</div></div>
<nav class="tabbar"><div class="tabbar-in">
  <a href="index.html?g=own" id="tab-own">直営</a>
  <a href="index.html?g=fc" id="tab-fc">FC</a>
  <a href="pl.html">予実</a>
  <a href="unei.html" id="tab-unei" class="on">運営</a>
  <a href="keiei.html" id="tab-keiei" style="display:none">経営</a>
  <a href="admin.html" id="tab-admin" style="display:none">管理</a>
</div></nav>

<script>
"use strict";
// ============================================================
//  店舗運営（運営タブ）
//
//  【何のページか】
//   数字（直営・FC・予実・経営）とは別に、現場の回し方をまとめる入口。
//   ★まず店舗を選ぶ → その店の中を細かいタブで分ける、という順にしてある。
//   対象は直営店だけ（現場オペは直営で回すため。FCは選択肢に出さない）。
//
//  【棚卸しタブ】
//   店舗単位で「棚卸しの項目」を1枚に並べる。
//   いまは項目（枠）を確定させる段階で、値の取得元は項目ごとにこれから決める。
//     ・すでに繋いである項目 … 在庫アプリの棚卸スキャン（scan_session_totals）
//     ・まだ決めていない項目 … 「取得元：未定」と画面に出す（黙って空にしない）
//   数えるページそのものは在庫アプリの /scan-stocktake。ここには作らない
//   （同じ機能を2つ持たない）。
//
//  【見せる相手】
//   社内は全員（閲覧のみの人も含む）。加盟オーナー（社外）には出さない。
//   ・タブバーそのものが加盟店モードでは非表示（dashboard.html）
//   ・このページ単体で開かれても下の gate で弾く
// ============================================================
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
// 在庫アプリ（同一ドメインの1つ上）。棚卸スキャンと手順書はこちらにある。
const SCAN_URL="../scan-stocktake";
const MANUAL_URL="../scan-stocktake/manual.html";
const A4_URL="../scan-stocktake/a4.pdf";

let SB=null, ME={email:"",role:null};
let STORE=null;                    // 選んでいるPOS店舗id（null＝店舗選択の画面）
let TAB="stocktake";               // 店舗の中の細かいタブ
let SESSION_ID=null;               // 棚卸しタブで見ている棚卸し（null＝いちばん新しいもの）
let SCAN={loaded:false,error:null,rows:[],stores:[],destName:{},posOfDest:{},destOfPos:{}};

const NUM=n=>Math.round(n).toLocaleString("ja-JP");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function screen(h){document.getElementById("app").innerHTML=h;}
function showError(e){screen('<div class="err">読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function daysBetween(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);}

async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;
  s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした（通信環境をご確認ください）"));document.head.appendChild(s);}); }

// 管理・経営タブは管理者だけに出す（他ページと同じ判定）
function syncAdminTab(){const ad=!!(ME&&ME.role==="admin");
  const t=document.getElementById("tab-admin");if(t)t.style.display=ad?"":"none";
  const k=document.getElementById("tab-keiei");if(k)k.style.display=ad?"":"none";}

async function boot(){
  try{
    let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
    if(!cfg||cfg.mode!=="auth"){
      screen('<div class="gate"><div class="logo">店舗運営</div><div class="t">ログインが必要です</div>'+
        '<div class="m">Googleログインの設定が完了すると利用できます。</div>'+
        '<div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>'); return;
    }
    await ensureSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){showLogin();return;}
    ME.email=(session.user&&session.user.email||"").toLowerCase();
    // 名簿は在庫アプリと共通の users テーブル1枚。ロールの語彙が違うので読み替える。
    let role=null;
    try{
      const {data:u}=await SB.from("users").select("role,is_active,segments").ilike("email",ME.email).maybeSingle();
      if(u&&u.is_active&&(u.segments||[]).includes("sales"))
        role=u.role==="admin"?"admin":(u.role==="manager"?"editor":"viewer");
    }catch(e){}
    ME.role=role;
    syncAdminTab();
    if(!ME.role){ showDenied("アクセス権がありません。管理者にユーザー追加を依頼してください。"); return; }
    if(await isFranchisee()){ showDenied("このページは社内メンバー専用です。"); return; }
    render();
    await loadStocktake();
    render();
  }catch(e){ showError(e); }
}

// 社外（加盟オーナー）かどうか。
//   ・users.is_internal を正とする。列を読めなかったときは判断材料にしない（null）
//   ・加えて app_user_stores に割り当てがあれば加盟店（dashboard.html の判定と同じ。
//     admin/editor は割り当てがあっても本部扱い）
// is_internal が読めず割り当ても無い人は社内として通す（社内メンバーの既定と同じ）。
async function isFranchisee(){
  let internal=null;
  try{
    const {data,error}=await SB.from("users").select("is_internal").ilike("email",ME.email).maybeSingle();
    if(!error&&data&&data.is_internal!=null)internal=!!data.is_internal;
  }catch(e){}
  if(internal===false)return true;
  if(ME.role==="admin"||ME.role==="editor")return false;
  try{
    const {data}=await SB.from("app_user_stores").select("store_id").eq("email",ME.email);
    if((data||[]).length)return true;
  }catch(e){}
  return false;
}

function showLogin(){
  screen('<div class="gate"><div class="logo">店舗運営</div><div class="t">ログイン</div>'+
    '<div class="m">登録済みの Google アカウントでログインしてください。</div>'+
    '<button class="gbtn" id="gl"><span class="g"></span>Google でログイン</button></div>');
  document.getElementById("gl").onclick=async()=>{const redirectTo=location.origin+location.pathname+location.search;
    await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}});};
}
function showDenied(msg){
  screen('<div class="gate"><div class="logo">店舗運営</div><div class="t">アクセスできません</div>'+
    '<div class="m">'+esc(msg)+'</div>'+
    '<button class="gbtn" id="lo"><span class="g"></span>別のアカウントでログイン</button>'+
    '<div style="margin-top:14px"><a class="navlink" href="index.html">← ダッシュボードへ</a></div></div>');
  document.getElementById("lo").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
}

// ---- 画面の状態はURLに載せる（共有・リロードで戻れるように）------------------
const SUBTABS=[
  {key:"stocktake", label:"棚卸し"},
  {key:"rack",      label:"ラック効率"},
  {key:"teirei",    label:"直営定例"},
];
function readState(){
  const q=new URLSearchParams(location.search);
  const s=q.get("store"); STORE=(s&&/^\d+$/.test(s))?+s:null;
  const t=q.get("t");     TAB=SUBTABS.some(x=>x.key===t)?t:"stocktake";
}
function pushState(){
  const u=new URL(location.href);
  if(STORE==null)u.searchParams.delete("store"); else u.searchParams.set("store",STORE);
  u.searchParams.set("t",TAB);
  history.replaceState(null,"",u.toString());
}
function selectStore(id){ STORE=id; SESSION_ID=null; pushState(); render(); window.scrollTo(0,0); }
function clearStore(){ STORE=null; SESSION_ID=null; pushState(); render(); window.scrollTo(0,0); }
function setTab(key){ TAB=key; SESSION_ID=null; pushState(); render(); }

// ---- 描画 ------------------------------------------------------------------
function headerHtml(sub){
  return `<header>
      <h1>店舗運営</h1>
      <span class="sub">${esc(sub||ME.email)}</span>
      <a class="navlink" href="index.html" style="margin-left:auto">← ダッシュボード</a>
      <button class="themebtn" id="themebtn">◐ 表示</button>
      <button class="themebtn" id="logout">ログアウト</button>
      <a class="homebtn" href="../" title="アプリのトップへ">ホーム</a>
    </header>`;
}
function bindHeader(){
  document.getElementById("themebtn").onclick=()=>{const r=document.documentElement;
    const c=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    r.setAttribute("data-theme",c==="dark"?"light":"dark");};
  document.getElementById("logout").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
}
function render(){ STORE==null?renderPicker():renderStore(); }

// 店舗選択（直営のみ）。カードには最後に数えた日を出して、押す前に状況が分かるようにする。
function renderPicker(){
  const stores=ownStores();
  const today=todayStr();
  const cards=stores.map(s=>{
    const t=latestOf(s.id);
    const days=t?daysBetween(t.taken_on,today):null;
    const meta=!SCAN.loaded?"読み込み中…"
      :!t?"棚卸しの記録なし"
      :`直近の棚卸し ${t.taken_on}（${days===0?"今日":NUM(days)+"日前"}）`+
        `${t.status==="final"?"":"・作業中"}`;
    return `<button class="storecard" data-store="${s.id}">
      <span class="lbl"><span class="nm">${esc(s.name)}</span>
        <span class="meta ${days!=null&&days>=45?"old":""}">${esc(meta)}</span></span>
      <span class="go">›</span></button>`;
  }).join("");
  screen(`${headerHtml()}
    <div class="panel">
      <h2>店舗を選ぶ</h2>
      <p class="lead">現場の作業は店舗ごとに回します。まず店舗を選んでください。<br>
        <span class="sub">直営店だけを出しています。</span></p>
      <div class="storelist">${cards||'<span class="sub">直営店が見つかりませんでした。</span>'}</div>
      ${SCAN.error?`<div class="warnbox">棚卸しの記録を読み込めませんでした（${esc(SCAN.error)}）。店舗は選べます。</div>`:""}
    </div>`);
  bindHeader();
  document.querySelectorAll(".storecard").forEach(b=>{b.onclick=()=>selectStore(+b.dataset.store);});
}

// 店舗を選んだあとの画面。細かいタブはこの中に置く。
function renderStore(){
  const s=storeOf(STORE);
  screen(`${headerHtml()}
    <div style="margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <button class="navlink" id="backstore">‹ 店舗を変える</button>
      <span style="font-size:17px;font-weight:800">${esc(s?s.name:"（不明な店舗）")}</span></div>
    <div class="subtabs">${SUBTABS.map(t=>
      `<button data-tab="${t.key}"${t.key===TAB?' class="on"':""}>${esc(t.label)}</button>`).join("")}</div>
    <div id="body">${TAB==="stocktake"?stocktakeHtml():TAB==="rack"?rackHtml():teireiHtml()}</div>`);
  bindHeader();
  document.getElementById("backstore").onclick=clearStore;
  document.querySelectorAll(".subtabs button").forEach(b=>{b.onclick=()=>setTab(b.dataset.tab);});
  bindStocktake();
}
// 棚卸しの選択（同じ店の過去ぶんを見る）。中身だけ差し替えるので、毎回つなぎ直す。
function bindStocktake(){
  const sel=document.getElementById("sesspick");
  if(sel)sel.onchange=()=>{SESSION_ID=sel.value||null;
    const b=document.getElementById("body"); if(b)b.innerHTML=stocktakeHtml(); bindStocktake();};
}

// ---- データ ----------------------------------------------------------------
// 店舗      … 売上アプリの店舗（dash_store）。直営だけを使う
// 対応付け  … pos_store_links（POS店舗→発送先。両アプリともこれを正とする）
// 棚卸しの数 … scan_session_totals（ダブルチェック済みだけを数えたビュー）
async function loadStocktake(){
  try{
    const [links,stores,sessions]=await Promise.all([
      SB.from("pos_store_links").select("pos_store_id,destination_id"),
      SB.from("dash_store").select("store_id,name,ownership,visible"),
      SB.from("scan_session_totals")
        .select("session_id,destination_id,taken_on,status,garment_qty,accessory_qty,last_checked_at")
        .order("taken_on",{ascending:false}).limit(500),
    ]);
    SCAN.stores=((stores.data||[]).filter(s=>s.visible!==false)
      .map(s=>({id:s.store_id,name:s.name,own:s.ownership||""})));
    SCAN.posOfDest={}; SCAN.destOfPos={};
    for(const l of (links.data||[])){ if(!l.destination_id)continue;
      SCAN.posOfDest[l.destination_id]=l.pos_store_id; SCAN.destOfPos[l.pos_store_id]=l.destination_id; }
    if(sessions.error)throw new Error(sessions.error.message);
    SCAN.rows=sessions.data||[];
    SCAN.loaded=true;
  }catch(e){ SCAN.loaded=true; SCAN.error=String(e&&e.message||e); }
}
function ownStores(){ return SCAN.stores.filter(s=>s.own==="直営")
  .sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")); }
function storeOf(id){ return SCAN.stores.find(s=>String(s.id)===String(id))||null; }
// その店の棚卸しを新しい順で返す（rows は taken_on の降順で読んである）
function sessionsOf(posId){ const d=SCAN.destOfPos[posId]; if(!d)return [];
  return SCAN.rows.filter(r=>r.destination_id===d); }
function latestOf(posId){ return sessionsOf(posId)[0]||null; }

// ---- 棚卸しタブ ------------------------------------------------------------
// 項目（枠）をここに1本で持つ。値の取得元は項目ごとにこれから決める。
//   src   … 画面に出す取得元の説明
//   live  … すでに繋いである項目（true）／まだ決めていない項目（false）
//   get   … live のときだけ使う。棚卸し1件（t）から値を作る
const STOCKTAKE_ITEMS=[
  {g:"実地で数えた数"},
  {n:"① 棚卸日",            src:"棚卸スキャン",             live:true,  get:t=>t?t.taken_on:null},
  {n:"② 状態",              src:"棚卸スキャン",             live:true,  get:t=>t?(t.status==="final"
      ?'<span class="tag t-final">確定</span>':'<span class="tag t-open">作業中</span>'):null, raw:true},
  {n:"③ 実地在庫（服）",     src:"棚卸スキャン",             live:true,  get:t=>t?NUM(t.garment_qty)+'<span class="u">着</span>':null, raw:true},
  {n:"④ 実地在庫（小物）",   src:"棚卸スキャン",             live:true,  get:t=>t?NUM(t.accessory_qty)+'<span class="u">点</span>':null, raw:true},
  {n:"⑤ 場所別の内訳（店内／BY／その他倉庫）", src:"取得元：未定", live:false},
  {n:"⑥ 数えた人・確認した人", src:"取得元：未定",            live:false},

  {g:"理論在庫の材料"},
  {n:"⑦ 前月末の在庫（服）", src:"取得元：未定",              live:false},
  {n:"⑧ 当月の入荷（服）",   src:"取得元：未定",              live:false},
  {n:"⑨ 小計（⑦＋⑧）",      src:"計算（⑦と⑧が決まったら）", live:false},
  {n:"⑩ 当月の販売数（服）", src:"取得元：未定",              live:false},
  {n:"⑪ 控除（イレギュラー・返送など）", src:"取得元：未定",   live:false},
  {n:"⑫ 理論在庫（⑨−⑩−⑪）", src:"計算（⑨〜⑪が決まったら）", live:false},

  {g:"差分"},
  {n:"⑬ 差分（③−⑫）",       src:"計算（③と⑫が決まったら）", live:false},
  {n:"⑭ 差分率",             src:"計算（⑬÷⑫）",             live:false},
  {n:"⑮ 差分の理由",         src:"取得元：未定",              live:false},

  {g:"あと処理"},
  {n:"⑯ 月次棚卸へ送ったか", src:"取得元：未定",              live:false},
];

function stocktakeHtml(){
  const list=sessionsOf(STORE);
  const cur=SESSION_ID?list.find(r=>r.session_id===SESSION_ID)||null:(list[0]||null);
  const s=storeOf(STORE);
  const linked=!!SCAN.destOfPos[STORE];
  const scanHref=linked?`${SCAN_URL}?pos=${encodeURIComponent(STORE)}`:SCAN_URL;

  const picker=list.length>1?`<div style="margin:0 0 10px">
      <span class="sub">見る棚卸し：</span>
      <select class="pick" id="sesspick">${list.slice(0,24).map(r=>
        `<option value="${r.session_id}"${(cur&&cur.session_id===r.session_id)?" selected":""}>`+
        `${esc(r.taken_on)}${r.status==="final"?"（確定）":"（作業中）"}</option>`).join("")}</select>
    </div>`:"";

  const rows=STOCKTAKE_ITEMS.map(it=>{
    if(it.g)return `<div class="grouphd">${esc(it.g)}</div>`;
    let v=null; if(it.live&&it.get)v=it.get(cur);
    const val=(v==null||v==="")?'<span class="val none">—</span>'
      :`<span class="val">${it.raw?v:esc(v)}</span>`;
    return `<div class="item">
      <span class="lbl"><span class="nm">${esc(it.n)}</span>
        <span class="src ${it.live?"src-live":"src-todo"}">${esc(it.src)}</span></span>
      ${val}</div>`;
  }).join("");

  return `
    <div class="panel">
      <h2>棚卸し｜${esc(s?s.name:"")}</h2>
      ${!SCAN.loaded?'<p class="lead">読み込み中…</p>':""}
      ${SCAN.error?`<div class="warnbox">棚卸しの記録を読み込めませんでした（${esc(SCAN.error)}）。</div>`:""}
      ${(!SCAN.error&&SCAN.loaded&&!linked)?`<div class="warnbox">この店舗は発送先（在庫アプリの店舗）と対応付いていないため、棚卸しの記録を引けません。<br>在庫アプリの「店舗の対応付け」（/store-links）で結んでください。</div>`:""}
      ${(!SCAN.error&&SCAN.loaded&&linked&&!list.length)?'<div class="warnbox">この店舗の棚卸しはまだ記録がありません。</div>':""}
      ${picker}
      ${rows}
      <p class="note">数はダブルチェックまで済んだぶんだけです（読み取ったままの場所は入りません）。<br>
        服は「着」、小物は「点」で数え方が違うので合算していません。</p>
    </div>
    <div class="panel">
      <h2>数える</h2>
      <p class="lead">値札のバーコードで数えるのは、在庫アプリの棚卸スキャンです。</p>
      <div class="btnrow">
        <a class="bigbtn" href="${scanHref}">📷 ${esc(s?s.name:"この店舗")}の棚卸スキャンを開く</a>
        <a class="ghost" href="${MANUAL_URL}" target="_blank" rel="noopener">📖 使い方</a>
        <a class="ghost" href="${A4_URL}" target="_blank" rel="noopener">🖨 店舗貼り出し用（A4・1枚）</a>
      </div>
      <p class="note">数える人（アルバイト・就労支援施設の方など）は、Googleでログインして棚卸スキャンを開くと自動で登録されます。事前のユーザー追加は不要です。</p>
    </div>
    <div class="panel">
      <h2>取得元について</h2>
      <div class="soon"><b>いまは項目（枠）を決めている段階です。</b>
        <span class="src-live">緑</span>の項目はすでに棚卸スキャンから引いています。
        <span class="src-todo">「取得元：未定」</span>の項目は、どこから引くか（または手入力にするか）を決めてから繋ぎます。</div>
    </div>`;
}

// ---- ラック効率（枠だけ）---------------------------------------------------
function rackHtml(){
  const s=storeOf(STORE);
  return `
    <div class="panel">
      <h2>ラック効率｜${esc(s?s.name:"")}</h2>
      <div class="soon">
        <b>この版では枠だけです。</b>置き場所（ラック・什器）ごとに、置いている量に対してどれだけ売れているかを見るためのタブです。<br>
        作る前に決めることがあります：
        <ul>
          <li><b>分母</b>… 棚卸スキャンが持っているラック別の在庫数（着数）を使うか、什器の枚数（容量）を使うか</li>
          <li><b>分子</b>… いまのPOSは「どのラックの商品が売れたか」を持っていません。カテゴリ別の売上でラックを推定するか、値札の分類で寄せるか</li>
          <li><b>期間</b>… 棚卸しは月1回なので、在庫は棚卸日の断面・売上は月合計、という粒度でよいか</li>
        </ul>
      </div>
    </div>`;
}

boot();
