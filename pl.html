<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NOTIME 月次予実</title>
<style>
  :root{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;
    --accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);--radius:14px;}
  @media (prefers-color-scheme: dark){:root{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;
    --accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{ --bg:#0e1116;--surface:#161b22;--surface2:#1c232c;--border:#2a323c;--ink:#e7ebef;--ink2:#a3adb8;--muted:#727d89;--accent:#5b9bff;--accent-weak:#1e2f4a;--good:#3fce8c;--bad:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4);}
  :root[data-theme="light"]{ --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--border:#e2e6ea;--ink:#1a1d21;--ink2:#5b636c;--muted:#8a929b;--accent:#2f6fd0;--accent-weak:#dbe6f7;--good:#1a8a5a;--bad:#c0392b;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 88px;}
  header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px;}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 4px;}
  select{appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 30px 8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  label.lbl{font-size:12px;color:var(--muted);}
  .navlink{border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
  .navlink:hover{border-color:var(--accent);}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);}
  .tabbar-in{max-width:600px;margin:0 auto;display:flex;}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}
  .tabbar a .ic{font-size:19px;line-height:1;filter:grayscale(.25) opacity(.85);}
  .tabbar a.on{color:var(--accent);}
  .tabbar a.on .ic{filter:none;}
  .tabbar a:active{opacity:.55;}
  .themebtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer;}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  .chip:hover{color:var(--ink);border-color:var(--accent);}
  .subtoggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin:10px 0 2px;}
  .subtoggle button{border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;}
  .subtoggle button.on{background:var(--accent);color:#fff;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;margin:14px 0;}
  .panel h2{font-size:14px;margin:0 0 8px;font-weight:700;}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .hcard{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;}
  .hcard .k{font-size:12px;color:var(--ink2);font-weight:600;}
  .hcard .v{font-size:22px;font-weight:800;margin-top:3px;line-height:1.1;}
  .hcard .s{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
  .fhero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;}
  .fhero .big{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.05;}
  .fhero .lbl2{font-size:12px;color:var(--ink2);font-weight:600;}
  .pills{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:8px;}
  .pill{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:12px;color:var(--ink2);font-weight:600;}
  .pill b{color:var(--ink);}
  .delta{font-weight:700;}
  .rowflex{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center;margin:2px 0 6px;}
  .field{display:flex;align-items:center;gap:8px;} .field label{font-size:12.5px;color:var(--ink2);font-weight:600;}
  .tblwrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);}
  th{color:var(--ink2);font-weight:700;font-size:11px;background:var(--surface);}
  tr.sect td{background:var(--surface2);font-weight:750;font-size:11.5px;color:var(--ink2);}
  tr.total td{font-weight:750;border-top:2px solid var(--border);background:var(--surface2);}
  input.num{width:104px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;text-align:right;font-family:inherit;}
  input.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak);}
  input.num.edit{color:var(--accent);}
  .auto{color:var(--ink);font-weight:700;}
  .up{color:var(--good);} .down{color:var(--bad);} .mut{color:var(--muted);}
  .note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.7;}
  .foot{color:var(--muted);font-size:11px;margin-top:18px;line-height:1.7;}
  .err{padding:20px;color:var(--bad);font-weight:600;}
  .gate{max-width:440px;margin:14vh auto;text-align:center;padding:0 22px;}
  .gate .logo{font-size:22px;font-weight:750;letter-spacing:.02em;}
  .gate .t{font-size:16px;font-weight:700;margin:18px 0 6px;}
  .gate .m{color:var(--ink2);font-size:14px;line-height:1.8;}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:11px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);margin-top:18px;}
  .gbtn:hover{border-color:var(--accent);}
  .gbtn .g{width:18px;height:18px;display:inline-block;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sub" style="padding:40px 0">読み込み中…</div></div>
<nav class="tabbar"><div class="tabbar-in">
  <a href="index.html"><span class="ic">📊</span>サマリー</a>
  <a href="pl.html" class="on"><span class="ic">📋</span>予実</a>
  <a href="trends.html"><span class="ic">📈</span>推移</a>
</div></nav>
<script>
"use strict";
const YEN=n=>Math.round(n).toLocaleString("ja-JP");
const NUM=n=>Math.round(n).toLocaleString("ja-JP");
const F1=n=>(Math.round(n*10)/10).toLocaleString("ja-JP",{minimumFractionDigits:1,maximumFractionDigits:1});
const F2=n=>(Math.round(n*100)/100).toLocaleString("ja-JP",{minimumFractionDigits:2,maximumFractionDigits:2});
const state={store:"all",ym:null,view:"pl"};   // view: "pl"=月次予実 / "fc"=着地見込み
let DATA=null, A=null, M={}, AUTO=null, fc=null;

const CONFIG_URL="https://rwfcsanmqvkxiuwdeddv.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null, ME={email:"",role:null};
function screen(h){document.getElementById("app").innerHTML=h;}
function showError(e){screen('<div class="err">データを読み込めませんでした：'+esc(String(e&&e.message||e))+'</div>');}
function prep(){ if(!DATA||!DATA.daily)throw new Error("データが空です");
  const ds=DATA.daily.map(r=>r.d).sort(); DATA._min=ds[0];DATA._max=ds[ds.length-1];
  const sd=DATA.daily.filter(r=>(r.tx||0)>0||(r.in||0)>0).map(r=>r.d).sort();
  DATA._salesMax=sd.length?sd[sd.length-1]:DATA._max; }
async function boot(){ try{
  if(window.__DATA__){DATA=window.__DATA__;prep();render();return;}
  let cfg=null; try{cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();}catch(e){}
  if(cfg&&cfg.mode==="auth"){await authBoot(cfg.url,cfg.anon);return;}
  const url=(cfg&&cfg.dataUrl)||"data.json";
  DATA=await (await fetch(url,{cache:"no-store"})).json(); prep(); render();
}catch(e){showError(e);} }
async function ensureSupabase(){ if(window.supabase)return; await new Promise((res,rej)=>{const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));document.head.appendChild(s);}); }
async function authBoot(url,anon){ screen('<div class="sub" style="padding:40px 0">読み込み中…</div>'); await ensureSupabase();
  SB=window.supabase.createClient(url,anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return;}
  ME.email=(session.user&&session.user.email||"").toLowerCase();
  let role=null; try{const {data:u}=await SB.from("app_users").select("role").eq("email",ME.email).maybeSingle();role=u&&u.role||null;}catch(e){}
  ME.role=role;
  if(!ME.role){showDenied(ME.email);return;}
  const {data,error}=await SB.storage.from("dashboard-data").download("data.json");
  if(error)throw new Error("データを取得できませんでした（"+error.message+"）");
  DATA=JSON.parse(await data.text()); prep(); render(); }
function showLogin(){ screen(`<div class="gate"><div class="logo">NOTIME 月次予実</div>
  <div class="t">ログイン</div><div class="m">許可されたメンバー専用です。<br>管理者に登録された Google アカウントでログインしてください。</div>
  <button class="gbtn" id="glogin"><span class="g"></span>Google でログイン</button></div>`);
  document.getElementById("glogin").onclick=doLogin; }
function showDenied(email){ screen(`<div class="gate"><div class="logo">NOTIME 月次予実</div>
  <div class="t">アクセス権がありません</div><div class="m"><b>${esc(email)}</b> はまだ登録されていません。<br>管理者（Shoさん）にユーザー追加を依頼してください。</div>
  <button class="gbtn" id="grelogin"><span class="g"></span>別のアカウントでログイン</button></div>`);
  document.getElementById("grelogin").onclick=doLogout; }
async function doLogin(){ const redirectTo=location.origin+location.pathname;
  const {error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo,queryParams:{prompt:"select_account"}}}); if(error)showError(error); }
async function doLogout(){try{await SB.auth.signOut();}catch(e){}location.reload();}

function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}
function monthsInData(){return [...new Set(DATA.daily.map(r=>r.d.slice(0,7)))].sort();}
function usableStores(){const w=new Set(DATA.daily.map(r=>r.s));return DATA.stores.filter(s=>w.has(s.id));}
function computeActual(store,ym){
  const ids=store==="all"?new Set(usableStores().map(s=>s.id)):new Set([store]);
  const a={in:0,ex:0,tx:0,it:0,v:0,bag:0,bagq:0,hasV:false};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue; if(r.d.slice(0,7)!==ym)continue;
    a.in+=r.in||0;a.ex+=r.ex||0;a.tx+=r.tx||0;a.it+=r.it||0;a.bag+=r.bag||0;a.bagq+=r.bagq||0;
    if(r.v!=null){a.v+=r.v;a.hasV=true;} }
  if(!a.hasV)a.v=0; return a;
}

// 実績が自動で出るKPI（予算は記入式）
const KPIS=[
  {k:"inTax",name:"税込売上（レジ袋込）",fmt:YEN,u:"円",budget:true, av:a=>a.in+a.bag},
  {k:"in",   name:"税込売上（レジ袋除）",fmt:YEN,u:"円",budget:true, av:a=>a.in},
  {k:"ex",   name:"税抜売上",           fmt:YEN,u:"円",budget:true, av:a=>a.ex},
  {k:"v",    name:"来店客数",           fmt:NUM,u:"人",budget:true, av:a=>a.v},
  {k:"tx",   name:"購入客数（取引数）",  fmt:NUM,u:"件",budget:true, av:a=>a.tx},
  {k:"pr",   name:"購入率",             fmt:F1, u:"%", budget:true, av:a=>a.v?a.tx/a.v*100:null},
  {k:"aov",  name:"客単価（税込）",       fmt:YEN,u:"円",budget:true, av:a=>a.tx?a.in/a.tx:null},
  {k:"it",   name:"販売数",             fmt:NUM,u:"点",budget:true, av:a=>a.it},
  {k:"aup",  name:"商品単価（税抜）",     fmt:YEN,u:"円",budget:true, av:a=>a.it?a.ex/a.it:null},
  {k:"upt",  name:"平均購入数",         fmt:F2, u:"点",budget:true, av:a=>a.tx?a.it/a.tx:null},
  {k:"bag",  name:"レジ袋売上",         fmt:YEN,u:"円",budget:false,av:a=>a.bag},
  {k:"bagq", name:"レジ袋・クーポン数", fmt:NUM,u:"点",budget:false,av:a=>a.bagq},
];
// 販管費の項目（すべて記入式。予算/実績の2列）
const COSTS=["家賃","人件費","広告費(Meta/LINE)","PR費用","決済手数料","配送料","タグ代","水光熱","通信・USEN",
  "監視カメラ","本社配賦","火災保険","初期ローン","入店管理システム","レジ利用料","物件更新手数料","保証会社更新手数料","その他"];
const PAYS=["現金","カード決済","QRコード","電子マネー"];

// 各店の月次予実シート(見込計算表)の予算。in=税込売上/ex=税抜売上/v=来店客数。
// 未保存の月は初期値として使い（初回オープン時に保存）、以後は手修正・削除できます。
const BUDGETS={
  "山形":{"2026-03":{in:4698307,ex:4271188,v:3251},"2026-04":{in:4388578,ex:3989616,v:2927},"2026-05":{in:4332260,ex:3938418,v:2718},"2026-06":{in:3086094,ex:2805540,v:2033},"2026-07":{in:2565420,ex:2332200,v:1690},"2026-08":{in:2460266,ex:2236605,v:1880},"2026-09":{in:1975050,ex:1795500,v:1575},"2026-10":{in:2358048,ex:2143680,v:1740},"2026-11":{in:2716560,ex:2469600,v:1838},"2026-12":{in:3121642,ex:2837856,v:1689},"2027-01":{in:3172620,ex:2884200,v:1840},"2027-02":{in:2165130,ex:1968300,v:1458}},
  "いわき":{"2026-04":{in:3690747,ex:3355225},"2026-05":{in:5039496,ex:4581360},"2026-06":{in:3564000,ex:3240000},"2026-07":{in:3310560,ex:3009600},"2026-08":{in:2583279,ex:2348435},"2026-09":{in:1949063,ex:1771875},"2026-10":{in:2335271,ex:2122974},"2026-11":{in:2703826,ex:2458024},"2026-12":{in:3141152,ex:2855593},"2027-01":{in:3187800,ex:2898000},"2027-02":{in:2171144,ex:1973768},"2027-03":{in:2384168,ex:2167425}},
  "福井":{"2026-06":{in:9814358,ex:8922144},"2026-07":{in:6831000,ex:6210000},"2026-08":{in:4533779,ex:4121618},"2026-09":{in:2876816,ex:2615288},"2026-10":{in:3472367,ex:3156698},"2026-11":{in:4006077,ex:3641888},"2026-12":{in:4697460,ex:4270419},"2027-01":{in:4117286,ex:3742988},"2027-02":{in:2817738,ex:2561580},"2027-03":{in:3103791,ex:2821628},"2027-04":{in:3378623,ex:3071475},"2027-05":{in:3772230,ex:3429300}},
};
function budStoreName(sid){const s=(DATA.stores||[]).find(x=>String(x.id)===String(sid));return s?s.name:"";}
// シート予算を b_ キー（予算入力欄のキー）に変換。税込→b_inTax/b_in、税抜→b_ex、来店→b_v。
function storeSeed(sid,ym){
  const b=(BUDGETS[budStoreName(sid)]||{})[ym]; if(!b)return {};
  const o={};
  if(Number.isFinite(b.in)){o.b_inTax=b.in;o.b_in=b.in;}
  if(Number.isFinite(b.ex))o.b_ex=b.ex;
  if(Number.isFinite(b.v))o.b_v=b.v;
  return o;
}
// 着地見込みの目標（税込予算）。総合は各店合計（登録のある店だけ）。
function fcBudget(store,ym){
  if(store==="all"){let sum=0;(DATA.stores||[]).forEach(s=>{const b=(BUDGETS[s.name]||{})[ym];if(b&&Number.isFinite(b.in))sum+=b.in;});return sum;}
  const b=(BUDGETS[budStoreName(store)]||{})[ym]; return (b&&Number.isFinite(b.in))?b.in:0;
}

function mkey(){return `notime-pl-${state.store}-${state.ym}`;}
function loadM(){
  let raw=null; try{raw=localStorage.getItem(mkey());}catch(e){}
  if(raw){ try{return JSON.parse(raw);}catch(e){return {};} }
  // 初回：シートの予算を初期値として保存（以後は普通の入力として編集・削除可能）
  const seed=isAll()?{}:storeSeed(state.store,state.ym);
  if(Object.keys(seed).length){ try{localStorage.setItem(mkey(),JSON.stringify(seed));}catch(e){} }
  return {...seed};
}
function saveM(){ try{localStorage.setItem(mkey(),JSON.stringify(M));}catch(e){} }
function g(k){const v=M[k];return Number.isFinite(v)?v:0;}
function has(k){return Number.isFinite(M[k]);}
function inp(k,step){return `<input class="num pin" data-k="${k}" type="number" step="${step||1}" value="${has(k)?M[k]:""}" placeholder="—">`;}

// 総合（全店）は各店の入力値の合計。金額系は合計、比率は合計した基礎値から計算。
function isAll(){return state.store==="all";}
function storeMof(sid){
  let raw=null; try{raw=localStorage.getItem(`notime-pl-${sid}-${state.ym}`);}catch(e){}
  if(raw){ try{return JSON.parse(raw);}catch(e){return {};} }
  return storeSeed(sid,state.ym);  // 未保存ならシート予算を初期値として合計に反映
}
function sumStores(key){let t=0,any=false;for(const s of usableStores()){const m=storeMof(s.id);if(Number.isFinite(m[key])){t+=m[key];any=true;}}return any?t:null;}
function effNum(key){ return isAll()? sumStores(key) : (Number.isFinite(M[key])?M[key]:null); }
function E(key){const v=effNum(key);return Number.isFinite(v)?v:0;}
function budKPI(k){
  if(!isAll()) return Number.isFinite(M["b_"+k])?M["b_"+k]:null;
  const S=x=>sumStores("b_"+x);
  if(["inTax","in","ex","v","tx","it"].includes(k)) return S(k);
  const inn=S("in"),tx=S("tx"),v=S("v"),ex=S("ex"),it=S("it");
  if(k==="pr")  return (v&&tx!=null)? tx/v*100 : null;
  if(k==="aov") return (tx&&inn!=null)? inn/tx : null;
  if(k==="aup") return (it&&ex!=null)? ex/it : null;
  if(k==="upt") return (tx&&it!=null)? it/tx : null;
  return null;
}
// 金額の入力セル（総合は合計を読み取り専用表示）
function amtCell(key){ if(!isAll()) return inp(key,1000);

// KPI予算の入力セル（総合は合計/派生を読み取り専用表示）
function budCell(m){ if(!m.budget) return "";
  if(!isAll()) return inp("b_"+m.k, m.k==="pr"?0.1:(m.k==="upt"?0.01:(["v","tx","it","bagq"].includes(m.k)?1:1000)));

// ======= 着地見込み（旧・別ページを予実タブに統合）=======
function isWeekend(d){const g=new Date(d+"T00:00:00Z").getUTCDay();return g===0||g===6;}
function addDays(d,n){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function monthEnd(ym){const[y,m]=ym.split("-").map(Number);const last=new Date(Date.UTC(y,m,0)).getUTCDate();return `${ym}-${String(last).padStart(2,"0")}`;}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const METS=["in","ex","tx","it","v"];
function computeAuto(store, ym){
  const ids = store==="all" ? new Set(usableStores().map(s=>s.id)) : new Set([store]);
  const mS=ym+"-01", mE=monthEnd(ym), today=todayStr(), winStart=addDays(mS,-56);
  const byDate={};
  for(const r of DATA.daily){ if(!ids.has(r.s))continue; if(r.d<winStart||r.d>mE)continue;
    const a=byDate[r.d]||(byDate[r.d]={in:0,ex:0,tx:0,it:0,v:0,hasV:false});
    a.in+=r.in||0;a.ex+=r.ex||0;a.tx+=r.tx||0;a.it+=r.it||0;if(r.v!=null){a.v+=r.v;a.hasV=true;} }
  const monthDates=Object.keys(byDate).filter(d=>d>=mS&&d<=mE).sort();
  const closing = monthDates.filter(d=>d<=today).slice(-1)[0] || null;
  const td={in:0,ex:0,tx:0,it:0,v:0};
  const wk={in:0,ex:0,tx:0,it:0,v:0,n:0}, we={in:0,ex:0,tx:0,it:0,v:0,n:0};
  if(closing) for(const d of monthDates){ if(d>closing)continue; const a=byDate[d]; const b=isWeekend(d)?we:wk;
    METS.forEach(k=>{b[k]+=a[k];td[k]+=a[k];}); b.n++; }
  const trWk={in:0,ex:0,tx:0,it:0,v:0,n:0}, trWe={in:0,ex:0,tx:0,it:0,v:0,n:0};
  const trFrom=addDays(closing||today,-56), trTo=closing||addDays(today,-1);
  for(const d of Object.keys(byDate)){ if(d<trFrom||d>trTo)continue; const a=byDate[d]; const b=isWeekend(d)?trWe:trWk; METS.forEach(k=>b[k]+=a[k]); b.n++; }
  const avgOf=(m,t,k)=> m.n? m[k]/m.n : (t.n? t[k]/t.n : 0);
  const avg={}; METS.forEach(k=>avg[k]={wk:avgOf(wk,trWk,k), we:avgOf(we,trWe,k)});
  let remWk=0,remWe=0; const start = closing? addDays(closing,1): mS;
  for(let d=start; d<=mE; d=addDays(d,1)){ if(isWeekend(d))remWe++; else remWk++; }
  const exRatio = td.in? td.ex/td.in : 0.91;
  return {closing, mS, mE, td, wkN:wk.n, weN:we.n, avg, remWk, remWe, exRatio};
}
function fcKey(){return `notime-fc-${state.store}-${state.ym}`;}
function fcNum(v,d){const n=Number(v);return Number.isFinite(n)?n:d;}
function fcMrg(o,def,k){const a=(o.avg&&o.avg[k])||{};return {wk:fcNum(a.wk,def.avg[k].wk),we:fcNum(a.we,def.avg[k].we)};}
function loadFc(){
  const def={remWk:AUTO.remWk, remWe:AUTO.remWe, budget:fcBudget(state.store,state.ym),
    avg:{in:{wk:Math.round(AUTO.avg.in.wk),we:Math.round(AUTO.avg.in.we)},
         v:{wk:Math.round(AUTO.avg.v.wk),we:Math.round(AUTO.avg.v.we)},
         tx:{wk:Math.round(AUTO.avg.tx.wk),we:Math.round(AUTO.avg.tx.we)},
         it:{wk:Math.round(AUTO.avg.it.wk),we:Math.round(AUTO.avg.it.we)}}};
  try{const s=localStorage.getItem(fcKey()); if(s){const o=JSON.parse(s);
    return {remWk:fcNum(o.remWk,def.remWk),remWe:fcNum(o.remWe,def.remWe),budget:fcNum(o.budget,def.budget),
      avg:{in:fcMrg(o,def,"in"),v:fcMrg(o,def,"v"),tx:fcMrg(o,def,"tx"),it:fcMrg(o,def,"it")}};}
  }catch(e){}
  return def;
}
function saveFc(){try{localStorage.setItem(fcKey(),JSON.stringify(fc));}catch(e){}}
function resetFc(){try{localStorage.removeItem(fcKey());}catch(e){} render(); }
function landing(){
  const L={};
  METS.forEach(k=>{ if(k==="ex")return;
    L[k]=AUTO.td[k] + fc.remWk*(fc.avg[k]?fc.avg[k].wk:0) + fc.remWe*(fc.avg[k]?fc.avg[k].we:0); });
  L.ex=L.in*AUTO.exRatio;
  return L;
}
const FKPI=[
  {k:"ex", name:"税抜売上", fmt:v=>YEN(v)+"円", calc:t=>t.ex},
  {k:"pr", name:"購入率",   fmt:v=>F1(v)+"%",   calc:t=>t.v>0?t.tx/t.v*100:null},
  {k:"aov",name:"客単価（税込）",   fmt:v=>YEN(v)+"円", calc:t=>t.tx>0?t.in/t.tx:null},
  {k:"upt",name:"平均購入数",fmt:v=>F2(v)+"点", calc:t=>t.tx>0?t.it/t.tx:null},
  {k:"aup",name:"平均商品単価（税抜）",fmt:v=>YEN(v)+"円",calc:t=>t.it>0?t.ex/t.it:null},
];
const DRIVERS=[
  {k:"in",name:"税込売上",fmt:v=>YEN(v),unit:"円",step:1000},
  {k:"v", name:"来店客数",fmt:v=>NUM(v),unit:"人",step:1},
  {k:"tx",name:"取引数",  fmt:v=>NUM(v),unit:"件",step:1},
  {k:"it",name:"販売点数",fmt:v=>NUM(v),unit:"点",step:1},
];
function fmtMD(d){const[,m,dd]=d.split("-");return `${+m}/${+dd}`;}

function render(){
  const us=usableStores(), months=monthsInData();
  if(!state.ym||!months.includes(state.ym)) state.ym=(DATA._salesMax||months[months.length-1]).slice(0,7);
  const stores=[{id:"all",name:"総合（全店）"},...us.map(s=>({id:s.id,name:s.name}))];
  const storeName=state.store==="all"?"総合（全店）":(us.find(s=>s.id===state.store)||{}).name||"";
  const[y,mm]=state.ym.split("-"); const monthLabel=`${y}年${+mm}月`;

  const top=`
    <header>
      <h1>NOTIME 月次予実</h1>
      <button class="themebtn" id="themebtn" style="margin-left:auto">◐ 表示切替</button>
    </header>
    <div class="controls">
      <label class="lbl">店舗</label>
      <select id="store">${stores.map(s=>`<option value="${s.id}" ${String(s.id)===String(state.store)?"selected":""}>${s.name}</option>`).join("")}</select>
      <label class="lbl" style="margin-left:6px">対象月</label>
      <select id="ym">${months.slice().reverse().map(m=>{const[a,b]=m.split("-");return `<option value="${m}" ${m===state.ym?"selected":""}>${a}年${+b}月</option>`;}).join("")}</select>
    </div>
    <div class="subtoggle">
      <button data-view="pl" class="${state.view==="pl"?"on":""}">月次予実</button>
      <button data-view="fc" class="${state.view==="fc"?"on":""}">🎯 着地見込み</button>
    </div>`;

  if(state.view==="fc"){
    AUTO=computeAuto(state.store,state.ym); fc=loadFc();
    document.getElementById("app").innerHTML=top+fcBody(monthLabel,storeName);
    bindCommon(); bindFc();
    drawDriver(); fcRecompute();
    return;
  }

  // 月次予実ビュー
  A=computeActual(state.store,state.ym); M=loadM();
  document.getElementById("app").innerHTML=top+plBody(monthLabel,storeName);
  bindCommon();
  const rb=document.getElementById("reset");
  if(rb)rb.onclick=()=>{if(confirm("この店舗・この月の記入値を消しますか？")){try{localStorage.removeItem(mkey());}catch(e){}M={};render();}};
  document.querySelectorAll(".pin").forEach(el=>el.oninput=()=>{const k=el.dataset.k;
    if(el.value===""){delete M[k];}else{const v=Number(el.value);if(Number.isFinite(v))M[k]=v;else delete M[k];}
    saveM();recompute();});
  recompute();
}

function bindCommon(){
  document.getElementById("store").onchange=e=>{state.store=e.target.value==="all"?"all":+e.target.value;render();};
  document.getElementById("ym").onchange=e=>{state.ym=e.target.value;render();};
  document.getElementById("themebtn").onclick=toggleTheme;
  document.querySelectorAll(".subtoggle button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
}

function fcRecompute(){
  const L=landing(), td=AUTO.td;
  document.getElementById("land-in").textContent=YEN(L.in)+"円";
  DRIVERS.forEach(d=>{const c=document.getElementById("land-"+d.k);if(c)c.textContent=d.fmt(L[d.k])+d.unit;});
  document.getElementById("closing").textContent=AUTO.closing?fmtMD(AUTO.closing):"—（当月データなし）";
  document.getElementById("td-in").textContent=YEN(td.in)+"円";
  const b=fc.budget, pills=[];
  pills.push(`<span class="pill">締日まで <b>${YEN(td.in)}円</b></span>`);
  pills.push(`<span class="pill">残 平日<b>${fc.remWk}</b>・土日祝<b>${fc.remWe}</b>日</span>`);
  if(b>0){
    const prog=td.in/b*100, ratio=L.in/b*100, diff=L.in-b;
    pills.push(`<span class="pill">🎯 目標(税込) <b>${YEN(b)}円</b></span>`);
    pills.push(`<span class="pill">進捗率 <b>${F1(prog)}%</b></span>`);
    pills.push(`<span class="pill">計画比 <b>${F1(ratio)}%</b></span>`);
    const cls=diff>=0?"up":"down";
    pills.push(`<span class="pill">計画差額 <b class="delta ${cls}">${diff>=0?"+":"−"}${YEN(Math.abs(diff))}円</b></span>`);
    document.getElementById("land-vs").innerHTML=`<span class="lbl2 delta ${ratio>=100?"up":"down"}">（対予算 ${F1(ratio)}%）</span>`;
  }else{
    pills.push(`<span class="pill" style="opacity:.75">🎯 目標 未登録（この店舗）</span>`);
    document.getElementById("land-vs").innerHTML="";
  }
  document.getElementById("pills").innerHTML=pills.join("");
  const head=`<thead><tr><th>指標</th><th>締日まで(実績)</th><th>着地見込み</th></tr></thead>`;
  const body=FKPI.map(m=>{const tv=m.calc(td),lv=m.calc(L);
    return `<tr><td>${m.name}</td><td>${tv==null?"—":m.fmt(tv)}</td><td>${lv==null?"—":m.fmt(lv)}</td></tr>`;}).join("");
  document.getElementById("kpi").innerHTML=head+"<tbody>"+body+"</tbody>";
}

function setTxt(id,txt,cls){const el=document.getElementById(id);if(!el)return;el.textContent=txt;if(cls!==undefined)el.className=cls;}
function recompute(){
  const AV={}; KPIS.forEach(m=>AV[m.k]=m.av(A));
  KPIS.forEach(m=>{ if(!m.budget)return; const b=budKPI(m.k), av=AV[m.k];
    if(Number.isFinite(b)&&b!==0&&av!=null){ const ach=av/b*100, dif=av-b;
      setTxt("ach_"+m.k, F1(ach)+"%", ach>=100?"up":"down");
      setTxt("dif_"+m.k, (dif>=0?"+":"−")+m.fmt(Math.abs(dif))+m.u, dif>=0?"up":"down");
    }else{ setTxt("ach_"+m.k,"—","mut"); setTxt("dif_"+m.k,"—","mut"); } });
  const exA=A.ex, exB=E("pl_ex_b");
  setTxt("pl_ex_a", YEN(exA)+"円");
  setTxt("pl_ex_d", exB>0?diffStr(exA-exB):"", exB>0?dc(exA-exB):"mut");
  const genA=E("genka_a"), genB=E("genka_b");
  setTxt("genka_r", exA>0?("原価率 "+F1(genA/exA*100)+"%"):"", "mut");
  const grA=exA-genA, grB=exB-genB;
  setTxt("gross_a", YEN(grA)+"円"); setTxt("gross_b", exB||genB?YEN(grB)+"円":"—");
  setTxt("gross_d", (exB||genB)?diffStr(grA-grB):"", (exB||genB)?dc(grA-grB):"mut");
  let sgaA=0,sgaB=0;
  COSTS.forEach((c,i)=>{ const da=E("ca_"+i), db=E("cb_"+i); sgaA+=da; sgaB+=db;
    setTxt("cd_"+i, (da||db)?diffStr(da-db):"", "mut"); });
  setTxt("sga_a", YEN(sgaA)+"円"); setTxt("sga_b", YEN(sgaB)+"円");
  setTxt("sga_d", diffStr(sgaA-sgaB), "mut");
  const opA=grA-sgaA, opB=grB-sgaB;
  setTxt("op_a", YEN(opA)+"円"); setTxt("op_b", (exB||genB||sgaB)?YEN(opB)+"円":"—");
  setTxt("op_d", (exB||genB||sgaB)?diffStr(opA-opB):"", (exB||genB||sgaB)?dc(opA-opB):"mut");
  setTxt("opr_a", exA>0?F1(opA/exA*100)+"%":"—", opA>=0?"auto up":"auto down");
  setTxt("opr_b", exB>0?F1(opB/exB*100)+"%":"—");
  let payT=0; PAYS.forEach((p,i)=>payT+=E("pay_"+i));
  setTxt("pay_total", YEN(payT)+"円");
  const salesIn=A.in+A.bag;
  setTxt("pay_diff", payT>0?diffStr(payT-salesIn):"—", "mut");
  setTxt("h-sales", YEN(salesIn)+"円");
  const bIn=budKPI("inTax");
  if(Number.isFinite(bIn)&&bIn!==0){ setTxt("h-ach", F1(salesIn/bIn*100)+"%", salesIn>=bIn?"v up":"v down");
    setTxt("h-sales-s","予算 "+YEN(bIn)+"円"); }
  else{ setTxt("h-ach","—","v"); setTxt("h-sales-s","予算 未入力"); }
  const showOp = exA>0 && (sgaA>0||genA>0);
  setTxt("h-op", showOp?YEN(opA)+"円":"—", showOp?(opA>=0?"v up":"v down"):"v");
  setTxt("h-op-s", showOp?("粗利 "+YEN(grA)+"円"):"原価・販管費を記入");
  setTxt("h-opr", showOp?F1(opA/exA*100)+"%":"—", showOp?(opA>=0?"v up":"v down"):"v");
}
function diffStr(d){return (d>=0?"+":"−")+YEN(Math.abs(d))+"円";}
function dc(d){return d>=0?"up":"down";}
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");}
if(location.hash==="#fc")state.view="fc";   // forecast.html からの転送で着地見込みを開く
boot();
</script>
