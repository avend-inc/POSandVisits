# Supabase プロジェクト設定（Edge Function デプロイ用の最小構成）
# project_id はプロジェクトの参照ID（公開URLのサブドメイン）。秘密情報ではありません。
# 配信中のダッシュボード（GitHub Pages）が接続しているプロジェクトに合わせること。
project_id = "qcdxhsrnlsgpntbiellh"

[functions.ask]
# ブラウザから呼ぶため、入口(ゲートウェイ)でのJWT必須は外す。
# 理由: CORSの事前確認(OPTIONS)には Authorization ヘッダが付かないため、
#       verify_jwt = true だと事前確認が入口で弾かれ、ブラウザからは
#       「Load failed」としか分からない通信エラーになる。
# 安全性: 関数側で JWT 検証（auth.getUser）と app_users の許可リスト判定を
#         必ず行っているため、未ログインのリクエストは関数内で 401 で弾かれる。
verify_jwt = false
