# 地域サイトレジストリ（§5.2）。
# MVP（§11）で実際に巡回するのは fudosanlist.cbiz.ne.jp（連合隊）のみ。
# それ以外は付録A（§12）の発見エンジン出力サンプルで、第2〜3段階で有効化する。
#
# status: verified | pending | broken
#   - verified: 人が初回パース結果を目視確認済み（§5.2「人のレビュー（必須）」）
#   - pending : 発見エンジンが出したがレビュー未
#   - broken  : パーサ破損を検知。自動修復はしない（§13）
#
# area_unit_hint: §9.1.1 単位取り違え防止。抽出した単位と食い違ったら broken を立てる。

sources:
  - domain: fudosanlist.cbiz.ne.jp
    parser: rengotai
    tier: 1
    nationwide: true
    detail_domain: fudosan.cbiz.ne.jp   # 個別物件URLは別ドメイン（§5.1.1）
    cities: [福島市, 秋田市, 富士市, 大分市, 宮崎市, 長崎市]
    # 連合隊カードのセレクタは実HTMLで確定させる（§5.2「人のレビュー」）。
    # 下記は暫定。src/sources/rengotai.py はセレクタが外れても本文正規表現で拾える
    # 二段構えにしてあるが、verified にする前に必ず実ページで確認すること。
    selectors:
      item: ".property-list .property"     # PROVISIONAL
      name: ".property-title"              # PROVISIONAL
      area: ".spec-area"                   # PROVISIONAL
      area_unit_hint: "坪"                 # 連合隊は坪単価/坪数が構造化（§5.1）。要確認
      rent: ".spec-rent"                   # PROVISIONAL
      parking: ".spec-parking"             # PROVISIONAL
      floor: ".spec-floor"                 # PROVISIONAL
      detail_link: "a.detail-link"         # PROVISIONAL
    status: pending          # ← 実HTMLでパース確認後に verified へ
    last_ok: null

