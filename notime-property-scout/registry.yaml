# 地域サイトレジストリ（§5.2）— 「取れるところから全部」版。
# 2026-08 に §5.2 の発見（この環境で唯一通る WebSearch）で6市ぶん洗い出した実在ソース。
#
# status: verified | pending | broken
#   - verified: 人が初回パース結果を目視確認済み（§5.2「人のレビュー（必須）」）
#   - pending : 発見済みだがパーサ未検証（本番投入は目視確認後）
#   - broken  : パーサ破損を検知。自動修復はしない（§13）
# fetch: auto | semi | aggregator
#   - auto : 通常の自動収集で取得可（マナー厳守：robots/3秒/UA連絡先・§5.4）
#   - semi : bot遮断/規約により半自動のみ（§5.3。人がブラウザで開いてHTML投入）
#   - aggregator: 複数ポータルの束ね。重複多く、一次ソースの取りこぼしチェック用（主軸にしない）
#
# ★重要な発見：地場業者の多くが「共有CMS」を使っており、1パーサで多数のサイトを賄える。
#   cms=ES_rentfeature : URLが /rent_feature/result/{id} 形式。ajrc/hayashi-kousan/kando-abc/
#                        tintai-pyramid/reaes/sanei-f/tokiwasre など（全国の地場に多い）
#   cms=kasitenpo      : URLが /kasi-tenpo/{pref}/result/{city}.html 形式。eastjapan-jk/rfudosan/
#                        benestngs/esanko/oita-jisyo/heartfulhomes など
#   → この2本を書けば地場13社以上を一気にカバーできる（連合隊に依存しない多面収集）。

# ───────────────────────── 全国ポータル（Tier1・全6市に適用） ─────────────────────────
portals_nationwide:
  - domain: fudosanlist.cbiz.ne.jp
    name: 不動産連合隊
    parser: rengotai
    fetch: auto
    list_url_tmpl: "https://fudosanlist.cbiz.ne.jp/list/rent/?prop=2&area={pref_roma}&a2={jis}"
    detail_domain: fudosan.cbiz.ne.jp   # 個別物件URLは別ドメイン（§5.1.1）
    status: pending          # URL構造は実確認済／カードのセレクタは実HTMLで確定要
  - domain: homes.co.jp
    name: LIFULL HOME'S
    parser: homes
    fetch: auto
    list_url_tmpl: "https://www.homes.co.jp/chintai/tempo/{pref_roma}/{city_roma}-city/list/"
    status: pending
  - domain: temponw.com
    name: 店舗ネットワーク
    parser: temponw
    fetch: auto
    list_url_tmpl: "https://www.temponw.com/area_search/result?prefectures_code={pref_code}&cities[]={city_code3}"
    status: pending
  - domain: house.goo.ne.jp
    name: goo住宅・不動産
    parser: goo
    fetch: auto
    list_url_tmpl: "https://house.goo.ne.jp/rent/{region_bb}/area_{pref_roma}/{jis}.html"
    status: pending
  - domain: homemate.co.jp
    name: ホームメイト（東建）
    parser: homemate
    fetch: auto
    list_url_tmpl: "https://www.homemate.co.jp/business/pr-{pref_roma}/{jis}/"
    status: pending
  - domain: infonista.jp
    name: インフォニスタ
    parser: generic
    fetch: auto
    status: pending
  - domain: pitat.com
    name: ピタットハウス
    parser: generic
    fetch: auto
    status: pending
  - domain: mapfan.com
    name: MapFan不動産
    parser: generic
    fetch: aggregator          # 取りこぼしチェック用（主軸にしない・§5.1）
    status: pending

# ───────────────── 宅建協会・公的（Tier2＋自治体。地場物件の網羅性が高い） ─────────────────
takken_public:
  - domain: hatomarksite.com
    name: ハトマークサイト（全宅連）
    fetch: semi               # bot遮断 → 半自動ルート（§5.3）
    status: pending
  - domain: fudousan.or.jp
    name: 不動産ジャパン（流通推進センター）
    parser: generic
    fetch: auto
    status: pending
  - domain: n-takken.or.jp
    name: たっけんくんネットながさき（長崎県宅建協会・約900社）
    parser: takken_nagasaki
    fetch: auto
    cities: [長崎市]
    status: pending
  - domain: city.akita.lg.jp
    name: 秋田市 中心市街地 空き店舗データベース（市公式）
    parser: generic
    fetch: auto
    cities: [秋田市]
    note: 自治体が所有者/管理会社から集めた空き店舗情報。ポータル未掲載を拾える
    status: pending

