# ============================================================
#  名簿の点検（読み取りのみ）
#
#  Actions →「名簿の点検」→ Run workflow
#
#  売上アプリ(app_users)と在庫アプリ(users)の名簿を1枚にまとめる前に、
#  いま誰がどちらに居て、加盟店の割り当て(app_user_stores)がどれだけ
#  有るのか、どのRLSポリシーが依存しているのかを調べる。
#
#  ★メールアドレスはログに出さない
#    このリポジトリは公開で、Actionsのログも公開になる。
#    ドメインと件数だけを出す。誰が居るかはSupabaseの画面で見る。
#
#  書き込みは一切しない。
# ============================================================
name: 名簿の点検

on:
  workflow_dispatch:

jobs:
  probe:
    name: 名簿を調べる
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: 点検を実行
        run: python -m tools.auth_probe
