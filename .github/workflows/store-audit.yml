# ============================================================
#  店舗×月 売上監査 / 店舗メタ(区分・表示名)の確認・修正
#
#  Actions →「店舗×月 売上監査」→ Run workflow
#    mode = audit    : 単店単月の内訳監査（store/month）
#    mode = storefix : 店舗の区分(直営/FC)・表示名を確認/修正（store_like ほか）
#  結果はログに出ます。
# ============================================================
name: 店舗×月 売上監査

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit=単店単月の内訳 / storefix=区分・表示名の確認/修正"
        required: true
        default: "audit"
        type: choice
        options: [audit, storefix]
      store:
        description: "（audit）店名の一部（例: いわき）"
        required: false
        default: "いわき"
      month:
        description: "（audit）対象月 YYYY-MM（例: 2026-07）"
        required: false
        default: "2026-07"
      store_like:
        description: "（storefix）対象店名の一部（例: 所沢）"
        required: false
        default: "所沢"
      set_ownership:
        description: "（storefix）区分。直営 / FC / （空=変えない）"
        required: false
        default: ""
      set_name:
        description: "（storefix）表示名を変える場合の正式名（空=変えない）"
        required: false
        default: ""
      do_update:
        description: "（storefix）実際に更新する（オフ=確認のみ）"
        required: false
        default: false
        type: boolean
      consolidate_keep:
        description: "（storefix）統合先に残す store id（例: 56）"
        required: false
        default: ""
      consolidate_drop:
        description: "（storefix）統合して消す store id（例: 55）"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 単店単月の内訳監査
        if: ${{ inputs.mode == 'audit' }}
        run: python -m tools.store_month_audit "${{ inputs.store }}" "${{ inputs.month }}"
      - name: 店舗メタ(区分・表示名)の確認/修正
        if: ${{ inputs.mode == 'storefix' }}
        env:
          STORE_LIKE: ${{ inputs.store_like }}
          SET_OWNERSHIP: ${{ inputs.set_ownership }}
          SET_NAME: ${{ inputs.set_name }}
          DO_UPDATE: ${{ inputs.do_update && '1' || '' }}
          CONSOLIDATE_KEEP: ${{ inputs.consolidate_keep }}
          CONSOLIDATE_DROP: ${{ inputs.consolidate_drop }}
        run: python -m tools.store_meta_fix
