# ============================================================
#  物件フィード(feeds/bukken.jsonl) を Supabase の bukken テーブルへ同期する
#
#  【なぜ必要か】
#   物件の発見は Claude セッション(WebSearch)で行うが、その環境からは Supabase に
#   直接書けない（egress遮断）。そこで「発見結果をリポジトリに追記 → ここで Supabase へ
#   upsert」という橋渡しをする。ユーザーがSQLを手で流す必要をなくすのが目的。
#
#  【動くタイミング】
#   ・notime-property-scout/feeds/bukken.jsonl を push したとき（＝新しい物件が追記されたとき）
#   ・毎日 06:10 JST（取りこぼし同期）
#   ・手動実行（Actions → Run workflow）
#
#  【やること】
#   sync_bukken.py が feed を読み、id で upsert。物件スペック列だけ送るので、
#   ユーザーが付けた OK/NG・理由（verdict/reason）は保持される。
# ============================================================
name: 物件フィードをSupabaseへ同期(bukken)

on:
  push:
    branches: [feature/supabase-etl]
    paths: ["notime-property-scout/feeds/bukken.jsonl"]
  schedule:
    - cron: "10 21 * * *"   # 06:10 JST（UTC 21:10）
  workflow_dispatch:

concurrency:
  group: bukken-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Supabaseへ upsert
        id: sync
        run: |
          out="$(python notime-property-scout/tools/sync_bukken.py)"
          echo "$out"
          echo "summary=$out" >> "$GITHUB_OUTPUT"
      - name: Slack通知（任意）
        if: ${{ env.SLACK_WEBHOOK != '' }}
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          payload="$(python -c 'import json,os; print(json.dumps({"text":"🏢 物件フィード同期: "+os.environ.get("SUMMARY","")}))')"
          curl -sS -X POST -H 'content-type: application/json' --data "$payload" "$SLACK_WEBHOOK" || true
