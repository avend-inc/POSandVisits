# ============================================================
#  デジテール売上CSVの調査
#
#  来店(visits)と同じ /{slug}/kpi/●●/download の売上版（●●）と、
#  そのCSVの列を、実データで確定するための調査（取り込みはしない）。
#
#  使い方: Actions →「デジテール売上CSVの調査」→ Run workflow
#    slug: 調べる店舗スラッグ（既定 notime_masakicho＝伊予松前）
#    account: notime（既定）／ selfurugi
# ============================================================
name: デジテール売上CSVの調査

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "店舗スラッグ（既定＝伊予松前）"
        required: false
        default: "notime_masakicho"
      account:
        description: "アカウント"
        required: false
        default: "notime"
        type: choice
        options: [notime, selfurugi]

concurrency:
  group: notime-daily-etl
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      DIGITAIL_ID: ${{ secrets.DIGITAIL_ID }}
      DIGITAIL_PW: ${{ secrets.DIGITAIL_PW }}
      DIGITAIL_SF_ID: ${{ secrets.DIGITAIL_SF_ID }}
      DIGITAIL_SF_PW: ${{ secrets.DIGITAIL_SF_PW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: ブラウザ(Chromium)を用意
        run: python -m playwright install --with-deps chromium
      - name: 売上CSVを調べる
        run: |
          ARGS="--slug ${{ inputs.slug }}"
          if [ "${{ inputs.account }}" = "selfurugi" ]; then ARGS="$ARGS --sf"; fi
          python -m tools.digitel_sales_probe $ARGS
      - name: 調査用ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitel-sales-probe-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
