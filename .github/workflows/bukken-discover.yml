# ============================================================
#  毎朝の物件discovery（実サイト取得→feed追記→Supabase反映→新規時Slack）
#
#  【なぜGitHub Actionsか】
#   Claudeセッション環境は不動産サイトへegress遮断で出られない。GitHub Actions は
#   インターネットに出られるため、実サイトを取得して物件を集められる。
#   （§10のとおりデータセンターIPが一部サイトにbot遮断される可能性はある。
#    取れないサイトは自動でスキップし、取れた分だけ feed に足す。）
#
#  【動くタイミング】毎朝6:03 JST / 手動
#  【やること】discover.py で新規物件を feeds/bukken.jsonl に追記 → push →
#             sync_bukken.py で Supabase へ upsert → 新規があれば店舗開発チャンネルへ通知
# ============================================================
name: 物件discovery(毎朝・bukken)

on:
  schedule:
    - cron: "3 21 * * *"    # 06:03 JST
  workflow_dispatch:

concurrency:
  group: bukken-discover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SLACK_WEBHOOK_BUKKEN: ${{ secrets.SLACK_WEBHOOK_BUKKEN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SCOUT_CONTACT: ${{ secrets.SCOUT_CONTACT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-etl
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml playwright
          # goo等のJS後読みサイトの面積取得用にヘッドレスChromiumを入れる
          python -m playwright install --with-deps chromium

      - name: 実サイトから新規物件を発見して feed に追記
        id: disc
        run: python notime-property-scout/tools/discover.py

      # 先に Supabase へ反映する（ユーザーが見るのはDB。pushが失敗してもDBは更新される）
      - name: Supabaseへ upsert（新規判定つき）
        id: sync
        run: python notime-property-scout/tools/sync_bukken.py

      # そのあとで feed を commit & push（並行マージでbranchが進んでいてもrebaseで追従＋リトライ）
      - name: feed に変更があれば commit & push（新規0でも補完分を確定）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notime-property-scout/feeds/bukken.jsonl
          if git diff --cached --quiet; then echo "feed変更なし"; exit 0; fi
          git commit -m "discovery: feed更新（新規 ${{ steps.disc.outputs.new_count }} 件・補完含む）"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:feature/supabase-etl; then
              echo "push成功"; exit 0
            fi
            echo "push失敗（$i回目）。remoteを取り込んでrebaseして再試行..."
            git fetch origin feature/supabase-etl
            # feed はDBが正なので衝突時はこちら（discovery結果）を優先
            git rebase -X ours origin/feature/supabase-etl || git rebase --abort
            sleep $((i * 3))
          done
          echo "pushはリトライしても失敗。DBは既にupsert済みなので致命的ではない。"; exit 0

      # 通知は「毎朝の定期実行」1回だけ。手動実行(workflow_dispatch)や検証実行では鳴らさない。
      - name: Slack通知（新規のみ・店舗開発チャンネル・1日1回）
        if: ${{ github.event_name == 'schedule' && steps.sync.outputs.new_count != '0' && steps.sync.outputs.new_count != '' }}
        env:
          NEW_COUNT: ${{ steps.sync.outputs.new_count }}
          NAMES: ${{ steps.sync.outputs.names }}
        run: |
          hook="${SLACK_WEBHOOK_BUKKEN:-$SLACK_WEBHOOK}"
          if [ -z "$hook" ]; then echo "Slack webhook未設定。通知スキップ"; exit 0; fi
          payload=$(python3 -c 'import json,os; print(json.dumps({"text":"🏢 新しい物件が "+os.environ["NEW_COUNT"]+" 件あります\n"+os.environ.get("NAMES","")+"\n▶ レビュー: https://avend-inc.github.io/POSandVisits/bukken.html"}))')
          curl -sS -X POST -H 'content-type: application/json' --data "$payload" "$hook" || true
