# ============================================================
#  ダッシュボードを GitHub Pages に配信する
#
#  【なぜ必要か】
#   このダッシュボードは gh-pages ブランチの index.html を GitHub Pages が
#   そのまま配信している。中身は web/dashboard.html の単純コピーで、
#   これまでは「更新したら手でコピーして push する」運用だった。
#   その手順を忘れると、data.json（Supabase）は新しいのに画面のコードだけ古い、
#   という気づきにくい状態になる（実際に起きた）。
#   ここで自動化して、default ブランチの web/dashboard.html と
#   gh-pages/index.html が必ず一致するようにする。
#
#  【動くタイミング】
#   web/dashboard.html を default ブランチに push したとき（＝PRをマージしたとき）。
#   手動実行もできる（Actions →「ダッシュボードを配信(GitHub Pages)」→ Run workflow）。
#
#  【やること】
#   web/dashboard.html を gh-pages の index.html にコピーして push するだけ。
#   中身が同じなら何もしない（空コミットは作らない）。
#   gh-pages にある他のファイル（他タブのHTML・アイコン・robots.txt 等）は触らない。
# ============================================================
name: ダッシュボードを配信(GitHub Pages)

on:
  push:
    branches: [feature/supabase-etl]
    paths:
      - "web/dashboard.html"
      - "web/bukken.html"
      - "web/shoken.html"
      - "web/mise.html"
      - "web/pl.html"
      - "web/keiei.html"
      - "web/trends.html"
      - "web/landing.js"
  workflow_dispatch:

# 同時に2つ走ると push がぶつかるので直列化する
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: gh-pages の index.html を更新
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 配信元（default ブランチ）を取得
        uses: actions/checkout@v4
        with:
          path: src

      - name: 配信先（gh-pages）を取得
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: コピーして push
        run: |
          set -e
          # dashboard は index.html として、他は同名でコピー。
          # landing.js は全ページ共通の「着地見込み」実装なので、消費ページと必ず一緒に配信する。
          cp src/web/dashboard.html pages/index.html
          cp src/web/bukken.html    pages/bukken.html
          cp src/web/shoken.html    pages/shoken.html
          cp src/web/mise.html      pages/mise.html
          cp src/web/pl.html        pages/pl.html
          cp src/web/keiei.html     pages/keiei.html
          cp src/web/trends.html    pages/trends.html
          cp src/web/landing.js     pages/landing.js
          cd pages
          FILES="index.html bukken.html shoken.html mise.html pl.html keiei.html trends.html landing.js"
          if git diff --quiet -- $FILES; then
            echo "変更はありません（配信済みと同じ内容）。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "デプロイ: dashboard/pl/keiei/trends/landing.js を配信 (${GITHUB_SHA::7})"
          git push
          echo "✅ 配信しました。GitHub Pages の反映まで1分ほどかかります。"
