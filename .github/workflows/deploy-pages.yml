# ============================================================
#  ダッシュボードを GitHub Pages に配信する
#
#  【なぜ必要か】
#   このダッシュボードは gh-pages ブランチの index.html を GitHub Pages が
#   そのまま配信している。中身は web/dashboard.html の単純コピーで、
#   これまでは「更新したら手でコピーして push する」運用だった。
#   その手順を忘れると、data.json（Supabase）は新しいのに画面のコードだけ古い、
#   という気づきにくい状態になる（実際に起きた）。
#   ここで自動化して、default ブランチの web/dashboard.html と
#   gh-pages/index.html が必ず一致するようにする。
#
#  【動くタイミング】
#   web/dashboard.html を default ブランチに push したとき（＝PRをマージしたとき）。
#   手動実行もできる（Actions →「ダッシュボードを配信(GitHub Pages)」→ Run workflow）。
#
#  【やること】
#   web/dashboard.html を gh-pages の index.html にコピーして push するだけ。
#   中身が同じなら何もしない（空コミットは作らない）。
#   gh-pages にある他のファイル（他タブのHTML・アイコン・robots.txt 等）は触らない。
# ============================================================
name: ダッシュボードを配信(GitHub Pages)

on:
  push:
    branches: [feature/supabase-etl]
    paths:
      - "web/dashboard.html"
      - "web/admin.html"
      - "web/bukken.html"
      - "web/shoken.html"
      - "web/mise.html"
      - "web/cities.html"
      - "web/municipalities.json"
      - "web/pl.html"
      - "web/keiei.html"
      - "web/unei.html"
      - "web/trends.html"
      - "web/landing.js"
      # ask/promo/forecast は配信リストから漏れていて、gh-pages 側が長く古いままだった
      # （2026-09 に発覚。分析AI・販促の2ページだけナビが旧版・ログイン共通化も未適用・
      #  分析AIは会話履歴の送り方が Edge Function と食い違っていた）。
      - "web/ask.html"
      - "web/promo.html"
      - "web/forecast.html"
  workflow_dispatch:

# 同時に2つ走ると push がぶつかるので直列化する
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: gh-pages の index.html を更新
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 配信元（default ブランチ）を取得
        uses: actions/checkout@v4
        with:
          path: src

      - name: 配信先（gh-pages）を取得
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: コピーして push
        run: |
          set -e
          # dashboard は index.html として、他は同名でコピー。
          # landing.js は全ページ共通の「着地見込み」実装なので、消費ページと必ず一緒に配信する。
          cp src/web/dashboard.html pages/index.html
          cp src/web/admin.html     pages/admin.html
          cp src/web/bukken.html    pages/bukken.html
          cp src/web/shoken.html    pages/shoken.html
          cp src/web/mise.html      pages/mise.html
          cp src/web/cities.html    pages/cities.html
          cp src/web/municipalities.json pages/municipalities.json
          cp src/web/pl.html        pages/pl.html
          cp src/web/keiei.html     pages/keiei.html
          cp src/web/unei.html      pages/unei.html
          cp src/web/trends.html    pages/trends.html
          cp src/web/landing.js     pages/landing.js
          cp src/web/ask.html       pages/ask.html
          cp src/web/promo.html     pages/promo.html
          cp src/web/forecast.html  pages/forecast.html
          cd pages
          FILES="index.html admin.html bukken.html shoken.html mise.html cities.html municipalities.json pl.html keiei.html unei.html trends.html landing.js ask.html promo.html forecast.html"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先に stage してから差分判定する。git diff（stage前）は「新規ファイル」を
          # 検知しないため、shoken/mise のような新規ページが未配信のまま
          # 「変更なし」で早期終了してしまう事故を防ぐ（実際に起きた）。
          git add $FILES
          if git diff --cached --quiet; then
            echo "変更はありません（配信済みと同じ内容）。"
            exit 0
          fi
          git commit -m "デプロイ: dashboard/admin/bukken/shoken/mise/pl/keiei/unei/trends/landing.js/ask/promo/forecast を配信 (${GITHUB_SHA::7})"
          git push
          echo "✅ 配信しました。GitHub Pages の反映まで1分ほどかかります。"
