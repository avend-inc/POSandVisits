# ============================================================
#  NOTIME 日次ETL — 毎朝、前日ぶんの売上と来店数を Supabase に入れる
#
#  ・自動実行 : 毎日 朝6時（日本時間）
#               GitHub は世界標準時(UTC)で動くので "21:00 UTC" = 翌朝6時(JST)
#               ※ 自動実行はデフォルトブランチのこのファイルとコードで動きます。
#  ・手動実行 : GitHubの Actions タブ →「NOTIME 日次ETL」→ Run workflow
#
#  はじめの準備（最初の1回）:
#    1. Supabase の SQL Editor で sql/setup_all.sql を貼って Run（表を作る）
#    2. 下記6つを Settings → Secrets and variables → Actions に登録
#
#  cashier の期間欄・CSVボタンの目印が未確定でも、この Actions を1回動かせば、
#  失敗時に debug/ へ「入力欄・ボタンの一覧」が自動保存され、実行ログにも出ます。
#  → それを見て目印（セレクタ）を確定できます（手元PCでのログイン調査は不要）。
#
#  ID・パスワード類は、このファイルには書きません。
#  リポジトリの Settings → Secrets and variables → Actions に登録した値を使います。
# ============================================================
name: NOTIME 日次ETL

on:
  schedule:
    # 毎朝 前日ぶんを取り込む（日本時間）。
    # GitHubのcronは遅延・スキップが起きることがあるため、予備の時刻を複数用意する。
    # 2回目以降は「取り込み済み」なら自動でスキップされるので何度動いても安全。
    - cron: "0 21 * * *"    # 06:00 JST
    - cron: "0 22 * * *"    # 07:00 JST（予備）
    - cron: "30 23 * * *"   # 08:30 JST（予備）
    - cron: "0 3 * * *"     # 12:00 JST（★動作テスト用・確認後に削除予定）

  workflow_dispatch:
    inputs:
      date:
        description: "取り込む営業日 (YYYY-MM-DD)。空なら前日。backfill時は開始日(from)"
        required: false
        default: ""
      only:
        description: "片方だけ動かす場合に選ぶ"
        required: false
        default: "both"
        type: choice
        options: [both, cashier, digitel]
      force:
        description: "取り込み済みの日でも、もう一度取り込む"
        required: false
        default: false
        type: boolean
      backfill:
        description: "過去分の一括取り込み（dateを開始日、toを終了日にする）"
        required: false
        default: false
        type: boolean
      to:
        description: "backfillの終了日 (YYYY-MM-DD)。空なら今日"
        required: false
        default: ""
      dashboard:
        description: "取り込みはせず、ダッシュボードの集計・配信だけ行う"
        required: false
        default: false
        type: boolean

# 同時に2つ走らないようにする（二重取り込みの予防）
concurrency:
  group: notime-daily-etl
  cancel-in-progress: false

jobs:
  etl:
    name: 前日ぶんを取り込む
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo
      CASHIER_ID: ${{ secrets.CASHIER_ID }}
      CASHIER_PW: ${{ secrets.CASHIER_PW }}
      DIGITAIL_ID: ${{ secrets.DIGITAIL_ID }}
      DIGITAIL_PW: ${{ secrets.DIGITAIL_PW }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 任意：これを登録するとダッシュボードが「Googleログイン制(社内のみ)」になる。
      #       未登録なら従来どおり公開URL（知っていれば誰でも閲覧可）。
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ブラウザ(Chromium)を用意
        if: ${{ ! inputs.dashboard }}
        run: python -m playwright install --with-deps chromium

      - name: 設定がそろっているか確認
        run: |
          missing=""
          for name in CASHIER_ID CASHIER_PW DIGITAIL_ID DIGITAIL_PW SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets が登録されていません:$missing"
            echo "リポジトリの Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          echo "Secrets OK"

      - name: ETL を実行
        if: ${{ ! inputs.dashboard }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            ARGS=""
            if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --from ${{ inputs.date }}"; fi
            if [ -n "${{ inputs.to }}" ];   then ARGS="$ARGS --to ${{ inputs.to }}"; fi
            if [ "${{ inputs.only }}" = "cashier" ]; then ARGS="$ARGS --only cashier"; fi
            if [ "${{ inputs.only }}" = "digitel" ]; then ARGS="$ARGS --only digitel"; fi
            echo "実行(backfill): python -m etl.backfill $ARGS"
            python -m etl.backfill $ARGS
          else
            ARGS=""
            if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
            if [ "${{ inputs.only }}" = "cashier" ]; then ARGS="$ARGS --only cashier"; fi
            if [ "${{ inputs.only }}" = "digitel" ]; then ARGS="$ARGS --only digitel"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            echo "実行: python -m etl.run_daily $ARGS"
            python -m etl.run_daily $ARGS
          fi

      # 集計してダッシュボード(HTML+data.json)をSupabase Storageへ配信。
      # 取り込みが成功した後、または dashboard 単独モードのときに動く。
      - name: ダッシュボードを更新
        if: ${{ inputs.dashboard || success() }}
        run: |
          if [ "${{ inputs.dashboard }}" = "true" ]; then
            python -m tools.export_dashboard --print-json
          else
            python -m tools.export_dashboard
          fi

      # 失敗したときだけ、原因調査用のファイルを残す（7日で自動削除）
      - name: 失敗時の調査用ファイルを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            debug/
            raw/
          if-no-files-found: ignore
          retention-days: 7
