<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>商圏調査</title>
<style>
  :root{--ink:#1a1a1a;--ink2:#6b6b6b;--bg:#f5f5f3;--surface:#fff;--border:#e4e4e4;
    --accent:#b8860b;--ok:#1b8a3a;--ng:#c0392b;--hold:#8a6d00;--shadow:0 1px 3px rgba(0,0,0,.06);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:80px}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  .hbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink2);
    border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap}
  main{max-width:760px;margin:0 auto;padding:14px}
  .lead{font-size:12.5px;color:var(--ink2);line-height:1.7;margin:2px 0 14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
  .card h2{font-size:14px;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
  label .req{color:var(--ng)}
  input,select{border:1px solid var(--border);border-radius:10px;padding:10px;font-size:15px;color:var(--ink);background:#fff;width:100%}
  .hint{font-size:10.5px;color:#9a9a9a}
  .runbtn{display:block;width:100%;margin-top:14px;background:var(--accent);color:#fff;border:none;
    border-radius:11px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  .verdict{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .vbig{font-size:22px;font-weight:800}
  .v-成功{color:var(--ok)} .v-失敗{color:var(--ng)} .v-不可{color:var(--hold)}
  .pill{font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:4px 11px}
  .pill.成功{background:var(--ok)} .pill.失敗{background:var(--ng)} .pill.不可{background:var(--hold)}
  .axis{border-top:1px solid var(--border);padding:10px 0;display:grid;grid-template-columns:96px 74px 1fr;gap:8px;align-items:start}
  .axis:first-child{border-top:none}
  .axis .an{font-size:12.5px;font-weight:700}
  .axis .aj{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px;text-align:center;height:fit-content;white-space:nowrap}
  .aj.成功{background:var(--ok)} .aj.失敗{background:var(--ng)} .aj.不可{background:#9a8a3a} .aj.情報{background:#888}
  .axis .ad{font-size:12px;color:var(--ink2);line-height:1.6}
  ul.notes{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.7}
  ul.notes li{margin:3px 0}
  .flag{color:var(--ng);font-weight:700}
  details{margin-top:8px}
  details summary{font-size:12px;color:var(--accent);cursor:pointer}
  table.bench{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
  table.bench th,table.bench td{border:1px solid var(--border);padding:4px 6px;text-align:right}
  table.bench th:first-child,table.bench td:first-child{text-align:left}
  .msg{padding:24px 16px;color:var(--ink2);text-align:center;line-height:1.8}
  .loginbtn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer}
  .homebtn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;text-decoration:none}
</style></head>

<script>
"use strict";
// 弊社の物件レビュー(bukken.html)と同じ Supabase / ログイン(notime-auth)を共有。
const CONFIG_URL="https://qcdxhsrnlsgpntbiellh.supabase.co/storage/v1/object/public/dashboard/config.json";
let SB=null;

// ===== 教師データ由来のベンチマーク（弊社店のみ。競合は除外）=====
//  ※ 数値は Google Sheets「店舗教師データ」から算出。店舗追加時は再生成すること。
const BENCH=[{"n":"鎌ヶ谷","g":"urbanA","p3":18547,"p10":245631,"p20":783348,"p30":1620433,"p40":2850962,"traf":25215,"indep":0.086,"muni":"千葉県鎌ケ谷市"},{"n":"旭川末広","g":"road_success","p3":10409,"p10":39763,"p20":42088,"p30":43191,"p40":45965,"traf":20141,"indep":0.865,"muni":"北海道旭川市"},{"n":"上田原","g":"fail","p3":6318,"p10":22882,"p20":31762,"p30":54285,"p40":108278,"traf":13354,"indep":0.211,"muni":"長野県上田市"},{"n":"仙台吉成","g":"fail","p3":14252,"p10":155323,"p20":222515,"p30":244953,"p40":276356,"traf":null,"indep":0.562,"muni":"宮城県仙台市"},{"n":"伊勢崎","g":"fail","p3":9243,"p10":64410,"p20":187979,"p30":286272,"p40":359266,"traf":29013,"indep":0.179,"muni":"群馬県伊勢崎市"},{"n":"徳島沖浜","g":"road_success","p3":11074,"p10":43138,"p20":63269,"p30":72024,"p40":77387,"traf":null,"indep":0.557,"muni":"徳島県徳島市"},{"n":"熊谷","g":"urbanA","p3":11300,"p10":54355,"p20":159834,"p30":349186,"p40":745004,"traf":12798,"indep":0.073,"muni":"埼玉県熊谷市"},{"n":"富山田中町","g":"road_success","p3":15833,"p10":55289,"p20":80401,"p30":107210,"p40":127310,"traf":24587,"indep":0.434,"muni":"富山県富山市"},{"n":"倉敷","g":"fail","p3":12850,"p10":63641,"p20":152793,"p30":204112,"p40":241276,"traf":null,"indep":0.264,"muni":"岡山県倉敷市"},{"n":"静岡","g":"fail","p3":18235,"p10":79775,"p20":94581,"p30":140276,"p40":195994,"traf":22421,"indep":0.407,"muni":"静岡県静岡市"},{"n":"GARAGE静岡","g":"fail","p3":18895,"p10":88622,"p20":109311,"p30":138101,"p40":185365,"traf":8586,"indep":0.478,"muni":"静岡県静岡市"},{"n":"伊予松前","g":"road_success","p3":5652,"p10":66535,"p20":80844,"p30":83397,"p40":86577,"traf":26057,"indep":0.769,"muni":"愛媛県伊予郡"},{"n":"山形","g":"road_success","p3":16964,"p10":36403,"p20":52385,"p30":66765,"p40":78329,"traf":25004,"indep":0.465,"muni":"山形県山形市"},{"n":"福井","g":"road_success","p3":10744,"p10":43795,"p20":68233,"p30":83750,"p40":93106,"traf":null,"indep":0.47,"muni":"福井県福井市"},{"n":"高松","g":"fail","p3":13529,"p10":55025,"p20":73323,"p30":101968,"p40":124576,"traf":16811,"indep":0.442,"muni":"香川県高松市"}];

// ===== 検証済みの閾値（MD §1.2。ハードコードではなく確定した定数として保持）=====
const CFG={
  muni_lo:240000, muni_hi:500000, muni_big:700000,   // 市人口 スイートスポット / 大都市除外
  density_lo:300, density_hi:1250,                    // 密度 必須フィルター
  indep_A:0.15, indep_BC:0.45, indep_border:[0.43,0.47],
  overpop_10k:66535, overpop_mult:1.3,                // 人口過大(仙台型)
  traffic_floor:20141,                               // 路面型 通行量下限(旭川)
  thin_floor:30518,                                  // 薄商圏ゲート発火床(いわき)
  rescue_indep:0.6, rescue_traffic:25000,            // いわき救済
};

const NUM=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("ja-JP");
const road=()=>BENCH.filter(b=>b.g==="road_success");
const urbanA=()=>BENCH.filter(b=>b.g==="urbanA");

// 候補のバンド値が、路面成功店のどこに位置するか（○○以上・△△以下）
function positioning(band,v){
  if(v==null) return "—";
  const arr=road().map(b=>({n:b.n,x:b[band]})).filter(o=>o.x!=null).sort((a,b)=>a.x-b.x);
  const below=[...arr].reverse().find(o=>o.x<=v), above=arr.find(o=>o.x>v);
  if(below&&above) return `${below.n}(${NUM(below.x)})以上 / ${above.n}(${NUM(above.x)})以下`;
  if(!below) return `全成功店未満（最小=${arr[0].n} ${NUM(arr[0].x)}）`;
  return `全成功店以上（最大=${arr[arr.length-1].n} ${NUM(arr[arr.length-1].x)}）`;
}

// ===== 判定エンジン（純関数・MD §1.3）=====
function evaluate(I){
  const A={}, cls=(j,d)=>({j,d});   // j: 成功/失敗/不可/情報, d: 説明
  const indep=(I.p10!=null&&I.p40)? I.p10/I.p40 : null;
  const density=(I.muni_pop!=null&&I.muni_area)? I.muni_pop/I.muni_area : null;
  const isRoad=I.model==="路面";

  // ① 市区町村
  if(I.muni_pop==null||density==null) A.muni=cls("情報","人口・面積が未入力");
  else if(I.muni_pop>=CFG.muni_big) A.muni=cls("失敗",`市人口 ${NUM(I.muni_pop)} ≥ 70万（仙台型・過大の入口）`);
  else if(I.muni_pop>=CFG.muni_lo&&I.muni_pop<=CFG.muni_hi&&density>=CFG.density_lo&&density<=CFG.density_hi)
    A.muni=cls("成功",`人口 ${NUM(I.muni_pop)}（24〜50万）・密度 ${Math.round(density)}（300〜1,250）`);
  else if(I.muni_pop<CFG.muni_lo) A.muni=cls("不可",`市人口 ${NUM(I.muni_pop)} < 24万（スイートスポット下限割れ）`);
  else if(density<CFG.density_lo||density>CFG.density_hi) A.muni=cls("失敗",`密度 ${Math.round(density)}（300〜1,250外）`);
  else A.muni=cls("不可",`人口 ${NUM(I.muni_pop)}・密度 ${Math.round(density)}（スイートスポット外）`);

  // ② 人口過大（仙台型）
  const overLimit=CFG.overpop_10k*CFG.overpop_mult;
  if(I.p10==null) A.overpop=cls("情報","10km人口が未入力");
  else if(I.p10>overLimit||(I.muni_pop!=null&&I.muni_pop>=CFG.muni_big))
    A.overpop=cls("失敗",`10km20-34 ${NUM(I.p10)} が過大（${NUM(Math.round(overLimit))}超）→仙台型`);
  else A.overpop=cls("成功",`10km20-34 ${NUM(I.p10)} は過大でない`);

  // ③ 独立度
  let patternA=false;
  if(indep==null) A.indep=cls("情報","10km/40kmが未入力");
  else if(indep<CFG.indep_A){ patternA=true; A.indep=cls("情報",`独立度 ${indep.toFixed(3)} < 0.15 → パターンA（都心郊外・下でA判定）`); }
  else if(indep<CFG.indep_BC){
    const border=indep>=CFG.indep_border[0]&&indep<=CFG.indep_border[1];
    A.indep=cls("失敗",`独立度 ${indep.toFixed(3)}（0.15〜0.45＝回避ゾーン・伊勢崎/倉敷型）`+(border?" ⚠境界(富山0.434・山形0.465が成功の前例)":""));
  }
  else A.indep=cls("成功",`独立度 ${indep.toFixed(3)} ≥ 0.45（主力ゾーン）`);

  // ④ 薄商圏ゲート（10km < いわき床で発火）
  if(I.p10!=null&&I.p10<CFG.thin_floor){
    if(indep!=null&&indep>=CFG.rescue_indep&&I.traffic!=null&&I.traffic>=CFG.rescue_traffic)
      A.thin=cls("成功",`薄いが 独立度${indep.toFixed(3)}≥0.6 かつ 通行量${NUM(I.traffic)}≥25k で救済（いわき型）`);
    else A.thin=cls("失敗",`10km ${NUM(I.p10)} < ${NUM(CFG.thin_floor)} で薄く、救済条件(独立度0.6+&通行量25k+)を満たさない（上田原型）`);
  } else A.thin=cls("情報","薄商圏ゲート 非発火（10kmは床以上）");

  // ⑤ 通行量
  if(!isRoad) A.traffic=cls("情報","中心街徒歩型は通行量 非ゲート（盛岡型）。3km近接密度で評価");
  else if(I.traffic==null) A.traffic=cls("情報","通行量が未入力（路面型は必須）");
  else if(I.traffic<CFG.traffic_floor){
    const strongPop=(I.p10!=null&&I.p10>=45000);
    A.traffic=cls("失敗",`通行量 ${NUM(I.traffic)} < 下限 ${NUM(CFG.traffic_floor)}（下限割れ）`+(strongPop?" ※人口が強いので人的確認を推奨":""));
  } else A.traffic=cls("成功",`通行量 ${NUM(I.traffic)} ≥ 下限 ${NUM(CFG.traffic_floor)}`);
  if(I.traffic!=null&&I.traffic_dist_m!=null&&I.traffic_dist_m>800)
    A.traffic.d+=` ／ ⚠計測点まで${NUM(I.traffic_dist_m)}m（前面道路でない可能性・低信頼）`;

  // A分岐（独立度 < 0.15）: 都心郊外A型で再評価
  if(patternA){
    const a40=urbanA().map(b=>b.p40).sort((x,y)=>x-y);   // 745,004 〜 2,850,962
    if(I.p40==null) A.indep=cls("不可","パターンAだが40km母数が未入力で判定不可");
    else if(I.p40>=a40[0]) A.indep=cls("成功",`パターンA（都心郊外埋没型）。40km母数 ${NUM(I.p40)} がA成功店(鎌ヶ谷・熊谷 ${NUM(a40[0])}〜${NUM(a40[a40.length-1])})レンジ内 → 都心郊外A型`);
    else A.indep=cls("不可",`パターンAだが40km母数 ${NUM(I.p40)} がA成功店(最小 ${NUM(a40[0])})を大幅に下回る（小型A・前例なし）→判定不可`);
  }

  // ===== 総合判定 =====
  const vals=Object.values(A).map(a=>a.j);
  let overall,reason;
  if(vals.includes("失敗")){ overall="失敗"; reason="いずれかの軸が失敗の型に一致（"+Object.entries(A).filter(([k,a])=>a.j==="失敗").map(([k])=>AXIS[k]).join("・")+"）"; }
  else if(vals.includes("不可")){ overall="不可"; reason="失敗の型には非該当だが、成功の型にも収まらない軸がある（境界/前例外/情報不足）"; }
  else if(vals.every(j=>j==="成功"||j==="情報") && vals.includes("成功")){ overall="成功"; reason="全ての判定軸が成功店類似で、失敗の型に非該当"; }
  else { overall="不可"; reason="判定に必要な情報が不足している"; }

  // ===== 懸念点とカバー仮説（§1.4）=====
  const concerns=[], covers=[];
  const rs=road();
  const min3=Math.min(...rs.map(b=>b.p3));
  if(I.p3!=null&&I.p3<min3){ concerns.push(`3km人口 ${NUM(I.p3)} が路面成功店の最小(${NUM(min3)})未満＝近接が薄い`);
    if(I.p10!=null&&I.p10>=50000) covers.push("伊予松前型: 3km薄いが10km人口が厚い（＋通行量）でカバーの前例あり"); }
  if(I.p10!=null&&I.p10<CFG.thin_floor) covers.push("いわき型: 全般に薄くても 独立度0.6+ ＆ 通行量25k+ なら成功の前例あり");
  if(indep!=null&&indep>=CFG.indep_border[0]&&indep<CFG.indep_BC) covers.push("富山型: 独立度が低め(0.434)でも3km・10km人口の厚み＋通行量で成功の前例あり");
  if(concerns.length===0&&overall==="成功") covers.push("深刻な弱点なし（補償不要）");

  // ===== データ品質（バンド単調性）=====
  const bands=[["3km",I.p3],["10km",I.p10],["20km",I.p20],["30km",I.p30],["40km",I.p40]].filter(b=>b[1]!=null);
  let mono=true; for(let i=1;i<bands.length;i++) if(bands[i][1]<bands[i-1][1]) mono=false;
  const dq=[];
  if(!mono) dq.push("バンド単調性 崩れ（例 20km<10km）→ ポリゴン捕捉ミスの疑い・再取得推奨");
  if(I.p40==null) dq.push("40km未入力（独立度＝結論の要。必ず取得）");

  return {overall,reason,indep,density,axes:A,concerns,covers,dq,mono};
}
const AXIS={muni:"市区町村",overpop:"人口過大",indep:"独立度",thin:"薄商圏",traffic:"通行量"};

// ===== 画面 =====
function fmtVerdict(v){return v==="成功"?"成功店類似":v==="失敗"?"失敗店類似":"判定不可";}
function renderForm(){
  document.getElementById("main").innerHTML=`
  <p class="lead">住所とモデル区分、商圏の数値（20-34歳の絶対数）を入れると、教師データ（弊社の成功/失敗店）に照合して
    <b>総合判定・各軸判定・懸念/カバー仮説</b>を返します。判定ロジックは手作業レポートと同じ決定論ルールです。
    数値の自動取得（e-Stat等）は準備中で、今は手入力です。</p>
  <div class="card">
    <h2>入力</h2>
    <div class="grid">
      <label>住所<input id="i_addr" placeholder="例）山形県山形市…"></label>
      <label>モデル区分 <span class="req">*</span>
        <select id="i_model"><option value="路面">路面（ロードサイド）</option><option value="中心街徒歩">中心街徒歩</option></select>
        <span class="hint">路面＝通行量ゲート有効／徒歩＝盛岡型・通行量は非ゲート</span></label>
      <label>市区町村 人口<input id="i_muni_pop" inputmode="numeric" placeholder="例）247000"></label>
      <label>市 面積（km²）<input id="i_muni_area" inputmode="decimal" placeholder="例）381"><span class="hint">密度＝人口÷面積</span></label>
      <label>3km 20-34歳<input id="i_p3" inputmode="numeric"></label>
      <label>10km 20-34歳<input id="i_p10" inputmode="numeric"></label>
      <label>20km 20-34歳<input id="i_p20" inputmode="numeric"></label>
      <label>30km 20-34歳<input id="i_p30" inputmode="numeric"></label>
      <label>40km 20-34歳<input id="i_p40" inputmode="numeric"><span class="hint">独立度＝10km÷40km。結論を左右するので必須</span></label>
      <label>通行量（上下・24h・小型車）<input id="i_traffic" inputmode="numeric"></label>
      <label>通行量 計測点までの距離（m・任意）<input id="i_tdist" inputmode="numeric"><span class="hint">遠いほど低信頼</span></label>
    </div>
    <button class="runbtn" id="run">判定する</button>
  </div>
  <div id="result"></div>
  <div class="card"><details><summary>主ベンチマーク（弊社 地方路面 成功店）を見る</summary>
    <table class="bench"><tr><th>店</th><th>3km</th><th>10km</th><th>40km</th><th>独立度</th><th>通行量</th></tr>
    ${road().map(b=>`<tr><td>${b.n}</td><td>${NUM(b.p3)}</td><td>${NUM(b.p10)}</td><td>${NUM(b.p40)}</td><td>${b.indep}</td><td>${NUM(b.traf)}</td></tr>`).join("")}
    </table>
    <p class="hint" style="margin-top:6px">10km20-34 レンジ 36,403〜66,535 ／ 通行量 20,141〜26,057。競合(Syndi・ヒューマンイズデッド)はベンチから除外。</p>
  </details></div>`;
  document.getElementById("run").onclick=run;
}
function numv(id){const s=document.getElementById(id).value.replace(/[, ]/g,"").trim();return s===""?null:Number(s);}
function run(){
  const I={addr:document.getElementById("i_addr").value,model:document.getElementById("i_model").value,
    muni_pop:numv("i_muni_pop"),muni_area:numv("i_muni_area"),p3:numv("i_p3"),p10:numv("i_p10"),
    p20:numv("i_p20"),p30:numv("i_p30"),p40:numv("i_p40"),traffic:numv("i_traffic"),traffic_dist_m:numv("i_tdist")};
  const R=evaluate(I);
  const vk=R.overall;
  const axHtml=Object.entries(R.axes).map(([k,a])=>`<div class="axis"><div class="an">${AXIS[k]}</div>
    <div class="aj ${a.j}">${a.j==="成功"?"成功類似":a.j==="失敗"?"失敗類似":a.j==="不可"?"判定不可":"参考"}</div>
    <div class="ad">${a.d}</div></div>`).join("");
  const posHtml=[["3km","p3"],["10km","p10"],["20km","p20"],["30km","p30"],["40km","p40"]]
    .map(([lab,b])=>`<li><b>${lab}</b>：${I[b]==null?"未入力":NUM(I[b])+" → "+positioning(b,I[b])}</li>`).join("");
  document.getElementById("result").innerHTML=`
  <div class="card">
    <div class="verdict"><span class="vbig v-${vk}">総合：${fmtVerdict(vk)}</span><span class="pill ${vk}">${vk==="成功"?"GO寄り":vk==="失敗"?"見送り寄り":"要人手"}</span></div>
    <div class="ad" style="font-size:13px;color:var(--ink2);line-height:1.7">${R.reason}</div>
    <div style="font-size:11.5px;color:#9a9a9a;margin-top:6px">
      独立度 ${R.indep==null?"—":R.indep.toFixed(3)} ／ 密度 ${R.density==null?"—":Math.round(R.density)} ／ モデル ${I.model}</div>
  </div>
  <div class="card"><h2>各軸の判定</h2>${axHtml}</div>
  <div class="card"><h2>成功店との位置づけ（20-34歳・絶対数）</h2><ul class="notes">${posHtml}</ul></div>
  <div class="card"><h2>懸念点とカバー仮説</h2>
    ${R.concerns.length?'<b style="font-size:12.5px">懸念</b><ul class="notes">'+R.concerns.map(c=>`<li>${c}</li>`).join("")+"</ul>":'<div class="ad">深刻な弱点なし</div>'}
    ${R.covers.length?'<b style="font-size:12.5px">カバー仮説（前例）</b><ul class="notes">'+R.covers.map(c=>`<li>${c}</li>`).join("")+"</ul>":""}
  </div>
  ${R.dq.length?'<div class="card"><h2>データ品質チェック</h2><ul class="notes">'+R.dq.map(d=>`<li class="flag">${d}</li>`).join("")+"</ul></div>":""}
  `;
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}

// ===== ログイン（bukken と共有）=====
async function loadSupabase(){ if(window.supabase)return;
  await new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=()=>rej(new Error("ログイン部品を読み込めませんでした"));
    document.head.appendChild(s);});}
async function boot(){
  try{
    const cfg=await (await fetch(CONFIG_URL,{cache:"no-store"})).json();
    await loadSupabase();
    SB=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"notime-auth"}});
    const {data:{session}}=await SB.auth.getSession();
    if(!session){
      document.getElementById("main").innerHTML='<div class="msg">商圏調査を見るにはログインが必要です。<br><button class="loginbtn" id="lg">Googleでログイン</button></div>';
      document.getElementById("lg").onclick=()=>SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
      return;
    }
    document.getElementById("logoutbtn").style.display="";
    document.getElementById("logoutbtn").onclick=async()=>{try{await SB.auth.signOut();}catch(e){}location.reload();};
    renderForm();
  }catch(e){ document.getElementById("main").innerHTML='<div class="msg">読み込みに失敗しました：'+String(e.message||e)+'</div>'; }
}
boot();
</script>
</body></html>
